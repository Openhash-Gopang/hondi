<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

:root {
  --bg:        #eef1f6;
  --surface:   #ffffff;
  --border:    #e2e8f0;
  --navy:      #0e1c3f;
  --brand:     #0c6cc3;
  --brand-dk:  #094a86;
  --text:      #0f172a;
  --text3:     #475569;
  --text4:     #64748b;
  --radius:    8px;
  --radius-lg: 12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size: 14px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

.ug-doc { max-width: 1040px; margin: 0 auto; padding: 24px 24px 80px; }

/* ── 서비스 탭 ── */
.svc-tabs {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.svc-tab {
  background: var(--surface); border: none; border-radius: 10px;
  padding: 10px 6px; text-align: center; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--text3);
  box-shadow: 0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.07);
  transition: box-shadow 0.18s ease, transform 0.18s ease, color 0.18s ease;
  white-space: nowrap;
}
.svc-tab .svc-tab-count { display: block; font-size: 10.5px; font-weight: 500; color: var(--text4); margin-top: 2px; }
.svc-tab:hover {
  color: var(--brand-dk); transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(15,23,42,0.14), 0 2px 6px rgba(15,23,42,0.08);
}
.svc-tab.active {
  background: var(--brand); color: #fff;
  box-shadow: 0 6px 16px rgba(12,108,195,0.35), 0 2px 6px rgba(12,108,195,0.2);
}
.svc-tab.active .svc-tab-count { color: #dbeafe; }
@media (max-width: 900px) {
  .svc-tabs { grid-template-columns: repeat(4, 1fr); }
  .svc-tab { font-size: 12px; padding: 9px 4px; }
}
@media (max-width: 560px) {
  .svc-tabs { grid-template-columns: repeat(2, 1fr); }
}

/* ── 본문 콘텐츠 ── */
.svc-content {
  background: var(--surface); border: none; border-radius: var(--radius-lg);
  padding: 40px; min-height: 320px;
  box-shadow: 0 2px 10px rgba(15,23,42,0.08), 0 1px 3px rgba(15,23,42,0.06);
}

/* ── 서비스 상세 콘텐츠 ── */
.svc-detail h2 { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
.svc-detail .svc-lead { font-size: 14.5px; color: var(--text3); line-height: 1.7; margin-bottom: 28px; }
.svc-detail h3 {
  font-size: 15px; font-weight: 600; color: var(--navy);
  margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
}
.svc-detail h3:first-of-type { margin-top: 0; }

/* 세부분야 태그 */
.svc-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.svc-tag {
  font-size: 12.5px; color: var(--brand-dk); background: #eff6ff; border-radius: 20px;
  padding: 5px 12px;
}

.svc-table-wrap { overflow-x: auto; margin: 8px 0 4px; }
table.svc-table { width: 100%; border-collapse: collapse; font-size: 13px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(15,23,42,0.08); }
table.svc-table th, table.svc-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.svc-table thead th { background: #f1f5f9; color: var(--navy); font-weight: 600; white-space: nowrap; }
table.svc-table tbody tr:last-child td { border-bottom: none; }
table.svc-table td.svc-hondi { color: var(--brand-dk); font-weight: 600; }

.svc-callout {
  background: #eff6ff; border: 1px solid #93c5fd; border-left: 4px solid var(--brand);
  border-radius: 8px; padding: 12px 16px; margin: 16px 0; font-size: 13px; color: #1e3a5f;
}
.svc-callout.important { background: #fff7ed; border-color: #fbbf24; border-left-color: #d97706; color: #7c4a03; }

/* ── 체험 시뮬레이션(경찰 조사 중 실시간 정보 안내) ── */
.sim-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-top: 8px; overflow: hidden; }
.sim-stepper { display: flex; overflow-x: auto; background: #f1f5f9; padding: 14px 16px; gap: 6px; }
.sim-dot {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  font-size: 11.5px; font-weight: 600; color: var(--text4);
  padding: 6px 10px; border-radius: 99px; white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.sim-dot .num {
  width: 18px; height: 18px; border-radius: 50%; background: #cbd5e1;
  color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sim-dot.done { color: var(--brand-dk); }
.sim-dot.done .num { background: var(--brand); }
.sim-dot.active { background: #eff6ff; color: var(--brand-dk); }
.sim-dot.active .num { background: var(--brand-dk); }

.sim-panel { padding: 26px 28px; min-height: 200px; }
.sim-panel h4 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.sim-panel p { font-size: 13.5px; color: var(--text3); line-height: 1.75; margin-bottom: 10px; }

.dialogue-box { background: #f8fafc; border-radius: 10px; padding: 16px 20px; margin: 4px 0 14px; font-size: 13.5px; line-height: 1.9; }
.dialogue-box p { margin: 0 0 8px; }
.dialogue-box p:last-child { margin-bottom: 0; }
.dialogue-box .spk-officer strong { color: var(--text); }
.dialogue-box .spk-user strong { color: var(--brand-dk); }
.dialogue-box .spk-agent strong { color: #047857; }

.sim-advice {
  position: relative; background: #ecfdf5; border: 1px solid #6ee7b7; border-left: 4px solid #059669;
  border-radius: 8px; padding: 12px 16px 12px 40px; margin: 10px 0; font-size: 13px; color: #065f46; line-height: 1.7;
}
.sim-advice::before { content: '💬'; position: absolute; left: 12px; top: 11px; font-size: 15px; }
.sim-advice b { color: #047857; }
.sim-advice.warn { background: #fef2f2; border-color: #fca5a5; border-left-color: #dc2626; color: #7f1d1d; }
.sim-advice.warn b { color: #b91c1c; }
.sim-advice-label { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; color: #047857; margin-bottom: 4px; }
.sim-advice.warn .sim-advice-label { color: #b91c1c; }
.sim-note { font-size: 11.5px; color: var(--text4); margin-top: 2px; }

.sim-actions { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-top: 1px solid var(--border); background: #f1f5f9; }
.sim-btn { font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 99px; border: none; cursor: pointer; font-family: 'Pretendard', sans-serif; transition: opacity 0.15s; }
.sim-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.sim-btn.primary { background: var(--brand-dk); color: #fff; }
.sim-btn.outline { background: #fff; color: var(--text3); border: 1px solid #d1d5db; }
.sim-btn.ghost { background: none; color: var(--text4); }
.sim-btn:not(:disabled):hover { opacity: 0.85; }
@media (max-width: 640px) { .sim-panel { padding: 20px 18px; } .sim-actions { padding: 14px 18px; flex-wrap: wrap; gap: 8px; } }

.ug-footer { text-align: center; font-size: 12px; color: var(--text4); border-top: 1px solid var(--border); padding-top: 18px; margin-top: 40px; }
</style>

function renderTags(list) {
  return list.map(function (t) { return '<span class="svc-tag">' + t + '</span>'; }).join('');
}

function renderScenarioTable(rows) {
  var html = '<div class="svc-table-wrap"><table class="svc-table"><thead><tr><th>사용자 발화</th><th>상담 분야</th><th>처리</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    html += '<tr><td>"' + r[0] + '"</td><td>' + r[1] + '</td><td class="svc-hondi">' + r[2] + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderSvc(key) {
  var contentEl = document.getElementById('svcContent');
  var html = '<div class="svc-detail">';
  html += '<h2>' + SVC_LABEL[key] + ' — ' + SVC_COUNT[key] + '</h2>';
  html += '<p class="svc-lead">' + SVC_LEAD[key] + '</p>';

  if (SVC_TAGS[key]) {
    html += '<h3>세부분야</h3><div class="svc-tags">' + renderTags(SVC_TAGS[key]) + '</div>';
  }

  html += '<h3>상담 예시</h3>' + renderScenarioTable(SVC_SCENARIOS[key]);
  html += '<p style="font-size:12px; color:var(--text4); margin-top:8px;">위 시나리오는 이해를 돕기 위한 예시이며, 실제 상담 결과는 상황에 따라 달라질 수 있습니다.</p>';

  if (SIM_DEFS[key]) {
    var sim = SIM_DEFS[key];
    html += '<h3>체험해보기 · ' + sim.title + '</h3>';
    html += '<p>' + sim.intro + '</p>';
    html += '<div class="sim-box">' +
      '<div class="sim-stepper" id="simStepper"></div>' +
      '<div class="sim-panel" id="simPanel"></div>' +
      '<div class="sim-actions">' +
        '<button class="sim-btn outline" id="simPrev">이전</button>' +
        '<div style="display:flex;gap:8px">' +
          '<button class="sim-btn ghost" id="simReset">처음부터</button>' +

        '</div>' +
      '</div>' +
    '</div>';
  }

  if (LIVE_SIM_DEFS[key]) {
    var live = LIVE_SIM_DEFS[key];
    html += '<h3>체험해보기 · ' + live.title + '</h3>';
    html += '<p>' + live.intro + '</p>';

      '<div class="sim-panel" id="liveSimPanel"></div>' +

  html += '<div class="svc-callout">' + REL_CALLOUT + '</div>';

/* ══════════════ 체험 시뮬레이션 엔진(공통) ══════════════ */
function initSim(sim) {
  var LABELS = sim.labels;
  var cur = 0;

  var stepperEl = document.getElementById('simStepper');
  var panelEl = document.getElementById('simPanel');
  var prevBtn = document.getElementById('simPrev');
  var nextBtn = document.getElementById('simNext');
  var resetBtn = document.getElementById('simReset');
  if (!stepperEl) return;

  function renderStepper() {
    stepperEl.innerHTML = LABELS.map(function (label, i) {
      var cls = (i === cur ? 'active' : (i < cur ? 'done' : ''));
      return '<div class="sim-dot ' + cls + '"><span class="num">' + (i + 1) + '</span>' + label + '</div>';
    }).join('');
  }

  function render() {
    renderStepper();
    panelEl.innerHTML = sim.panels[cur]();
    prevBtn.disabled = cur === 0;
    nextBtn.textContent = cur === LABELS.length - 1 ? '완료' : '다음 단계';
  }

  nextBtn.onclick = function () { if (cur < LABELS.length - 1) { cur++; render(); } };
  prevBtn.onclick = function () { if (cur > 0) { cur--; render(); } };
  resetBtn.onclick = function () { cur = 0; render(); };

  render();
}

// personas/law.html → hondi-proxy Worker의 /law/demo-consult를 호출한다.
// 이 엔드포인트는 아직 worker.js에 반영되지 않았다 — 반영 전까지는 요청이
// 실패하며 아래 오류 카드가 표시된다. 반영 내용: docs/PENDING-WORKER-CHANGES_law-persona-demo.md
var LAW_DEMO_API_URL = 'https://hondi-proxy.tensor-city.workers.dev/law/demo-consult';

function escapeHtmlLive(s) {
  return (s || '').replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function initLiveSim(personaKey, def) {
  var panelEl = document.getElementById('liveSimPanel');
  var submitBtn = document.getElementById('liveSimSubmit');
  if (!panelEl) return;

  var state = { message: def.placeholder, loading: false, error: null, result: null };

  function render() {
    var errBlock = state.error
      ? '<div class="sim-card" style="background:#fef2f2;color:#b91c1c"><b>오류</b> — ' + escapeHtmlLive(state.error) + '<br>API 서버 연결을 확인하거나 잠시 후 다시 시도해 주세요.</div>'
      : '';

    var html = '<h4>상황을 입력하세요</h4>' +
      '<p>' + def.fieldHint + '</p>' +
      '<textarea class="sim-field" id="liveSimInput" placeholder="' + escapeHtmlLive(def.placeholder) + '">' + escapeHtmlLive(state.message === def.placeholder ? '' : state.message) + '</textarea>' +
      errBlock +
      (state.loading ? '<p style="margin-top:12px;color:var(--brand-dk);font-weight:600">' + def.loadingLabel + '</p>' : '');

    if (state.result) {
      var r = state.result;
      var needed = (r.needed_items || []).map(escapeHtmlLive).join('<br>');
      html += '<h4 style="margin-top:20px">답변</h4>' +
        '<div class="sim-card"><b>상황 요약</b><br>' + escapeHtmlLive(r.situation_summary || '') + '</div>' +
        '<div class="sim-card"><b>안내</b><br>' + escapeHtmlLive(r.guidance || '') + '</div>' +
        (needed ? '<div class="sim-card"><b>다음 단계에 필요한 것</b><br>' + needed + '</div>' : '') +
        '<div class="sim-advice"><span class="sim-advice-label">참고</span><br>' + escapeHtmlLive(r.final_authority_note || '') + '</div>';
    }

    panelEl.innerHTML = html;
    submitBtn.disabled = state.loading;
  }

  async function submit() {
    var input = document.getElementById('liveSimInput');
    var message = (input && input.value.trim()) || def.placeholder;
    state.message = message;
    state.loading = true;
    state.error = null;
    state.result = null;
    render();
    try {
      var res = await fetch(LAW_DEMO_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: personaKey, message: message }),
      });
      var data = await res.json();
      if (!res.ok || data.status === 'upstream_error') {
        throw new Error(data.message || ('요청 실패(HTTP ' + res.status + ')'));
      }
      state.result = data.result;
      state.loading = false;
      render();
    } catch (e) {
      state.loading = false;
      state.error = e.message || '알 수 없는 오류';
      render();
    }
  }

  submitBtn.onclick = submit;
  render();
}
