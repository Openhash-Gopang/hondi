<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안 게시판 — 나비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

:root {
  /* ── Material Design 3 토큰 ── */
  --bg:        #f6f6fb;
  --surface:   #ffffff;
  --surface-variant: #f0eff6;
  --border:    #e2e1ec;
  --outline-variant: #e2e1ec;

  --brand:     #4f46e5;   /* primary */
  --brand-dk:  #3730a3;   /* primary, darker (hover/active) */
  --on-brand:  #ffffff;
  --brand-container:    #e4e1ff;
  --on-brand-container: #150066;

  --text:      #1c1b1f;   /* on-surface */
  --text-sub:  #49454f;   /* on-surface-variant */
  --text-mute: #79747e;   /* outline */

  --error:     #b3261e;
  --error-container: #f9dedc;

  --font:      'Roboto','Noto Sans KR',sans-serif;
  --mono:      'Roboto Mono',monospace;
  --radius:    12px;

  --el-1: 0px 1px 2px rgba(0,0,0,.30), 0px 1px 3px 1px rgba(0,0,0,.15);
  --el-2: 0px 1px 2px rgba(0,0,0,.30), 0px 2px 6px 2px rgba(0,0,0,.15);
  --el-3: 0px 1px 3px rgba(0,0,0,.30), 0px 4px 8px 3px rgba(0,0,0,.15);
}

body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* ── Header (MD3 Top App Bar) ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--el-1);
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-logo { font-size: 16px; font-weight: 700; color: var(--brand); text-decoration: none; letter-spacing: .1px; }
.header-divider { width: 1px; height: 18px; background: var(--border); }
.header-title { font-size: 14px; font-weight: 500; color: var(--text-sub); }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--brand);
  text-decoration: none; padding: 8px 16px;
  border: 1px solid var(--outline-variant); border-radius: 20px;
  background: var(--surface);
  transition: background-color .15s;
}
.back-btn:hover { background: var(--brand-container); border-color: var(--brand-container); }

/* ── Main ── */
.main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }

/* ── Stats (MD3 Elevated Card) ── */
.stats { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.stat-card {
  background: var(--surface); border: none; box-shadow: var(--el-1);
  border-radius: var(--radius); padding: 18px 20px;
  flex: 1; min-width: 120px;
}
.stat-num { font-size: 26px; font-weight: 700; color: var(--brand); font-family: var(--mono); }
.stat-label { font-size: 12px; font-weight: 500; color: var(--text-sub); margin-top: 4px; }

/* ── Filter row ── */
.filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

/* write-btn = MD3 Filled Button */
.write-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 20px; border: none;
  background: var(--brand); color: var(--on-brand); font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: var(--font); white-space: nowrap;
  box-shadow: var(--el-1); transition: box-shadow .15s, background-color .15s;
}
.write-btn:hover { background: var(--brand-dk); box-shadow: var(--el-2); }

/* filter-btn = MD3 Filter Chip */
.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn {
  padding: 7px 16px; border-radius: 8px; border: 1px solid var(--outline-variant);
  background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text-sub);
  cursor: pointer; font-family: var(--font); transition: all .15s;
}
.filter-btn:hover { background: var(--surface-variant); }
.filter-btn.active {
  background: var(--brand-container); color: var(--on-brand-container);
  border-color: var(--brand-container); font-weight: 700;
}

/* ── Table (MD3 Elevated Card) ── */
.table-wrap { background: var(--surface); border: none; box-shadow: var(--el-1); border-radius: var(--radius); overflow: hidden; }
.table-header {
  display: grid;
  grid-template-columns: 56px 80px 1fr 90px 100px 90px;
  gap: 0; padding: 14px 20px;
  background: var(--surface-variant);
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--text-sub);
  text-transform: uppercase; letter-spacing: .5px;
}
.feedback-row {
  display: grid;
  grid-template-columns: 56px 80px 1fr 90px 100px 90px;
  gap: 0; padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  align-items: start;
  transition: background-color .1s;
}
.feedback-row:last-child { border-bottom: none; }
.feedback-row:hover { background: var(--surface-variant); }

.cell-handle { font-size: 12px; color: var(--text-sub); font-family: var(--mono); }
.cell-content { font-size: 13.5px; color: var(--text); line-height: 1.55; }
.cell-content .admin-note { font-size: 11.5px; color: var(--text-sub); margin-top: 4px; }
.cell-category { font-size: 12px; }
.cell-date { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.cell-status { }

/* ── Category badge (MD3 Assist Chip, tonal) ── */
.cat-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 8px;
  font-weight: 600;
}
.cat-bug     { background: #f9dedc; color: #8c1d18; }
.cat-feature { background: #dde3ff; color: #1a237e; }
.cat-ui      { background: #ecdcfb; color: #4a148c; }
.cat-etc     { background: var(--surface-variant); color: var(--text-sub); }
.cat-pending { background: var(--surface-variant); color: var(--text-mute); }

/* ── Status badge (MD3 tonal chip) ── */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 8px;
  font-weight: 600; cursor: default;
}
.status-pending   { background: #fff3cd; color: #7a5900; }
.status-reviewing { background: #dde3ff; color: #1a237e; }
.status-accepted  { background: #d7f3df; color: #0f5e2c; }
.status-rejected  { background: var(--surface-variant); color: var(--text-mute); }

/* ── Admin controls (MD3 Outlined Button, small) ── */
.admin-controls { display: none; margin-top: 10px; }
.admin-controls.visible { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-btn {
  font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--brand); background: var(--surface);
  cursor: pointer; font-family: var(--font); color: var(--brand);
  transition: all .15s;
}
.admin-btn:hover { background: var(--brand-container); }

/* ── Empty ── */
.empty { text-align: center; padding: 64px 20px; color: var(--text-mute); }
.empty svg { margin-bottom: 12px; opacity: .35; }

/* ── Upvote (MD3 Icon Button) ── */
.cell-vote { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.vote-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 28px; border-radius: 8px;
  border: 1px solid var(--outline-variant); background: var(--surface);
  color: var(--text-sub); cursor: pointer; transition: all .15s;
}
.vote-btn:hover:not(:disabled) { background: var(--brand-container); border-color: var(--brand-container); color: var(--on-brand-container); }
.vote-btn.voted { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.vote-btn:disabled { cursor: default; opacity: .55; }
.vote-count { font-size: 12px; font-weight: 700; color: var(--text-sub); font-family: var(--mono); }

/* ── 비공개 배지 ── */
.vis-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; padding: 3px 8px; border-radius: 8px;
  background: var(--surface-variant); color: var(--text-sub); font-weight: 600; margin-left: 6px;
}

/* ── 글쓰기 모달 (MD3 Dialog) ── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(28,27,31,.4);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 28px; padding: 24px;
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--el-3);
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
.modal-box textarea {
  width: 100%; min-height: 120px; padding: 14px; border: 1px solid var(--outline-variant);
  border-radius: 12px; font-family: var(--font); font-size: 13.5px; resize: vertical;
  box-sizing: border-box; background: var(--surface-variant);
}
.modal-box textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; background: var(--surface); }
.vis-choice { display: flex; gap: 10px; margin: 16px 0; }
.vis-choice label {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px; border: 1px solid var(--outline-variant); border-radius: 12px;
  font-size: 13px; color: var(--text-sub); cursor: pointer; transition: all .15s;
}
.vis-choice input { accent-color: var(--brand); }
.vis-choice label:has(input:checked) { border-color: var(--brand); background: var(--brand-container); color: var(--on-brand-container); font-weight: 700; }
.modal-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 18px; }

/* modal-btn.cancel = MD3 Text Button / modal-btn.submit = MD3 Filled Button */
.modal-btn {
  padding: 10px 20px; border-radius: 20px; font-size: 13.5px; font-weight: 500;
  cursor: pointer; font-family: var(--font); border: none;
}
.modal-btn.cancel { background: transparent; color: var(--brand); }
.modal-btn.cancel:hover { background: var(--brand-container); }
.modal-btn.submit { background: var(--brand); color: var(--on-brand); box-shadow: var(--el-1); }
.modal-btn.submit:hover { background: var(--brand-dk); box-shadow: var(--el-2); }
.modal-btn.submit:disabled { opacity: .5; cursor: default; box-shadow: none; }
.modal-error { font-size: 12px; font-weight: 500; color: var(--error); margin-top: 10px; display: none; }

/* ── Loading ── */
.loading { text-align: center; padding: 40px; color: var(--text-mute); font-size: 13px; }

@media (max-width: 600px) {
  .table-header, .feedback-row {
    grid-template-columns: 1fr;
  }
  .table-header { display: none; }
  .feedback-row { gap: 6px; }
  .cell-handle::before { content: '@'; }
  .cell-vote { flex-direction: row; justify-content: flex-start; gap: 8px; }
  .filter-row { flex-direction: column; align-items: stretch; }
  .write-btn { justify-content: center; }
  .stats { gap: 8px; }
  .stat-card { min-width: 80px; padding: 14px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <a href="/desktop.html" class="header-logo">나비</a>
    <div class="header-divider"></div>
    <span class="header-title">제안 현황</span>
  </div>
  <a href="/desktop.html" class="back-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    돌아가기
  </a>
</header>

<!-- Main -->
<main class="main">

  <!-- Stats -->
  <div class="stats" id="stats-area">
    <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">전체 제안</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">검토 대기</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-accepted">—</div><div class="stat-label">반영 확정</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-reviewing">—</div><div class="stat-label">검토중</div></div>
  </div>

  <!-- Filter + 글쓰기 -->
  <div class="filter-row">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('')" data-filter="">전체</button>
      <button class="filter-btn" onclick="setFilter('pending')" data-filter="pending">검토 대기</button>
      <button class="filter-btn" onclick="setFilter('reviewing')" data-filter="reviewing">검토중</button>
      <button class="filter-btn" onclick="setFilter('accepted')" data-filter="accepted">반영 확정</button>
      <button class="filter-btn" onclick="setFilter('rejected')" data-filter="rejected">보류</button>
    </div>
    <button class="write-btn" onclick="openWriteModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      글쓰기
    </button>
  </div>

  <!-- 글쓰기 모달 -->
  <div class="modal-backdrop" id="write-modal">
    <div class="modal-box">
      <div class="modal-title">새 제안 작성</div>
      <textarea id="write-content" placeholder="개선했으면 하는 점, 버그, 아이디어를 자유롭게 적어주세요."></textarea>
      <div class="vis-choice">
        <label><input type="radio" name="visibility" value="public" checked> 공개 (다른 사용자가 보고 투표 가능)</label>
        <label><input type="radio" name="visibility" value="private"> 비공개 (본인과 관리자만)</label>
      </div>
      <div class="modal-error" id="write-error"></div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeWriteModal()">취소</button>
        <button class="modal-btn submit" id="write-submit" onclick="submitFeedback()">등록</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-header">
      <div>투표</div>
      <div>제안자</div>
      <div>내용</div>
      <div>카테고리</div>
      <div>일자</div>
      <div>상태</div>
    </div>
    <div id="feedback-list">
      <div class="loading">불러오는 중…</div>
    </div>
  </div>

</main>

<script>
const PROXY = 'https://hondi-proxy.tensor-city.workers.dev';
const ADMIN_HANDLE = '@96627170';

const CAT_MAP = {
  bug:     { label: '버그 신고',  cls: 'cat-bug' },
  feature: { label: '기능 추가',  cls: 'cat-feature' },
  ui:      { label: 'UI 개선',    cls: 'cat-ui' },
  etc:     { label: '기타',       cls: 'cat-etc' },
  pending: { label: '분류 중',    cls: 'cat-pending' },
};
const STATUS_MAP = {
  pending:   { label: '검토 대기', cls: 'status-pending' },
  reviewing: { label: '검토중',    cls: 'status-reviewing' },
  accepted:  { label: '반영 확정', cls: 'status-accepted' },
  rejected:  { label: '보류',      cls: 'status-rejected' },
};

let allItems   = [];
let curFilter  = '';
let isAdmin    = false;
let adminGuid  = null;
let myGuid     = null;
let myHandle   = null;
const votedIds = new Set(); // 이번 세션에서 투표한 항목(중복 클릭 방지용 — 서버가 최종 판정)

// ── 로그인 사용자 확인 (관리자 여부 + 본인 guid/handle) ──────
function checkAdmin() {
  try {
    const user = JSON.parse(localStorage.getItem('gopang_user_v4') || 'null');
    if (user?.ipv6)  myGuid   = user.ipv6;
    if (user?.handle) myHandle = user.handle;
    if (user?.handle === ADMIN_HANDLE) {
      isAdmin   = true;
      adminGuid = user.ipv6;
    }
  } catch {}
}

// ── 데이터 로드 ──────────────────────────────────────────
async function loadFeedback() {
  try {
    const qs = new URLSearchParams({ limit: '100' });
    if (isAdmin) qs.set('is_admin', '1');
    else if (myGuid) qs.set('requester_guid', myGuid);
    const res  = await fetch(`${PROXY}/feedback?${qs.toString()}`);
    const data = await res.json();
    allItems = data.items || [];
    updateStats();
    render();
  } catch(e) {
    document.getElementById('feedback-list').innerHTML =
      '<div class="empty"><p>불러오기 실패. 새로고침해 주세요.</p></div>';
  }
}

// ── 통계 ────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent    = allItems.length;
  document.getElementById('stat-pending').textContent  = allItems.filter(i => i.status === 'pending').length;
  document.getElementById('stat-accepted').textContent = allItems.filter(i => i.status === 'accepted').length;
  document.getElementById('stat-reviewing').textContent= allItems.filter(i => i.status === 'reviewing').length;
}

// ── 필터 ────────────────────────────────────────────────
function setFilter(val) {
  curFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === val);
  });
  render();
}

// ── 렌더링 ───────────────────────────────────────────────
function render() {
  const list = document.getElementById('feedback-list');
  const items = curFilter ? allItems.filter(i => i.status === curFilter) : allItems;

  if (!items.length) {
    list.innerHTML = `<div class="empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>제안이 없습니다</p>
    </div>`;
    return;
  }

  list.innerHTML = items.map(item => {
    const cat    = CAT_MAP[item.category]    || CAT_MAP.etc;
    const status = STATUS_MAP[item.status]   || STATUS_MAP.pending;
    const date   = new Date(item.created_at).toLocaleDateString('ko-KR', { month:'2-digit', day:'2-digit' });
    const adminCtrl = isAdmin ? `
      <div class="admin-controls visible" id="ctrl-${item.id}">
        ${['reviewing','accepted','rejected'].map(s =>
          s !== item.status
            ? `<button class="admin-btn" onclick="changeStatus('${item.id}','${s}')">${STATUS_MAP[s].label}</button>`
            : ''
        ).join('')}
      </div>` : '';

    const isPublic   = item.visibility !== 'private';
    const isOwn      = myGuid && item.guid === myGuid;
    const hasVoted   = votedIds.has(item.id);
    const voteCell   = isPublic
      ? `<div class="cell-vote">
          <button class="vote-btn${hasVoted ? ' voted' : ''}" ${(hasVoted || isOwn) ? 'disabled' : ''}
                  onclick="voteFeedback('${item.id}')" title="${isOwn ? '본인 제안에는 투표할 수 없습니다' : '찬성'}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <span class="vote-count" id="vote-count-${item.id}">${item.vote_count || 0}</span>
        </div>`
      : `<div class="cell-vote"><span class="vote-count">—</span></div>`;
    const visBadge   = !isPublic ? `<span class="vis-badge">🔒 비공개</span>` : '';

    return `<div class="feedback-row" id="row-${item.id}">
      ${voteCell}
      <div class="cell-handle">${item.handle || '—'}</div>
      <div class="cell-content">
        ${escHtml(item.content)}${visBadge}
        ${item.admin_note ? `<div class="admin-note">💬 ${escHtml(item.admin_note)}</div>` : ''}
        ${adminCtrl}
      </div>
      <div class="cell-category">
        <span class="cat-badge ${cat.cls}">${cat.label}</span>
      </div>
      <div class="cell-date">${date}</div>
      <div class="cell-status">
        <span class="status-badge ${status.cls}">${status.label}</span>
      </div>
    </div>`;
  }).join('');
}

// ── 글쓰기 모달 ────────────────────────────────────────
function openWriteModal() {
  if (!myGuid || !myHandle) {
    alert('로그인 후 이용해 주세요.');
    return;
  }
  document.getElementById('write-content').value = '';
  document.getElementById('write-error').style.display = 'none';
  document.querySelector('input[name="visibility"][value="public"]').checked = true;
  document.getElementById('write-modal').classList.add('open');
}
function closeWriteModal() {
  document.getElementById('write-modal').classList.remove('open');
}
async function submitFeedback() {
  const content = document.getElementById('write-content').value.trim();
  const errEl   = document.getElementById('write-error');
  const btn     = document.getElementById('write-submit');
  if (!content) {
    errEl.textContent = '내용을 입력해 주세요.';
    errEl.style.display = 'block';
    return;
  }
  const visibility = document.querySelector('input[name="visibility"]:checked').value;

  btn.disabled = true;
  btn.textContent = '등록 중…';
  try {
    const res  = await fetch(`${PROXY}/feedback`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid: myGuid, handle: myHandle, content, visibility }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.detail || data.error || '등록 실패');
    closeWriteModal();
    await loadFeedback();
  } catch(e) {
    errEl.textContent = '등록 실패: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '등록';
  }
}

// ── 투표(Up) ─────────────────────────────────────────────
async function voteFeedback(id) {
  if (!myGuid) { alert('로그인 후 이용해 주세요.'); return; }
  if (votedIds.has(id)) return;

  const btn = document.querySelector(`#row-${id} .vote-btn`);
  if (btn) btn.disabled = true;

  try {
    const res  = await fetch(`${PROXY}/feedback/${id}/vote`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voter_guid: myGuid }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.detail || data.error || '투표 실패');

    votedIds.add(id);
    const idx = allItems.findIndex(i => i.id === id);
    if (idx !== -1) allItems[idx].vote_count = data.vote_count;
    const countEl = document.getElementById(`vote-count-${id}`);
    if (countEl) countEl.textContent = data.vote_count;
    if (btn) btn.classList.add('voted');
  } catch(e) {
    if (btn) btn.disabled = false;
    alert('투표 실패: ' + e.message);
  }
}

// ── 상태 변경 (관리자) ──────────────────────────────────
async function changeStatus(id, status) {
  if (!isAdmin) return;
  const note = status === 'rejected'
    ? prompt('보류 사유를 입력하세요 (선택사항):') || null
    : null;

  try {
    const res = await fetch(`${PROXY}/feedback/${id}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, admin_note: note, admin_guid: adminGuid }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.detail);

    // 로컬 업데이트
    const idx = allItems.findIndex(i => i.id === id);
    if (idx !== -1) { allItems[idx].status = status; if (note) allItems[idx].admin_note = note; }
    updateStats();
    render();
  } catch(e) {
    alert('상태 변경 실패: ' + e.message);
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 초기화 ───────────────────────────────────────────────
checkAdmin();
loadFeedback();
</script>
