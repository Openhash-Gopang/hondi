<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나비 — 코드로 기기 연결</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  2026-07-31 신설 — "다른 기기 연결" QR을 나비 숫자 코드로 교체하면서
  짝을 이루는 스캔 페이지. 로그인 여부와 무관하게(=이 페이지 자체는
  webapp.html의 인증 흐름을 거치지 않는 새 기기가 열 수 있어야 하므로)
  독립 페이지로 둔다 — auth/device-link.html·auth/qr-login.html과 같은
  스타일.

  카메라로 hondi-digit-code.js가 만든 10칸 숫자 코드를 찍으면
  hondi-digit-scanner.js로 그 숫자열을 읽어, digitsToPhone()으로 곧장
  전화번호로 해석한다(프로필 조회 lookupDigitProfile()는 쓰지 않음 —
  이 페이지는 "그 코드가 가리키는 계정을 열람"하는 게 아니라 "그
  전화번호로 기기 연결을 요청"하는 별도 목적이기 때문). 이후
  auth/device-link.html?phone=...으로 이동하면, 그 페이지가 이미
  PREFILLED_PHONE 자동전송 로직을 갖고 있어 추가 조작 없이 승인 요청이
  전송된다.

  ★ 이 페이지는 계정 인증을 대신하지 않는다 — 실제 승인은 여전히
  전화번호가 등록된 기존 기기에서 생체인증으로 이뤄진다. 이 페이지가
  하는 일은 오직 "전화번호를 직접 타이핑하지 않고 카메라로 읽어들이는"
  입력 보조뿐이다.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; }
  body {
    font-family: -apple-system, 'Pretendard', sans-serif;
    display:flex; flex-direction:column;
  }
  #top-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(0,0,0,.85); flex-shrink:0;
  }
  #top-bar .title{ color:#fff; font-size:16px; font-weight:700; }
  #top-bar .sub{ color:rgba(255,255,255,.65); font-size:11.5px; margin-top:1px; }
  #close-btn{
    background:none; border:none; color:#fff; font-size:24px; cursor:pointer; line-height:1;
  }
  #stage{ position:relative; flex:1; width:100%; overflow:hidden; background:#000; }
  #ls-video{ width:100%; height:100%; object-fit:cover; display:block; }
  #ls-canvas{ display:none; }
  #ls-overlay{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #guide{
    position:absolute; bottom:18px; left:0; right:0; text-align:center; pointer-events:none;
  }
  #guide span{
    background:rgba(0,0,0,.55); color:#ddd; font-size:12px; padding:4px 14px; border-radius:20px;
  }
  #status-bar{
    background:rgba(0,0,0,.9); color:#9ca3af; font-size:13px; text-align:center;
    padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom));
    flex-shrink:0; min-height:20px;
  }
  #status-bar.error{ color:#f87171; }
  #status-bar.success{ color:#4ade80; }
  #manual-fallback{
    display:none; background:rgba(0,0,0,.9); text-align:center; padding:0 16px 16px;
  }
  #manual-fallback a{ color:#93c5fd; font-size:12.5px; text-decoration:underline; }
</style>
</head>
<body>

<div id="top-bar">
  <div>
    <div class="title">나비 숫자 코드 스캔</div>
    <div class="sub">다른 기기의 "다른기기 연결" 화면에 뜬 코드를 비춰주세요</div>
  </div>
  <button id="close-btn" onclick="_lsClose()">✕</button>
</div>

<div id="stage">
  <video id="ls-video" autoplay playsinline muted></video>
  <canvas id="ls-canvas"></canvas>
  <canvas id="ls-overlay"></canvas>
  <div id="guide"><span>"나비" 글자와 숫자열을 화면 안에 맞춰주세요</span></div>
</div>

<div id="status-bar">카메라를 시작하는 중...</div>
<div id="manual-fallback">
  <a href="/auth/device-link.html">코드 없이 전화번호로 직접 연결하기 →</a>
</div>

<script type="module">
import { startScanner, stopScanner } from '/src/gopang/ai/hondi-digit-scanner.js';
import { digitsToPhone } from '/src/gopang/ai/hondi-digit-code.js';
import { _buildKrE164 } from '/src/gopang/core/auth.js';

const RETURN_URL = new URLSearchParams(location.search).get('return') || '/webapp.html';

const statusEl   = document.getElementById('status-bar');
const fallbackEl = document.getElementById('manual-fallback');
let scannerActive = false;

function setStatus(msg, kind) {
  statusEl.textContent = msg || '';
  statusEl.className = kind || '';
}

function _lsClose() {
  scannerActive = false;
  stopScanner();
  if (window.opener && !window.opener.closed) window.close();
  else location.href = RETURN_URL;
}
window._lsClose = _lsClose;

async function _startScan() {
  scannerActive = true;
  const video   = document.getElementById('ls-video');
  const canvas  = document.getElementById('ls-canvas');
  const overlay = document.getElementById('ls-overlay');

  await startScanner(video, canvas, overlay,
    /* 인식 성공 — idStr은 hondi-digit-scanner.js가 이미 합쳐놓은 10자리
       숫자 문자열이다(예: "0012345678") — hondi-digit-code.js의
       idToDigits()는 BigInt id를 받는 별도 변환이라 여기선 필요 없다. */
    (idStr) => {
      if (!scannerActive) return;
      scannerActive = false;
      stopScanner();
      try {
        const digits = idStr.split('').map(Number);
        const phone  = digitsToPhone(digits);      // { type, areaCode, subscriberNumber, display }
        const e164   = _buildKrE164(phone.type, phone.areaCode, phone.subscriberNumber);
        setStatus(`인식 완료: ${phone.display} — 연결 요청 화면으로 이동합니다...`, 'success');
        setTimeout(() => {
          location.href = '/auth/device-link.html'
            + '?phone=' + encodeURIComponent(e164)
            + '&return=' + encodeURIComponent(RETURN_URL);
        }, 600);
      } catch (e) {
        // 인식은 됐지만 전화번호 형식이 아님(예: 다른 사용자의 프로필용
        // 나비 코드를 잘못 비춘 경우) — 다시 스캔하게 안내한다.
        setStatus('전화번호 코드가 아닙니다: ' + e.message + ' — 다시 시도해주세요.', 'error');
        fallbackEl.style.display = 'block';
        setTimeout(() => { if (!scannerActive) _startScan(); }, 1800);
      }
    },
    /* 상태 메시지 */
    (msg) => setStatus(msg)
  );
}

_startScan().catch((e) => {
  setStatus('카메라를 시작할 수 없습니다: ' + (e.message || e), 'error');
  fallbackEl.style.display = 'block';
});
</script>

</body>
</html>
