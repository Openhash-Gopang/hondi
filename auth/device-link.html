<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혼디 — PC에서 로그인</title>
<script src="/gopang-wallet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #f8f9fa;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  #card {
    background: white; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 32px 28px; width: 100%; max-width: 380px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  h1 { font-size: 18px; color: #111827; margin-bottom: 6px; }
  p.desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.6; }
  label { display:block; font-size: 12px; color:#374151; margin-bottom:6px; font-weight:600; }
  input {
    width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 15px; margin-bottom: 16px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #0057A8; }
  select {
    width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 15px; margin-bottom: 16px; font-family: inherit; background: #fff;
  }
  select:focus { outline: none; border-color: #0057A8; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: #0057A8; color: #fff;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  button.secondary { background: #f3f4f6; color: #374151; }
  #status { font-size: 13px; color: #6b7280; margin-top: 14px; text-align: center; min-height: 18px; }
  #status.error { color: #dc2626; }
  #status.success { color: #059669; }
  .step { display: none; }
  .step.active { display: block; }
  .timer { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 8px; }
  .spinner {
    width: 22px; height: 22px; border: 2.5px solid #e5e7eb; border-top-color: #0057A8;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="card">
  <h1 id="page-title">PC에서 혼디 로그인</h1>
  <p class="desc" id="page-desc">
    스마트폰과 완전히 같은 계정으로 PC에서도 이용할 수 있습니다.
    문자(SMS) 없이, 스마트폰에서 확인 한 번이면 됩니다.
    (알림은 <strong>평소 혼디를 쓰던 그 브라우저</strong>에서 열어야 합니다 —
    같은 폰이라도 Chrome·Safari 등 브라우저가 다르면 별개로 인식됩니다.)
  </p>

  <!-- STEP 1: 전화번호 입력
       (2026-07-27 개편 — 기존엔 자유 텍스트 입력 한 줄에 자체
       normalizePhoneToE164()로 "+82"+숫자만 이어붙였는데, 앞자리
       "010"/지역번호를 빠뜨려도 검증 없이 그대로 서버로 보내 존재하는
       계정을 못 찾는 사고실험 결함이 나왔다. 회원가입 화면
       (src/gopang/core/auth.js initAuthWithPhone)이 이미 갖고 있던
       "휴대폰/유선 선택 + 지역번호 선택 + 뒷자리 숫자"라는 검증된 구조를
       그대로 재사용해 유선전화까지 안전하게 지원한다. -->
  <div class="step active" id="step-phone">
    <label for="phone-type">전화 종류</label>
    <select id="phone-type">
      <option value="mobile">휴대폰</option>
      <option value="landline">유선전화(지역번호)</option>
    </select>

    <div id="area-code-row" style="display:none">
      <label for="area-code">지역번호</label>
      <select id="area-code"></select>
    </div>

    <label for="phone" id="phone-label">스마트폰에 등록된 전화번호</label>
    <input id="phone" type="tel" placeholder="010-1234-5678" autocomplete="tel">
    <button id="btn-request">스마트폰으로 요청 보내기</button>
  </div>

  <!-- STEP 2: 승인 대기 (2026-07-20 UX 개선 — 구글 방식, PC에 입력할 코드 없음) -->
  <div class="step" id="step-code">
    <div class="spinner" id="code-spinner"></div>
    <p style="text-align:center;font-size:14px;color:#374151;margin-bottom:6px">
      스마트폰 알림을 열어 <strong>"본인이 맞습니다"</strong>를 눌러주세요
    </p>
    <div class="timer" id="timer"></div>
    <button id="btn-sms-fallback" class="secondary" style="opacity:0.5;font-size:12px;padding:9px;margin-top:14px">
      알림이 안 왔나요? 문자로 받기
    </button>
    <p style="text-align:center;font-size:11px;color:#9ca3af;margin-top:6px">
      문자는 휴대폰이 통신사 신호를 받을 수 있어야 옵니다(Wi-Fi만으로는 문자 수신 불가).
    </p>
    <button id="btn-backup-key" class="secondary" style="opacity:0.6;font-size:12px;padding:9px;margin-top:10px">
      백업 키를 직접 갖고 있어요(수동 입력)
    </button>
  </div>

  <div id="status"></div>
</div>

<script type="module">
import { _buildKrE164, KR_AREA_CODES, krNeededDigitsFor, _restoreFromBackupKey } from '../src/gopang/core/auth.js';

(() => {
  const WORKER = 'https://hondi-proxy.tensor-city.workers.dev';
  const RETURN_URL = new URLSearchParams(location.search).get('return') || '/webapp.html';
  const PREFILLED_PHONE = new URLSearchParams(location.search).get('phone') || '';

  // 2026-07-23 신설 — purpose='sign_request'면 개인키를 옮기지 않고,
  // sigMsg에 대한 서명 결과만 1회성으로 받아 opener에게 postMessage로
  // 돌려준다(공용 PC 세션의 1회성 서명 위임 — 4단계). 이 페이지는 그
  // 경우 팝업으로 열린다(sendMessage() → gopang-wallet.js 참고).
  const PARAMS  = new URLSearchParams(location.search);
  const PURPOSE = PARAMS.get('purpose') === 'sign_request' ? 'sign_request' : 'key_transfer';
  const SIG_MSG = PARAMS.get('sigMsg') || null;
  // 2026-09-19 신설 — 호출부가 "이 deviceId로는 승인 알림을 보내지 마라"고
  // 명시할 수 있게 전달만 해준다(실제 필터링은 서버 handleDeviceLinkInit이
  // 함). "자기 자신을 삭제하는 요청이 자기 자신에게도 알림으로 간다"는
  // 문제(§push-diagnose.html의 기기 삭제 기능) 대응.
  const EXCLUDE_DEVICE_ID = PARAMS.get('excludeDeviceId') || null;
  const IS_POPUP_SIGN = PURPOSE === 'sign_request' && !!window.opener;
  // 팝업(window.open)은 같은 오리진이면 opener와 sessionStorage를 공유한다
  // (스펙 동작) — 그래서 "이번 공용 PC 세션에서 이미 승인받은 전화번호"를
  // 매번 새로 입력할 필요 없이 재사용할 수 있다.
  const CACHED_E164_KEY = 'gopang_shared_pc_e164';

  if (PURPOSE === 'sign_request') {
    document.getElementById('page-title').textContent = '서명 요청 승인';
    document.getElementById('page-desc').textContent =
      '이 PC(공용 PC 모드)가 방금 시도한 작업에 대한 서명을 요청합니다. ' +
      '개인키는 이 PC로 옮겨지지 않고, 매번 스마트폰에서 승인해야 합니다.';
  }

  const $ = (id) => document.getElementById(id);
  const stepPhone = $('step-phone'), stepCode = $('step-code');
  const statusEl = $('status');

  let sessionId = null;
  let pcKeyPair = null;   // { publicKey, privateKey (CryptoKey), publicKeyB64u }
  let e164Used = null;    // sign_request 완료 시 sessionStorage에 캐시하기 위해 기억
  let pollTimer = null;
  let countdownTimer = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }

  const phoneTypeEl = $('phone-type');
  const areaCodeRow = $('area-code-row');
  const areaCodeEl  = $('area-code');
  const phoneLabel  = $('phone-label');

  KR_AREA_CODES.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.code;
    opt.textContent = `${a.name} (0${a.code})`;
    areaCodeEl.appendChild(opt);
  });

  function _currentPhoneType() { return phoneTypeEl.value === 'landline' ? 'landline' : 'mobile'; }
  function _currentAreaCode()  { return _currentPhoneType() === 'landline' ? areaCodeEl.value : null; }

  function _updatePhoneUI() {
    const isLandline = _currentPhoneType() === 'landline';
    areaCodeRow.style.display = isLandline ? 'block' : 'none';
    const needed = krNeededDigitsFor(_currentPhoneType(), _currentAreaCode());
    if (isLandline) {
      phoneLabel.textContent = '전화번호(지역번호 제외 뒷자리)';
      $('phone').placeholder = `가입자번호 ${needed}자리`;
    } else {
      phoneLabel.textContent = '스마트폰에 등록된 전화번호';
      $('phone').placeholder = '010-1234-5678';
    }
  }
  phoneTypeEl.addEventListener('change', _updatePhoneUI);
  areaCodeEl.addEventListener('change', _updatePhoneUI);
  _updatePhoneUI();

  // ── 전화번호 입력값 → e164 ─────────────────────────────
  // ★ 2026-07-27 교체 — 기존 normalizePhoneToE164()는 형식 검증 없이
  // "+82"+숫자만 이어붙여서, 휴대폰 앞자리 "010"을 빠뜨린 입력도 그대로
  // 서버에 보내(서버가 재정규화하며 "82096627170" 같은 엉뚱한 값을
  // 만들어) 존재하는 계정을 "등록된 계정 없음"으로 오판하게 했다
  // (사고실험에서 발견). 이제 회원가입 화면과 동일한 auth.js의
  // _buildKrE164/krNeededDigitsFor를 그대로 재사용한다 — 입력값에서
  // 필요한 자릿수만큼 뒤에서부터 잘라 쓰므로, 사용자가 "010"/지역번호를
  // 포함해서 입력했든 빼고 입력했든 결과가 항상 같고, 자릿수가 안 맞으면
  // (server 재정규화가 만들어내는 엉뚱한 값 대신) 여기서 명확히 실패
  // 처리한다. 유선전화(지역번호)도 이 경로로 함께 지원된다.
  function buildE164FromInput() {
    const phoneType = _currentPhoneType();
    const areaCode  = _currentAreaCode();
    if (phoneType === 'landline' && !areaCode) return null; // 지역번호 미선택
    const rawDigits = $('phone').value.replace(/[^0-9]/g, '');
    const needed = krNeededDigitsFor(phoneType, areaCode);
    // 사용자가 "010"/지역번호까지 포함해서 입력했을 수도 있으니, 필요한
    // 자릿수만큼 뒤에서부터 취한다 — 포함 여부와 무관하게 항상 같은
    // 결과가 나온다. 자릿수가 부족하면(needed보다 짧으면) 그대로 두어
    // 아래 length 비교에서 명확히 실패하게 한다.
    const localDigits = rawDigits.length > needed ? rawDigits.slice(-needed) : rawDigits;
    if (localDigits.length !== needed) return null;
    return _buildKrE164(phoneType, areaCode, localDigits);
  }

  // e164 문자열 → { type, areaCode, local, display } 파싱. 표시(display)와
  // select 상태 복원(_applyE164ToPhoneUI) 양쪽에서 공유해 로직이 갈라지지
  // 않게 한다.
  function _parseE164Kr(e164) {
    const digits = e164.replace(/^\+82/, '');
    if (digits.length === 11 && digits.startsWith('010')) {
      return { type: 'mobile', areaCode: null,
        display: `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}` };
    }
    for (const a of KR_AREA_CODES) {
      const prefix = '0' + a.code;
      if (digits.startsWith(prefix)) {
        return { type: 'landline', areaCode: a.code,
          display: `${prefix}-${digits.slice(prefix.length)}` };
      }
    }
    return null; // 알 수 없는 형식
  }

  function e164ToKrDisplay(e164) {
    const parsed = _parseE164Kr(e164);
    return parsed ? parsed.display : e164; // 예상 밖 형식이면 그대로 반환(정규화 단계에서 재검증됨)
  }

  // PREFILLED_PHONE/캐시된 e164를 복원할 때, 입력창 텍스트뿐 아니라
  // 휴대폰/유선·지역번호 select 상태까지 함께 맞춘다(2026-07-27 신설) —
  // 이게 안 맞으면 그대로 제출 시 buildE164FromInput()이 잘못된 자릿수
  // 기준으로 뒷자리를 잘라내 엉뚱한 번호가 만들어진다.
  function _applyE164ToPhoneUI(e164) {
    const parsed = _parseE164Kr(e164);
    if (!parsed) { $('phone').value = e164; return; }
    phoneTypeEl.value = parsed.type;
    if (parsed.type === 'landline') areaCodeEl.value = parsed.areaCode;
    _updatePhoneUI();
    $('phone').value = parsed.display;
  }
  if (PREFILLED_PHONE) {
    _applyE164ToPhoneUI(PREFILLED_PHONE);
    // 2026-07-28 — 이 상태(PREFILLED_PHONE 존재) 자체가 이미 "이 계정은
    // 있는데 이 기기엔 없다"는 판정 결과다(auth.js가 넘겨준 것). 여기서
    // 한 번 더 확인 화면을 보여주고 클릭을 기다리는 건 불필요한 반복
    // 절차이자 실질적 보안 효과도 없다(PC 쪽 클릭은 신원을 증명하지
    // 않음 — 실제 승인은 폰에서 일어난다). 그래서 step-phone 화면을
    // 아예 건너뛰고 곧장 요청을 전송한다. 대신 남용 방지는 서버
    // (handleDeviceLinkInit의 e164/IP 2단계 rate limit)로 옮겼다.
    //
    // 2026-07-28 추가 수정 — _sendRequest()가 fetch 응답을 기다린 뒤에야
    // step-code로 전환하면, 그 왕복 시간만큼 step-phone 입력화면이 "전송
    // 중..." 문구와 함께 그대로 보이는 깜빡임이 있었다(실사로 확인).
    // 응답을 기다리지 않고 여기서 즉시 대기 화면으로 전환한다 — 실패하면
    // _sendRequest()의 catch가 step-phone으로 되돌리고 에러를 보여준다.
    stepPhone.classList.remove('active');
    stepCode.classList.add('active');
    setStatus('스마트폰에 요청을 보내는 중...');
    _sendRequest();
  } else if (PURPOSE === 'sign_request') {
    // 공용 PC 세션에서 이미 한 번 승인받은 번호가 있으면 재사용 —
    // 매 서명 요청마다 전화번호를 다시 입력하게 하면 "세션 동안은
    // 편하게 쓴다"는 공용 PC 모드의 취지에 어긋난다. 승인 자체(폰에서
    // 버튼 누르기)는 매번 새로 필요하다 — 여기서 건너뛰는 건 어디까지나
    // "이 번호로 보낼지" 타이핑뿐이다.
    const cached = sessionStorage.getItem(CACHED_E164_KEY);
    if (cached) {
      _applyE164ToPhoneUI(cached);
      setStatus('이전에 사용한 번호로 자동 채워졌습니다. 바로 요청을 보낼 수 있습니다.');
    }
  }

  // 2026-07-28 — 기존엔 버튼 클릭 리스너 안에 인라인으로만 있었는데,
  // PREFILLED_PHONE 도착 시 자동 트리거하기 위해 이름 있는 함수로 분리.
  // 동작은 기존과 완전히 동일, 호출 경로만 (클릭 | 자동)으로 늘었다.
  async function _sendRequest() {
    // 기기 불일치 화면(auth.js)에서 넘어온 경우도 위에서 이미 표준
    // "010-1234-5678"/"지역번호+뒷자리" 형식으로 채워뒀으므로, 아래는
    // 항상 같은 경로(buildE164FromInput)로 처리한다 — 별도 분기 불필요.
    const e164 = buildE164FromInput();
    if (!e164) {
      const needed = krNeededDigitsFor(_currentPhoneType(), _currentAreaCode());
      setStatus(
        _currentPhoneType() === 'landline' && !_currentAreaCode()
          ? '지역번호를 선택해 주세요.'
          : `전화번호 뒷자리 ${needed}자리를 정확히 입력해 주세요.`,
        'error'
      );
      return;
    }
    e164Used = e164;

    $('btn-request').disabled = true;
    setStatus('스마트폰에 요청을 보내는 중...');

    try {
      const pcLabel = (() => {
        const ua = navigator.userAgent;
        const browser = /Chrome/.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : '브라우저';
        const os = /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
        return `${browser} · ${os}`.trim();
      })();

      const initBody = { e164, pcLabel, purpose: PURPOSE };
      if (PURPOSE === 'sign_request') {
        if (!SIG_MSG) throw new Error('서명 대상이 없습니다(sigMsg 누락) — 잘못된 요청입니다.');
        initBody.sigMsg = SIG_MSG;
        if (EXCLUDE_DEVICE_ID) initBody.excludeDeviceId = EXCLUDE_DEVICE_ID;
      } else {
        // key_transfer만 X25519 키페어가 필요하다(개인키 봉투 수신용).
        // sign_request는 서명 '결과'만 평문으로 받으면 되므로 불필요.
        pcKeyPair = await GopangWallet.generateX25519KeyPair();
        initBody.pcPubKeyB64u = pcKeyPair.publicKeyB64u;
      }

      const res = await fetch(`${WORKER}/auth/device-link/init`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(initBody),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.detail || data.error || '요청 실패');

      sessionId = data.sessionId;
      stepPhone.classList.remove('active');
      stepCode.classList.add('active');
      // 2026-07-28 — pushSent(누군가 하나라도 받음) 대신 pushSentToMobile
      // (폰이 실제로 받음)을 기준으로 안내한다. "PC 자신이 예전 구독으로
      // 남아있어서 pushSent:true인데 정작 폰은 못 받는" 사고를 이 화면
      // 에서 더 이상 "성공"으로 오인하지 않는다.
      if (data.hasMobileDevice === false) {
        setStatus('이 계정에 등록된 스마트폰이 없습니다. 아래 "문자로 받기"를 이용해 주세요.', 'error');
      } else {
        setStatus('스마트폰 알림을 확인해 주세요.');
      }
      startCountdown(data.expires_in || 90);
      startPolling();
      setupSmsFallback(data.pushSentToMobile, data.hasMobileDevice);
    } catch (e) {
      // 2026-07-28 — 자동 전송 시 이미 step-code로 전환해뒀을 수 있으니
      // (위 PREFILLED_PHONE 분기), 실패하면 입력 화면으로 되돌려서
      // "스마트폰으로 요청 보내기" 버튼이 다시 보이게 한다.
      stepCode.classList.remove('active');
      stepPhone.classList.add('active');
      setStatus(e.message || '요청에 실패했습니다.', 'error');
      $('btn-request').disabled = false;
    }
  }
  $('btn-request').addEventListener('click', _sendRequest);

  // ── 백업 키로 직접 복구(auth.js의 옛 3버튼 확인 화면에 있던 옵션을
  // 이 대기 화면의 보조 링크로 이전, 2026-07-28) ──────────────────
  // guid 없이 호출하므로 서버 pubkey 검증은 건너뛰지만(로컬 지갑 교체만),
  // RETURN_URL로 돌아간 뒤 그 페이지의 통상적인 세션 검증 단계에서
  // PUBKEY_MISMATCH 등은 그대로 걸러진다.
  $('btn-backup-key').addEventListener('click', async () => {
    const key = prompt('백업 키(개인키, Base64URL)를 입력하세요:');
    if (!key) return;
    const result = await _restoreFromBackupKey(key.trim());
    if (!result.ok) {
      alert('복구 실패: ' + (result.detail || result.reason || '알 수 없는 오류'));
      return;
    }
    location.href = RETURN_URL;
  });

  // ── SMS 폴백(2안) ───────────────────────────────────
  // 2026-07-28 — 기준을 pushSent(누군가 하나라도 받음)에서
  // pushSentToMobile(폰이 실제로 받음)로 좁혔다. hasMobileDevice가
  // false면(등록된 폰 자체가 없음) 기다려도 의미가 없으니 지연 없이
  // 즉시 강조한다.
  // 사고실험 ⑥: 폰이 정상 발송된 경우엔, 알림이 보통 1~2초 안에
  // 도착하므로 사용자가 성급하게 눌러 불필요한 SMS 비용이 나가지
  // 않도록 8초간은 흐리게 뒀다가 그 뒤에 강조한다.
  let smsFallbackTimer = null;
  function setupSmsFallback(pushSentToMobile, hasMobileDevice) {
    const btn = $('btn-sms-fallback');
    btn.style.opacity = '0.5';
    btn.disabled = false;
    if (pushSentToMobile === false || hasMobileDevice === false) {
      btn.style.opacity = '1';
    } else {
      smsFallbackTimer = setTimeout(() => { btn.style.opacity = '1'; }, 8000);
    }
  }

  $('btn-sms-fallback').addEventListener('click', async () => {
    const btn = $('btn-sms-fallback');
    if (!sessionId || btn.disabled) return;
    btn.disabled = true; // 연타 방지(사고실험 ⑤) — 서버도 별도로 재확인함
    const original = btn.textContent;
    btn.textContent = '문자 발송 중...';
    try {
      const res = await fetch(`${WORKER}/auth/device-link/resend-sms`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.detail || data.error || '문자 발송 실패');

      btn.textContent = '문자를 보냈습니다';
      setStatus('문자로 받은 링크를 스마트폰에서 열어 승인해 주세요.');
      // 서버가 세션 TTL을 5분으로 연장했으므로(사고실험 ①), PC의
      // 카운트다운도 같이 늘려준다 — 안 그러면 화면상 타이머만 먼저
      // 끝나 사용자가 아직 유효한 세션을 포기하게 된다.
      if (countdownTimer) clearInterval(countdownTimer);
      startCountdown(data.expires_in || 300);
    } catch (e) {
      setStatus(e.message, 'error');
      btn.textContent = original;
      btn.disabled = false;
    }
  });

  // (2026-07-20 삭제 — STEP 2 "코드 확인" 버튼 자체가 없어졌다. 폰이
  // 승인 버튼을 누르면 스스로 code를 /verify에 제출하므로, PC는
  // 이제부터 오직 polling만으로 결과(delivered)를 기다린다.)

  // ── 봉투 polling ────────────────────────────────────
  async function _pollOnce() {
    try {
      const res = await fetch(`${WORKER}/auth/device-link/poll?sessionId=${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      if (!data.ok) return;

      if (data.state === 'expired') {
        stopPolling();
        _showExpiredGuidance();
        return;
      }
      if (data.state === 'delivered') {
        stopPolling();
        if (data.purpose === 'sign_request') {
          await finishSignRequest(e164Used, data.signature, data.publicKeyB64u, data.guid);
        } else if (data.sealed) {
          await finishImport(data.sealed);
        }
      }
    } catch { /* 일시적 네트워크 오류는 무시하고 다음 polling에서 재시도 */ }
  }

  // 2026-07-28 — KV→Durable Object 이전으로 저장소 쪽 최대 60초 전파
  // 지연은 없앴는데도 폰 승인 후 PC가 약 40초 걸려서야 반영되는 게
  // 실사로 재현됐다. 원인은 다른 곳(브라우저의 백그라운드 탭 타이머
  // 스로틀링) — 사용자가 폰을 확인하러 가는 동안 이 PC 탭이 비활성화
  // 되면 Chrome/Brave 계열이 setInterval(2000ms)을 훨씬 뜸하게만
  // 실행한다. 탭이 다시 보이는(포커스 복귀) 순간 즉시 한 번 더 poll을
  // 강제 실행해서, 스로틀링된 인터벌과 무관하게 사용자가 돌아오는 그
  // 즉시 최신 상태를 반영한다.
  function _onVisibilityChange() {
    if (!document.hidden && pollTimer) _pollOnce();
  }
  document.addEventListener('visibilitychange', _onVisibilityChange);

  function startPolling() {
    pollTimer = setInterval(_pollOnce, 2000);
  }
  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  function startCountdown(seconds) {
    let remain = seconds;
    const el = $('timer');
    const tick = () => {
      if (remain <= 0) {
        clearInterval(countdownTimer);
        el.textContent = '만료됨';
        stopPolling();
        _showExpiredGuidance();
        return;
      }
      el.textContent = `${remain}초 후 만료`;
      remain -= 1;
    };
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ── 만료 시 안내 (2026-07-21 신설) ────────────────────
  // 이 승인 방식은 서버가 절대 확인할 수 없는 전제 위에 서 있다 —
  // "개인키를 가진 다른 기기가 실제로 존재하는가"는 서버가 원리상
  // 알 수 없다(개인키는 서버에 없다). 그래서 "다시 시도하면 될 수도
  // 있다"는 기존 문구는, 그 전제 자체가 성립하지 않는 경우(키를 가진
  // 유일한 기기의 저장소를 지운 경우 등)에는 사실과 다르다 — 사용자가
  // 영원히 재시도만 반복하게 만든다. 그 불확실성 자체를 솔직히 알리고,
  // 실질적인 다음 단계(백업 키 복구 또는 이 계정 포기)를 안내한다.
  function _showExpiredGuidance() {
    // sign_request 팝업이면 굳이 이 긴 안내문을 보여줄 필요 없다 — 그냥
    // 실패를 opener에게 알리고 닫는다. 이 문구는 key_transfer(전용 PC
    // 최초 연결, 실패하면 사용자가 직접 다음 행동을 정해야 함)에만 맞다.
    if (IS_POPUP_SIGN) {
      try {
        window.opener?.postMessage(
          { type: 'GOPANG_SIGN_RESULT', ok: false, error: 'expired' },
          location.origin
        );
      } catch (e) { /* 무시 */ }
      setStatus('시간이 초과되어 취소되었습니다.', 'error');
      setTimeout(() => { try { window.close(); } catch {} }, 800);
      return;
    }
    setStatus(
      '응답이 없어 만료됐습니다. 이 방식은 개인키를 가진 다른 기기가 ' +
      '실제로 존재해야만 작동합니다 — 서버는 그런 기기가 진짜 있는지 ' +
      '확인할 방법이 없어, 있어도 없어도 지금과 똑같이 "응답 없음"으로 ' +
      '보입니다. 그 기기가 확실히 있다면 다시 시도해 주세요(문자를 ' +
      '보냈는데도 응답이 없다면, 그 기기가 통신 신호가 없는 상태 ' +
      'Wi-Fi 전용 기기·비행기 모드 등일 수도 있습니다). 만약 이 ' +
      '계정을 쓰던 기기가 이것뿐이었고 그 기기의 데이터를 지운 적이 ' +
      '있다면, 이 방식으로는 복구할 수 없습니다 — 가입 시 저장해둔 ' +
      '백업 키(4단어 시드)가 있으면 "백업 키를 직접 갖고 있어요" ' +
      '경로로 복구하고, 없다면 이 계정은 되살릴 수 없으니 새로 ' +
      '가입해 주세요.',
      'error'
    );
    resetToStep1();
  }

  function resetToStep1() {
    stepCode.classList.remove('active');
    stepPhone.classList.add('active');
    $('btn-request').disabled = false;
    sessionId = null; pcKeyPair = null;
    if (smsFallbackTimer) { clearTimeout(smsFallbackTimer); smsFallbackTimer = null; }
    const smsBtn = $('btn-sms-fallback');
    smsBtn.disabled = false;
    smsBtn.textContent = '알림이 안 왔나요? 문자로 받기';
    smsBtn.style.opacity = '0.5';
  }

  // ── 봉투 복호화 → 지갑 복원 ─────────────────────────
  // ── 서명 결과 반환 (2026-07-23 신설, sign_request 전용) ──────────
  // key_transfer와 달리 개인키를 옮기는 게 아니라, 이미 서명된 결과를
  // opener(sendMessage()를 호출했던 원래 탭)에게 postMessage로 돌려주고
  // 이 팝업은 닫는다. 성공한 번호는 세션 동안 재사용할 수 있도록
  // sessionStorage에 남긴다(팝업은 opener와 같은 오리진이면 sessionStorage를
  // 공유한다 — 스펙 동작).
  async function finishSignRequest(e164, signature, publicKeyB64u, guid) {
    if (e164) sessionStorage.setItem(CACHED_E164_KEY, e164);
    setStatus('완료됐습니다.', 'success');
    try {
      window.opener?.postMessage(
        { type: 'GOPANG_SIGN_RESULT', ok: true, signature, publicKeyB64u, guid },
        location.origin
      );
    } catch (e) { /* opener가 이미 닫혔거나 접근 불가 — 무시 */ }
    setTimeout(() => { try { window.close(); } catch {} }, 400);
  }

  async function finishImport(sealed) {
    try {
      const plaintext = await GopangWallet.openSealedWithKey(pcKeyPair.privateKey, sealed);
      const { privKeyB64u, userRecord, onboardingFlags } = JSON.parse(plaintext);
      if (!privKeyB64u) throw new Error('전달받은 데이터 형식이 올바르지 않습니다.');

      await GopangWallet.restoreFromPrivateKey(privKeyB64u);

      // ★ 2026-07-20 신설 — gopang_user_v4를 폰과 동일하게 이 기기에도
      // 써준다. gopang-wallet.js의 싱글턴 자동 초기화 IIFE가 다음 페이지
      // 로드(webapp.html) 때 이 값을 읽어 지갑에 guid를 연결하고,
      // 그 값이 없으면(로그아웃 버튼이 숨겨지는 등) 앱이 이 계정을
      // "게스트"로 오인한다 — 지갑 키만 옮기고 이 기록을 빠뜨리면 계정
      // 삭제·로그아웃이 정상 동작하지 않는다는 게 실사로 확인됐다.
      if (userRecord && userRecord.ipv6) {
        localStorage.setItem('gopang_user_v4', JSON.stringify(userRecord));
      } else {
        // 폰 쪽에도 gopang_user_v4가 없던 경우(드묾) — 최소한 지갑
        // 복원은 됐으니 계속 진행하되, 계정 삭제·로그아웃이 정상
        // 동작하지 않을 수 있음을 알린다.
        console.warn('[DeviceLink] 폰의 gopang_user_v4가 비어있어 계정 식별 정보를 옮기지 못했습니다.');
      }

      // ★ 2026-07-20 신설(실사 발견 — 주피터 지시) — 온보딩 완료 플래그
      // (hondi_first_greeted 등)도 같이 안 옮기면, 오래전에 가입한
      // 사용자인데도 PC에서는 "평생 1회" 신규 환영 인사·프로필 질문이
      // 다시 시작돼버린다(call-ai.js의 _buildFirstContactContext가
      // localStorage만 보고 판단하기 때문). 상세 PDV·대화 기록까지
      // 옮길 필요는 없고, 이 최소 신호만 옮기면 충분하다.
      if (onboardingFlags) {
        if (onboardingFlags.firstGreeted) localStorage.setItem('hondi_first_greeted', '1');
        if (onboardingFlags.tutorialDone) localStorage.setItem('hondi_tutorial_done', '1');
        if (onboardingFlags.tutorialStep) localStorage.setItem('hondi_tutorial_step', onboardingFlags.tutorialStep);
      }

      setStatus('완료됐습니다. 이동 중...', 'success');
      setTimeout(() => { location.href = RETURN_URL; }, 800);
    } catch (e) {
      setStatus('지갑 가져오기에 실패했습니다: ' + e.message, 'error');
      resetToStep1();
    } finally {
      // 페어링 전용 1회용 키는 즉시 폐기(순방향 비밀성) — 참조만 끊어도
      // CryptoKey 자체가 non-extractable이라 메모리에서 재추출 불가능하다.
      pcKeyPair = null;
    }
  }
})();
</script>
</body>
</html>
