<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Pretendard',sans-serif;background:#f5f5f5;color:#111;min-height:100dvh;padding:20px}

h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12.5px;color:#6b7280;margin-bottom:20px;line-height:1.6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:14px}
.card label{display:block;font-size:12.5px;color:#6b7280;margin-bottom:6px}
.card input,.card textarea,.card select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
.submit-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#111;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.submit-btn:disabled{background:#d1d5db;cursor:not-allowed}
.err{color:#9B1C1C;font-size:12.5px;margin-top:8px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item-cat{font-size:11px;color:#6b7280;background:#f3f4f6;border-radius:99px;padding:2px 8px}
.item-desc{font-size:12.5px;color:#374151;margin-top:6px;line-height:1.5}
.item-date{font-size:11px;color:#9ca3af;margin-top:4px}
.empty{padding:24px;text-align:center;color:#9ca3af;font-size:13px}
.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:12px;color:#1e40af;margin-bottom:14px;line-height:1.6}
.note a{color:#1e40af;font-weight:600}
.result{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;font-size:12.5px;color:#166534;margin-top:10px;line-height:1.6;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>불법행위 신고 정리</h1>
  <div class="sub">교통법규위반·바가지요금 등을 정리해드립니다.</div>
  <div class="note" style="background:#eff6ff;border-color:#bfdbfe;color:#1e3a5f;">이 페이지는 범위를 넓혀 <b>K-Watch</b>로 통합될 예정입니다 — 범죄부터 생활 속 부당·불법·편법·오염·파손까지 다루고, 대응 기관 선정부터 진행 상황 공개까지 이어집니다. <a href="./pages/k-services.html#kwatch" style="color:#1e3a5f;font-weight:600;">K-Watch 안내 보기 →</a></div>
  <div class="note">나비는 관공서에 직접 신고를 접수하지 않습니다. 여기서 내용을 정리해두면, 실제 접수는 <a href="https://www.safepatrol.go.kr" target="_blank" rel="noopener">안전신문고</a>에서 진행하실 수 있습니다.</div>

<!-- 2026-10-24: 시작 영역(대화창) -->
<script>
  window.K_AUTH_CONFIG = { serviceLabel: "불법행위 신고 정리" };
  window.HONDI_CHAT_WIDGET_CONFIG = {
    sp: "k-watch",
    panelMode: "inline",
    inlineMount: "#startChatMount",
    mic: true,
    camera: "touch",
    maxTokens: 2500,
    panelTitle: "신고 정리 AI",
    label: "목격하신 내용을 말씀하세요",
    greeting: "안녕하세요! 목격하신 불법·부당 행위를 말씀해 주세요. 신고에 필요한 내용(언제·어디서·무엇을·증거)을 정리해 드립니다. 나비는 관공서에 직접 접수하지 않으며, 실제 접수는 안전신문고(safepatrol.go.kr)에서 직접 하셔야 합니다.",
    serviceLabel: "불법행위 신고 정리",
    context: "사용자는 지금 불법행위 신고 정리 화면에 있다. 이 화면은 신고 내용을 정리해 주는 단계까지만 하며, 나비는 관공서에 신고를 직접 접수하지 않는다. 실제 접수는 이용자가 안전신문고(safepatrol.go.kr) 등에서 직접 한다. 접수를 대신했다고 말하지 않는다. 위급한 상황이면 먼저 112·119에 연락하도록 안내한다.",
  };
</script>
<script src="https://hondi.net/auth/k-service-auth-client.js"></script>
<script src="/assets/chat-widget.js"></script>
<div class="doc-start" id="startBox" style="margin:0 auto 14px"></div>
<script src="/assets/md-view.js"></script>
<script>window.START_FIELD = { firstTab: "신고 정리", secondTab: "방법론", legalReview: false, suggestButton: false, placeholder: "목격하신 내용을 말씀하세요" };</script>
<script src="/assets/start-field.js"></script>

  <div class="card">
    <label>유형</label>
    <select id="f-category">
      <option value="traffic_violation">교통법규위반</option>
      <option value="overcharging">바가지 요금</option>
      <option value="illegal_parking">불법 주정차</option>
      <option value="other">기타</option>
    </select>
    <label>장소(선택)</label>
    <input id="f-location" type="text" placeholder="예: 제주시 ○○동 앞">
    <label>내용</label>
    <textarea id="f-desc" rows="4" placeholder="목격하신 내용을 자세히 적어주세요"></textarea>
    <button class="submit-btn" id="submit-btn" onclick="submitReport()">정리하기</button>
    <div class="err" id="err" style="display:none"></div>
    <div class="result" id="result"></div>
  </div>

  <div id="list"></div>
</div>

<script>
const WORKER_URL = 'https://hondi-proxy.tensor-city.workers.dev';
let userGuid = null;
const CAT_LABEL = { traffic_violation: '교통법규위반', overcharging: '바가지 요금', illegal_parking: '불법 주정차', other: '기타' };

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s ?? '');
  return div.innerHTML;
}

async function waitForWallet(timeoutMs = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (window.gopangWallet?.guid) return { guid: window.gopangWallet.guid };
    await new Promise(r => setTimeout(r, 200));
  }
  return { guid: null };
}

async function loadReports() {
  const list = document.getElementById('list');
  if (!userGuid) return;
  try {
    const res = await fetch(`${WORKER_URL}/citizen/reports/list?${new URLSearchParams({ guid: userGuid })}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
    renderReports(data.reports || []);
  } catch (e) {
    list.innerHTML = `<div class="empty">조회 실패: ${escapeHtml(e.message)}</div>`;
  }
}

function renderReports(reports) {
  const list = document.getElementById('list');
  if (!reports.length) { list.innerHTML = `<div class="empty">정리한 기록이 없습니다.</div>`; return; }
  list.innerHTML = reports.map(r => `
    <div class="item">
      <span class="item-cat">${escapeHtml(CAT_LABEL[r.category] || r.category)}</span>
      <div class="item-desc">${escapeHtml(r.description)}${r.location_text ? ' · ' + escapeHtml(r.location_text) : ''}</div>
      <div class="item-date">${escapeHtml((r.created_at || '').slice(0, 10))}</div>
    </div>
  `).join('');
}

async function submitReport() {
  const err = document.getElementById('err');
  const result = document.getElementById('result');
  err.style.display = 'none'; result.style.display = 'none';
  if (!userGuid) { err.textContent = '지갑 정보를 아직 불러오지 못했습니다.'; err.style.display = 'block'; return; }
  const description = document.getElementById('f-desc').value.trim();
  if (!description) { err.textContent = '내용을 입력해 주세요.'; err.style.display = 'block'; return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`${WORKER_URL}/citizen/reports/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        guid: userGuid,
        category: document.getElementById('f-category').value,
        location_text: document.getElementById('f-location').value.trim(),
        description,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
    result.textContent = data.guidance || '정리되었습니다.';
    result.style.display = 'block';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-location').value = '';
    loadReports();
  } catch (e) {
    err.textContent = '처리 실패: ' + e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

(async function init() {
  const w = await waitForWallet();
  userGuid = w.guid;
  loadReports();
})();
</script>
</body>
</html>
