name: Gov SP monthly review (최신성 갱신 + 사용자 피드백 반영 강제)

# 절차: docs/GOV-SP-MONTHLY-REVIEW_v1_0.md
#  · 매월 1일: 피드백 취합(triage) → 월간 장부 개설 PR + 체크리스트 이슈
#  · 매일: 마감(15일) 경과 후 장부 미종결이면 이슈 재알림
#  · PR: 정부 SP 파일을 바꾸는 PR은 마감 경과 시 장부가 종결돼야 통과(필수 체크로 지정할 것)

on:
  schedule:
    - cron: '0 0 1 * *'     # 매월 1일 09:00 KST — 장부 개설
    - cron: '0 1 * * *'     # 매일 10:00 KST — 마감 점검
  pull_request:
    paths:
      - 'prompts/gov-tree/**'
      - 'prompts/K-Public_common_v*.md'
      - 'prompts/SP-10_kpublic_*.txt'
      - 'data/gov-sp-review/**'
      - 'tools/gov_sp_monthly_review.py'
      - 'tools/sp_update_log.py'
      - 'data/sp-update-log/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'open | check'
        required: false
        default: 'check'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-ledger:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 1) 지난달 피드백 취합·초안 제안(사람 승인 없이는 반영 안 됨 — 기존 triage와 동일)
      - name: Triage feedback
        continue-on-error: true
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
          HONDI_WORKER_URL: https://hondi-proxy.tensor-city.workers.dev
        run: python3 tools/triage_feedback.py
      # 2) 월간 장부 개설
      # 2-1) 공유 다이제스트 재생성(최근 90일 창이 매월 이동)
      - name: Regenerate shared update digest
        run: python3 tools/sp_update_log.py digest
      - name: Open ledger
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
        run: python3 tools/gov_sp_monthly_review.py open
      # 3) PR + 체크리스트 이슈(main은 PR 필수 — 직접 push 안 함)
      - name: Open PR and issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=$(TZ=Asia/Seoul date +%Y-%m)
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "gov-sp-review/$M"
          git add "data/gov-sp-review/$M.json" prompts/gov-tree/00-common/GOV-UPDATE-DIGEST.md
          git diff --staged --quiet && { echo "장부 변경 없음(이미 개설됨)"; exit 0; }
          git commit -m "chore(gov-sp): $M 월간 검토 장부 개설"
          git push -u origin "gov-sp-review/$M"
          gh pr create --base main --head "gov-sp-review/$M" --title "chore(gov-sp): $M 월간 검토 장부" --body "절차: docs/GOV-SP-MONTHLY-REVIEW_v1_0.md. 이 PR을 병합한 뒤 장부를 채워 15일까지 종결한다."
          gh issue create --title "[월간 정부 SP 검토] $M — 15일까지 종결" --body "$(cat docs/GOV-SP-MONTHLY-REVIEW_v1_0.md | sed -n '/^## 체크리스트/,$p')"

  check-ledger:
    if: github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 정부 SP를 바꾼 PR은 갱신 기록(언제·어떻게·왜)을 함께 추가해야 하고 공유 다이제스트가 원장과 맞아야 한다
      - name: Require update-log entry for changed gov SPs
        if: github.event_name == 'pull_request'
        run: python3 tools/sp_update_log.py check-pr --base origin/${{ github.base_ref }}
      - name: Check monthly review ledger
        id: chk
        run: python3 tools/gov_sp_monthly_review.py check --pr-gate | tee /tmp/chk.txt; exit ${PIPESTATUS[0]}
      # 피드백 집계 → 갱신 여부 결정(SP별 미반영 10건↑ → 갱신 필요 이슈). 원천 조회 실패해도 다른 점검은 막지 않는다.
      - name: Decide SP updates from feedback counts
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sp_update_log.py feedback-decide --open-issues
      - name: Re-alert overdue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=$(TZ=Asia/Seoul date +%Y-%m)
          gh issue create --title "[월간 정부 SP 검토 지연] $M" --body "$(cat /tmp/chk.txt)" || true
