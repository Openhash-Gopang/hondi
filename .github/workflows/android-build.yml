name: Android APK Build

# 나비웹 안드로이드 앱(TWA) 시험용 APK 빌드. 계획서: admin/android-app-plan-20261116.html
# 서명: GitHub secrets(NAVIWEB_KEYSTORE_B64 등)의 개인 서명키로 서명한다. 없으면 서명하지 않은 APK 가 나온다.
"on":
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: write   # main 에서 빌드되면 APK 를 사이트(downloads/)에 게시하려고 커밋한다

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAVIWEB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firebase API key 설정 여부 점검
        working-directory: android
        run: |
          if grep -Eq '^FIREBASE_API_KEY=.+' app/firebase-config.properties; then
            echo "FIREBASE_API_KEY 설정됨"
          else
            echo "::warning::FIREBASE_API_KEY 가 비어 있습니다 — 빌드는 되지만 푸시 토큰을 받을 수 없습니다"
          fi
      - name: 개인 서명키 준비
        env:
          KS_B64: ${{ secrets.NAVIWEB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/naviweb.keystore"
            echo "NAVIWEB_KEYSTORE_FILE=$RUNNER_TEMP/naviweb.keystore" >> "$GITHUB_ENV"
            echo "개인 서명키 사용"
          else
            echo "::warning::NAVIWEB_KEYSTORE_B64 없음 — 서명되지 않은 APK 가 만들어집니다"
          fi
      - name: assemble
        working-directory: android
        env:
          NAVIWEB_KEYSTORE_PASSWORD: ${{ secrets.NAVIWEB_KEYSTORE_PASSWORD }}
          NAVIWEB_KEY_ALIAS: ${{ secrets.NAVIWEB_KEY_ALIAS }}
          NAVIWEB_KEY_PASSWORD: ${{ secrets.NAVIWEB_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: APK 지문 확인
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs "$APK" | grep "SHA-256" || echo "::warning::서명 지문을 확인하지 못했습니다(서명되지 않은 APK 일 수 있음)"
      - uses: actions/upload-artifact@v4
        with:
          name: naviweb-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      # QR 로 바로 설치할 수 있게, 서명된 APK 를 사이트 downloads/naviweb.apk 로 게시한다(main 푸시일 때만).
      # 커밋 메시지에 [skip ci] 를 넣지 않는다 — Cloudflare Pages 가 이 커밋으로 사이트를 다시 배포해야 한다.
      # (GITHUB_TOKEN 푸시는 다른 워크플로를 일으키지 않고, downloads/ 는 이 워크플로의 감시 경로가 아니라 반복되지 않는다.)
      - name: 사이트에 APK 게시
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$NAVIWEB_KEYSTORE_FILE" ]; then echo "::warning::서명되지 않은 APK 는 게시하지 않습니다"; exit 0; fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          git config user.name "naviweb-apk-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p downloads
          cp "$APK" downloads/naviweb.apk
          printf '{"versionCode":%s,"builtAt":"%s","sha256":"%s"}\n' "$NAVIWEB_VERSION_CODE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(sha256sum downloads/naviweb.apk | cut -d' ' -f1)" > downloads/naviweb-apk.json
          git add downloads/naviweb.apk downloads/naviweb-apk.json
          git commit -m "chore: 안드로이드 앱 APK 게시 (빌드 ${NAVIWEB_VERSION_CODE})"
          git push origin HEAD:main
