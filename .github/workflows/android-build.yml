name: Android APK Build

# 나비웹 안드로이드 앱(TWA) 시험용 APK 빌드. 계획서: admin/android-app-plan-20261116.html
# 서명: GitHub secrets(NAVIWEB_KEYSTORE_B64 등)에 개인 서명키가 있으면 그 키로, 없으면 공개 시험 키(android/debug.keystore)로 서명한다.
# 공개 시험 키로 서명된 APK 는 배포하지 않는다.
"on":
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAVIWEB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firebase API key 설정 여부 점검
        working-directory: android
        run: |
          if grep -Eq '^FIREBASE_API_KEY=.+' app/firebase-config.properties; then
            echo "FIREBASE_API_KEY 설정됨"
          else
            echo "::warning::FIREBASE_API_KEY 가 비어 있습니다 — 빌드는 되지만 푸시 토큰을 받을 수 없습니다"
          fi
      - name: 개인 서명키 준비
        env:
          KS_B64: ${{ secrets.NAVIWEB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/naviweb.keystore"
            echo "NAVIWEB_KEYSTORE_FILE=$RUNNER_TEMP/naviweb.keystore" >> "$GITHUB_ENV"
            echo "개인 서명키 사용"
          else
            echo "::warning::NAVIWEB_KEYSTORE_B64 없음 — 공개 시험 키로 서명됩니다(배포 금지)"
          fi
      - name: assemble
        working-directory: android
        env:
          NAVIWEB_KEYSTORE_PASSWORD: ${{ secrets.NAVIWEB_KEYSTORE_PASSWORD }}
          NAVIWEB_KEY_ALIAS: ${{ secrets.NAVIWEB_KEY_ALIAS }}
          NAVIWEB_KEY_PASSWORD: ${{ secrets.NAVIWEB_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: APK 지문 확인
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: naviweb-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
