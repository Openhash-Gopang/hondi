name: Live Smoketest — Subject-Gate Hierarchical (5 roots, 395 leaves)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-hierarchical-gate-full5-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: pip install requests

      - name: Run subject-gate hierarchical smoketest (professor, physician, lawyer, patent-attorney, accountant)
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 subject_gate_hierarchical_live_smoketest.py \
            --scenarios scenarios_hierarchical_gate_full5_395_20260918.json \
            --roots professor,physician,lawyer,patent-attorney,accountant \
            --out ../../results/subject-gate-hierarchical/full5-395 \
            --resume

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-hierarchical-gate-full5
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: hierarchical-gate-full5 live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-hierarchical-gate-full5

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-hierarchical-gate-full5-results
          path: results/
