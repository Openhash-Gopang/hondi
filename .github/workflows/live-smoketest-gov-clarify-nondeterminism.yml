name: Live Smoketest — Gov Router CLARIFY Non-determinism Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-gov-clarify-nondeterminism-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Repeat 2 retry-prone utterances 6x each at fixed max_tokens/temperature=0 (diag-04 non-determinism probe)
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 gov_clarify_live_smoketest.py \
            --scenarios scenarios_gov_clarify_nondeterminism_20260918.json \
            --out ../../results/gov-clarify-nondeterminism

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-gov-clarify-nondeterminism
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: gov-clarify non-determinism probe results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-gov-clarify-nondeterminism

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-gov-clarify-nondeterminism-results
          path: results/
