name: Live Smoketest — Gov Router CLARIFY A3 (EMD Team Level)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-gov-clarify-a3-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run gov-router CLARIFY A3 (읍면동 팀 레벨, 8 scenarios — 6 adjacent-pair + 2 control)
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 gov_clarify_live_smoketest.py \
            --scenarios scenarios_gov_clarify_a3_20260918.json \
            --out ../../results/gov-clarify-a3

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-gov-clarify-a3
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: gov-clarify-a3 live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-gov-clarify-a3

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-gov-clarify-a3-results
          path: results/
