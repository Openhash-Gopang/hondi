name: Check digit-code & phone-auth tests

# 2026-09-26 신설 — 2026-09-25 하루 동안 tests/digit-v2의 단위 테스트(56개)는 실제로는
# 사람이 로컬에서 "npm run test:unit"을 손으로 돌릴 때만 실행됐다. main에 자동으로 반영되는
# CI 관문이 전혀 없어서, 같은 결함을 여러 차례 눈으로 조사해야 했다. 이 워크플로는 그 테스트를
# push마다 자동으로 돌린다. tests/cross-validation은 worker.js(Cloudflare Worker) ↔
# pb_hooks/main.pb.js(PocketBase JSVM) 사이에 손으로 두 번 옮겨 적힌 로직(전화번호 정규화·해시
# 접두어·비밀값 이름 등)이 서로 어긋나지 않는지 확인한다 — 2026-09-25의 조사 지연 원인.

"on":
  push:
    branches: [main]
    paths:
      - 'src/gopang/ai/hondi-digit-*.js'
      - 'src/worker/digit-claim-*.js'
      - 'src/worker/phone-token.js'
      - 'src/worker/phone-lookup.js'
      - 'src/worker/device-geo.js'
      - 'worker.js'
      - 'pb_hooks/main.pb.js'
      - 'tests/digit-v2/**'
      - 'tests/cross-validation/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/gopang/ai/hondi-digit-*.js'
      - 'src/worker/digit-claim-*.js'
      - 'src/worker/phone-token.js'
      - 'src/worker/phone-lookup.js'
      - 'src/worker/device-geo.js'
      - 'worker.js'
      - 'pb_hooks/main.pb.js'
      - 'tests/digit-v2/**'
      - 'tests/cross-validation/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --silent
        working-directory: tests/digit-v2

      - name: Run digit-v2 unit tests
        run: npm run test:unit
        working-directory: tests/digit-v2

      - name: Run worker.js ↔ pb_hooks cross-validation tests
        run: node --test 'tests/cross-validation/*.test.mjs'
