name: Live Smoketest — Gov Router CLARIFY Empty-Response Diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-gov-clarify-emptyresponse-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Re-run the 5 reproduced empty-response cases (A1/A3/A5) at max_tokens=12000
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 gov_clarify_live_smoketest.py \
            --scenarios scenarios_gov_clarify_emptyresponse_diag_20260918.json \
            --out ../../results/gov-clarify-emptyresponse-diag \
            --max-tokens 12000

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-gov-clarify-emptyresponse-diag
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: gov-clarify empty-response diagnostic results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-gov-clarify-emptyresponse-diag

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-gov-clarify-emptyresponse-diag-results
          path: results/
