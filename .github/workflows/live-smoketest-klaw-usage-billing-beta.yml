name: Live Smoketest — K-Law Beta Usage Billing (GDC ×10)

on:
  workflow_dispatch:
    inputs:
      scenarios_file:
        description: "Scenario file name in tests/live_smoketest/ (blank = scenarios_klaw_usage_billing_beta_20260907.json)"
        required: false
        default: ""
      funded_guid:
        description: "GDC 잔액 보유한 테스트 guid (필수 — 모든 시나리오가 실제 과금을 발생시킴)"
        required: true
      worker_base:
        description: "worker.js(hondi-proxy) base URL"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-klaw-usage-billing-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run K-Law beta usage-billing live smoketest
        working-directory: tests/live_smoketest
        run: |
          SCEN="${{ github.event.inputs.scenarios_file }}"
          if [ -z "$SCEN" ]; then SCEN="scenarios_klaw_usage_billing_beta_20260907.json"; fi
          BASE=$(basename "$SCEN" .json)
          OUT="../../results/${BASE}"
          echo "scenarios=$SCEN out=$OUT"
          python3 klaw_usage_billing_live_smoketest.py \
            --scenarios "$SCEN" --out "$OUT" \
            --worker-base "${{ github.event.inputs.worker_base || 'https://hondi-proxy.tensor-city.workers.dev' }}" \
            --funded-guid "${{ github.event.inputs.funded_guid }}" \
            --resume

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-klaw-usage-billing-beta
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: K-Law beta usage-billing live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-klaw-usage-billing-beta

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-klaw-usage-billing-beta-results
          path: results/
