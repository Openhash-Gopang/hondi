name: Live Smoketest — Gov Router CLARIFY A7 Batch (city-dept zero-match rescue)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-gov-clarify-a7-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run gov-router CLARIFY A7 batch (3 scenarios — 시청 국 키워드 완전매칭 실패 시 _resolveCityDeptMatch 전체목록 구제망 검증)
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 gov_clarify_live_smoketest.py \
            --scenarios scenarios_gov_clarify_a7_citydept_zeromatch_20260918.json \
            --out ../../results/gov-clarify-a7

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-gov-clarify-a7
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: gov-clarify-a7 live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-gov-clarify-a7

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-gov-clarify-a7-results
          path: results/
