name: Live Smoketest — EXPERT routing (A-named, 453 leaves)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-expert-leaf-named-routing-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run EXPERT leaf A-named routing smoketest
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 routing_ABmention_live_smoketest.py \
            --scenarios scenarios_expert_leaf_named_453_20260918.json \
            --out ../../results/routing-ab/expert-leaf-named-453

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-expert-leaf-named-453
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: expert-leaf-named-453 live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-expert-leaf-named-453

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-expert-leaf-named-453-results
          path: results/
