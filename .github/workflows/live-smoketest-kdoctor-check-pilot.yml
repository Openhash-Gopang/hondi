name: Live Smoketest — K-Doctor-Check 오류 주입 파일럿

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Repeat count (default 1)"
        required: false
        default: "1"
      label:
        description: "Result label (blank = run number). Results go to branch results/live-smoketest-kdoctor-check-<label>"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-kdoctor-check-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run K-Doctor-Check pilot
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_DOCTOR_KEY: ${{ secrets.DEEPSEEK_DOCTOR_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_CHECK_KEY: ${{ secrets.DEEPSEEK_CHECK_KEY }}
        run: |
          LABEL="${{ github.event.inputs.label }}"
          if [ -z "$LABEL" ]; then LABEL="run${{ github.run_number }}"; fi
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          node kdoctor_check_pilot.mjs --out ../../results/kdoctor-check-$LABEL --repeat ${{ github.event.inputs.repeat || '1' }}

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-kdoctor-check-${LABEL:-run}
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: kdoctor check pilot results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-kdoctor-check-${LABEL:-run}
