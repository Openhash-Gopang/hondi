name: Check Routing Regression (auto-gate)

# 배경(2026-08-06, 주피터 지시 — 라우팅 검색순서 편향 방지책 1번):
# AC-PRO-CORE·gwp-registry.js·expert-registry.js가 바뀌어도 지금까지는
# 실제 라우팅 정확도를 아무도 자동으로 검증하지 않았다(live-smoketest.yml은
# workflow_dispatch 전용). check-stale-refs.yml 등 정적 정합성 검사는 이미
# push마다 자동 실행되는데, "이 변경이 실제로 더 정확하게 라우팅하는가"라는
# 행동적 정확도 검증엔 그런 게이트가 없었다는 게 이 워크플로의 존재 이유다.
#
# 300건 전체(scenarios.json)가 아니라, 이번 세션에서 GWP↔EXPERT 판별
# 정확도(선순위/후순위 편향)를 직접 겨냥해 만든 3개 배치만 돈다 — 비용·
# 시간을 감안한 의도적 축소(전체 300건은 여전히 live-smoketest.yml로
# 수동 실행). 각 배치의 임계치는 100%가 아니라 "현재 알려진 기준선에서
# 더 나빠지지 않는다"는 회귀 방지 목적으로 설정했다 — kestate/ktelecom
# 태그 문법 미준수, kbusiness/ktax 혼동처럼 이미 알려졌지만 아직 안 고쳐진
# 이슈 때문에 100%로 잡으면 항상 빨갛게 떠서 게이트 자체를 무시하게 만드는
# 역효과가 난다.

on:
  push:
    branches: [main]
    paths:
      # 2026-09-30 수정 — 아래 세 문서는 버전이 자주 올라가는 활성 편집
      # 대상인데, 경로 필터를 정확한 파일명으로 고정해뒀더니 버전이
      # 올라갈 때마다 이 워크플로가 그 파일의 변경에 대해 조용히 트리거를
      # 멈추는 문제가 있었다(실제로 AC-PRO-CORE_v1_1.txt는 이미 오래전에
      # v1_15로 바뀌어 사라졌는데 트리거 경로는 그대로였다 — 다행히
      # 아래 --prompt/--system-prompt 인자가 똑같이 v1_1을 하드코딩하고
      # 있어서 그쪽 크래시로 먼저 발견됐다). 버전 부분을 글롭으로 바꿔
      # 재발을 막는다 — GitHub Actions의 paths 필터는 "**" 없이도 파일명
      # 안의 "*"를 글롭으로 해석한다.
      - "prompts/AC-PRO-CORE_v*.txt"
      - "prompts/UNIVERSAL-common_v*.md"
      - "prompts/PROFESSIONAL-common_v*.md"
      - "gwp-registry.js"
      - "src/gopang/ai/expert-registry.js"
  workflow_dispatch: {}

permissions:
  contents: write

# 2026-08-06 신설(주피터 지적) — AC-PRO-CORE_v1_1.txt를 이 세션에서만도
# 여러 번 고쳤는데, 그때마다 이 워크플로가 새로 트리거된다. cancel-
# in-progress 없이는 짧은 시간에 연속으로 push하면(실사 중 흔한 패턴)
# 이전 실행이 아직 라이브 API 호출 중인 채로 새 실행이 쌓여 러너 풀을
# 동시에 여러 개 점유한다 — 실제로 이 문제가 관찰됨: prompts/**를
# 건드리는 push 하나가 이 워크플로를 포함해 5개 워크플로를 동시에
# 트리거해 수동 workflow_dispatch 실행이 대기열에 밀리는 걸 확인했다.
# manifest.yml이 이미 쓰는 것과 동일한 패턴 — 최신 push만 살아남고
# 이전 실행은 자동 취소된다(어차피 최신 코드 기준 결과만 의미 있으므로
# 취소해도 손실 없음).
concurrency:
  group: routing-regression
  cancel-in-progress: true

jobs:
  routing-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      # ── AC-PRO-CORE 현재 파일명 확정 (2026-09-30 신설 — 실제 운영 버그
      #    수정) ────────────────────────────────────────────────────────
      # 배경: 아래 두 단계가 지금까지 "prompts/AC-PRO-CORE_v1_1.txt"를
      # 하드코딩하고 있었다. 이 파일은 v1_15까지 여러 번 버전업됐는데
      # 그때마다 이 두 줄을 안 고쳐서, 최소 9/20 이후 기록된 13번의 실행
      # 전부가 "Check domain keyword collisions" 단계에서
      # FileNotFoundError로 즉시 죽고 있었다(실행 시간이 전부 14~21초인
      # 게 그 증거 — 실제 라이브 API를 부르는 "Run routing-focused
      # scenario batches"까지 한 번도 도달하지 못했다). SP-AUTHOR_v1_15·
      # SP-EDITOR_v1_0 하드코딩 fetch와 정확히 같은 종류의 결함이다.
      # prompts/sp-catalog.json이 이미 'AC-PRO-CORE' 키로 현재 파일명을
      # 정확히 유지하고 있으므로(build_manifest.py가 자동 생성), 이걸
      # 매번 읽어 $GITHUB_ENV에 기록하고 아래 두 단계에서 재사용한다 —
      # 다음 버전업부터는 이 워크플로 파일을 다시 고칠 필요가 없다.
      - name: Resolve current AC-PRO-CORE filename from sp-catalog.json
        run: |
          set -e
          FILE=$(python3 -c "import json; print(json.load(open('prompts/sp-catalog.json'))['AC-PRO-CORE'])")
          echo "AC-PRO-CORE 현재 파일: $FILE"
          echo "AC_PRO_CORE_FILE=$FILE" >> "$GITHUB_ENV"

      # ── 도메인 키워드 충돌 검사 (2026-08-06 신설) ──────────────────
      # 배경: 이 워크플로가 잡는 "행동적 정확도" 회귀와는 다른 층위의
      # 문제 — R1류 조항에 새 예시를 추가할 때 그 단어가 이미 다른 GWP의
      # "분야" 칸에 등록돼 있는지 확인 안 하면(순수 의미론적 판단만
      # 하고 문자열 검색을 생략하면), 그 자체로 새 라우팅 충돌을 만들
      # 수 있다는 걸 실사로 확인했다(klaw 문단에 "관세 통관" 예시를
      # 넣었다가 klogistics의 기존 "통관" 등록과 충돌해 명확한 위임의도
      # 발화가 [CALL_KINTENT:]로 새는 회귀를 20/20 재현). 비용이 거의
      # 없는 정적 검사라 라이브 API 호출(아래 단계, 비용·시간 소요)보다
      # 먼저 돈다 — 정보 제공용이라 기본은 빌드를 막지 않는다(--strict
      # 안 씀, 오탐 소지가 check_no_hardcoded_sp_refs.py류 구조적 검사
      # 보다 커서).
      - name: Check domain keyword collisions (informational)
        run: python3 tools/check_domain_keyword_collision.py --prompt "prompts/$AC_PRO_CORE_FILE"

      - name: Run routing-focused scenario batches
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          for SCEN in \
            scenarios_regression_R1_20260801.json \
            scenarios_expert_routing_paraphrase_hard_20260806.json \
            scenarios_gwp_priority_no_expert_20260806.json ; do
            BASE=$(basename "$SCEN" .json)
            OUT="../../results/${BASE}"
            echo "=== running $SCEN -> $OUT (AC-PRO-CORE: $AC_PRO_CORE_FILE) ==="
            python3 live_smoketest.py --scenarios "$SCEN" \
              --system-prompt "../../prompts/$AC_PRO_CORE_FILE" \
              --out "$OUT" --resume
          done

      - name: Check thresholds (fails the build below baseline)
        working-directory: tests/live_smoketest
        run: |
          set -e
          FAILED=0
          python3 check_routing_regression_threshold.py \
            --results ../../results/scenarios_regression_R1_20260801/live_results.json \
            --threshold 0.85 --label "R1 회귀(2026-08-01 canonical, 39건)" || FAILED=1
          python3 check_routing_regression_threshold.py \
            --results ../../results/scenarios_expert_routing_paraphrase_hard_20260806/live_results.json \
            --threshold 0.85 --label "패러프레이즈 하드모드(30건)" || FAILED=1
          python3 check_routing_regression_threshold.py \
            --results ../../results/scenarios_gwp_priority_no_expert_20260806/live_results.json \
            --threshold 0.65 --label "GWP 우선(25건) — kestate/ktelecom 태그문법·kbusiness/ktax 혼동 기지 이슈로 임계치 낮춤" || FAILED=1
          exit $FAILED

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-routing-regression-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: routing regression gate results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-regression-results
          path: results/
