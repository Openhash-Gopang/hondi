name: Live Smoketest — profile-assistant (DeepSeek, 300 scenarios)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Debug: only run first N scenarios (blank = all)"
        required: false
        default: ""
      # 2026-0X-XX 신설 — 300건 실측에서 실패/검토필요로 나온 68건만 골라
      # 별도 파일(profile_assistant_scenarios_retest_68fail.json)로 빠르게
      # 재검증할 수 있게 선택지 추가. 기본값은 기존과 동일(전체 세트).
      # 2026-0X-XX 2차 신설 — patch Q(18건 전수분석 종합수정)/patch R(지시문
      # 주입+(c)패턴 사후 강제 오버라이드) 검증에 필요한 최소 9건만 추린
      # 세트 추가. 68건 전체를 매번 돌릴 필요 없이 이 9건만으로 두 패치의
      # 핵심 주장(#267/#279 결정적 보장, #92/#257 반복감지, #130/#217
      # 시나리오 수정, person→business 3건 표본)을 빠르게 확인할 수 있다.
      scenarios_file:
        description: "시나리오 파일 선택"
        required: false
        type: choice
        default: "profile_assistant_scenarios.json"
        options:
          - "profile_assistant_scenarios.json"
          - "profile_assistant_scenarios_retest_68fail.json"
          - "profile_assistant_scenarios_patch_qr_verify.json"
          - "profile_assistant_scenarios_diverse_industries_20260913.json"
          - "profile_assistant_scenarios_diverse_industries_retest_v2_32.json"
          - "profile_assistant_scenarios_industry_inference_20260913.json"

permissions:
  contents: write

jobs:
  run-live-smoketest-profile-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run profile-assistant live smoketest
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS="--scenarios ${{ github.event.inputs.scenarios_file }} --repo-root ../.. --out ../../results/profile-assistant --resume"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python3 profile_assistant_smoketest.py $ARGS

      - name: Commit results to results branch
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-profile-assistant
          git add -f results/profile-assistant/
          git diff --cached --quiet || git commit -m "chore: profile-assistant live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-profile-assistant

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-profile-assistant-results
          path: results/profile-assistant/
