name: Deploy hondi-proxy Worker

# 2026-07-12 — worker.js를 매번 Cloudflare 대시보드에 수동 복사-붙여넣기
# 하던 방식의 근본 해결책. worker.js나 wrangler.toml이 main에 push되면
# 자동으로 hondi-proxy Worker에 배포한다.
#
# 필요한 GitHub Secrets(Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit 권한의 Custom Token
#   CLOUDFLARE_ACCOUNT_ID  — 8897e584cfc42457b462f76fdcf6e157
# (2026-07-12 세션에서 이미 등록 완료 확인됨)

"on":
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      # 2026-09-21 — worker.js가 import하는 모듈(src/**, data/classification/**)만 고친 병합은 예전엔 배포를 트리거하지
      # 않았다. (별개로, 병합 커밋 메시지에 대괄호로 감싼 "skip ci" 류 문구가 들어 있으면 GitHub가 그 푸시의 워크플로
      # 전체를 건너뛴다 — #405가 그래서 배포도 버전 갱신도 안 됐다. 사람이 쓰는 커밋 메시지에는 쓰지 말 것.) K-FOI 핸들러(src/worker/kfoi-handler.js)를 고친 병합 3건(#402·#403·#406)은 그 시점에 배포되지 않아
      # (다음 worker.js 변경 때에야 함께 반영) SP(GitHub에서 바로 읽힘)와 서버가 어긋났다. 테스트 파일만 바뀐 경우는 제외.
      - 'src/**'
      - '!src/tests/**'
      - 'data/classification/**'
  workflow_dispatch:  # 수동 실행도 가능(Actions 탭에서 Run workflow)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ★2026-08-12 — 명시 안 하면 action이 npx로 최신 버전을 비대화형
          # 설치 시도하다 실패하고 구버전(3.90.0)으로 조용히 폴백한다.
          # 3.90.0은 worker.js의 ES2025 import attributes 문법
          # (`with { type: 'json' }`)을 못 읽어 최소 23시간 배포가 전부
          # 실패했었다(빌드 에러로 조기 종료돼 Cloudflare엔 반영조차 안 됨,
          # 데이터 손상 위험은 없었음). 버전을 명시해 이 실패 유형을 없앤다.
          wranglerVersion: '4.121.0'
