name: Assist Live Smoketest (AC-PRO-CORE v1.15 vs v1.16)
on:
  push:
    branches: [test/assistant-live]
    paths: [tests/live_smoketest/assist_live_smoketest.py, .github/workflows/assist-live-smoketest.yml, prompts/AC-PRO-ASSIST_v1_0.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Run A/B
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: mkdir -p results && python3 tests/live_smoketest/assist_live_smoketest.py | tee results/summary.txt
      - name: Publish results branch
        run: |
          git config user.name hondi-live-smoketest-bot
          git config user.email actions@users.noreply.github.com
          git checkout -B results/assist-live
          git add -f results/
          git commit -q -m "chore: assist live smoketest results"
          git push --force origin HEAD:results/assist-live
