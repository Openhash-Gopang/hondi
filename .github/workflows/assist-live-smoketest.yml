name: Assist Live Smoketest (AC-PRO-CORE v1.15 vs v1.16)
on:
  push:
    branches: [test/assistant-live]
    paths: [tests/live_smoketest/assist_live_smoketest.py, .github/workflows/assist-live-smoketest.yml, prompts/AC-PRO-CORE_v1_16.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Run A/B
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 tests/live_smoketest/assist_live_smoketest.py
