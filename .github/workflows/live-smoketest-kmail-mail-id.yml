name: Live Smoketest — K-Mail ID/설정/임시보관함/자가발송 왕복

# 2026-09-12 신설 — 이번 세션에 새로 만든 K-Mail 기능 전체의 회귀 방지
# 가드(kaddress-contacts 워크플로우가 전혀 안 건드리는 영역):
#   1) mail_id 형식 검증(3~30자, 영숫자로 시작/끝)·예약어 거부.
#   2) mail_id 저장 전 소문자 정규화.
#   3) mail_id 전역 유일성(다른 사용자가 이미 쓰는 값은 409로 거부) —
#      실계정을 두 개 만들 필요 없이 PocketBase Admin API로 합성 guid의
#      kmail_user_settings 행을 하나 심어 재현.
#   4) GET /kmail/mail-id/check가 실제 점유 상태와 일치하는지.
#   5) POST /kmail/mail-id/auto가 8자리 hex를 만들고 재호출해도 같은
#      값을 반환하는지(멱등성).
#   6) 발신자 표시 이름·서명·부재중 자동응답 저장/조회 왕복 — 이 REST
#      경로가 지갑서명 전용이라 실제로는 호출 자체가 불가능했던 버그를
#      이번 세션에 고쳤는데, 그 회귀도 함께 방지.
#   7) 임시보관함 저장/목록/삭제 왕복.
#   8) ★ 자기 자신의 <guid>@hondi.kr로 실제 발송 → Cloudflare Email
#      Routing catch-all → _handleKmailInboundEmail 수신까지, 외부
#      메일 인프라를 실제로 왕복하는 유일한 시나리오(제3자에게는 아무
#      것도 안 보내므로 스팸 위험 없음).
#
# kaddress-contacts 워크플로우와 동일한 관례(workflow_dispatch,
# phone_verify_token 오프라인 재현, PocketBase Admin API 직접 검증,
# results 브랜치 커밋, artifact 업로드).
#
# ★ 실계정 주의 — test_e164는 실제 등록된 K-Mail 사용 계정이어야
#   한다. 이 계정의 kmail_user_settings(서명/발신자 표시이름/mail_id
#   등)를 실제로 덮어쓰지만, 실행 전 값을 백업했다가 끝나고 그대로
#   복원한다(kmail_mail_id_live_smoketest.py 상단 docstring 참고).
#   중간에 실패해서 복원이 안 되면, "메일" 탭 → "내 메일 ID"/서명
#   설정에서 원래 값으로 수동 복구하면 된다. 자가발송으로 생기는
#   발신함/수신함 메일 1건은 정리 대상이 아니다(실사용 흔적과 동일하게
#   그대로 둠).
#
# 필요 GitHub Secrets:
#   PHONE_VERIFY_SECRET — 이미 등록됨(kaddress-contacts와 공용).
#   PB_ADMIN_EMAIL / PB_ADMIN_PASSWORD — 이미 등록됨(kaddress-contacts와 공용).

on:
  workflow_dispatch:
    inputs:
      scenarios_file:
        description: "Scenario file name in tests/live_smoketest/ (blank = scenarios_kmail_mail_id_20260912.json)"
        required: false
        default: ""
      test_e164:
        description: "K-Mail을 실제로 쓰는 등록된 테스트 계정 전화번호 — 어떤 형식이든(뒷자리 8자리만도 가능) 자동 정규화됨 — 필수"
        required: true
      worker_base:
        description: "worker.js(hondi-proxy) base URL"
        required: false
        default: ""
      skip_self_send:
        description: "true면 실제 발송/수신 왕복 시나리오를 건너뜀(빠른 재실행용)"
        required: false
        default: "false"
      no_restore:
        description: "true면 실행 전 설정값으로 복원하지 않음(디버깅용)"
        required: false
        default: "false"
      external_recipient:
        description: "지정하면 이 실제 이메일 주소로도 발송 API 호출 시나리오를 추가 실행(도착 여부는 직접 확인 필요, 비워두면 생략)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-kmail-mail-id-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run K-Mail mail_id live smoketest
        working-directory: tests/live_smoketest
        env:
          PHONE_VERIFY_SECRET: ${{ secrets.PHONE_VERIFY_SECRET }}
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
        run: |
          SCEN="${{ github.event.inputs.scenarios_file }}"
          if [ -z "$SCEN" ]; then SCEN="scenarios_kmail_mail_id_20260912.json"; fi
          BASE=$(basename "$SCEN" .json)
          OUT="../../results/${BASE}"
          echo "scenarios=$SCEN out=$OUT"
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.skip_self_send }}" = "true" ]; then EXTRA_ARGS="$EXTRA_ARGS --skip-self-send"; fi
          if [ "${{ github.event.inputs.no_restore }}" = "true" ]; then EXTRA_ARGS="$EXTRA_ARGS --no-restore"; fi
          EXT_RECIPIENT="${{ github.event.inputs.external_recipient }}"
          if [ -n "$EXT_RECIPIENT" ]; then EXTRA_ARGS="$EXTRA_ARGS --external-recipient $EXT_RECIPIENT"; fi
          python3 kmail_mail_id_live_smoketest.py \
            --scenarios "$SCEN" --out "$OUT" \
            --worker-base "${{ github.event.inputs.worker_base || 'https://hondi-proxy.tensor-city.workers.dev' }}" \
            --test-e164 "${{ github.event.inputs.test_e164 }}" \
            --resume $EXTRA_ARGS

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-kmail-mail-id
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: K-Mail mail_id live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-kmail-mail-id

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-kmail-mail-id-results
          path: results/
