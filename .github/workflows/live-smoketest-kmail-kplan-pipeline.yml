name: Live Smoketest — K-Mail↔K-Plan 파이프라인 (관리자 시딩)

# 2026-09-02 신설 — worker.js의 _kmailTriggerKPlanRecompose가 실제
# Cloudflare Worker에 배포된 뒤, 진짜 실행 경로(다이제스트 생성 →
# K-Recompose 트리거 → K-Plan 실제 DeepSeek 호출 → ai_messages 기록)를
# end-to-end로 검증한다.
#
# 사용자 서명(Ed25519) 계층은 의도적으로 우회한다 — CI가 실사용자의
# 개인키를 가질 이유가 없다. 대신 gov-mail 스모크테스트와 동일한
# 관리자 인증(HONDI_ADMIN_EMAIL/PASSWORD)만으로 테스트용 연락처·캠페인을
# 직접 시딩하는 admin 엔드포인트 3종(worker.js 참고)을 쓴다. 이 엔드포인트들이
# 만드는 캠페인은 처음부터 status='sent'로 채워져 실제 이메일이 나가지
# 않는다 — 검증 대상은 다이제스트~K-Recompose 구간뿐이다.
#
# 크론(wrangler.toml [triggers])이 매시 정각 1회만 돌기 때문에, 자연
# 발생을 기다리지 않고 /admin/kmail/sweep-digests로 즉시 1회 스윕한다.
#
# 필요 GitHub Secrets:
#   HONDI_ADMIN_EMAIL, HONDI_ADMIN_PASSWORD — gov-mail 스모크테스트와 공용.
#     아직 미등록이면 이 워크플로는 로그인 단계에서 바로 실패한다.

on:
  workflow_dispatch:
    inputs:
      test_recipient_email:
        description: '시딩할 테스트 연락처의 이메일 (실제 발송은 안 됨 — 레코드에만 씀)'
        required: true
        type: string
      test_recipient_name:
        description: '시딩할 테스트 연락처 이름'
        required: false
        type: string
        default: 'CI 스모크테스트'

jobs:
  kmail-kplan-pipeline-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://hondi-proxy.tensor-city.workers.dev
    steps:
      - name: (임시 디버그) secret 해시 출력
        env:
          ADMIN_EMAIL: ${{ secrets.HONDI_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.HONDI_ADMIN_PASSWORD }}
        run: |
          echo "email 길이: ${#ADMIN_EMAIL}, sha256: $(printf '%s' "$ADMIN_EMAIL" | sha256sum | cut -d' ' -f1)"
          echo "password 길이: ${#ADMIN_PASSWORD}, sha256: $(printf '%s' "$ADMIN_PASSWORD" | sha256sum | cut -d' ' -f1)"

      - name: 관리자 로그인
        id: login
        env:
          ADMIN_EMAIL: ${{ secrets.HONDI_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.HONDI_ADMIN_PASSWORD }}
        # jq --arg로 JSON을 조립한다 — 이전엔 "{\"email\":\"$ADMIN_EMAIL\"...}"
        # 문자열 보간 방식이라, 비밀번호에 "/$/`/\ 같은 문자가 섞이면 bash가
        # 깨뜨려 실제로는 다른 값이 전송됐다(2026-09-02 실패로 발견 —
        # 로컬 PowerShell ConvertTo-Json 테스트는 이 문제가 없어 통과했는데
        # CI에서만 재현됐다). --arg는 값을 이스케이프 걱정 없이 그대로 넣는다.
        run: |
          RES=$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" \
            '{email: $email, password: $password}' | \
            curl -s -X POST "$WORKER_URL/admin/login" \
            -H "Content-Type: application/json" -d @-)
          TOKEN=$(echo "$RES" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::관리자 로그인 실패 — HONDI_ADMIN_EMAIL/PASSWORD secret을 확인하세요. 응답: $RES"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "✓ 관리자 로그인 성공"

      - name: 테스트 캠페인 시딩
        id: seed
        env:
          ADMIN_TOKEN: ${{ steps.login.outputs.token }}
          TEST_EMAIL: ${{ inputs.test_recipient_email }}
          TEST_NAME: ${{ inputs.test_recipient_name }}
        run: |
          PLAN_ID="ci-smoketest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "plan_id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          RES=$(jq -n --arg plan_id "$PLAN_ID" --arg checkpoint_label "라이브 스모크테스트" \
            --arg test_email "$TEST_EMAIL" --arg test_name "$TEST_NAME" \
            '{plan_id: $plan_id, checkpoint_label: $checkpoint_label, test_email: $test_email, test_name: $test_name}' | \
            curl -s -X POST "$WORKER_URL/admin/kmail/seed-test-campaign" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -d @-)
          OK=$(echo "$RES" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "::error::캠페인 시딩 실패. 응답: $RES"
            exit 1
          fi
          echo "✓ 시딩 완료 — $(echo "$RES" | jq -c '{contact_id, campaign_id, owner_user_guid}')"

      - name: 다이제스트 스윕 실행 (K-Recompose까지 동기 대기)
        id: sweep
        env:
          ADMIN_TOKEN: ${{ steps.login.outputs.token }}
        # _kmailGenerateDigest → _kmailTriggerKPlanRecompose가 이 요청
        # 안에서 동기로 실행된다(fire-and-forget 아님) — K-Plan DeepSeek
        # 호출까지 끝나야 응답이 온다. 이전 K-Plan 캠페인 스모크테스트에서
        # 단일 호출에 최대 수십 초 걸린 전례가 있어 넉넉히 --max-time 120.
        run: |
          RES=$(curl -s --max-time 120 -X POST "$WORKER_URL/admin/kmail/sweep-digests" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          OK=$(echo "$RES" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "::error::다이제스트 스윕 실패. 응답: $RES"
            exit 1
          fi
          echo "✓ 스윕 완료 — $(echo "$RES" | jq -c '.')"

      - name: K-Recompose 결과 확인
        env:
          ADMIN_TOKEN: ${{ steps.login.outputs.token }}
          PLAN_ID: ${{ steps.seed.outputs.plan_id }}
        run: |
          RES=$(curl -s "$WORKER_URL/admin/kmail/recompose-result?plan_id=$PLAN_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          FOUND=$(echo "$RES" | jq -r '.found')
          {
            echo "## K-Mail↔K-Plan 파이프라인 라이브 스모크테스트"
            echo ""
            echo "- plan_id: \`$PLAN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FOUND" != "true" ]; then
            echo "::error::K-Recompose 결과를 찾지 못했습니다 — 파이프라인이 실제로 안 걸렸을 가능성. 응답: $RES"
            {
              echo "- 결과: ❌ FAIL — kplan_recompose 레코드를 찾지 못함"
              echo ""
              echo "가능한 원인: worker.js 최신 배포 여부, DEEPSEEK_API_KEY 등 K-Plan"
              echo "쪽 secret, 또는 _kmailTriggerKPlanRecompose 내부 오류(Cloudflare"
              echo "Worker 로그 확인 필요 — 이 워크플로에서는 안 보임)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ K-Recompose 결과 확인됨"
          {
            echo "- 결과: ✅ PASS — kplan_recompose 레코드 확인됨"
            echo ""
            echo "<details><summary>K-Plan 원문 응답 보기</summary>"
            echo ""
            echo '```'
            echo "$RES" | jq -r '.result.content_original'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
