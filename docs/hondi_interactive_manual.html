<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혼디 사용자 매뉴얼 — 배우면서 GDC 받기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root {
  /* ── Material 3 톤 컬러 ── */
  --primary: #0c6cc3; --on-primary: #ffffff;
  --primary-container: #d3e4ff; --on-primary-container: #001c38;
  --secondary-container: #ffe9b3; --on-secondary-container: #4a3800;
  --tertiary-container: #d7f0dd; --on-tertiary-container: #003916;
  --error-container: #fce8e6; --on-error-container: #7a0000;
  --surface: #ffffff; --surface-container: #f3f3f8; --surface-container-high: #ececf4;
  --on-surface: #1b1c1f; --on-surface-variant: #47464f;
  --outline: #c9c7d0; --outline-variant: #e3e1ea;
  --navy: #0e1c3f;

  /* M3 elevation */
  --el-1: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px 1px rgba(15,23,42,0.08);
  --el-2: 0 1px 2px rgba(15,23,42,0.08), 0 2px 6px 2px rgba(15,23,42,0.10);
  --el-3: 0 1px 3px rgba(15,23,42,0.10), 0 4px 10px 2px rgba(15,23,42,0.10);
  --el-4: 0 2px 3px rgba(15,23,42,0.12), 0 6px 14px 4px rgba(15,23,42,0.12);
  --radius: 12px; --radius-sm: 8px; --radius-full: 999px;
}
body {
  background: #eef1f6; color: var(--on-surface);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size: 14px; line-height: 1.8; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 100px; }

/* ── Top App Bar (M3) ── */
.app-bar {
  background: var(--navy); color: #fff; border-radius: var(--radius);
  padding: 22px 26px; margin-bottom: 18px; box-shadow: var(--el-3);
  position: relative; overflow: hidden;
}
.app-bar::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--primary), #5aa9e6 60%, transparent); }
.ab-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ab-title { font-size: 19px; font-weight: 700; }
.ab-sub { font-size: 12.5px; color: #a9b8d4; margin-top: 3px; }
.ab-stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.ab-chip { display:flex; align-items:center; gap:7px; background: rgba(255,255,255,0.1); padding: 7px 13px; border-radius: var(--radius-full); font-size:12.5px; }
.ab-chip b { font-size: 14px; }
.ab-progress-row { margin-top: 16px; }
.ab-progress-track { height: 8px; background: rgba(255,255,255,0.16); border-radius: 999px; overflow: hidden; }
.ab-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #5aa9e6); border-radius: 999px; transition: width 0.35s cubic-bezier(.4,0,.2,1); }
.ab-progress-label { font-size: 11.5px; color: #c9d6ee; margin-top: 6px; }
.temp-track { width: 56px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; }
.temp-fill { height: 100%; background: #f59e0b; transition: width 0.3s; }

/* ── Material Tabs (레벨 선택) — 슬라이딩 인디케이터 ── */
.md-tabs { position: relative; display: flex; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; box-shadow: var(--el-1); overflow: hidden; }
.md-tab {
  flex: 1; background: none; border: none; cursor: pointer; padding: 16px 10px 14px;
  font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--on-surface-variant);
  transition: color 0.2s; position: relative; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.md-tab .mt-count { font-size: 10.5px; font-weight: 500; color: var(--outline); }
.md-tab .mt-reward { font-size: 10px; font-weight: 700; color: #b06000; }
.md-tab.active { color: var(--primary); }
.md-tab.active .mt-reward { color: #b06000; }
.md-tab-indicator { position: absolute; bottom: 0; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; transition: left 0.28s cubic-bezier(.4,0,.2,1), width 0.28s cubic-bezier(.4,0,.2,1); }

/* ── 장(chapter) 카드 그리드 (M3 Filled/Outlined Cards) ── */
.ch-cards { background: var(--surface); padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; box-shadow: var(--el-1); }
.ch-card {
  background: var(--surface-container); border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit;
  font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant);
  display: flex; align-items: flex-start; gap: 8px; transition: box-shadow 0.15s, background 0.15s;
}
.ch-card:hover { box-shadow: var(--el-2); }
.ch-card.active { background: var(--primary-container); color: var(--on-primary-container); }
.ch-card .cc-num { flex-shrink:0; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
.ch-card.active .cc-num { background: var(--primary); color: #fff; }
.ch-card.completed .cc-num { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.ch-card.completed .cc-num::after { content:'✓'; }
@media (max-width: 720px) { .ch-cards { grid-template-columns: repeat(2, 1fr); } }

/* ── 본문 카드 ── */
.ch-content { background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); padding: 34px 36px; box-shadow: var(--el-1); margin-bottom: 20px; }
.ch-hero { margin-bottom: 8px; }
.ch-content h2 { font-size: 21px; font-weight: 700; color: var(--navy); margin: 6px 0 18px; text-align: center; }
.ch-content h3 { font-size: 15px; font-weight: 700; color: var(--on-surface); margin: 26px 0 14px; }
.ch-content p { color: var(--on-surface-variant); margin-bottom: 12px; }
.ch-illust { margin: 8px 0 20px; }
.ch-soon { padding: 50px 0; text-align: center; color: var(--outline); font-size: 13.5px; }

/* Material 톤 컨테이너(callout) */
.md-container { display: flex; gap: 14px; border-radius: var(--radius); padding: 16px 18px; margin: 18px 0; }
.md-container .mc-icon { flex-shrink: 0; width: 30px; height: 30px; }
.md-container .mc-icon svg { width: 100%; height: 100%; }
.md-container .mc-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
.md-container.tonal-primary { background: var(--primary-container); color: var(--on-primary-container); }
.md-container.tonal-warn { background: var(--secondary-container); color: var(--on-secondary-container); }
.md-container.tonal-error { background: var(--error-container); color: var(--on-error-container); }

/* 스텝 리스트 — 아이콘형(카드 아님, 리스트 열) */
.step-list { display: flex; flex-direction: column; gap: 4px; margin: 18px 0; }
.step-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 8px; border-radius: var(--radius-sm); transition: background 0.15s; }
.step-row:hover { background: var(--surface-container); }
.step-icon { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--primary-container); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.step-icon svg { width: 19px; height: 19px; }
.step-title { font-weight: 700; color: var(--on-surface); font-size: 13.5px; margin-bottom: 2px; }
.step-desc { color: var(--on-surface-variant); font-size: 13px; }

/* ── 퀴즈 (M3 카드형) ── */
.quiz-section { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--outline-variant); }
.quiz-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.quiz-sub { font-size: 12px; color: var(--outline); margin-bottom: 18px; }
.quiz-q { background: var(--surface-container); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.quiz-q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.quiz-q-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); box-shadow: var(--el-1); display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--primary); }
.quiz-q-icon svg { width: 15px; height: 15px; }
.quiz-q-text { font-size: 13.5px; font-weight: 600; color: var(--on-surface); }
.quiz-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--outline-variant);
  border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 7px; cursor: pointer;
  font-size: 13px; color: var(--on-surface-variant); font-family: inherit; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.quiz-opt-mark {
  position: relative; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--outline);
  display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s;
}
.quiz-opt-mark svg { position: absolute; width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s; stroke: #fff; }
.quiz-opt-text { flex: 1; }
.quiz-opt.selected .quiz-opt-mark { border-color: var(--primary); background: var(--primary); }
.quiz-opt.selected .quiz-opt-mark .mark-check { opacity: 1; }
.quiz-opt.correct .quiz-opt-mark { border-color: #188038; background: #188038; }
.quiz-opt.correct .quiz-opt-mark .mark-check { opacity: 1; }
.quiz-opt.correct .quiz-opt-mark .mark-x { opacity: 0; }
.quiz-opt.incorrect .quiz-opt-mark { border-color: #c5221f; background: #c5221f; }
.quiz-opt.incorrect .quiz-opt-mark .mark-x { opacity: 1; }
.quiz-opt.incorrect .quiz-opt-mark .mark-check { opacity: 0; }
.quiz-opt:hover { box-shadow: var(--el-1); }
.quiz-opt.selected { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
.quiz-opt.correct { border-color: #188038; background: var(--tertiary-container); color: var(--on-tertiary-container); font-weight: 700; }
.quiz-opt.incorrect { border-color: #c5221f; background: var(--error-container); color: var(--on-error-container); font-weight: 700; }
.quiz-opt:disabled { cursor: default; }
.quiz-explain { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 4px; padding: 10px 14px; background: var(--surface); border-radius: var(--radius-sm); display: none; }
.quiz-explain.show { display: block; }
.quiz-submit {
  background: var(--primary); color: #fff; border: none; border-radius: var(--radius-full);
  padding: 12px 28px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--el-1);
}
.quiz-submit:hover { box-shadow: var(--el-2); }
.quiz-submit:disabled { background: var(--outline-variant); color: var(--outline); cursor: not-allowed; box-shadow:none; }
.quiz-result { margin-top: 16px; padding: 14px 18px; border-radius: var(--radius); font-size: 13.5px; font-weight: 700; display: none; }
.quiz-result.show { display: block; }
.quiz-result.pass { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.quiz-result.fail { background: var(--error-container); color: var(--on-error-container); }

.tier-reward-banner {
  display: none; margin-top: 4px; background: linear-gradient(135deg, var(--navy), #16295a); color: #fff;
  border-radius: var(--radius); padding: 22px 24px; text-align: center; box-shadow: var(--el-4);
}
.tier-reward-banner.show { display: block; }
.trb-amount { font-size: 24px; font-weight: 700; color: #ffe9b3; }

/* ── FAB(다음 장) ── */
.fab {
  position: fixed; bottom: 26px; right: 26px; width: 56px; height: 56px; border-radius: 16px;
  background: var(--primary); color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--el-3);
  transition: box-shadow 0.15s, transform 0.15s;
}
.fab:hover { box-shadow: var(--el-4); transform: translateY(-2px); }
.fab svg { width: 24px; height: 24px; }

/* ── K-정부 챕터 전용 UI (2026-08-29 신설) ── */
.kgov-app { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.kgov-category { border: 1px solid var(--outline-variant); border-radius: var(--radius-sm); overflow: hidden; }
.kgov-cat-head, .kgov-group-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-container); border: none; cursor: pointer;
  font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--on-surface);
  padding: 12px 14px; text-align: left;
}
.kgov-cat-head:hover, .kgov-group-head:hover { background: var(--surface-container-high); }
.kgov-cat-count, .kgov-group-count { font-size: 11.5px; font-weight: 500; color: var(--on-surface-variant); }
.kgov-cat-body { padding: 10px 14px 14px; border-top: 1px solid var(--outline-variant); }
.kgov-category > .kgov-cat-head::before, .kgov-group-head::before {
  content: '▸'; display: inline-block; margin-right: 8px; transition: transform 0.15s; color: var(--primary);
}
.kgov-cat-head.open::before, .kgov-group-head.open::before { transform: rotate(90deg); }
.kgov-agency-list { display: flex; flex-direction: column; gap: 4px; }
.kgov-agency-item { border-radius: var(--radius-sm); }
.kgov-agency-btn {
  width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 8px 10px; font-family: inherit; font-size: 13px; color: var(--on-surface-variant); cursor: pointer;
}
.kgov-agency-btn:hover { background: var(--surface-container); }
.kgov-agency-btn.active { background: var(--primary-container); color: var(--on-primary-container); font-weight: 700; }
.kgov-agency-btn:disabled { color: var(--outline); cursor: not-allowed; }
.kgov-dept-panel { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 10px 18px; }
.kgov-dept-btn {
  background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-full);
  padding: 6px 12px; font-family: inherit; font-size: 12px; color: var(--on-surface-variant); cursor: pointer;
}
.kgov-dept-btn:hover { border-color: var(--primary); color: var(--primary); }
.kgov-dept-btn:disabled { color: var(--outline); cursor: not-allowed; }
.kgov-dept-btn-own { border-color: var(--primary); color: var(--primary); font-weight: 700; }
.kgov-note { font-size: 12px; color: var(--outline); padding: 6px 4px; width: 100%; }
.kgov-group { border-top: 1px solid var(--outline-variant); }
.kgov-group:first-child { border-top: none; }
.kgov-group-body { display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 10px 18px; }
.kgov-file-link {
  font-size: 12.5px; color: var(--primary); text-decoration: none; padding: 5px 6px; border-radius: 6px;
}
.kgov-file-link:hover { background: var(--primary-container); text-decoration: underline; }
.kgov-loading { font-size: 13px; color: var(--outline); padding: 12px 4px; }
.kgov-filter-input {
  width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 10px;
  border: 1px solid var(--outline-variant); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 13px; color: var(--on-surface);
}
.kgov-filter-input:focus { outline: none; border-color: var(--primary); }

/* SP 열람 모달 */
.kgov-modal {
  display: none; position: fixed; inset: 0; background: rgba(15,17,20,0.55); z-index: 2000;
  align-items: center; justify-content: center; padding: 24px;
}
.kgov-modal.open { display: flex; }
.kgov-modal-inner {
  background: var(--surface); border-radius: var(--radius); max-width: 760px; width: 100%;
  max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--el-4); overflow: hidden;
}
.kgov-modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--outline-variant); flex-shrink: 0;
}
.kgov-modal-head span { font-size: 14px; font-weight: 700; color: var(--navy); }
.kgov-modal-head button {
  background: none; border: none; cursor: pointer; font-size: 16px; color: var(--on-surface-variant);
  width: 28px; height: 28px; border-radius: 50%;
}
.kgov-modal-head button:hover { background: var(--surface-container); }
.kgov-modal-note {
  font-size: 12px; color: var(--on-surface-variant); background: var(--surface-container);
  padding: 10px 18px; border-bottom: 1px solid var(--outline-variant); flex-shrink: 0;
}
.kgov-modal-inner pre {
  margin: 0; padding: 18px; overflow: auto; font-family: 'Pretendard', monospace; font-size: 12px;
  line-height: 1.7; color: var(--on-surface-variant); white-space: pre-wrap; word-break: break-word;
}
@media (max-width: 640px) {
  .kgov-dept-panel { padding-left: 8px; }
  .kgov-group-body { padding-left: 8px; }
}

</style>
</head>
<body>

<div class="wrap">
  <div class="app-bar">
    <div class="ab-top">
      <div>
        <div class="ab-title">📘 혼디 사용자 매뉴얼</div>
        <div class="ab-sub">배우면서 GDC를 받으세요 — 초급 1,000T · 중급 3,000T · 고급 10,000T</div>
      </div>
      <div class="ab-stats">
        <div class="ab-chip">진행률 <b id="progressLabel">0/32</b></div>
        <div class="ab-chip">혼디 온도 <b id="tempValue">36.5°</b><span class="temp-track"><span class="temp-fill" id="tempFill" style="width:37%"></span></span></div>
      </div>
    </div>
    <div class="ab-progress-row">
      <div class="ab-progress-track"><div class="ab-progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="ab-progress-label" id="progressSub">아직 시작 전입니다 — 첫 장부터 시작해 보세요.</div>
    </div>
  </div>

  <div class="md-tabs" id="tierTabs"><div class="md-tab-indicator" id="tierIndicator"></div></div>
  <div class="ch-cards" id="chTabs"></div>
  <div class="ch-content" id="chContent"></div>
  <div class="tier-reward-banner" id="tierRewardBanner"></div>
</div>

<button class="fab" id="nextFab" title="다음 장">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
</button>

<script>
var CHAPTERS = [{"tier": "beginner", "title": "가입하기 — 폰으로 시작하는 첫걸음", "id": "ch1", "body": "\n<div class=\"ch-hero\"><svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <circle cx=\"200\" cy=\"90\" r=\"78\" fill=\"#eaf3fc\"/>\n  <g transform=\"translate(150,40)\">\n    <rect x=\"0\" y=\"0\" width=\"56\" height=\"96\" rx=\"10\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <circle cx=\"28\" cy=\"82\" r=\"3\" fill=\"#0c6cc3\"/>\n    <rect x=\"10\" y=\"14\" width=\"36\" height=\"52\" rx=\"4\" fill=\"#eaf3fc\"/>\n    <circle cx=\"28\" cy=\"40\" r=\"10\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <path d=\"M20 40l6 6 12-12\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n  </g>\n  <g transform=\"translate(60,100)\" stroke=\"#f59e0b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <rect x=\"0\" y=\"14\" width=\"30\" height=\"20\" rx=\"3\"/>\n    <path d=\"M6 14V8a9 9 0 0 1 15-6.7\"/>\n  </g>\n  <g transform=\"translate(300,30)\" stroke=\"#188038\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#e6f4ea\" stroke=\"none\"/>\n    <polyline points=\"7 14 12 19 21 8\"/>\n  </g>\n</svg></div>\n<h2>가입하기 — 폰으로 시작하는 첫걸음</h2>\n<p>혼디는 <strong>이메일이나 비밀번호가 없습니다.</strong> 대신 여러분의 스마트폰이 곧 신원증명입니다. 그래서 혼디 가입은 <strong>반드시 스마트폰에서</strong> 시작해야 합니다 — PC에서는 가입 자체가 안 됩니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">왜 폰에서만 가입이 되나요?</div>\n  전화번호 인증이 \"이 사람이 실제로 그 번호의 주인이다\"를 확인하는 유일한 방법이기 때문입니다. 인증받는 기기와 계정을 만드는 기기가 다르면 이 확인이 무의미해집니다.</div>\n</div>\n\n<h3>가입 절차 4단계</h3>\n<div class=\"ch-illust\"><svg viewBox=\"0 0 640 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:0 auto\">\n  <defs>\n    <marker id=\"arrow1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#94a3b8\"/>\n    </marker>\n  </defs>\n  <line x1=\"80\" y1=\"60\" x2=\"200\" y2=\"60\" stroke=\"#cbd5e1\" stroke-width=\"2\" marker-end=\"url(#arrow1)\"/>\n  <line x1=\"280\" y1=\"60\" x2=\"400\" y2=\"60\" stroke=\"#cbd5e1\" stroke-width=\"2\" marker-end=\"url(#arrow1)\"/>\n  <line x1=\"480\" y1=\"60\" x2=\"560\" y2=\"60\" stroke=\"#cbd5e1\" stroke-width=\"2\" marker-end=\"url(#arrow1)\"/>\n  <circle cx=\"40\" cy=\"60\" r=\"34\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n  <g transform=\"translate(24,44)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <rect x=\"4\" y=\"0\" width=\"24\" height=\"32\" rx=\"4\"/><line x1=\"14\" y1=\"26\" x2=\"18\" y2=\"26\"/>\n  </g>\n  <text x=\"40\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#334155\" font-weight=\"600\">번호 입력</text>\n  <circle cx=\"240\" cy=\"60\" r=\"34\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n  <g transform=\"translate(224,44)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M16 2a10 10 0 0 0-10 10c0 7-3 9-3 9h26s-3-2-3-9a10 10 0 0 0-10-10z\" transform=\"scale(0.85)\"/>\n    <path d=\"M13.5 27a2.5 2.5 0 0 0 5 0\" transform=\"scale(0.85)\"/>\n  </g>\n  <text x=\"240\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#334155\" font-weight=\"600\">본인 확인</text>\n  <circle cx=\"440\" cy=\"60\" r=\"34\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n  <g transform=\"translate(424,44)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <circle cx=\"10.5\" cy=\"16.5\" r=\"7.5\"/><path d=\"M22 2 L11.4 12.6M17.5 8.5L20 6M20 6l2 2M20 6l3 3\"/>\n  </g>\n  <text x=\"440\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#334155\" font-weight=\"600\">지갑 생성</text>\n  <circle cx=\"600\" cy=\"60\" r=\"34\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n  <g transform=\"translate(586,46)\" stroke=\"#188038\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <polyline points=\"2 15 10 23 26 4\"/>\n  </g>\n  <text x=\"600\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#334155\" font-weight=\"600\">가입 완료</text>\n</svg></div>\n\n<div class=\"step-list\">\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">① 번호 입력</div><div class=\"step-desc\">휴대폰 번호를 입력합니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">② 본인 확인</div><div class=\"step-desc\">문자 또는 알림으로 온 인증번호를 입력합니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">③ 지갑 생성</div><div class=\"step-desc\">폰이 자동으로 여러분만의 암호 키(지갑)를 만듭니다. 이 키가 앞으로 여러분의 '신원'이 됩니다 — 따로 외울 비밀번호는 없습니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">④ 가입 완료</div><div class=\"step-desc\">바로 AI 비서와 대화를 시작할 수 있습니다.</div></div>\n    </div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">비밀번호가 없다면, 뭘 기억해야 하나요?</div>\n  아무것도 외울 필요가 없습니다. 다만 <strong>가입한 그 폰을 잃어버리지 않는 것</strong>이 중요합니다 — PC나 다른 폰에서 로그인하려면 이 폰이 \"본인이 맞다\"고 승인해줘야 하기 때문입니다(7장 \"폰-PC 연동과 알림\"에서 자세히 다룹니다).</div>\n</div>\n", "quiz": [{"q": "혼디에 처음 가입할 때 반드시 사용해야 하는 기기는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>", "options": ["PC(데스크톱)", "스마트폰", "태블릿", "아무 기기나 상관없음"], "answer": 1, "explain": "혼디는 전화번호 인증으로 본인을 확인하기 때문에, 최초 가입은 반드시 스마트폰에서 이뤄져야 합니다."}, {"q": "혼디 가입 시 별도로 만들어야 하는 것은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 9.9-1\"/></svg>", "options": ["이메일 주소", "비밀번호", "둘 다 필요 없음 — 지갑(키)이 자동 생성됨", "사용자 이름과 비밀번호 둘 다"], "answer": 2, "explain": "혼디는 비밀번호가 없습니다. 가입 시 폰이 자동으로 암호 키(지갑)를 생성하고, 이 키 자체가 여러분의 신원이 됩니다."}, {"q": "가입한 폰을 잃어버리면 왜 중요한 문제가 되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>", "options": ["폰 요금이 계속 나가서", "다른 기기가 로그인하려면 이 폰의 승인이 필요하기 때문에", "사진이 사라져서", "문제가 되지 않는다"], "answer": 1, "explain": "PC 등 다른 기기에서 로그인하려면 이미 등록된 폰이 '본인이 맞다'고 승인해줘야 합니다. 이게 혼디 인증의 핵심 구조입니다."}], "placeholder": false}, {"tier": "beginner", "title": "사람 찾기·호출하기", "id": "ch2", "body": "\n<div class=\"ch-hero\"><svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <circle cx=\"200\" cy=\"90\" r=\"78\" fill=\"#eaf3fc\"/>\n  <g transform=\"translate(120,60)\">\n    <rect x=\"0\" y=\"0\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <circle cx=\"20\" cy=\"15\" r=\"6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <line x1=\"24.5\" y1=\"19.5\" x2=\"29\" y2=\"24\" stroke=\"#0c6cc3\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n    <rect x=\"40\" y=\"10\" width=\"60\" height=\"10\" rx=\"3\" fill=\"#dbeafe\"/>\n  </g>\n  <g transform=\"translate(70,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <g transform=\"translate(280,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#188038\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <path d=\"M98 120 Q200 90 266 120\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\n</svg></div>\n<h2>사람 찾기·호출하기</h2>\n<p>혼디는 여러분의 AI 비서끼리만 대화하는 게 아니라, <strong>다른 사람과 직접 연결</strong>할 수도 있습니다. 닉네임이나 @handle로 검색해서 대화를 시작해 보세요.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">검색창은 어디에 있나요?</div>\n  화면 상단(또는 메뉴)의 검색 아이콘을 누르면 검색창이 뜹니다. 닉네임 일부만 입력해도 비슷한 이름이 함께 검색됩니다.</div>\n</div>\n\n<h3>검색부터 연결까지 4단계</h3>\n<div class=\"step-list\">\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">① 검색어 입력</div><div class=\"step-desc\">닉네임 또는 @handle을 입력합니다. @가 붙으면 정확히 그 handle 하나만, 없으면 비슷한 닉네임까지 함께 찾아줍니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">② 상세 필터(선택)</div><div class=\"step-desc\">결과가 너무 많으면 '상세 필터'를 펼쳐 국가코드(예: KR)나 지역(예: 서울)으로 좁힐 수 있습니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">③ 결과 확인</div><div class=\"step-desc\">닉네임과 handle이 함께 나열됩니다. 본인은 검색 결과에서 자동으로 제외됩니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 17l-3-3a2 2 0 0 1 0-3l4-4a2 2 0 0 1 3 0l1 1\"/><path d=\"M13 21l7-7\"/><path d=\"M2 12l5 5\"/><path d=\"M9 20l-3-3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">④ 연결 요청</div><div class=\"step-desc\">원하는 사람을 누르면 '연결 요청을 보내시겠습니까?' 확인창이 뜹니다. 동의하면 바로 대화가 시작됩니다.</div></div>\n    </div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"10\" r=\"3\"/><path d=\"M12 2a8 8 0 0 0-8 8c0 5.25 8 13 8 13s8-7.75 8-13a8 8 0 0 0-8-8z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">필터는 왜 필요한가요?</div>\n  흔한 닉네임은 동명이인이 많을 수 있습니다. 국가·지역 필터로 좁히면 원하는 사람을 더 빠르게 찾을 수 있습니다.</div>\n</div>\n\n<div class=\"md-container tonal-error\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">연결 후에는?</div>\n  연결이 성사되면 메인 화면에서 그 사람과의 대화창이 열립니다. 3장 \"메시지 주고받기\"에서 이어서 다룹니다.</div>\n</div>\n", "quiz": [{"q": "검색어 앞에 @를 붙이면 어떻게 검색되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>", "options": ["더 많은 결과가 나온다", "정확히 그 handle 하나만 검색된다", "검색이 안 된다", "국가별로 정렬된다"], "answer": 1, "explain": "@가 붙으면 handle 정확 일치 검색이 되고, 없으면 닉네임·handle 부분 일치로 더 넓게 검색됩니다."}, {"q": "검색 결과가 너무 많을 때 좁히는 방법은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg>", "options": ["다시 로그인한다", "상세 필터에서 국가·지역을 지정한다", "앱을 재설치한다", "방법이 없다"], "answer": 1, "explain": "상세 필터를 펼쳐 국가코드나 지역을 입력하면 검색 범위를 좁힐 수 있습니다."}, {"q": "검색 결과에 내 계정이 나오지 않는 이유는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>", "options": ["오류다", "본인은 자동으로 결과에서 제외되기 때문", "검색어를 잘못 입력해서", "권한이 없어서"], "answer": 1, "explain": "검색 로직이 내 handle과 일치하는 결과를 자동으로 걸러내므로, 본인은 목록에 뜨지 않습니다."}], "placeholder": false}, {"tier": "beginner", "title": "AI 비서 채팅 vs 다른 AI 호출", "id": "ch3", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n<rect x=\"20\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"100\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"90\" width=\"120\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<rect x=\"40\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<text x=\"100\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0c6cc3\" font-weight=\"700\">내 AI 비서</text>\n<rect x=\"220\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<circle cx=\"300\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<rect x=\"240\" y=\"90\" width=\"120\" height=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<rect x=\"240\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<text x=\"300\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b06000\" font-weight=\"700\">다른 AI(전문가·K-서비스)</text>\n</svg></div>\n<h2>AI 비서 채팅 vs 다른 AI 호출</h2>\n<p>혼디 화면에는 항상 <strong>\"내 AI 비서\"</strong> 채팅창이 있습니다. 그런데 전문가 페르소나나 K-서비스를 부르면 새로운 화면(탭)이 열립니다. 이 둘은 왜 다른 화면일까요?</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">내 AI 비서란?</div>나만 알고 나에게 맞춰진 개인 비서입니다. 내가 쓸수록 내 습관과 맥락을 기억해 점점 똑똑해집니다(11장에서 자세히 다룹니다).</div></div>\n<h3>두 화면이 하는 일이 다릅니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 AI 비서 채팅</div><div class=\"step-desc\">평소 대화, 일정, 메모, 다른 사람 연결 등 일상적인 요청을 처리합니다. 필요하면 이 비서가 알아서 전문가나 K-서비스를 대신 호출해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(전문가 페르소나)</div><div class=\"step-desc\">변호사, 세무사 같은 특정 분야 전문 AI와 1:1로 대화합니다. 내 AI 비서와는 별개의 대화 기록을 갖습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(K-서비스)</div><div class=\"step-desc\">K-Law, K-Health처럼 정부·공공 성격의 AI 서비스입니다. 역시 별도 화면에서 진행됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">헷갈리기 쉬운 점</div>\"내 AI 비서에게 물어보면 되지 않나요?\" — 맞습니다. 실제로 내 비서에게 그냥 물어보면, 필요할 때 비서가 알아서 전문가·K-서비스를 연결해주기도 합니다. 다만 특정 전문가와 계속 대화를 이어가고 싶다면 직접 그 화면을 열어두는 게 더 편합니다.</div></div>\n", "quiz": [{"q": "내 AI 비서와 전문가 페르소나 채팅의 가장 큰 차이는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>", "options": ["글자 크기", "각각 별도의 화면(탭)과 대화 기록을 가진다", "색깔만 다르다", "차이가 없다"], "answer": 1, "explain": "내 AI 비서와 전문가 페르소나·K-서비스는 서로 다른 화면에서, 서로 다른 대화 기록으로 진행됩니다."}, {"q": "내가 원하는 전문가를 매번 직접 찾지 않아도 되는 이유는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>", "options": ["전문가가 먼저 연락해서", "내 AI 비서가 필요시 알아서 연결해줄 수 있어서", "그런 기능은 없다", "K-서비스가 대신 찾아줘서"], "answer": 1, "explain": "내 AI 비서에게 그냥 요청하면, 필요한 경우 비서가 적절한 전문가나 K-서비스를 대신 호출해줄 수 있습니다."}, {"q": "K-서비스는 어떤 성격의 AI인가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>", "options": ["개인 맞춤형 비서", "정부·공공 성격의 서비스(K-Law, K-Health 등)", "게임 AI", "광고용 챗봇"], "answer": 1, "explain": "K-서비스는 K-Law, K-Health, K-119처럼 정부·공공 영역의 전문 AI 서비스입니다."}], "placeholder": false}, {"tier": "beginner", "title": "메시지 주고받기", "id": "ch4", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"40\" y=\"20\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#eaf3fc\"/>\n<text x=\"130\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0c6cc3\">안녕하세요!</text>\n<rect x=\"180\" y=\"80\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#0c6cc3\"/>\n<text x=\"270\" y=\"108\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\">네, 반갑습니다</text>\n</svg></div>\n<h2>메시지 주고받기</h2>\n<p>사람과의 대화든 AI와의 대화든, 메시지를 주고받는 방식은 동일합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">메시지 입력·전송</div><div class=\"step-desc\">하단 입력창에 글을 쓰고 전송 버튼(또는 Enter)을 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">읽음·응답 표시</div><div class=\"step-desc\">상대(사람 또는 AI)가 메시지를 읽으면 표시가 바뀌고, 곧 답장이 도착합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 메시지 알림</div><div class=\"step-desc\">앱을 보고 있지 않을 때도 알림으로 새 메시지를 받을 수 있습니다(7장 참고).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">대화 기록은 어디로 가나요?</div>모든 대화는 PDV(개인 데이터 저장소)에 안전하게 기록됩니다 — 12장 \"PDV 기록\"에서 자세히 다룹니다.</div></div>\n", "quiz": [{"q": "메시지를 전송하는 기본적인 방법은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg>", "options": ["음성으로만 가능", "입력창에 쓰고 전송 버튼 또는 Enter", "이메일로 전송", "전송 방법이 없다"], "answer": 1, "explain": "다른 메신저와 동일하게 입력창에 텍스트를 쓰고 전송하면 됩니다."}, {"q": "앱을 보고 있지 않을 때 새 메시지는 어떻게 알 수 있나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>", "options": ["알 수 없다", "알림으로 받는다", "문자로만 온다", "매번 로그인해서 확인해야 한다"], "answer": 1, "explain": "앱이 열려 있지 않아도 알림(Web Push)으로 새 메시지를 받을 수 있습니다."}, {"q": "대화 기록은 어디에 저장되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>", "options": ["저장 안 됨", "PDV(개인 데이터 저장소)", "상대방 서버에만", "USB에 직접"], "answer": 1, "explain": "모든 대화는 PDV에 기록되어 필요할 때 다시 찾아볼 수 있습니다."}], "placeholder": false}, {"tier": "beginner", "title": "마이크·카메라·파일 첨부", "id": "ch5", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></g></svg></div>\n<h2>마이크·카메라·파일 첨부</h2>\n<p>텍스트 말고도 음성·사진·파일로 대화할 수 있습니다. 입력창 옆 세 아이콘을 확인해 보세요.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">마이크 — 음성으로 말하기</div><div class=\"step-desc\">버튼을 누르고 말하면 자동으로 글자로 바뀌어 전송됩니다. 손이 바쁠 때 유용합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">카메라 — 사진·영상 촬영</div><div class=\"step-desc\">바로 찍어서 보내거나, 갤러리에서 골라 보낼 수 있습니다. 영수증·서류 촬영에 자주 씁니다(18장 재무제표와 연결됩니다).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">파일 첨부 — 문서 보내기</div><div class=\"step-desc\">PDF, 엑셀 등 파일을 첨부해 AI에게 분석을 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 사진을 많이 쓰나요?</div>영수증이나 계약서를 찍어 보내면 AI가 내용을 읽어 정리해 줍니다 — 타이핑할 필요가 없습니다.</div></div>\n", "quiz": [{"q": "말로 요청하고 싶을 때 사용하는 버튼은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg>", "options": ["카메라", "마이크", "파일 첨부", "전송"], "answer": 1, "explain": "마이크 버튼을 누르고 말하면 음성이 자동으로 텍스트로 변환되어 전송됩니다."}, {"q": "영수증을 정리해달라고 할 때 가장 편한 방법은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg>", "options": ["일일이 타이핑", "사진 찍어서 전송", "전화로 설명", "불가능하다"], "answer": 1, "explain": "카메라로 영수증을 찍어 보내면 AI가 내용을 읽어 자동으로 정리해 줍니다."}, {"q": "PDF나 엑셀 파일을 AI에게 분석시키려면?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg>", "options": ["파일 첨부 버튼 이용", "이메일로 별도 전송", "불가능하다", "프린트해서 전달"], "answer": 0, "explain": "파일 첨부 버튼으로 문서를 직접 보내 분석을 요청할 수 있습니다."}], "placeholder": false}, {"tier": "beginner", "title": "혼디 숫자 코드", "id": "ch6", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></g></svg></div>\n<h2>혼디 숫자 코드</h2>\n<p>전화번호를 매번 타이핑하기 번거로울 때, 화면에 뜬 <strong>10자리 숫자 코드</strong>를 카메라로 찍기만 하면 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기존 기기에서 코드 표시</div><div class=\"step-desc\">이미 로그인된 화면에서 \"숫자 코드 보기\"를 누르면 10자리 코드가 뜹니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 기기에서 스캔</div><div class=\"step-desc\">새 기기의 카메라로 그 코드를 비추면 자동으로 전화번호가 채워집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 이어가기</div><div class=\"step-desc\">타이핑 없이 곧바로 7장의 \"폰-PC 연동\" 절차로 넘어갑니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">QR코드와 다른가요?</div>예전엔 외부 QR 서비스를 썼지만, 지금은 혼디가 자체 개발한 숫자 코드 방식을 씁니다 — 전화번호 정보가 외부로 나가지 않아 더 안전합니다.</div></div>\n", "quiz": [{"q": "혼디 숫자 코드는 몇 자리인가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg>", "options": ["4자리", "10자리", "16자리", "자릿수 없음"], "answer": 1, "explain": "혼디 숫자 코드는 10자리 숫자로, 전화번호를 인코딩합니다."}, {"q": "숫자 코드를 쓰는 목적은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>", "options": ["보안을 낮추기 위해", "전화번호 타이핑을 생략하기 위해", "광고 표시용", "알 수 없음"], "answer": 1, "explain": "타이핑 없이 카메라 스캔만으로 전화번호를 빠르게 입력하기 위한 기능입니다."}, {"q": "예전 QR 방식과 지금 방식의 차이는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>", "options": ["차이 없음", "외부 QR 서비스 대신 자체 개발 방식을 사용해 더 안전함", "QR이 더 빠름", "지금은 코드가 없음"], "answer": 1, "explain": "외부 QR 생성 서비스를 걷어내고 자체 인코딩 방식으로 바꿔 전화번호 정보가 외부로 나가지 않습니다."}], "placeholder": false}, {"tier": "beginner", "title": "폰-PC 연동과 알림", "id": "ch7", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div>\n<h2>폰-PC 연동과 알림</h2>\n<p>혼디는 비밀번호가 없으므로, PC에서 로그인하려면 <strong>이미 등록된 폰이 승인</strong>해줘야 합니다. 이 승인은 알림(Web Push)으로 전달됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① PC에서 전화번호 입력</div><div class=\"step-desc\">PC 화면에서 번호 뒷자리를 입력하고 \"확인 알림 보내기\"를 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 폰이 알림 수신</div><div class=\"step-desc\">등록된 폰에 실시간 알림이 도착합니다 — Wi-Fi만으로도 정상 수신됩니다(문자와 다름).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 폰에서 지문으로 승인</div><div class=\"step-desc\">알림을 열고 \"본인이 맞습니다\"를 누른 뒤, 지문(또는 Face ID)으로 한 번 더 확인해야 PC가 로그인됩니다 — 지문 확인 없이는 승인이 끝나지 않습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">알림이 왜 SMS가 아닌가요?</div>SMS는 통신사 신호가 필요하지만, 이 알림은 인터넷(Wi-Fi 포함)만 있으면 전달됩니다. SMS는 알림이 안 왔을 때만 쓰는 예비 수단입니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 코드 확인만으로는 부족한가요?</div>폰이 이미 잠금 해제된 채로 분실·도난되면, 코드 확인만으로는 그걸 쥔 사람이 진짜 주인인지 구분할 수 없습니다. 지문(또는 Face ID)까지 확인해야 실제로 등록된 지문과 일치하는 사람인지 검증됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">승인 요청에 제한 시간이 있나요?</div>예, 짧은 시간 안에 승인해야 합니다. 시간이 지나면 \"세션이 만료됐다\"는 안내가 뜨고 처음부터 다시 시도해야 합니다.</div></div>\n", "quiz": [{"q": "PC 로그인을 승인하는 주체는 누구인가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>", "options": ["PC 스스로", "이미 등록된 폰", "고객센터 직원", "자동으로 승인됨"], "answer": 1, "explain": "PC에서 로그인 시도가 있으면 등록된 폰에 알림이 가고, 그 폰에서 직접 승인해야 로그인이 완료됩니다."}, {"q": "이 알림은 어떤 방식으로 전달되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>", "options": ["SMS 문자", "이메일", "Web Push(인터넷 알림)", "우편"], "answer": 2, "explain": "Wi-Fi로도 정상 전달되는 Web Push 방식을 사용합니다. SMS는 예비 수단입니다."}, {"q": "승인 요청을 너무 늦게 확인하면 어떻게 되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>", "options": ["문제 없음", "세션이 만료되어 처음부터 다시 시도해야 함", "자동 승인됨", "계정이 잠김"], "answer": 1, "explain": "승인에는 제한 시간이 있어, 시간이 지나면 세션이 만료되고 재시도해야 합니다."}], "placeholder": false}, {"tier": "beginner", "title": "내 프로필 — 나만의 AI 웹페이지", "id": "ch8", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div>\n<h2>내 프로필 — 나만의 AI 웹페이지</h2>\n<p>혼디 가입자는 누구나 자신만의 공개 웹페이지를 갖습니다. 다른 사람이 여러분을 검색하면 이 페이지를 보게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기본 정보</div><div class=\"step-desc\">닉네임, 소개, 연락 방법이 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">혼디 온도</div><div class=\"step-desc\">거래·평가에 따라 오르내리는 신뢰 지표가 함께 표시됩니다(당근마켓 온도와 같은 개념).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">바로 대화 시작</div><div class=\"step-desc\">프로필을 본 사람이 버튼 하나로 바로 대화나 거래를 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">혼디 온도가 뭔가요?</div>36.5도에서 시작해 0~99도 사이를 오갑니다. 혼디마켓에서 거래 후 리뷰를 받으면 온도가 변합니다. 자세한 건 19장 이후에서 다룹니다.</div></div>\n", "quiz": [{"q": "혼디 프로필 페이지는 누가 볼 수 있나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg>", "options": ["본인만", "검색한 다른 사용자 누구나", "관리자만", "아무도 못 봄"], "answer": 1, "explain": "혼디 프로필은 공개 웹페이지로, 검색을 통해 다른 사용자가 볼 수 있습니다."}, {"q": "혼디 온도의 시작 값은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>", "options": ["0도", "36.5도", "99도", "100도"], "answer": 1, "explain": "당근마켓 온도와 같은 개념으로, 36.5도(사람 체온)에서 시작합니다."}, {"q": "혼디 온도는 무엇에 따라 변하나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>", "options": ["매일 자동으로 오름", "거래·평가 결과", "앱 사용 시간", "변하지 않음"], "answer": 1, "explain": "혼디마켓 거래 후 리뷰 등 평가에 따라 온도가 오르내립니다."}], "placeholder": false}, {"tier": "beginner", "title": "설정 페이지 사용법", "id": "ch9", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></g></svg></div>\n<h2>설정 페이지 사용법</h2>\n<p>대시보드의 \"비서 설정\" 탭에서 알림·개인정보·연동 기기 등을 관리합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">알림 켜기·끄기</div><div class=\"step-desc\">불필요한 알림 종류를 개별적으로 끌 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 기기 관리</div><div class=\"step-desc\">현재 로그인된 기기 목록을 보고, 낯선 기기가 있으면 로그아웃시킬 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">PDV 데이터 내보내기</div><div class=\"step-desc\">내 기록 전체를 다운로드할 수 있습니다 — 12장에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">보안 설정 조정</div><div class=\"step-desc\">지문 인증을 요구하는 금액 기준이나 필수 여부를 여기서 직접 조정할 수 있습니다 — 33장(고급)에서 자세히 다룹니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">낯선 기기가 보인다면?</div>즉시 \"관리\"에서 그 기기를 로그아웃시키고, 백업 키를 갖고 계신다면 재확인해 보세요.</div></div>\n", "quiz": [{"q": "불필요한 알림을 줄이려면 어디서 설정하나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg>", "options": ["설정 페이지의 알림 항목", "앱 삭제 후 재설치", "고객센터 문의만 가능", "설정할 수 없음"], "answer": 0, "explain": "설정 페이지에서 알림 종류별로 켜고 끌 수 있습니다."}, {"q": "낯선 로그인 기기를 발견하면 어떻게 해야 하나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>", "options": ["무시한다", "설정에서 즉시 로그아웃시킨다", "비밀번호를 바꾼다", "앱을 삭제한다"], "answer": 1, "explain": "설정의 로그인 기기 관리에서 즉시 해당 기기를 로그아웃 처리해야 합니다(혼디는 비밀번호가 없으므로 비밀번호 변경은 해당되지 않습니다)."}, {"q": "내 기록 전체를 다운로드하려면?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>", "options": ["불가능하다", "설정 페이지의 PDV 내보내기", "고객센터에 우편 요청", "이메일로 요청"], "answer": 1, "explain": "설정 페이지에서 PDV 데이터 내보내기 기능으로 내 기록 전체를 다운로드할 수 있습니다."}], "placeholder": false}, {"tier": "intermediate", "title": "사람과 사람의 대화, AI와 AI의 대화", "id": "ch10", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:380px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"96\" y1=\"60\" x2=\"124\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/>\n<text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">느림</text>\n<text x=\"110\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">사람 ↔ 사람</text>\n<circle cx=\"290\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/><circle cx=\"370\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n<line x1=\"316\" y1=\"60\" x2=\"344\" y2=\"60\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/>\n<text x=\"330\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">빛의 속도</text>\n<text x=\"330\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">AI ↔ AI</text>\n</svg></div>\n<h2>사람과 사람의 대화, AI와 AI의 대화</h2>\n<p>사람끼리 대화하면 오해가 생기기도 하고 시간이 걸립니다. 반면 혼디의 AI 비서끼리는 정보를 빠르고 정확하게 주고받습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사람 ↔ 사람</div><div class=\"step-desc\">말투·감정·타이밍에 따라 전달이 느려지거나 오해가 생길 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI ↔ AI</div><div class=\"step-desc\">내 AI 비서가 상대의 AI 비서와 직접 조율해, 예를 들어 약속 시간 잡기 같은 일을 몇 초 만에 끝냅니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그럼 사람 대 사람 대화는 필요 없나요?</div>아닙니다. 중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 게 좋습니다. AI ↔ AI는 반복적이고 사무적인 조율을 대신해주는 것입니다.</div></div>\n", "quiz": [{"q": "AI와 AI 사이의 대화가 가진 장점은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>", "options": ["더 감정적이다", "빠르고 정확하게 정보를 주고받는다", "항상 사람보다 느리다", "불가능하다"], "answer": 1, "explain": "AI끼리는 오해 없이 빠른 속도로 정보를 주고받을 수 있습니다."}, {"q": "사람과 사람의 대화에서 자주 생기는 문제는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>", "options": ["항상 완벽함", "오해나 지연이 생길 수 있음", "AI보다 항상 빠름", "문제 없음"], "answer": 1, "explain": "말투, 감정, 타이밍 등으로 오해나 지연이 생길 수 있습니다."}, {"q": "중요한 결정은 누가 하는 것이 좋은가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>", "options": ["항상 AI가", "사람이 직접", "AI와 사람 둘 다 절대 안 됨", "무작위로"], "answer": 1, "explain": "중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 것이 좋습니다."}], "placeholder": false}, {"tier": "intermediate", "title": "쓰면 쓸수록 똑똑해지는 나만의 AI 비서", "id": "ch11", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"100\" r=\"20\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"200\" cy=\"80\" r=\"30\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"340\" cy=\"55\" r=\"42\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<path d=\"M40 130 L370 20\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" fill=\"none\"/>\n<text x=\"70\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1일차</text>\n<text x=\"200\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1개월</text>\n<text x=\"340\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#0c6cc3\" font-weight=\"700\">1년</text>\n</svg></div>\n<h2>쓰면 쓸수록 똑똑해지는 나만의 AI 비서</h2>\n<p>내 AI 비서는 대화가 쌓일수록 내 습관, 선호, 맥락을 점점 더 잘 이해하게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기억이 쌓입니다</div><div class=\"step-desc\">과거 대화·PDV 기록을 참고해 다음 대화에서 더 정확한 답을 줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">점점 맞춤화됩니다</div><div class=\"step-desc\">반복되는 요청 패턴을 학습해 먼저 제안해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 데이터는 내 것</div><div class=\"step-desc\">이 모든 학습은 내 PDV 안에서만 이뤄지며, 다른 사람 비서와 섞이지 않습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">다른 AI 챗봇과 다른 점</div>일반 챗봇은 대화가 끝나면 기억을 잃지만, 내 AI 비서는 PDV에 계속 기록을 남겨 시간이 지날수록 더 정확해집니다.</div></div>\n", "quiz": [{"q": "내 AI 비서가 똑똑해지는 원리는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>", "options": ["소프트웨어 업데이트만으로", "내 대화·PDV 기록이 쌓이기 때문", "랜덤으로", "불가능하다"], "answer": 1, "explain": "쌓인 대화와 PDV 기록을 참고해 점점 더 맞춤화된 답을 줍니다."}, {"q": "이 학습된 정보는 다른 사람과 공유되나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>", "options": ["예, 모두와 공유됨", "아니요, 내 PDV 안에서만 유지됨", "공개 게시판에 올라감", "알 수 없음"], "answer": 1, "explain": "학습은 내 PDV 안에서만 이뤄지며 다른 사람 비서와 섞이지 않습니다."}, {"q": "일반 챗봇과 내 AI 비서의 차이는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>", "options": ["차이 없음", "일반 챗봇은 대화가 끝나면 기억을 잃지만 내 비서는 기록이 누적됨", "일반 챗봇이 더 똑똑함", "내 비서는 기록을 안 남김"], "answer": 1, "explain": "PDV에 기록이 누적되어 시간이 지날수록 더 정확해지는 게 핵심 차이입니다."}], "placeholder": false}, {"tier": "intermediate", "title": "PDV 기록 — 내 데이터는 어디에 있는가", "id": "ch12", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></g></svg></div>\n<h2>PDV 기록 — 내 데이터는 어디에 있는가</h2>\n<p>PDV(Private Data Vault, 개인 데이터 저장소)는 내 모든 대화·거래·기록이 안전하게 보관되는 나만의 금고입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 것은 내 것</div><div class=\"step-desc\">PDV의 데이터는 나만 열람할 수 있고, 다른 사람이나 기업이 마음대로 가져갈 수 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI 비서가 참고합니다</div><div class=\"step-desc\">11장에서 다룬 “똑똑해지는 AI 비서”의 재료가 바로 이 PDV 기록입니다.</div></
