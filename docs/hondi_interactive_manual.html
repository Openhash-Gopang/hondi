div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">평생 쌓입니다</div><div class=\"step-desc\">오늘의 기록이 10년 뒤에도 그대로 남아 나의 역사가 됩니다(13장에서 이어집니다).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">PDV를 내보낼 수 있나요?</div>네, 9장에서 다룬 설정 페이지에서 내 PDV 기록 전체를 다운로드할 수 있습니다.</div></div>\n", "quiz": [{"q": "PDV는 무엇의 줄임말인가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>", "options": ["Personal Data Vault", "Public Data View", "Private Digital Video", "Personal Device Verification"], "answer": 0, "explain": "PDV는 Private Data Vault, 개인 데이터 저장소입니다."}, {"q": "PDV의 데이터는 누가 열람할 수 있나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>", "options": ["누구나", "오직 나 자신", "혼디 직원 전체", "광고주"], "an l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>", "options": ["종량제", "정액제", "연간 구독", "일일 구독"], "answer": 3, "explain": "종량제·정액제(월)·연간 구독 세 가지 중 선택할 수 있습니다."}], "placeholder": false}, {"tier": "intermediate", "title": "GDC 사용하기 — 사용료와 사용자 간 결제", "id": "ch15", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></g></svg></div>\n<h2>GDC 사용하기 — 사용료와 사용자 간 결제</h2>\n<p>GDC는 혼디 이용료 지불뿐 아니라, <strong>사용자끼리 직접 주고받는 결제</strong>에도 쓰입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">서비스 이용료 결제</div><div class=\"step-desc\">전문가 페르소나·K-서비스 이용 시 GDC가 자동 차감됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사용자 간 결제</div><div class=\"step-desc\">혼디마켓에서 물건을 사고팔 때도 GDC로 결제합니다 — 19장에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내역 확인</div><div class=\"step-desc\">대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">GDC는 현금과 같나요?</div>혼디 생태계 안에서는 현금처럼 쓰이지만, 실제 환전이나 외부 사용에는 26장 \"수수료 없는 GDC 환전과 송금\"에서 다루는 규칙이 적용됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">결제할 때마다 지문을 확인하나요?</div>아니요 — 일정 금액 미만(기본 1만 원)은 매번 지문 없이 바로 결제됩니다. 그 금액을 넘어서는 결제만 지문(또는 Face ID)으로 한 번 더 확인합니다. 이 기준 금액은 설정에서 직접 조정할 수 있습니다 — 33장 \"보안 설정 직접 조정하기\"에서 다룹니다.</div></div>\n", "quiz": [{"q": "GDC로 결제할 수 없는 것은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>", "options": ["전문가 페르소나 이용료", "K-서비스 이용료", "혼디마켓 거래", "해당 없음(모두 가능)"], "answer": 3, "explain": "GDC는 서비스 이용료와 사용자 간 거래 모두에 쓰일 수 있습니다."}, {"q": "혼디마켓에서의 결제 수단은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>", "options": ["현금만", "신용카드만", "GDC", "포인트만"], "answer": 2, "explain": "혼디마켓의 거래도 GDC로 이뤄집니다."}, {"q": "사용 내역은 어디서 확인하나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>", "options": ["확인 불가", "대시보드", "고객센터 전화", "은행 앱"], "answer": 1, "explain": "대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다."}], "placeholder": false}, {"tier": "intermediate", "title": "전문가 페르소나 호출하기", "id": "ch16", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></g></svg></div>\n<h2>전문가 페르소나 호출하기</h2>\n<p>변호사, 세무사, 회계사, 간호사, 건축사 등 수백 종의 전문 분야 AI를 바로 호출할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분야 검색</div><div class=\"step-desc\">원하는 전문 분야(예: \"세무사\")를 검색합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 페르소나 선택</div><div class=\"step-desc\">해당 분야에 특화된 AI 페르소나를 선택해 대화를 시작합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 전문 상담</div><div class=\"step-desc\">법률·회계·의료 등 실제 전문가 수준의 상담을 받을 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">어떤 분야가 있나요?</div>법률, 회계, 세무, 의료, 건축, 관광통역, 감정평가 등 매우 다양한 분야의 전문가 페르소나가 준비되어 있습니다.</div></div>\n", "quiz": [{"q": "전문가 페르소나를 호출하는 첫 단계는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>", "options": ["바로 결제", "분야 검색", "회원 탈퇴", "이메일 전송"], "answer": 1, "explain": "원하는 전문 분야를 먼저 검색해서 찾습니다."}, {"q": "전문가 페르소나로 다룰 수 있는 분야가 아닌 것은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg>", "options": ["법률", "세무", "의료", "해당 없음(매우 다양함)"], "answer": 3, "explain": "법률·회계·의료·건축 등 수백 종의 다양한 전문 분야를 다룹니다."}, {"q": "전문가 페르소나 채팅은 내 AI 비서와 같은 화면인가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>", "options": ["예, 완전히 같다", "아니요, 별도 화면(3장 참고)", "전문가 페르소나는 존재하지 않는다", "항상 전화로만 가능"], "answer": 1, "explain": "3장에서 다뤘듯 전문가 페르소나는 내 AI 비서와 별도의 화면에서 진행됩니다."}], "placeholder": false}, {"tier": "intermediate", "title": "K-정부", "id": "ch_kgov", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(35,35)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M25 0L2 12v3h46v-3z\"/><line x1=\"2\" y1=\"15\" x2=\"48\" y2=\"15\"/><line x1=\"6\" y1=\"15\" x2=\"6\" y2=\"40\"/><line x1=\"16\" y1=\"15\" x2=\"16\" y2=\"40\"/><line x1=\"26\" y1=\"15\" x2=\"26\" y2=\"40\"/><line x1=\"36\" y1=\"15\" x2=\"36\" y2=\"40\"/><line x1=\"46\" y1=\"15\" x2=\"46\" y2=\"40\"/><line x1=\"0\" y1=\"40\" x2=\"50\" y2=\"40\"/><line x1=\"0\" y1=\"44\" x2=\"50\" y2=\"44\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(160,38)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"36\" height=\"34\" rx=\"2\"/><line x1=\"8\" y1=\"10\" x2=\"32\" y2=\"10\"/><line x1=\"8\" y1=\"18\" x2=\"32\" y2=\"18\"/><line x1=\"8\" y1=\"26\" x2=\"20\" y2=\"26\"/></g></svg></div>\n<h2>K-정부 — 대한민국 공공기관 전체 지도</h2>\n<p>K-정부는 대한민국의 입법·사법·행정부, 지방자치단체, 공기업, 공공기관을 한 곳에서 찾아볼 수 있는 AI 디렉토리입니다. 모든 부서까지 다 나열하지는 않고, 기관 명칭 위주로 안내합니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">K-서비스(17장)와 무엇이 다른가요?</div>K-서비스는 K-Law·K-Tax처럼 특정 \"기능\" 중심의 공익 서비스입니다. K-정부는 그 기능들이 실제로 속한 \"기관\" 자체를 찾아가는 디렉토리입니다 — 예를 들어 세금 신고는 K-Tax로 바로 가지만, \"국세청은 어떤 조직인가\"를 알고 싶을 때는 K-정부에서 국세청을 찾습니다.</div>\n</div>\n\n<h3>기관을 눌러 살펴보세요</h3>\n<p style=\"font-size:13px;color:var(--on-surface-variant);margin-bottom:8px\">카테고리 → 기관 → 부서 순으로 펼쳐집니다. 부서를 누르면 그 부서의 SP(System Prompt)를 바로 확인할 수 있습니다.</p>\n<div id=\"kgov-app\" class=\"kgov-app\"><div class=\"kgov-loading\">불러오는 중…</div></div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">부서 SP는 어떻게 만들어지나요?</div>입법부·사법부·행정부·지방자치단체의 부서 SP는 미리 파일로 만들어 둔 게 아니라, 공용 템플릿에 그 부서의 실사 데이터(부서명·소관업무 등)를 그 자리에서 채워 넣어 만듭니다 — 혼디가 실제로 부서 AI를 필요할 때만 만드는 방식(지연 인스턴스화)과 같습니다. 반면 공기업·공공기관은 기관마다 이미 완성된 SP 파일이 있어 클릭하면 바로 열립니다. 지방자치단체는 16개 시도 중 15개는 시도 자체 정보가, 13개는 실·국 단위 부서까지 조사되어 있으며 나머지는 준비 중입니다.</div>\n</div>\n", "quiz": [{"q": "K-정부와 K-서비스의 차이는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>", "options": ["차이 없음", "K-서비스는 기능 중심, K-정부는 기관 자체를 찾는 디렉토리", "K-정부가 유료 서비스", "K-서비스는 지방자치단체 전용"], "answer": 1, "explain": "K-서비스는 K-Law·K-Tax 같은 기능 중심 서비스이고, K-정부는 그 기능이 속한 기관 자체를 찾아가는 디렉토리입니다."}, {"q": "입법부·사법부·행정부·지방자치단체 부서의 SP는 어떻게 만들어지나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>", "options": ["기관마다 미리 만들어 둔 개별 파일을 연다", "공용 템플릿에 그 부서의 실사 데이터를 즉석에서 채워 만든다", "만들 수 없다", "관리자가 매번 수작업으로 작성한다"], "answer": 1, "explain": "혼디의 지연 인스턴스화 원칙과 같은 방식으로, 공용 템플릿에 그 부서의 데이터를 채워 그 자리에서 SP를 만듭니다."}, {"q": "공기업·공공기관 SP는 어떻게 확인하나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/></svg>", "options": ["템플릿 치환이 필요하다", "기관마다 이미 완성된 SP 파일을 바로 열람한다", "확인할 방법이 없다", "가입자만 볼 수 있다"], "answer": 1, "explain": "공기업 30개·공공기관 254개는 기관마다 이미 완성된 SP 파일이 있어, 클릭하면 그 파일을 바로 열람할 수 있습니다."}], "placeholder": false}, {"tier": "intermediate", "title": "K-서비스 호출하기", "id": "ch17", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></g></svg></div>\n<h2>K-서비스 호출하기</h2>\n<p>K-Law, K-Health, K-119처럼 정부·공공 성격의 AI 서비스를 K-서비스라고 부릅니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① K-서비스 목록 열기</div><div class=\"step-desc\">K-119·K-Law·K-Health·K-School·K-Tax·K-Market 등 다양한 서비스 탭이 나열됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 원하는 서비스 선택</div><div class=\"step-desc\">예를 들어 세금 문의는 K-Tax, 법률 문의는 K-Law를 선택합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 바로 상담·처리</div><div class=\"step-desc\">공공 성격의 절차를 AI가 즉시 안내하거나 처리해줍니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전문가 페르소나와 뭐가 다른가요?</div>전문가 페르소나(16장)는 개별 전문가 역할이고, K-서비스는 정부·공공기관 성격의 서비스라는 점이 다릅니다.</div></div>\n", "quiz": [{"q": "K-서비스의 성격은?", "icon": "< 송금 대비 GDC의 장점은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>", "options": ["더 비싼 수수료", "수수료 없음", "더 느림", "환율 변동 위험 증가"], "answer": 1, "explain": "환전·송금 수수료가 없다는 게 핵심 장점입니다."}], "placeholder": false}, {"tier": "advanced", "title": "나만의 SP 맞춤 수정하기 — 개인·기관·부서", "id": "ch27", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></g></svg></div>\n<h2>나만의 SP 맞춤 수정하기 — 개인·기관·부서</h2>\n<p>SP(System Prompt, AI 비서의 기본 지침)를 내 필요에 맞게 직접 수정할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 개인용 맞춤</div><div class=\"step-desc\">말투, 우선순위, 자주 쓰는 표현 등을 개인 SP에 반영합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/ div><div class=\"step-desc\">OpenRouter 등에서 본인 명의의 API 키를 발급받습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 설정에 등록</div><div class=\"step-desc\">9장의 설정 페이지에서 발급받은 키를 등록합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 사용량 직접 관리</div><div class=\"step-desc\">이후 AI 사용량과 비용을 내 키 기준으로 직접 확인·관리합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">누구에게 필요한 기능인가요?</div>일반 사용자는 필요 없습니다 — 대량으로 AI를 쓰거나 비용을 세밀하게 관리하고 싶은 고급 사용자를 위한 선택 기능입니다.</div></div>\n", "quiz": [{"q": "BYOK는 무엇을 의미하나요 y:block;margin:0 auto\">\n<circle cx=\"90\" cy=\"50\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"30\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"310\" cy=\"55\" r=\"9\" fill=\"#0c6cc3\"/>\n<circle cx=\"130\" cy=\"110\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"260\" cy=\"115\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"85\" r=\"9\" fill=\"#188038\"/>\n<line x1=\"90\" y1=\"50\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"310\" y1=\"55\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"130\" y1=\"110\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"260\" y1=\"115\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n</svg></div>\n<h2>Openhash — 서버 없는 인증</h2>\n<p>주민등록증이나 운전면허증처럼 위변조를 원천 차단하는 기술이 Openhash입니다. 특정 중앙 서버 하나에 의존하지 않고 데이터 무결성을 보장합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분산 기록</div><div class=\"step-desc\">기록이 하나의 서버가 아니라 여러 지점에 분산 저장됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 위변조 불가능</div><div class=\"step-desc\">한 곳의 기록만 몰래 바꿔서는 전체 무결성을 속일 수 없는 구조입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰의 기반</div><div class=\"step-desc\">이 덕분에 PDV(12장) 기록과 재무제표(20장)를 믿고 쓸 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">블록체인과 같은 건가요?</div>비슷한 \"분산·위변조 방지\" 철학을 공유하지만, 혼디의 Openhash는 혼디 생태계 안의 데이터 무결성 보장에 특화되어 있습니다.</div></div>\n", "quiz": [{"q": "Openhash의 핵심 목적은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>", "options": ["속도 향상", "데이터 위변조 방지", "디자인 개선", "광고 차단"], "answer": 1, "explain": "주민등록증처럼 위변조를 원천 차단하는 신뢰 인프라입니다."}, {"q": "Openhash는 어떻게 위변조를 막나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>", "options": ["한 서버에 강력한 암호를 걸어서", "여러 지점에 분산 기록해서", "기록을 아예 안 남겨서", "비밀번호로"], "answer": 1, "explain": "하나의 중앙 서버가 아니라 여러 지점에 분산 기록해 한 곳만 조작해서는 무결성을 속일 수 없습니다."}, {"q": "Openhash가 신뢰의 기반이 되는 예로 언급된 것은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>", "options": ["PDV 기록과 재무제표", "날씨 예보", "게임 점수", "광고 노출수"], "answer": 0, "explain": "PDV 기록과 재무제표의 신뢰성이 Openhash 위에서 보장됩니다."}], "placeholder": false}, {"tier": "advanced", "title": "MoTE란 무엇인가", "id": "ch30", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"30\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"150\" y2=\"40\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"55\" x2=\"150\" y2=\"55\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"70\" x2=\"150\" y2=\"70\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"85\" x2=\"120\" y2=\"85\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"100\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">A4 약 50페이지</text>\n<line x1=\"185\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"2\" marker-end=\"url(#a30)\"/>\n<defs><marker id=\"a30\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#94a3b8\"/></marker></defs>\n<circle cx=\"300\" cy=\"70\" r=\"45\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#188038\" font-weight=\"700\">MoTE</text>\n<text x=\"300\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#188038\">비용 절감</text>\n</svg></div>\n<h2>MoTE란 무엇인가</h2>\n<p>K-Law가 판사처럼 판단하려면 헌법·법률·판례 지침을 미리 읽혀둬야 하며, 그 분량은 A4 용지로 약 50페이지에 달합니다. <strong>MoTE는 이 비용을 구조적으로 줄이는 기술</strong>입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">문제: 매번 다시 읽기</div><div class=\"step-desc\">AI가 질문마다 50페이지 분량의 참고자료를 새로 읽으면 비용과 에너지가 많이 듭니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">해결: MoTE</div><div class=\"step-desc\">핵심 지침을 효율적으로 재사용해 매번 처음부터 다시 읽지 않도록 구조화합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">효과: 이용료·에너지 절감</div><div class=\"step-desc\">이 절감분이 3장·16장·17장에서 다룬 K-서비스·전문가 페르소나 이용료를 낮추는 데 기여합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 중요한가요?</div>MoTE 같은 구조적 효율화가 없다면 전문 지식이 필요한 AI 서비스의 비용이 훨씬 비싸질 수밖에 없습니다.</div></div>\n", "quiz": [{"q": "MoTE가 해결하려는 문제는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>", "options": ["느린 인터넷 속도", "매번 방대한 참고자료를 새로 읽어야 하는 비용 문제", "디자인 문제", "가입 절차 문제"], "answer": 1, "explain": "K-Law 같은 서비스가 매번 A4 약 50페이지를 다시 읽어야 하는 비용 문제를 구조적으로 줄입니다."}, {"q": "MoTE의 효과는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>", "options": ["속도만 빨라짐", "이용료·에너지 절감", "기능이 줄어듦", "보안 강화만"], "answer": 1, "explain": "구조적으로 비용과 에너지를 절감시켜 이용료를 낮추는 데 기여합니다."}, {"q": "MoTE의 절감 효과가 영향을 주는 서비스는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>", "options": ["K-서비스·전문가 페르소나 이용료", "혼디 온도", "가입 절차", "없음"], "answer": 0, "explain": "절감된 비용이 K-서비스·전문가 페르소나 이용료를 낮추는 데 반영됩니다."}], "placeholder": false}, {"tier": "advanced", "title": "정부 없이 여권 발급이 가능할까?", "id": "ch31", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;display:block;margin:0 auto\">\n<circle cx=\"200\" cy=\"80\" r=\"60\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"140\" y1=\"80\" x2=\"260\" y2=\"80\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 1 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 0 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<circle cx=\"200\" cy=\"80\" r=\"18\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"18\" fill=\"#b06000\" font-weight=\"700\">?</text>\n</svg></div>\n<h2>정부 없이 여권 발급이 가능할까?</h2>\n<p>여권은 전통적으로 국가만이 발급해왔습니다. 하지만 신원 확인·기록 관리를 기술로 대체할 수 있다면 어떨까요?</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신원 확인의 핵심</div><div class=\"step-desc\">여권의 본질은 \"이 사람이 실제로 이 사람이다\"를 증명하는 것 — 혼디의 가입·인증 구조(1장)와 원리가 같습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신뢰 인프라</div><div class=\"step-desc\">Openhash(29장) 같은 위변조 방지 기술이 국가 발급 없이도 신뢰를 담보할 잠재력을 보여줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">현실적 한계</div><div class=\"step-desc\">다만 국경 통과·법적 효력은 각국 정부의 상호 인정이 필요해, 기술만으로 완전히 대체하긴 어렵습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그래서 결론은?</div>기술적으로는 신원 증명이 가능하지만, 실제 여권 대체는 국제적 합의가 필요한 영역입니다 — 32장에서 혼디가 이 문제에 접근하는 방식을 다룹니다.</div></div>\n", "quiz": [{"q": "여권의 본질적 기능은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>", "options": ["예쁜 디자인", "신원 증명", "사진 보관", "여행 기록"], "answer": 1, "explain": "여권의 핵심은 '이 사람이 실제로 이 사람이다'를 증명하는 신원 확인 기능입니다."}, {"q": "혼디의 어떤 기술이 신원 증명의 신뢰 기반이 될 수 있나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>", "options": ["Openhash", "GDC", "혼디마켓", "전문가 페르소나"], "answer": 0, "explain": "위변조 방지 기술인 Openhash가 신뢰의 기반이 될 잠재력을 보여줍니다."}, {"q": "기술만으로 여권을 완전히 대체하기 어려운 이유는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg>", "options": ["기술이 부족해서", "국경 통과 등에는 각국 정부의 상호 인정이 필요해서", "비용이 너무 비싸서", "보안이 약해서"], "answer": 1, "explain": "법적 효력과 국경 통과는 국제적 합의가 필요한 영역이기 때문입니다."}], "placeholder": false}, {"tier": "advanced", "title": "혼디로 구현하는 글로벌 전자 여권", "id": "ch32", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"130\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<circle cx=\"200\" cy=\"55\" r=\"16\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"150\" y1=\"90\" x2=\"250\" y2=\"90\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"70\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"330\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"200\" cy=\"140\" r=\"10\" fill=\"#188038\"/>\n<line x1=\"130\" y1=\"70\" x2=\"80\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"270\" y1=\"70\" x2=\"320\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n</svg></div>\n<h2>혼디로 구현하는 글로벌 전자 여권</h2>\n<p>31장에서 살펴본 개념을 실제로 구현하면, 혼디 계정 하나로 전 세계 어디서든 신원을 증명할 수 있는 형태가 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 혼디 신원 = 전자 여권의 기초</div><div class=\"step-desc\">1장의 지갑 기반 신원이 여권 역할의 출발점이 됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② Openhash로 위변조 방지</div><div class=\"step-desc\">29장의 분산 인증 기술이 여권 정보의 신뢰성을 보장합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 국가 간 상호 인정 확대</div><div class=\"step-desc\">각국 정부·기관이 혼디 신원을 인정하는 범위가 넓어질수록 실제 여권처럼 쓰일 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">지금 당장 여권을 대체하나요?</div>아직은 아닙니다 — 이는 혼디가 지향하는 방향이며, 각국의 제도적 인정이 함께 진행되어야 완성됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전체 장을 완주하셨다면</div>축하합니다! 초급·중급·고급 전체 장을 모두 마치면 GDC 10,000T와 혼디 온도 상승이 함께 반영됩니다.</div></div>\n", "quiz": [{"q": "혼디 전자 여권 구상의 출발점은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg>", "options": ["지갑 기반 신원(1장)", "혼디마켓 거래", "GDC 잔액", "닉네임"], "answer": 0, "explain": "1장에서 다룬 지갑 기반 신원이 전자 여권 구상의 기초가 됩니다."}, {"q": "여권 정보의 신뢰성을 보장하는 기술은?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>", "options": ["Openhash", "마이크 기능", "숫자 코드", "혼디마켓"], "answer": 0, "explain": "29장에서 다룬 Openhash의 분산 인증 기술이 신뢰성을 보장합니다."}, {"q": "혼디 전자 여권이 실제 여권처럼 쓰이려면 무엇이 필요한가요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>", "options": ["아무것도 필요 없음, 이미 완성됨", "각국 정부·기관의 상호 인정 확대", "앱 재설치", "광고 시청"], "answer": 1, "explain": "국가 간 상호 인정이 확대되어야 실제 여권처럼 통용될 수 있습니다."}], "placeholder": false}, {"tier": "advanced", "title": "보안 설정 직접 조정하기 — 문턱값과 유예", "id": "ch33", "body": "<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle "/></svg>", "options": ["낮추는 쪽(강화)", "올리는 쪽(완화)", "둘 다 즉시 적용", "둘 다 24시간 걸림"], "answer": 0, "explain": "보호를 강화하는 방향(문턱값을 낮추거나 지문을 다시 켜는 것)은 지갑 서명만으로 바로 반영됩니다."}, {"q": "보호를 낮추는 조정을 하면 어떤 일이 함께 일어나나요?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>", "options": ["아무 일도 없음", "지문 확인 후 24시간 유예 + 다른 기기로 알림", "즉시 계정이 잠김", "자동으로 취소됨"], "answer": 1, "explain": "지문 확인을 거친 뒤에도 24시간 뒤에야 적용되고, 그 사이 다른 등록 기기에 알림이 갑니다 — 본인이 요청한 게 아니면 취소할 수 있습니다."}, {"q": "완화에 유예 시간을 두는 이유는?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>", "options": ["시스템 속도 문제", "폰을 잠깐 손에 넣은 사람이 몰래 보안을 낮춰버리는 걸 막기 위해", "법적 의무라서", "이유 없음"], "answer": 1, "explain": "즉시 완화되면, 폰을 잠깐이라도 손에 넣은 사람이 보호 수준을 낮춰놓고 돌려줘도 원래 주인이 알아챌 수 없습니다. 유예 시간과 알림이 이걸 막습니다."}], "placeholder": false}];
var TIER_LABELS = {"beginner": "초급", "intermediate": "중급", "advanced": "고급"};
var TIER_REWARDS = {"beginner": 1000, "intermediate": 3000, "advanced": 10000};
var TIER_ORDER = ["beginner", "intermediate", "advanced"];
var STORAGE_KEY = "hondi_manual_progress_v1";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {completed: [], tierRewardClaimed: []}; }
  catch (e) { return {completed: [], tierRewardClaimed: []}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
var progress = loadProgress();
var currentTier = "beginner";
var currentChapterId = CHAPTERS[0].id;

function chaptersByTier(tier) { return CHAPTERS.filter(function (c) { return c.tier === tier; }); }
function isCompleted(id) { return progress.completed.indexOf(id) !== -1; }
function tierCompletedCount(tier) { return chaptersByTier(tier).filter(function (c) { return isCompleted(c.id); }).length; }
function tierFullyDone(tier) { var chs = chaptersByTier(tier); return chs.length > 0 && chs.every(function (c) { return isCompleted(c.id); }); }

function renderHeader() {
  var total = CHAPTERS.length, done = progress.completed.length;
  document.getElementById('progressLabel').textContent = done + '/' + total;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';
  document.getElementById('progressSub').textContent =
    done === 0 ? '아직 시작 전입니다 — 첫 장부터 시작해 보세요.' :
    done === total ? '모든 과정을 완료했습니다! 🎉' : done + '개 장을 완료했습니다. 계속해 보세요.';
  var tempBonus = 0;
  TIER_ORDER.forEach(function (t) { if (tierFullyDone(t)) tempBonus += {beginner:10, intermediate:15, advanced:25}[t]; });
  var temp = Math.min(99, 36.5 + tempBonus);
  document.getElementById('tempValue').textContent = temp.toFixed(1) + '°';
  document.getElementById('tempFill').style.width = Math.min(100, temp / 99 * 100) + '%';
}

function renderTierTabs() {
  var wrap = document.getElementById('tierTabs');
  var indicator = document.getElementById('tierIndicator');
  wrap.querySelectorAll('.md-tab').forEach(function (b) { b.remove(); });
  TIER_ORDER.forEach(function (tier, i) {
    var chs = chaptersByTier(tier);
    var done = tierCompletedCount(tier);
    var btn = document.createElement('button');
    btn.className = 'md-tab' + (tier === currentTier ? ' active' : '');
    btn.innerHTML = TIER_LABELS[tier] + '<span class="mt-count">' + done + '/' + chs.length + '</span>' +
      '<span class="mt-reward">GDC ' + TIER_REWARDS[tier].toLocaleString() + 'T</span>';
    btn.addEventListener('click', function () {
      currentTier = tier; currentChapterId = chaptersByTier(tier)[0].id; renderAll();
    });
    wrap.appendChild(btn);
  });
  requestAnimationFrame(function () {
    var activeBtn = wrap.querySelector('.md-tab.active');
    if (activeBtn) {
      indicator.style.left = activeBtn.offsetLeft + 'px';
      indicator.style.width = activeBtn.offsetWidth + 'px';
    }
  });
}

function renderChapterTabs() {
  var wrap = document.getElementById('chTabs');
  wrap.innerHTML = '';
  chaptersByTier(currentTier).forEach(function (ch, idx) {
    var btn = document.createElement('button');
    btn.className = 'ch-card' + (ch.id === currentChapterId ? ' active' : '') + (isCompleted(ch.id) ? ' completed' : '');
    btn.innerHTML = '<span class="cc-num">' + (isCompleted(ch.id) ? '' : (idx + 1)) + '</span><span>' + ch.title + '</span>';
    btn.addEventListener('click', function () { currentChapterId = ch.id; renderAll(); });
    wrap.appendChild(btn);
  });
}

function renderQuiz(chapter) {
  if (!chapter.quiz || !chapter.quiz.length) return '';
  var html = '<div class="quiz-section"><div class="quiz-title">✏️ 확인 퀴즈</div><div class="quiz-sub">모두 맞히면 이 장이 완료 처리됩니다.</div>';
  chapter.quiz.forEach(function (q, qi) {
    html += '<div class="quiz-q" data-qi="' + qi + '">' +
      '<div class="quiz-q-head"><div class="quiz-q-icon">' + (q.icon || '') + '</div><div class="quiz-q-text">' + (qi + 1) + '. ' + q.q + '</div></div>';
    q.options.forEach(function (opt, oi) {
      html += '<button type="button" class="quiz-opt" data-oi="' + oi + '">' +
        '<span class="quiz-opt-mark">' +
          '<svg class="mark-check" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '<svg class="mark-x" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</span>' +
        '<span class="quiz-opt-text">' + opt + '</span></button>';
    });
    html += '<div class="quiz-explain"></div></div>';
  });
  html += '<button type="button" class="quiz-submit" id="quizSubmitBtn">채점하기</button><div class="quiz-result" id="quizResult"></div></div>';
  return html;
}

function renderContent() {
  var chapter = CHAPTERS.find(function (c) { return c.id === currentChapterId; });
  var el = document.getElementById('chContent');
  el.innerHTML = chapter.body + (chapter.placeholder ? '' : renderQuiz(chapter));
  if (chapter.id === 'ch_kgov' && !chapter.placeholder) kgovBuildApp(document.getElementById('kgov-app'));
  if (chapter.placeholder) return;
  var selections = {}; var submitted = false;
  el.querySelectorAll('.quiz-q').forEach(function (qEl) {
    var qi = qEl.dataset.qi;
    qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
      optBtn.addEventListener('click', function () {
        if (submitted) return;
        qEl.querySelectorAll('.quiz-opt').forEach(function (b) { b.classList.remove('selected'); });
        optBtn.classList.add('selected');
        selections[qi] = parseInt(optBtn.dataset.oi, 10);
      });
    });
  });
  var submitBtn = document.getElementById('quizSubmitBtn');
  submitBtn.addEventListener('click', function () {
    if (Object.keys(selections).length < chapter.quiz.length) { alert('모든 문항에 답해 주세요.'); return; }
    submitted = true; var allCorrect = true;
    el.querySelectorAll('.quiz-q').forEach(function (qEl) {
      var qi = parseInt(qEl.dataset.qi, 10); var q = chapter.quiz[qi]; var picked = selections[qi];
      var correct = picked === q.answer; if (!correct) allCorrect = false;
      qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
        var oi = parseInt(optBtn.dataset.oi, 10); optBtn.disabled = true;
        if (oi === q.answer) optBtn.classList.add('correct');
        else if (oi === picked) optBtn.classList.add('incorrect');
      });
      var expl = qEl.querySelector('.quiz-explain'); expl.textContent = q.explain; expl.classList.add('show');
    });
    submitBtn.disabled = true;
    var resultEl = document.getElementById('quizResult');
    resultEl.classList.add('show', allCorrect ? 'pass' : 'fail');
    if (allCorrect) {
      resultEl.textContent = '🎉 정답입니다! 이 장을 완료 처리했습니다.';
      if (!isCompleted(chapter.id)) { progress.completed.push(chapter.id); saveProgress(progress); }
      checkTierReward(chapter.tier);
      renderHeader(); renderTierTabs(); renderChapterTabs();
    } else {
      resultEl.textContent = '아쉽지만 틀린 문항이 있습니다. 내용을 다시 읽고 새로고침 후 재도전해 보세요.';
    }
  });
}

function checkTierReward(tier) {
  if (!tierFullyDone(tier)) return;
  if (progress.tierRewardClaimed.indexOf(tier) !== -1) return;
  progress.tierRewardClaimed.push(tier); saveProgress(progress);
  var banner = document.getElementById('tierRewardBanner');
  banner.classList.add('show');
  banner.innerHTML = TIER_LABELS[tier] + ' 과정을 모두 완료했습니다!<br><span class="trb-amount">GDC ' + TIER_REWARDS[tier].toLocaleString() + 'T 지급</span>' +
    '<div style="font-size:11.5px;color:#a9b8d4;margin-top:8px">※ 실제 계정 지급 및 혼디 온도 반영은 백엔드 연동 후 적용됩니다(현재는 미리보기).</div>';
}

document.getElementById('nextFab').addEventListener('click', function () {
  var list = chaptersByTier(currentTier);
  var idx = list.findIndex(function (c) { return c.id === currentChapterId; });
  if (idx < list.length - 1) { currentChapterId = list[idx + 1].id; renderAll(); window.scrollTo({top:0, behavior:'smooth'}); }
});


/* ── K-정부 챕터 전용 로직 (2026-08-29 신설, 2026-08-29 단일 출처로 재설계) ──
   이 챕터는 어떤 기관·부서 명칭도 직접 저장해 두지 않는다 — 전부 그때그때
   저장소에서 읽어온다:
   - 입법·사법·행정부·지자체 부서: division목록 JSON(실사 데이터)에서 기관명을
     매번 새로 뽑아내고, 부서 SP는 공용 템플릿에 그 행의 데이터를 그 자리에서
     치환해 만든다(저장·중복 없음).
   - 공기업·공공기관: 사이트가 이미 쓰고 있는 정본 카탈로그
     prompts/sp-catalog-categories.json에서 해당 폴더 하위 파일 목록을 그대로
     가져오고, 이름·소관부처는 그 파일을 직접 열어 표시 시점에 읽는다.
   즉 이 파일 안에 있는 건 전부 "어디서 가져올지"뿐이고, "무엇이 있는지"는
   단 한 곳(저장소의 실제 데이터/카탈로그)에서만 관리된다. */

var KGOV_CACHE = {};
function kgovFetchText(url) {
  if (KGOV_CACHE[url]) return Promise.resolve(KGOV_CACHE[url]);
  return fetch(url).then(function (r) { return r.text(); }).then(function (t) { KGOV_CACHE[url] = t; return t; });
}
function kgovFetchJSON(url) {
  if (KGOV_CACHE[url]) return Promise.resolve(KGOV_CACHE[url]);
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) { KGOV_CACHE[url] = j; return j; });
}
function kgovEsc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function kgovSubstitute(tmpl, row) {
  var out = tmpl;
  Object.keys(row).forEach(function (k) {
    var v = row[k];
    if (typeof v === 'string') out = out.split('{' + k + '}').join(v);
  });
  return out;
}
function kgovParseHeader(text) {
  var mName = text.match(/문서명\s*:\s*(.+?)\s*—/);
  var mDept = text.match(/소관부처\s*:\s*(.+)/);
  return { name: mName ? mName[1].trim() : null, dept: mDept ? mDept[1].trim() : '기타' };
}
function kgovRawUrl(repoRelativePath) {
  return 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/' + repoRelativePath;
}
function kgovModal() {
  var m = document.getElementById('kgovModal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'kgovModal';
  m.className = 'kgov-modal';
  m.innerHTML = '<div class="kgov-modal-inner"><div class="kgov-modal-head"><span id="kgovModalTitle"></span><button type="button" id="kgovModalClose" aria-label="닫기">✕</button></div><pre id="kgovModalBody"></pre></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('open'); });
  m.querySelector('#kgovModalClose').addEventListener('click', function () { m.classList.remove('open'); });
  return m;
}
function kgovShow(title, text) {
  var m = kgovModal();
  m.querySelector('#kgovModalTitle').textContent = title;
  m.querySelector('#kgovModalBody').textContent = text;
  var note = m.querySelector('#kgovModalNote');
  var leftover = text.match(/\{[A-Z_]+\}/g);
  if (leftover) {
    if (!note) {
      note = document.createElement('div');
      note.id = 'kgovModalNote';
      note.className = 'kgov-modal-note';
      m.querySelector('.kgov-modal-inner').insertBefore(note, m.querySelector('#kgovModalBody'));
    }
    var uniq = Array.from(new Set(leftover)).join(', ');
    note.textContent = uniq + '는 실제 서비스에서 상위 공용 SP가 자동으로 삽입되는 자리로, 이 화면에서는 표시되지 않습니다.';
    note.hidden = false;
  } else if (note) {
    note.hidden = true;
  }
  m.classList.add('open');
}
function kgovShowLoading(title) { kgovShow(title, '불러오는 중…'); }

function kgovCategorySection(title, countLabel, buildFn) {
  var sec = document.createElement('div');
  sec.className = 'kgov-category';
  var head = document.createElement('button');
  head.type = 'button';
  head.className = 'kgov-cat-head';
  head.innerHTML = '<span>' + kgovEsc(title) + '</span><span class="kgov-cat-count">' + kgovEsc(countLabel) + '</span>';
  var body = document.createElement('div');
  body.className = 'kgov-cat-body';
  body.hidden = true;
  var built = false;
  head.addEventListener('click', function () {
    body.hidden = !body.hidden;
    head.classList.toggle('open', !body.hidden);
    if (!built) { built = true; buildFn(body); }
  });
  sec.appendChild(head);
  sec.appendChild(body);
  return sec;
}

function kgovAgencyItem(container, label, disabled, onOpen) {
  var wrap = document.createElement('div');
  wrap.className = 'kgov-agency-item';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kgov-agency-btn';
  btn.textContent = label;
  if (disabled) btn.disabled = true;
  var panel = document.createElement('div');
  panel.className = 'kgov-dept-panel';
  panel.hidden = true;
  btn.addEventListener('click', function () {
    var wasOpen = !panel.hidden;
    container.querySelectorAll('.kgov-dept-panel').forEach(function (p) { p.hidden = true; });
    container.querySelectorAll('.kgov-agency-btn').forEach(function (b) { b.classList.remove('active'); });
    if (wasOpen) return;
    btn.classList.add('active');
    panel.hidden = false;
    if (!panel.dataset.loaded) {
      panel.dataset.loaded = '1';
      onOpen(panel);
    }
  });
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  container.appendChild(wrap);
}

/* 입법부·사법부·행정부 공용: division목록 JSON을 매번 새로 읽어
   기관 목록·부서 목록을 뽑아내고, 부서 SP는 공용 템플릿에 그 자리에서 치환한다. */
function kgovBranch(container, jsonUrl, tmplUrl) {
  container.innerHTML = '기관 목록 불러오는 중…';
  kgovFetchJSON(jsonUrl).then(function (data) {
    var rows = data['division목록'];
    var agencies = [];
    rows.forEach(function (r) { if (agencies.indexOf(r['기관명']) === -1) agencies.push(r['기관명']); });
    container.innerHTML = '';
    agencies.forEach(function (name) {
      kgovAgencyItem(container, name, false, function (panel) {
        var subRows = rows.filter(function (r) { return r['기관명'] === name; });
        panel.innerHTML = '';
        subRows.forEach(function (row) {
          var dbtn = document.createElement('button');
          dbtn.type = 'button';
          dbtn.className = 'kgov-dept-btn';
          dbtn.textContent = row['부서명'] + (row['부서유형'] ? ' · ' + row['부서유형'] : '');
          dbtn.addEventListener('click', function () {
            kgovShowLoading(name + ' · ' + row['부서명']);
            /* 이 6종 템플릿은 자리표시자 이름이 {상위기관이름}/{부서이름}으로,
               JSON 필드명(기관명/부서명)과 표기가 달라 별칭을 붙여 치환한다. */
            var aliased = Object.assign({}, row, { '상위기관이름': row['기관명'], '부서이름': row['부서명'] });
            kgovFetchText(tmplUrl).then(function (tmpl) {
              kgovShow(name + ' · ' + row['부서명'] + ' — SP', kgovSubstitute(tmpl, aliased));
            });
          });
          panel.appendChild(dbtn);
        });
      });
    });
  });
}

/* 지방자치단체: province-master-data.json에 실제 등재된 시도만 그대로
   보여준다(전체 개수를 가정하거나 미등재 항목을 임의로 채워 넣지 않음). */
function kgovLocal(container) {
  var PROV_JSON = '../prompts/gov-tree/01-do/templates/province-master-data.json';
  var PROV_TMPL = '../prompts/gov-tree/01-do/templates/SP-PROVINCE-TEMPLATE_v1.1.md';
  var DEPT_JSON = '../prompts/gov-tree/02-do-dept/templates/do-dept-master-data.json';
  var DEPT_TMPL_BASE = '../prompts/gov-tree/02-do-dept/templates/';

  container.innerHTML = '시도 목록 불러오는 중…';
  kgovFetchJSON(PROV_JSON).then(function (data) {
    var provinces = data['도목록'];
    container.innerHTML = '';
    provinces.forEach(function (row) {
      kgovAgencyItem(container, row['도이름'], false, function (panel) {
        panel.innerHTML = '';
        var ownBtn = document.createElement('button');
        ownBtn.type = 'button';
        ownBtn.className = 'kgov-dept-btn kgov-dept-btn-own';
        ownBtn.textContent = row['도이름'] + ' 자체 SP 보기';
        ownBtn.addEventListener('click', function () {
          kgovShowLoading(row['도이름']);
          kgovFetchText(PROV_TMPL).then(function (tmpl) { kgovShow(row['도이름'] + ' — SP', kgovSubstitute(tmpl, row)); });
        });
        panel.appendChild(ownBtn);
        kgovFetchJSON(DEPT_JSON).then(function (dd) {
          var deptRows = dd['부서목록'].filter(function (r) { return r['도코드'] === row['도코드']; });
          if (!deptRows.length) {
            var note = document.createElement('div');
            note.className = 'kgov-note';
            note.textContent = '실·국 단위 부서 데이터는 아직 조사 전입니다.';
            panel.appendChild(note);
            return;
          }
          deptRows.forEach(function (row2) {
            var tmplFile = row2['template'];
            var notReady = tmplFile.indexOf('미작성') !== -1;
            var dbtn = document.createElement('button');
            dbtn.type = 'button';
            dbtn.className = 'kgov-dept-btn';
            dbtn.textContent = row2['부서명'] + (notReady ? ' (준비 중)' : '');
            if (notReady) dbtn.disabled = true;
            dbtn.addEventListener('click', function () {
              kgovShowLoading(row['도이름'] + ' · ' + row2['부서명']);
              kgovFetchText(DEPT_TMPL_BASE + tmplFile).then(function (tmpl) {
                kgovShow(row['도이름'] + ' · ' + row2['부서명'] + ' — SP', kgovSubstitute(tmpl, row2));
              });
            });
            panel.appendChild(dbtn);
          });
        });
      });
    });
  });
}

/* 공기업·공공기관: 사이트 정본 카탈로그(prompts/sp-catalog-categories.json)에서
   해당 폴더 하위 파일 목록만 가져오고, 이름·소관부처는 그 파일을 열어 그
   자리에서 읽는다 — 파일 자체가 유일한 출처이며 별도로 베껴 두지 않는다. */
function kgovFileCategory(container, folderPrefix) {
  var CATALOG_URL = '../prompts/sp-catalog-categories.json';
  container.innerHTML = '목록 불러오는 중…';
  kgovFetchJSON(CATALOG_URL).then(function (catalog) {
    var files = catalog.items.filter(function (it) { return it.file.indexOf(folderPrefix) === 0; });
    container.innerHTML = files.length + '개 기관의 이름을 불러오는 중… (처음 한 번만 시간이 걸립니다)';
    return Promise.all(files.map(function (f) {
      return kgovFetchText(kgovRawUrl(f.file)).then(function (text) {
        var meta = kgovParseHeader(text);
        return { name: meta.name || f.name, dept: meta.dept, file: f.file };
      }).catch(function () {
        return { name: f.name, dept: '기타', file: f.file };
      });
    }));
  }).then(function (items) {
    var groups = {};
    items.forEach(function (it) { (groups[it.dept] = groups[it.dept] || []).push(it); });
    var groupArr = Object.keys(groups).map(function (k) { return { dept: k, items: groups[k] }; });
    groupArr.sort(function (a, b) { return b.items.length - a.items.length; });

    container.innerHTML = '';
    var filterBox = document.createElement('input');
    filterBox.type = 'text';
    filterBox.placeholder = '기관 이름으로 찾기…';
    filterBox.className = 'kgov-filter-input';
    container.appendChild(filterBox);

    var listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function render(filterText) {
      listWrap.innerHTML = '';
      var q = (filterText || '').trim();
      groupArr.forEach(function (g) {
        var matched = q ? g.items.filter(function (it) { return it.name.indexOf(q) !== -1; }) : g.items;
        if (!matched.length) return;
        var wrap = document.createElement('div');
        wrap.className = 'kgov-group';
        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'kgov-group-head';
        head.innerHTML = '<span>' + kgovEsc(g.dept) + '</span><span class="kgov-group-count">' + matched.length + '개</span>';
        var body = document.createElement('div');
        body.className = 'kgov-group-body';
        body.hidden = !q;
        matched.forEach(function (it) {
          var a = document.createElement('a');
          a.href = '../pages/prompt-editor.html?file=' + encodeURIComponent(it.file);
          a.target = '_blank';
          a.rel = 'noopener';
          a.className = 'kgov-file-link';
          a.textContent = it.name;
          body.appendChild(a);
        });
        head.addEventListener('click', function () {
          body.hidden = !body.hidden;
          head.classList.toggle('open', !body.hidden);
        });
        wrap.appendChild(head);
        wrap.appendChild(body);
        listWrap.appendChild(wrap);
      });
    }
    render('');
    filterBox.addEventListener('input', function () { render(filterBox.value); });
  });
}

function kgovBuildApp(root) {
  if (!root || root.dataset.built) return;
  root.dataset.built = '1';
  root.innerHTML = '';

  var DIV_BASE = '../prompts/gov-tree/09-national/policy-bodies/divisions/';

  root.appendChild(kgovCategorySection('입법부', '국회 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'assembly-agency-division-master-data.json', DIV_BASE + 'SP-ASSEMBLY-AGENCYDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('사법부', '법원 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'judiciary-division-master-data.json', DIV_BASE + 'SP-JUDICIARY-ADMINDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('행정부', '대통령 직속·위원회·처·부·청', function (body) {
    body.appendChild(kgovCategorySection('대통령 직속', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'presidential-division-master-data.json', DIV_BASE + 'SP-PRESIDENTIAL-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('위원회', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'commission-division-master-data.json', DIV_BASE + 'SP-COMMISSION-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('처', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'bureau-division-master-data.json', DIV_BASE + 'SP-BUREAU-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('부·청', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'ministry-division-master-data.json', DIV_BASE + 'SP-MINISTRY-ADMINDIV-TEMPLATE_v1.0.md');
    }));
  }));

  root.appendChild(kgovCategorySection('지방자치단체', '광역시도', function (body) {
    kgovLocal(body);
  }));

  root.appendChild(kgovCategorySection('공기업', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/enterprises/');
  }));

  root.appendChild(kgovCategorySection('공공기관', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/other/');
  }));
}
function renderAll() { renderHeader(); renderTierTabs(); renderChapterTabs(); renderContent(); }
renderAll();
window.addEventListener('resize', renderTierTabs);
</script>
