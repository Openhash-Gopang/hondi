<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP의 계층 구조 — 나비</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/site-header.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f5f7fb;color:#0f172a;
    font-family:'Pretendard',-apple-system,'Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6}

  :root{
    --navy:     #0e1c3f;
    --blue:     #3b82f6;
    --blue-dk:  #1d4ed8;
    --blue-bg:  #eff6ff;
    --border:   #e2e8f0;
    --text:     #0f172a;
    --text2:    #475569;
    --text3:    #64748b;
    --text4:    #94a3b8;
    --surface:  #ffffff;
  }
  a{color:inherit}

  .sh-hero{background:var(--navy);color:#fff;padding:32px 24px 26px}
  .sh-hero-inner{max-width:1040px;margin:0 auto}
  .sh-hero h1{font-size:22px;font-weight:700;margin-bottom:8px}
  .sh-hero p{font-size:13.5px;color:#c9d6ee;line-height:1.7;max-width:720px}

  .sh-wrap{max-width:1040px;margin:0 auto;padding:22px 24px 80px}
  .sh-hint{font-size:12px;color:var(--text4);margin-bottom:16px}

  .sh-group{margin-bottom:26px}
  .sh-group-title{font-size:12.5px;font-weight:700;color:var(--text3);letter-spacing:.3px;
    margin-bottom:10px;text-transform:uppercase}

  /* ---- 트리 노드 공통 ---- */
  details.tree-node{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    margin-bottom:6px;overflow:hidden;
  }
  details.tree-node > summary{
    list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;
    gap:8px;font-size:13.5px;font-weight:600;color:var(--text);user-select:none;
  }
  details.tree-node > summary::-webkit-details-marker{display:none}
  details.tree-node > summary::before{
    content:'▶';font-size:9px;color:var(--text4);transition:transform .15s;flex-shrink:0;
  }
  details.tree-node[open] > summary::before{transform:rotate(90deg)}
  details.tree-node > summary .ico{flex-shrink:0}
  details.tree-node > summary .cnt{
    margin-left:auto;font-size:11px;font-weight:500;color:var(--text4);
    background:#f1f5f9;border-radius:6px;padding:2px 7px;flex-shrink:0;
  }
  details.tree-node > summary:hover{background:var(--blue-bg)}

  .tree-children{
    padding:4px 10px 10px 26px;border-top:1px solid var(--border);
  }
  .tree-children .tree-node{margin-left:0}

  /* 하위(2단계) 노드는 살짝 옅게 */
  .tree-children > details.tree-node{background:#fafbfd}

  .tree-leaflist{
    display:flex;flex-direction:column;gap:3px;max-height:360px;overflow-y:auto;
    padding:6px 2px;
  }
  .tree-leaf{
    display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;
    font-size:12.5px;color:var(--text2);text-decoration:none;transition:background .1s;
  }
  .tree-leaf:hover{background:var(--blue-bg);color:var(--blue-dk)}
  .tree-leaf .ico{flex-shrink:0;color:var(--text4);font-size:11px}
  .tree-leaf .badge{
    margin-left:auto;flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--text3);
    background:#f1f5f9;border-radius:5px;padding:2px 6px;white-space:nowrap;
  }
  .tree-leaf .badge.editable{color:var(--blue-dk);background:var(--blue-bg)}

  .sh-loading{text-align:center;padding:60px 20px;color:var(--text4);font-size:13.5px}

  .sh-illust-band{background:var(--surface);border-bottom:1px solid var(--border);padding:22px 24px}
  .sh-illust{max-width:1040px;margin:0 auto}
  .sh-illust svg{width:100%;height:auto;display:block}
  .sh-illust-cap{text-align:center;font-size:11.5px;color:var(--text4);margin-top:10px}  .sh-core-group{border:1px solid #fde68a}
  .sh-core-title{
    display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#92400e;
    letter-spacing:.3px;margin-bottom:10px;text-transform:uppercase;
  }
  .sh-core-tier{font-size:11px;font-weight:700;color:#a16207;background:#fffbeb;
    border-radius:6px;padding:2px 8px;margin:10px 0 6px;display:inline-block}
</style>
</head>
<body>

<div class="site-nav">
  <a class="site-nav-logo" href="../desktop.html">
    <img src="../icons/navi-icon-192.png" alt="나비">
    <span>나비</span>
  </a>
  <nav class="site-nav-links">
    <a href="prompts.html">프롬프트</a>
    <a class="active" href="sp-hierarchy.html">SP의 계층 구조</a>
    <a href="core-prompts.html">핵심 프롬프트</a>
    <a href="prompt-status.html">프롬프트 작성 상황</a>
  </nav>
</div>

<div class="sh-hero">
  <div class="sh-hero-inner">
    <h1>SP의 계층 구조</h1>
    <p>나비를 구성하는 모든 System Prompt가 어떤 분류 밑에 속해 있는지 트리로 볼 수 있습니다. 폴더(📁)를 눌러 펼치고, 맨 끝의 SP(📄)를 누르면 해당 내용을 바로 확인할 수 있습니다.</p>
  </div>
</div>

<div class="sh-illust-band">
  <div class="sh-illust">
    <svg viewBox="0 0 1040 260" xmlns="http://www.w3.org/2000/svg">
      <!-- 연결선: 루트 -> 7개 그룹(핵심 SP 포함) -->
      <g stroke="#93a3c4" stroke-width="1.4" fill="none">
        <path d="M506,50 V70 H80 V90"/>
        <path d="M506,50 V70 H222 V90"/>
        <path d="M506,50 V70 H364 V90"/>
        <path d="M506,50 V70 H506 V90"/>
        <path d="M506,50 V70 H648 V90"/>
        <path d="M506,50 V70 H790 V90"/>
        <path d="M506,50 V70 H932 V90"/>
      </g>
      <!-- 루트 -->
      <rect x="406" y="10" width="200" height="40" rx="9" fill="#0e1c3f"/>
      <text x="506" y="26" text-anchor="middle" fill="#93a3c4" font-size="9" font-family="Pretendard,sans-serif">나비 SP 전체</text>
      <text x="506" y="42" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700" font-family="Pretendard,sans-serif">2,011개</text>

      <!-- 7개 그룹(핵심 SP + 기존 6개) -->
      <g font-family="Pretendard,sans-serif">
        <rect x="15"  y="90" width="130" height="52" rx="8" fill="#fffbeb" stroke="#d97706"/>
        <text x="80" y="110" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">⭐ 핵심 SP</text>
        <text x="80" y="126" text-anchor="middle" fill="#a16207" font-size="9">14개(교차분류)</text>

        <rect x="157" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="222" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">정부기관 라우팅</text>
        <text x="222" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 12개</text>

        <rect x="299" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="364" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">민원·서비스</text>
        <text x="364" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 3개</text>

        <rect x="441" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="506" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">경제·산업</text>
        <text x="506" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 2개</text>

        <rect x="583" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="648" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">시스템</text>
        <text x="648" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 1개</text>

        <rect x="725" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="790" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">전문직 페르소나</text>
        <text x="790" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 60개</text>

        <rect x="867" y="90" width="130" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="932" y="110" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="700">K-서비스</text>
        <text x="932" y="126" text-anchor="middle" fill="#64748b" font-size="9">카테고리 20개</text>
      </g>

      <!-- 공통 하위 패턴(범례): 나머지 6개 그룹이 이 아래로 동일한 규칙을 따른다 -->
      <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,4" fill="none">
        <path d="M506,142 V165"/>
      </g>
      <text x="506" y="180" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="Pretendard,sans-serif">나머지 6개 그룹은 아래 패턴이 그대로 반복됩니다 (핵심 SP는 그 안에서 뽑아온 것)</text>

      <g font-family="Pretendard,sans-serif" stroke="#3b82f6" stroke-width="1.4" fill="none">
        <path d="M300,220 H340"/>
        <path d="M500,220 H540" stroke-dasharray="3,4"/>
        <path d="M700,220 H740"/>
      </g>
      <g font-family="Pretendard,sans-serif">
        <rect x="180" y="196" width="120" height="48" rx="8" fill="#fff" stroke="#3b82f6"/>
        <text x="240" y="215" text-anchor="middle" fill="#94a3b8" font-size="8.5">📁</text>
        <text x="240" y="230" text-anchor="middle" fill="#0e1c3f" font-size="10.5" font-weight="700">카테고리</text>

        <rect x="340" y="196" width="160" height="48" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="3,3"/>

        <text x="420" y="212" text-anchor="middle" fill="#94a3b8" font-size="8.5">📁 (있는 경우만)</text>
        <text x="420" y="230" text-anchor="middle" fill="#0e1c3f" font-size="10.5" font-weight="700">하위분류</text>

        <rect x="540" y="196" width="160" height="48" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="3,3"/>
        <text x="620" y="212" text-anchor="middle" fill="#94a3b8" font-size="8.5">📁 (있는 경우만)</text>
        <text x="620" y="230" text-anchor="middle" fill="#0e1c3f" font-size="10.5" font-weight="700">하위분류 2단계</text>

        <rect x="740" y="196" width="120" height="48" rx="8" fill="#0e1c3f"/>
        <text x="800" y="215" text-anchor="middle" fill="#93a3c4" font-size="8.5">📄</text>
        <text x="800" y="230" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">SP (파일)</text>
      </g>
    </svg>
    <div class="sh-illust-cap">전체 구조: 나비 SP 전체 → 7개 그룹(핵심 SP 포함) → 카테고리 → (있으면) 하위분류 → 실제 SP 순서로 접혀 있습니다</div>
  </div>

</div>

<div class="sh-wrap">
  <div class="sh-hint" id="shHint">불러오는 중…</div>
  <div id="shTree"></div>
</div>

<script>
  const CATALOG_URL = '../prompts/sp-catalog-categories.json';
  const LEAF_LIST_COLLAPSE_THRESHOLD = 25; // 이보다 많으면 스크롤 영역으로 표시

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function looksEditable(file){
    return /^prompts\/[^/]+\.(md|txt)$/.test(file) ||
           /^prompts\/gov-tree\//.test(file) ||
           /^온라인 민원 SP\//.test(file) ||
           /^klaw\/prompts\//.test(file);
  }
  function githubUrl(file){
    return 'https://github.com/Openhash-Gopang/gopang/blob/main/' + file.split('/').map(encodeURIComponent).join('/');
  }

  function leafLink(it){
    const editable = looksEditable(it.file);
    const href = editable
      ? `prompt-editor.html?file=${encodeURIComponent(it.file)}`
      : githubUrl(it.file);
    const target = editable ? '' : ' target="_blank" rel="noopener"';
    return `
      <a class="tree-leaf" href="${href}"${target}>
        <span class="ico">📄</span>
        <span>${esc(it.name)}</span>
        <span class="badge${editable ? ' editable' : ''}">${editable ? '조회·수정' : 'GitHub'}</span>
      </a>
    `;
  }

  function leafListHtml(items){
    if (!items.length) return '<div style="padding:10px;color:var(--text4);font-size:12px">항목 없음</div>';
    const inner = items.map(leafLink).join('');
    if (items.length > LEAF_LIST_COLLAPSE_THRESHOLD) {
      return `<div class="tree-leaflist">${inner}</div>`;
    }
    return `<div class="tree-leaflist" style="max-height:none;overflow:visible">${inner}</div>`;
  }

  function renderCategoryNode(cat, catById, itemsByCat) {
    if (cat.children) {
      const childrenHtml = cat.children.map(cid => {
        const child = catById[cid];
        const items = itemsByCat[cid] || [];
        return `
          <details class="tree-node">
            <summary><span class="ico">📁</span><span>${esc(child.label)}</span><span class="cnt">${child.count.toLocaleString()}</span></summary>
            <div class="tree-children">${leafListHtml(items)}</div>
          </details>
        `;
      }).join('');
      return `
        <details class="tree-node">
          <summary><span class="ico">📁</span><span>${esc(cat.label)}</span><span class="cnt">${cat.count.toLocaleString()}</span></summary>
          <div class="tree-children">${childrenHtml}</div>
        </details>
      `;
    }
    const items = itemsByCat[cat.id] || [];
    return `
      <details class="tree-node">
        <summary><span class="ico">📁</span><span>${esc(cat.label)}</span><span class="cnt">${cat.count.toLocaleString()}</span></summary>
        <div class="tree-children">${leafListHtml(items)}</div>
      </details>
    `;
  }

  function renderCoreGroup(manifest){
    const coreItems = manifest.items.filter(it => it.core_tier !== undefined && it.core_tier !== null);
    if (!coreItems.length) return '';

    const byTier = {};
    coreItems.forEach(it => { (byTier[it.core_tier] = byTier[it.core_tier] || []).push(it); });

    const tierDefs = (manifest.core_tiers || []).slice().sort((a, b) => a.tier - b.tier);
    const tiersHtml = tierDefs.map(td => {
      const items = byTier[td.tier];
      if (!items || !items.length) return '';
      return `
        <div class="sh-core-tier">${esc(td.label)}</div>
        <div class="tree-leaflist" style="max-height:none;overflow:visible">${items.map(leafLink).join('')}</div>
      `;
    }).join('');

    return `
      <div class="sh-group">
        <div class="sh-core-title">⭐ 핵심 SP <span style="font-weight:500;color:#a16207;text-transform:none;font-size:11px">(다른 그룹에도 있는 항목을 한데 모은 것 — "핵심 프롬프트" 탭 참고)</span></div>
        <details class="tree-node sh-core-group" open>
          <summary><span class="ico">⭐</span><span>핵심 SP 전체 보기</span><span class="cnt">${coreItems.length}</span></summary>
          <div class="tree-children">${tiersHtml}</div>
        </details>
      </div>
    `;
  }

  async function init(){
    try {
      const res = await fetch(CATALOG_URL);
      const manifest = await res.json();

      const catById = {};
      manifest.categories.forEach(c => { catById[c.id] = c; });

      const itemsByCat = {};
      manifest.items.forEach(it => {
        (itemsByCat[it.cat] = itemsByCat[it.cat] || []).push(it);
      });

      const topCats = manifest.categories.filter(c => !c.parent);
      const groupOrder = [];
      const byGroup = {};
      topCats.forEach(c => {
        if (!byGroup[c.group]) { byGroup[c.group] = []; groupOrder.push(c.group); }
        byGroup[c.group].push(c);
      });

      const html = renderCoreGroup(manifest) + groupOrder.map(group => `
        <div class="sh-group">
          <div class="sh-group-title">${esc(group)}</div>
          ${byGroup[group].map(c => renderCategoryNode(c, catById, itemsByCat)).join('')}
        </div>
      `).join('');

      $('shTree').innerHTML = html;
      $('shHint').textContent = `총 ${manifest.total.toLocaleString()}개 SP · ${topCats.length.toLocaleString()}개 최상위 분류`;
    } catch (e) {
      $('shHint').textContent = '';
      $('shTree').innerHTML = `<div class="sh-loading">계층 구조를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    }
  }

  init();
</script>

</body>
</html>
