<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롬프트(SP) 검색 — 혼디</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/ph-header.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f5f7fb;color:#0f172a;
    font-family:'Pretendard',-apple-system,'Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6}

  :root{
    --navy:     #0e1c3f;
    --navy-2:   #12234f;
    --pill:     #1a2e5c;
    --pill-hv:  #24356b;
    --blue:     #3b82f6;
    --blue-dk:  #1d4ed8;
    --blue-bg:  #eff6ff;
    --border:   #e2e8f0;
    --text:     #0f172a;
    --text2:    #475569;
    --text3:    #64748b;
    --text4:    #94a3b8;
    --surface:  #ffffff;
  }

  a{color:inherit}

  .pp-search-wrap{max-width:980px;margin:-20px auto 0;padding:0 24px;position:relative;z-index:2}
  .pp-search-box{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 8px 24px rgba(15,23,42,.10);padding:14px 16px;display:flex;gap:10px;align-items:center;
  }
  .pp-search-box svg{flex-shrink:0;color:var(--text4)}
  .pp-search-box input{
    flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--text);background:transparent;
  }
  .pp-search-box input::placeholder{color:var(--text4)}
  .pp-search-hint{font-size:11.5px;color:var(--text4);margin-top:8px;padding:0 4px}

  .pp-wrap{max-width:980px;margin:0 auto;padding:22px 24px 80px}

  .pp-groups{display:flex;flex-direction:column;gap:22px}
  .pp-group-title{font-size:12.5px;font-weight:700;color:var(--text3);letter-spacing:.3px;margin-bottom:10px;text-transform:uppercase}
  .pp-chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .pp-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--text2);transition:all .12s;user-select:none;
  }
  .pp-chip:hover{border-color:var(--blue);color:var(--blue-dk)}
  .pp-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .pp-chip .cnt{font-weight:500;color:var(--text4);font-size:11.5px}
  .pp-chip.active .cnt{color:#dbe8ff}

  .pp-shortcut-row{display:flex;flex-wrap:wrap;gap:8px}
  .pp-chip-shortcut{
    display:inline-flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--blue);border-left:4px solid var(--blue);border-radius:20px;
    padding:8px 16px 8px 13px;text-decoration:none;transition:all .12s;
  }
  .pp-chip-shortcut:hover{background:var(--blue-bg);box-shadow:0 2px 8px rgba(59,130,246,.18)}
  .pp-chip-shortcut .main{font-size:13px;font-weight:700;color:var(--blue-dk)}
  .pp-chip-shortcut .sub{font-size:11.5px;font-weight:500;color:var(--text3)}

  .pp-chip-core{
    display:inline-flex;align-items:center;gap:8px;background:#fffbeb;
    border:1px solid #d97706;border-radius:20px;padding:8px 16px;cursor:pointer;
    font-size:13px;font-weight:700;color:#92400e;transition:all .12s;user-select:none;
  }
  .pp-chip-core:hover{background:#fef3c7}
  .pp-chip-core .cnt{font-weight:500;color:#a16207;font-size:11.5px}
  .pp-tier-header{
    font-size:11px;font-weight:700;color:#a16207;background:#fffbeb;border:1px solid #fde68a;
    border-radius:6px;padding:4px 9px;margin:12px 0 6px;display:inline-block;
  }
  .pp-tier-header:first-child{margin-top:0}

  .pp-sub-row{display:none;flex-wrap:wrap;gap:6px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--border)}
  .pp-chip-sub{
    display:inline-flex;align-items:center;background:#f1f5f9;border:1px solid var(--border);
    border-radius:16px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;
    color:var(--text2);transition:all .12s;user-select:none;
  }
  .pp-chip-sub:hover{border-color:var(--blue);color:var(--blue-dk)}
  .pp-chip-sub.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .pp-select-hint{text-align:center;padding:30px 20px;color:var(--text4);font-size:13px}

  /* ---- slide panel (results) ---- */
  .pp-slide-panel{
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .22s ease, margin .32s cubic-bezier(.4,0,.2,1);
    margin-top:0;
  }
  .pp-slide-panel.open{ opacity:1; margin-top:14px; }
  .pp-slide-inner{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 16px 8px;
  }

  .pp-results-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
  .pp-results-head h2{font-size:14px;font-weight:700;color:var(--text)}
  .pp-results-head span{font-size:12px;color:var(--text4);white-space:nowrap}

  .pp-list{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .pp-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;text-decoration:none;transition:border-color .12s,background .12s;
  }
  .pp-item:hover{border-color:var(--blue);background:var(--blue-bg)}
  .pp-item-main{min-width:0}
  .pp-item-name{font-size:13.5px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pp-item-badge{
    flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--text3);background:#f1f5f9;
    border-radius:6px;padding:3px 8px;white-space:nowrap;
  }
  .pp-item-badge.editable{color:var(--blue-dk);background:var(--blue-bg)}
  .pp-more{text-align:center;font-size:12.5px;color:var(--text4);padding:14px 0 6px}

  .pp-empty{text-align:center;padding:36px 20px;color:var(--text4);font-size:13.5px}

  .pp-note{
    margin-top:18px;font-size:12px;color:var(--text3);background:#fffbeb;border:1px solid #fde68a;
    border-radius:10px;padding:12px 14px;line-height:1.7;
  }

  .pp-explainer{
    margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    border-radius:14px;padding:16px 18px;
  }
  .pp-explainer h2{font-size:14px;font-weight:700;color:#fff;margin-bottom:8px;
    display:flex;align-items:center;gap:7px}
  .pp-explainer h2 .badge{
    font-size:10.5px;font-weight:700;color:#0e1c3f;background:#fff;border-radius:5px;padding:2px 6px;
  }
  .pp-explainer p{font-size:13px;color:#dbe4f5;line-height:1.75;max-width:760px}
  .pp-explainer p + p{margin-top:8px}
  .pp-explainer b{color:#fff}
</style>
</head>
<body>

<script>
window.PAGE_HEADER = {
  active: 'prompts',
  h1: '프롬프트(System Prompt) 검색',
  sub: '혼디를 구성하는 System Prompt를 종류별로 찾아볼 수 있습니다. 소속 기관·부서·직업 이름으로 검색해 자신의 SP를 찾은 뒤, 내용을 확인하고(관리자 권한이 있으면) 수정 요청(PR)을 보낼 수 있습니다.',
  extraHtml: `
    <div class="pp-explainer">
      <h2><span class="badge">알기 쉽게</span> 프롬프트(SP)가 뭔가요?</h2>
      <p>혼디는 하나의 AI가 모든 일을 처리하는 게 아니라, <b>업무마다 담당 AI가 따로</b> 있는 구조입니다. 제주도청 복지 상담을 맡는 AI, 의사 페르소나로 답하는 AI, 세무 신고를 도와주는 AI가 전부 다릅니다.</p>
      <p>프롬프트(System Prompt, 줄여서 <b>SP</b>)는 이 담당 AI 한 명 한 명에게 미리 쥐어주는 <b>업무 매뉴얼</b>이라고 생각하시면 됩니다. "이 업무를 맡을 때는 이런 규정을 지키고, 이런 순서로 안내하라"는 내용이 적혀 있습니다. 사람으로 치면 신입 직원에게 주는 업무 지침서와 비슷합니다.</p>
      <p>이 페이지에서 검색되는 건 바로 그 매뉴얼입니다 — 소속 기관·부서·직업 이름으로 찾으면, <b>내 업무를 담당하는 AI가 어떤 지침을 따르고 있는지</b> 직접 확인할 수 있습니다.</p>
    </div>
  `,
  subnav: [
    { label: '프롬프트', href: 'prompts.html', active: true },
    { label: 'SP의 계층 구조', href: 'sp-hierarchy.html' },
    { label: '핵심 프롬프트', href: 'core-prompts.html' },
    { label: '프롬프트 작성 상황', href: 'prompt-status.html' }
  ]
};
</script>
<script src="/assets/ph-header.js"></script>

<div class="pp-search-wrap" id="ppSearchAnchor">
  <div class="pp-search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="ppSearch" type="text" placeholder="기관·부서·직업·파일명으로 검색 (예: 제주도청, 세무, 변호사, 한림읍)" autocomplete="off">
  </div>
  <div class="pp-search-hint" id="ppHint">불러오는 중…</div>
</div>

<div class="pp-wrap">

  <div class="pp-group">
    <div class="pp-group-title">바로가기</div>
    <div class="pp-shortcut-row">
      <a class="pp-chip-shortcut" href="prompt-editor.html?file=prompts%2FAC-PRO-CORE_v1_7.txt">
        <span class="main">사용자</span><span class="sub">· AI 비서(AC) 본체 SP</span>
      </a>
      <a class="pp-chip-shortcut" href="prompt-editor.html?file=prompts%2Fhondi_visitor_sp_v1_2.txt">
        <span class="main">혼디</span><span class="sub">· 방문자 기본 SP("물어보세요")</span>
      </a>
    </div>
  </div>

  <div class="pp-group">
    <div class="pp-group-title">핵심 SP</div>
    <div class="pp-chip-row">
      <div class="pp-chip-core" data-topcat="__core__">
        <span>⭐ 핵심 SP 전체 보기</span><span class="cnt" id="ppCoreCount"></span>
      </div>
    </div>
  </div>

  <div class="pp-groups" id="ppGroups"></div>

  <div class="pp-note">
    조회는 누구나 가능합니다. 수정은 관리자 로그인 후 GitHub Pull Request로 생성되며, 검토·머지 전까지는 실제 서비스에 반영되지 않습니다. 일부 오래된 SP 파일은 아직 조회 전용 시스템에 등록되지 않았을 수 있습니다 — 그런 경우 "GitHub에서 보기" 링크를 이용해 주세요.
  </div>

</div>

<script>
  const CATALOG_URL = '../prompts/sp-catalog-categories.json';
  const MAX_RENDER = 200;

  let MANIFEST = null;
  let CAT_BY_ID = {};
  let activeKey = null;     // 패널이 현재 붙어 있는 최상위 트리거: 'search' | <topCatId> | null
  let activeLeaf = null;    // 실제 목록을 채우는 leaf 카테고리 id (하위분류가 없으면 activeKey와 동일)

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // 현재 prompt-editor.html(및 백엔드 /prompt, /admin/prompt)이 열람 가능한
  // 경로인지 대략적으로 표시만 해 주는 용도 — 실제 허용 여부는 백엔드가 최종 판단.
  function looksEditable(file){
    return /^prompts\/[^/]+\.(md|txt)$/.test(file) ||
           /^prompts\/gov-tree\//.test(file) ||
           /^온라인 민원 SP\//.test(file) ||
           /^klaw\/prompts\//.test(file);
  }

  function githubUrl(file){
    return 'https://github.com/Openhash-Gopang/gopang/blob/main/' + file.split('/').map(encodeURIComponent).join('/');
  }

  // ---- 슬라이드 패널: 하나의 노드를 트리거 위치로 옮겨가며 재사용한다 ----
  const panelEl = document.createElement('div');
  panelEl.className = 'pp-slide-panel';
  panelEl.id = 'ppPanel';
  panelEl.innerHTML = `
    <div class="pp-slide-inner">
      <div class="pp-sub-row" id="ppSubRow"></div>
      <div class="pp-results-head">
        <h2 id="ppResultsTitle">검색 결과</h2>
        <span id="ppResultsCount"></span>
      </div>
      <div class="pp-list" id="ppList"></div>
      <div class="pp-more" id="ppMore" style="display:none"></div>
    </div>
  `;

  function panelInnerEl(){ return panelEl.querySelector('.pp-slide-inner'); }

  function setPanelHeight(){
    // 콘텐츠가 바뀌었을 때도 부드럽게 높이를 맞춰준다.
    if (panelEl.classList.contains('open')) {
      panelEl.style.maxHeight = panelInnerEl().scrollHeight + 'px';
    }
  }

  function slideOpenAt(anchorEl){
    anchorEl.insertAdjacentElement('afterend', panelEl);
    renderResultsContent();
    panelEl.style.maxHeight = '0px';
    panelEl.classList.add('open');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        panelEl.style.maxHeight = panelInnerEl().scrollHeight + 'px';
      });
    });
  }

  function slideClose(onDone){
    if (!panelEl.classList.contains('open')) { if (onDone) onDone(); return; }
    panelEl.style.maxHeight = panelInnerEl().scrollHeight + 'px';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        panelEl.classList.remove('open');
        panelEl.style.maxHeight = '0px';
      });
    });
    setTimeout(() => { if (onDone) onDone(); }, 340);
  }

  function moveOrOpen(anchorEl, key){
    if (activeKey === key && panelEl.classList.contains('open')) {
      slideClose();
      activeKey = null;
      activeLeaf = null;
      return;
    }
    const reopen = () => { slideOpenAt(anchorEl); activeKey = key; };
    if (activeKey !== null) {
      slideClose(reopen);
    } else {
      reopen();
    }
  }

  function closeAll(){
    if (activeKey !== null) {
      slideClose();
      activeKey = null;
      activeLeaf = null;
    }
  }

  function clearTopChipHighlight(){
    document.querySelectorAll('[data-topcat]').forEach(c => c.classList.remove('active'));
  }

  function wireTopChipClick(el, topId){
    el.addEventListener('click', () => {
      const turningOn = activeKey !== topId;

      clearTopChipHighlight();
      if (!turningOn) {
        closeAll();
        return;
      }
      el.classList.add('active');
      $('ppSearch').value = ''; // 카테고리 선택 시 검색어는 초기화(검색과 분류는 서로 다른 모드)

      if (topId === '__core__') {
        activeLeaf = null;
      } else {
        const cat = CAT_BY_ID[topId];
        activeLeaf = cat.children ? null : topId;
      }

      const row = el.closest('.pp-group').querySelector('.pp-chip-row');
      moveOrOpen(row, topId);
    });
  }

  function renderGroups(){
    const topCats = MANIFEST.categories.filter(c => !c.parent);
    const byGroup = {};
    topCats.forEach(c => { (byGroup[c.group] = byGroup[c.group] || []).push(c); });

    const html = Object.entries(byGroup).map(([group, cats]) => `
      <div class="pp-group">
        <div class="pp-group-title">${esc(group)}</div>
        <div class="pp-chip-row">
          ${cats.map(c => `
            <div class="pp-chip" data-topcat="${esc(c.id)}">
              <span>${esc(c.label)}</span><span class="cnt">${c.count.toLocaleString()}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    $('ppGroups').innerHTML = html;

    $('ppGroups').querySelectorAll('.pp-chip[data-topcat]').forEach(el => {
      wireTopChipClick(el, el.getAttribute('data-topcat'));
    });
  }

  function itemRow(it){
    const editable = looksEditable(it.file);
    const href = editable
      ? `prompt-editor.html?file=${encodeURIComponent(it.file)}`
      : githubUrl(it.file);
    const target = editable ? '' : ' target="_blank" rel="noopener"';
    return `
      <a class="pp-item" href="${href}"${target}>
        <div class="pp-item-main">
          <div class="pp-item-name">${esc(it.name)}</div>
        </div>
        <div class="pp-item-badge${editable ? ' editable' : ''}">${editable ? '조회·수정' : 'GitHub에서 보기'}</div>
      </a>
    `;
  }

  function renderItemList(items){
    if (!items.length) {
      $('ppList').innerHTML = '<div class="pp-empty">일치하는 SP가 없습니다. 검색어를 바꾸거나 카테고리를 다시 선택해 보세요.</div>';
      $('ppMore').style.display = 'none';
      $('ppResultsCount').textContent = '0건';
      return;
    }
    const shown = items.slice(0, MAX_RENDER);
    $('ppList').innerHTML = shown.map(itemRow).join('');
    $('ppResultsCount').textContent = `${items.length.toLocaleString()}건`;
    if (items.length > MAX_RENDER) {
      $('ppMore').style.display = 'block';
      $('ppMore').textContent = `${(items.length - MAX_RENDER).toLocaleString()}건 더 있습니다 — 검색어를 좁혀 주세요.`;
    } else {
      $('ppMore').style.display = 'none';
    }
  }

  function childShortLabel(childLabel){
    const parts = childLabel.split(' · ');
    return parts.length > 1 ? parts[1] : childLabel;
  }

  function renderChildRow(cat){
    const sub = $('ppSubRow');
    sub.style.display = 'flex';
    sub.innerHTML = cat.children.map(cid => {
      const c = CAT_BY_ID[cid];
      const active = activeLeaf === cid ? ' active' : '';
      return `<div class="pp-chip-sub${active}" data-leaf="${esc(cid)}">${esc(childShortLabel(c.label))}</div>`;
    }).join('');
    sub.querySelectorAll('.pp-chip-sub').forEach(el => {
      el.addEventListener('click', () => {
        const leaf = el.getAttribute('data-leaf');
        activeLeaf = (activeLeaf === leaf) ? null : leaf;
        renderResultsContent();
        setPanelHeight();
      });
    });
  }

  function hideChildRow(){
    $('ppSubRow').style.display = 'none';
    $('ppSubRow').innerHTML = '';
  }

  function renderCoreItemList(){
    const coreItems = MANIFEST.items.filter(it => it.core_tier !== undefined && it.core_tier !== null);
    $('ppResultsTitle').textContent = '핵심 SP';
    $('ppResultsCount').textContent = `${coreItems.length.toLocaleString()}건`;
    if (!coreItems.length) {
      $('ppList').innerHTML = '<div class="pp-empty">핵심 SP로 태그된 항목이 없습니다.</div>';
      $('ppMore').style.display = 'none';
      return;
    }
    const byTier = {};
    coreItems.forEach(it => { (byTier[it.core_tier] = byTier[it.core_tier] || []).push(it); });
    const tierDefs = (MANIFEST.core_tiers || []).slice().sort((a, b) => a.tier - b.tier);
    $('ppList').innerHTML = tierDefs.map(td => {
      const items = byTier[td.tier];
      if (!items || !items.length) return '';
      return `<div class="pp-tier-header">${esc(td.label)}</div>` + items.map(itemRow).join('');
    }).join('');
    $('ppMore').style.display = 'none';
  }

  function renderResultsContent(){
    if (activeKey === 'search') {
      hideChildRow();
      const q = $('ppSearch').value.trim().toLowerCase();
      const items = MANIFEST.items.filter(it =>
        it.name.toLowerCase().includes(q) ||
        it.file.toLowerCase().includes(q) ||
        (it.region && it.region.toLowerCase().includes(q))
      );
      $('ppResultsTitle').textContent = '검색 결과';
      renderItemList(items);
      return;
    }

    if (activeKey === '__core__') {
      hideChildRow();
      renderCoreItemList();
      return;
    }

    const cat = CAT_BY_ID[activeKey];
    if (!cat) return;

    if (cat.children) {
      renderChildRow(cat);
      if (activeLeaf) {
        const leafCat = CAT_BY_ID[activeLeaf];
        $('ppResultsTitle').textContent = `"${leafCat.label}" 검색 결과`;
        renderItemList(MANIFEST.items.filter(it => it.cat === activeLeaf));
      } else {
        $('ppResultsTitle').textContent = `"${cat.label}" 하위 분류`;
        $('ppList').innerHTML = '<div class="pp-select-hint">위에서 세부 분야를 선택하세요.</div>';
        $('ppResultsCount').textContent = `${cat.count.toLocaleString()}건`;
        $('ppMore').style.display = 'none';
      }
      return;
    }

    hideChildRow();
    $('ppResultsTitle').textContent = `"${cat.label}" 검색 결과`;
    renderItemList(MANIFEST.items.filter(it => it.cat === activeKey));
  }

  function onSearchInput(){
    const q = $('ppSearch').value.trim();

    if (!q) {
      if (activeKey === 'search') closeAll();
      return;
    }

    if (activeKey === 'search') {
      renderResultsContent();
      setPanelHeight();
      return;
    }

    // 검색어 입력 시 선택돼 있던 카테고리는 해제하고 전역 검색으로 전환
    clearTopChipHighlight();
    activeLeaf = null;
    moveOrOpen($('ppSearchAnchor'), 'search');
  }

  async function init(){
    try {
      const res = await fetch(CATALOG_URL);
      MANIFEST = await res.json();
      MANIFEST.categories.forEach(c => { CAT_BY_ID[c.id] = c; });
      $('ppHint').textContent = `총 ${MANIFEST.total.toLocaleString()}개 SP · 카테고리를 선택하거나 검색어를 입력하세요`;
      renderGroups();

      const coreCount = MANIFEST.items.filter(it => it.core_tier !== undefined && it.core_tier !== null).length;
      $('ppCoreCount').textContent = coreCount.toLocaleString();
      document.querySelectorAll('.pp-chip-core[data-topcat]').forEach(el => {
        wireTopChipClick(el, el.getAttribute('data-topcat'));
      });
    } catch (e) {
      $('ppHint').textContent = '카탈로그를 불러오지 못했습니다: ' + e.message;
    }
  }

  $('ppSearch').addEventListener('input', onSearchInput);
  init();
</script>

</body>
</html>
