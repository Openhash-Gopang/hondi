<title>전국 지방행정 AI</title>
<meta name="description" content="광역시도청·시군구청·읍면동사무소 행정 안내 — hondi.net 같은 오리진, 별도 로그인 불필요.">

<!--
  2026-07-22 신설 — 사용자 지시("hondi.net/jeju, hondi.net/seoul 형식으로
  탭 전환 시 별도 인증이 불필요하게 하십시오").

  왜 이 파일이 필요했는가: kregionalgov(전국 지방행정 AI)는 그동안
  jeju.hondi.net이라는 "별도 서브도메인"에서 서빙됐다. 브라우저 입장에서
  hondi.net과 jeju.hondi.net은 완전히 다른 출처(origin)라, 지갑
  개인키(hondi.net의 localStorage/IndexedDB)를 직접 못 읽고 매번
  postMessage로 "서명해줘" 왕복을 해야 했다 — 오늘 하루 종일 씨름한
  SSO 타이밍/팝업차단/opener 문제 전부가 여기서 비롯됐다.

  이 페이지는 hondi.net "안"에 있으므로(같은 오리진), 지갑을 그냥
  localStorage에서 직접 읽는다 — subsystem-auth.js도, gopang-sso.js의
  opener 왕복도, 서명 요청도 전혀 필요 없다. pages/expert-chat.html이
  이미 정확히 이 패턴(같은 오리진 → 직접 읽기)으로 동작하고 있어
  그 구조를 그대로 따른다.

  라우팅 로직(어느 광역시도·시군구·읍면동인지 판별해 SP를 조립하는
  부분)은 이미 전국 대응으로 일반화된 src/gopang/gov/gov-router.js를
  그대로 가져다 쓴다 — 이 파일은 새 라우팅 로직을 만들지 않고, 그
  로직을 "제주 전용 도메인이 아니라 hondi.net 자체 안에서" 실행하는
  얇은 셸(shell)일 뿐이다. AI 실제 호출(/gov/relay)도 jeju.hondi.net이
  쓰던 것과 동일한, 오리진과 무관한 공용 워커 엔드포인트를 그대로
  재사용한다.

  ★ 2026-07-22 리팩터링 — UI(헤더/말풍선/입력창/첨부/카메라/마이크)를
  더 이상 이 파일이 직접 그리지 않는다. pages/expert-chat.html·
  pages/profile-assistant.html과 완전히 동일한 UI 코드가 3번 복사돼
  있던 걸 발견해서, /assets/chat-shell.css + src/gopang/ui/chat-shell.js
  공용 모듈로 뽑았다(사용자 지시: "모든 SP 및 AC가 하나의 대화창
  레이아웃을 공유"). 이 파일은 이제 정말로 라우팅+AI 호출 로직만
  남아 있다.

  ★ 2026-08-09 갱신 — 위치(현재 위치) 부분은 이제 연결했다. 메인 AI
  비서가 GWP로 이 탭을 열 때 URL facts로 건네준 위치가 없으면(북마크·
  직접 접속·새로고침), services/location.js의 _scheduleLocation()을 이
  페이지 스스로도 걸어 GPS→Kakao 역지오코딩 순으로 현재 위치를 확보하고,
  _callAI가 매 턴 _resolveLocationHint()로 최신 값을 다시 읽어
  assembleGovSystemPrompt()의 pdvLocationHint 인자로 넘긴다 — 발화 자체에
  지명이 없어도("우리 동네 세무서 어디예요") gov-router.js의 시/군 분기가
  이 힌트로 좁힐 수 있다.

  아직 옮기지 않은 것: 프로필에 저장된 "주소"(PDV) 우선 조회는
  window.gopangWallet(서명)이 있어야 동작하는데, 이 페이지는 지갑
  부트스트랩을 하지 않는다 — 지갑이 없으면 location.js가 그 단계만
  조용히 건너뛰고 GPS로 폴백한다(거짓으로 있는 척하지 않음, 그냥 GPS
  기반 현재 위치만 쓰임). 지갑 부트스트랩까지 이 페이지에서 하는 건
  더 큰 범위(로그인 온보딩 흐름 전체)라 여전히 후속 작업으로 분리한다.
  jeju.hondi.net의 PDV_REQUEST/PDV_RESPONSE 교차 오리진 중개 로직(§13,
  이력 등 위치 아닌 다른 PDV 필드용)도 마찬가지로 아직 안 옮겼다 —
  그런 질문에는 여전히 "그 정보는 지금 조회할 수 없습니다, 직접
  말씀해 주시겠어요" 폴백만 있다.
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<!-- 2026-07-23 — 입력창(첨부/카메라/마이크/전송)은 chat-shell.js 대신
     공용 chat-input.js 모듈이 담당한다(옵션 B, webapp.html과 동일 모듈
     공유). chat-shell.css/chat-shell.js는 상단바·말풍선에만 계속 쓰인다. -->
<link rel="stylesheet" href="/assets/chat-input.css">

  --gov:#06C755; --pri:#06C755; --pri-bg:#E9FBF0;

<body>

<div id="err-banner"></div>
<div id="chat-thread"></div>

<div id="bottom-dock">
  <div id="chat-input-slot"></div>
</div>

<script type="module">
import { assembleGovSystemPrompt, resolveGovAgency, resolveProvinceCode, resolveAgencyDisplayName,
         resolveHandlerCodeFromTrace, findStaffContact }
  from '/src/gopang/gov/gov-router.js';
import { escHtml, appendBubble, appendTyping }
  from '/src/gopang/ui/chat-shell.js';
import { mountChatInput, THEME_LINE_GREEN } from '/src/gopang/ui/chat-input.js';
// ★ 2026-08-13 신설 — GOV_TASK_SCHEMA_LOOKUP/DRAFT_REQUEST/SUBMIT_REQUEST
// 태그 처리(사고실험으로 발견: 이 페이지엔 지금까지 이 처리가 전혀 없어
// kgov가 이 태그들을 내도 화면에 브라켓 원문이 그대로 노출되거나 무시된
// 채 끝났다). call-ai.js가 이미 가진 파서·핸들러(_handleGovTaskTags)를
// 새로 만들지 않고 그대로 재사용한다 — sendFn만 이 페이지의 비-스트리밍
// 구조에 맞게 새로 만든다(아래 _callAI 내부 참고).
import { _handleGovTaskTags } from '/src/gopang/ai/call-ai.js';
// ★ 2026-08-09 신설(주피터 지시 — "사용자의 AI 비서(AC)는 사용자의 발화를
// 분석하고, 필요하면 사용자의 현재 위치와 주소지 데이터를 라우팅 모듈에
// 전달해야 합니다") — 이 페이지 파일 상단 주석(§13 대체 관련)이 이미
// "PDV를 직접 읽는 경로는 후속 작업으로 미뤘다"고 정직하게 적어뒀던 바로
// 그 공백을 메운다. 지금까지는 메인 AI 비서가 GWP로 이 탭을 열 때 URL의
// facts 파라미터로 미리 계산해 건네준 위치(_urlFactsLocation)에만
// 의존했다 — 즉 이 탭을 북마크·직접 접속·새로고침으로 열면(facts 파라미터
// 없음) 위치 힌트가 영원히 null이라 gov-router.js의 시/군 분기(2026-08-09
// PR #282)조차 발화에 지명이 없으면 전혀 못 써먹었다.
// services/location.js는 이미 GPS→Kakao 역지오코딩→프로필 주소 순으로
// 위치를 스스로 확보하는 로직을 갖고 있다(gopang-app.js가 메인 앱 셸에서
// 쓰는 것과 동일 모듈) — 이 페이지도 같은 오리진이므로 그대로 재사용한다.
// PROFILE 주소 우선 조회는 window.gopangWallet(서명)이 필요한데 이 페이지는
// 지갑 부트스트랩을 안 하므로, 지갑이 없으면 그 단계만 조용히 건너뛰고
// GPS로 자연스럽게 폴백한다(location.js 자체 catch 처리, 별도 대응 불필요) —
// 지갑까지 여기서 초기화하는 건 더 큰 범위(로그인 온보딩 흐름)라 이번에도
// 분리해 후속 과제로 남긴다.
import { _scheduleLocation, _buildRoutingFacts, _waitForLocationReady } from '/src/gopang/services/location.js';

const PROXY = 'https://hondi-proxy.tensor-city.workers.dev';

// ── 실국/시청/기관/과·팀 LLM 분류 폴백 (2026-08-02 신설) ───────────────
// gov-router.js의 _classifyFallback/_classifyDivisionFallback이 기대하는
// 계약: async (text, candidatesText) => 'CODE' | 'NONE' | null.
// v1.2(§0 국가기관 지연초기화 도입 시점)에 이 폴백 메커니즘 자체는
// 만들어졌지만, 실제 호출부(이 파일)에서 지금까지 쭉 classifyFn 자리에
// null을 넘겨왔다 — 즉 동점/미분류 발화에서 LLM이 대신 판단해주는
// 경로가 배선만 되고 한 번도 실제로 켜진 적이 없었다(2026-08-02
// division 2단계 라우팅 추가하며 재검토 중 발견). 여기서 처음 켠다.
// 저지연/저비용이 중요하므로 gov-flash 등급, JSON 강제 없이 코드 한
// 줄만 요구 — 실패해도 null 반환(호출부가 이미 "확정 못하면 안전하게
// 상위 계층으로 폴백"하도록 설계돼 있어 이 함수는 절대 throw하지 않는다).
async function _govClassifyFn(text, candidatesText) {
  try {
    const r = await fetch(`${PROXY}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'deepseek-v4-flash', max_tokens: 30, temperature: 0,
        messages: [
          { role: 'system', content:
            '아래는 제주 지방행정 라우팅 코드 후보 목록이다. 사용자 발화를 읽고 ' +
            '가장 알맞은 코드 하나만 답하라. 확신이 없거나 해당하는 코드가 없으면 ' +
            'NONE이라고만 답하라. 후보 중 2개가 똑같이 그럴듯해서 하나로 못 고르겠으면 ' +
            '"CLARIFY:코드1,코드2" 형식으로만 답하라(콤마로 구분, 공백 없이, 정확히 2개만). ' +
            '다른 설명·문장부호 없이 코드, NONE, 또는 CLARIFY:... 중 하나만 출력한다.\n\n' +
            candidatesText },
          { role: 'user', content: text },
        ],
      }),
    });
    if (!r.ok) return null;
    const d = await r.json();
    const raw = (d.choices?.[0]?.message?.content || '').trim();
    // ★ 2026-08-21 수정(사용자 지시 — 설계 공백 해소: "애매하면 되묻기") —
    // CLARIFY:코드1,코드2 형식은 접두어까지 그대로 보존해서 반환해야
    // gov-router.js의 _parseClarifySignal()이 인식한다. 기존 정규식은
    // 코드 형식(SP-XXX-YYY)만 뽑아서 CLARIFY: 접두어가 잘려나갔었다.
    if (raw.startsWith('CLARIFY:')) {
      const codes = raw.slice(8).match(/[A-Z0-9][A-Z0-9-]*/g) || [];
      return codes.length >= 2 ? `CLARIFY:${codes[0]},${codes[1]}` : null;
    }
    // 코드 형식(SP-XXX-YYY 등)만 추출 — 모델이 마침표/따옴표를 덧붙이는
    // 경우가 있어 그대로 비교하면 놓친다.
    const m = raw.match(/[A-Z0-9][A-Z0-9-]*/);
    return m ? m[0] : (raw === 'NONE' ? 'NONE' : null);
  } catch (e) {
    console.warn('[RegionalGov] LLM 분류 폴백 실패(무시 — 상위 계층으로 폴백):', e.message);
    return null;
  }
}


// ── GWP 파라미터 파싱 — 다른 GWP 페이지들과 동일 규약 ──────────────
const _qs     = new URLSearchParams(location.search);
let   GWP_CTX = '';
if (_qs.get('ctx')) {
  try {
    GWP_CTX = (_qs.get('ctx_enc') === 'b64')
      ? decodeURIComponent(escape(atob(_qs.get('ctx'))))
      : decodeURIComponent(_qs.get('ctx'));
  } catch (e) { GWP_CTX = ''; }
}

// ── 같은 오리진 직접 읽기 — SSO 왕복 전혀 불필요 ───────────────────
function _loadUser() {
  try { return JSON.parse(localStorage.getItem('gopang_user_v4') || 'null'); }
  catch { return null; }
}

// ── 대화 상태 ──────────────────────────────────────────────────
let messages = [];
let _lastAgency = 'gov_do';
// 2026-08-13 신설 — 자율 과금 제안 시스템 배선. GOV_TASK_SCHEMA_LOOKUP/
// DRAFT_REQUEST/SUBMIT_REQUEST 태그에서 처음 드러난 task_key를 대화가
// 끝날 때까지 기억해뒀다가 이후 모든 /gov/relay 호출에 실어 보낸다.
// task_key가 드러나는 그 턴 자체는 이미 과금이 끝난 뒤라 반영 못 하고
// 다음 턴부터 반영된다 — 표본 50건 단위 판단엔 무의미한 오차.
let _lastTaskKey = null;
let _taskRoundtrips = 0;
function _extractTaskKeyFromReply(replyText) {
  const m = replyText.match(/\[GOV_TASK_(?:SCHEMA_LOOKUP|DRAFT_REQUEST|SUBMIT_REQUEST)\]([\s\S]*?)\[\/GOV_TASK_/);
  if (!m) return null;
  try {
    const payload = JSON.parse(m[1].trim());
    return payload.task_key ? `${payload.agency || _lastAgency}:${payload.task_key}` : null;
  } catch (e) { return null; }
}

// 2026-08-14 신설(주피터 지시), 같은 날 서버로 이관 — flash↔pro 판단을
// 처음엔 브라우저에서 _resolveHondiTier()를 재사용해 했으나(중복 로직
// 안 만드는 원칙), 곧바로 "브라우저 판단은 순수함수 단위테스트가 안
// 된다"는 문제(window 의존 모듈이라 Node에서 import 불가)가 드러나
// 서버(worker.js callDeepSeek/handleGovRelay의 _resolveServerTier)로
// 옮겼다 — 서버는 이미 messages를 받고 있어 클라이언트 계산이 아예
// 필요 없었다. 여기 있던 _resolveGovTier() 클라이언트 계산·전달은
// 그래서 제거— 서버가 tier 필드를 더 이상 신뢰하지 않고 스스로
// 재계산하므로 안 보내도 무방하다(_govRelayCompletion의 tier 인자는
// 하위호환으로 남겨뒀지만 항상 undefined로 호출됨).

// 2026-07-23 — 페이지 자체 헤더(구 #top-bar, 초록)를 삭제했다. 이
// 웹뷰를 감싸는 상위 크롬(제목표시줄)이 이미 있어 헤더가 두 겹으로
// 겹쳐 보이는 문제가 실사로 지적됨 — 상위 크롬 하나만 남기고, 그
// document.title을 실제 호출된 기관명으로 갱신하는 쪽으로 통일한다
// (아래 _callAI 안 document.title 갱신부 참고). "고팡으로" 버튼도
// 함께 없앴다 — 상위 크롬 자체의 닫기 버튼이 새 탭을 닫고 원래
// AI 비서 탭으로 돌아가는 동일한 역할을 한다.

// 2026-07-23 — 입력창(첨부·카메라·마이크·전송)은 공용 chat-input.js가
// 담당한다(webapp.html과 동일 모듈 공유, 옵션 B). 이 페이지는 기존
// _callAI 로직만 그대로 두고 onSend 콜백으로 연결한다. 스트리밍 중단
// 기능은 이 페이지에 아직 없어 allowStop:false — 원본(chat-shell.js
// 시절)에도 없던 기능이라 새로 생기는 것도 아니다.
const ci = mountChatInput(document.getElementById('chat-input-slot'), {
  theme: THEME_LINE_GREEN,
  placeholder: '메시지를 입력하세요…',
  fileAccept: 'image/*',
  multiple: false,
  allowStop: false,
  onSend: async (text, files) => {
    const imageFile = files.find(f => f.isImage);
    let userMsg;
    if (imageFile) {
      userMsg = {
        role: 'user',
        content: [
          ...(text ? [{ type: 'text', text }] : []),
          { type: 'image_url', image_url: { url: imageFile.dataUrl } },
        ],
      };
      appendBubble('user',
        (text ? escHtml(text) + '<br>' : '') +
        `<img src="${imageFile.dataUrl}" style="max-width:180px;max-height:160px;border-radius:8px;display:block;margin-top:4px">`
      );
    } else {
      userMsg = { role: 'user', content: text };
      appendBubble('user', escHtml(text));
    }
    messages.push(userMsg);

    const typing = appendTyping('지역 행정 정보를 확인하고 있습니다');
    try {
      const reply = await _callAI(text, typing);
      typing.remove();
      appendBubble('ai', escHtml(reply).replace(/\n/g, '<br>'));
      // 2026-08-13 변경 — messages.push(assistant)를 여기서 하지 않는다.
      // _callAI 내부에 GOV_TASK 태그 처리 루프가 생기면서, 태그가 여러
      // 차례 오간 경우 중간 턴들도 messages에 반드시 남아야 모델이 문맥을
      // 잃지 않는다(§아래 _callAI 주석 참고) — 그 중간 턴 관리와 최종 턴
      // 관리를 한 곳(_callAI)에서 일관되게 하기 위해 최종 push 책임도
      // 그쪽으로 옮겼다. 여기서 또 push하면 마지막 턴이 중복 저장된다.
    } catch (e) {
      typing.remove();
      appendBubble('ai', `⚠️ 오류가 발생했습니다: ${escHtml(e.message)}`);
    }
  },
});

// ── Fix ④ (2026-07-25) — [STAFF_REVIEW_GATE] 태그 소비 ─────────────
// 발견 경위: HUMAN-AUTHORITY-GATE-SCHEMA(G18)가 _loadGovCommon()을 통해
// 모든 정부기관 세션의 시스템 프롬프트에 실제로 삽입되고 있어서, LLM이
// [STAFF_REVIEW_GATE: task_id=..., handler_code=...] 태그를 실제로 응답에
// 내보낼 수 있는 상태였다. 그런데 이 태그를 소비하는 코드가 서버(worker.js
// — AGY_VAULT_STORE/META_TABLE_UPDATE/DEPT_TASK_REQUEST는 전부 처리 블록이
// 있는데 이것만 없음)에도, 클라이언트(이 페이지가 기존에 import하던 4개
// 함수엔 resolveHandlerCodeFromTrace·findStaffContact가 없었음)에도 전혀
// 없어서, 사용자가 원문 브래킷 문법을 그대로 채팅창에서 보게 될 위험이
// 있었다. handler_code는 LLM 출력이 아니라 이번 턴에 실제로 매칭된
// trace에서 이 함수가 직접 resolveHandlerCodeFromTrace(trace)로 뽑는다
// (G18 구현 참고 문구가 명시한 방식 그대로 — 형식 준수 여부에 기능이
// 좌우되지 않게).
const STAFF_GATE_RE = /\[STAFF_REVIEW_GATE:[\s\S]*?\]/;
async function _consumeStaffReviewGate(replyText, trace) {
  if (!STAFF_GATE_RE.test(replyText)) return replyText;
  let noteText;
  try {
    const handlerCode = resolveHandlerCodeFromTrace(trace);
    const contact = handlerCode ? await findStaffContact(handlerCode) : null;
    noteText = contact
      ? `\n\n📋 이 요청은 담당부서 확인이 필요합니다 — ${contact.name}` +
        (contact.phone ? ` (${contact.phone}${contact.hours ? ', ' + contact.hours : ''})` : '') +
        `로 문의하시면 실제 접수·승인이 진행됩니다.`
      : `\n\n📋 이 요청은 담당부서 확인이 필요합니다 — 정확한 연락처를 지금 확인하지 못했습니다. 정부24(gov.kr) 또는 해당 기관 대표전화로 문의해 주세요.`;
  } catch (e) {
    console.warn('[RegionalGov] STAFF_REVIEW_GATE 연락처 조회 실패:', e.message);
    noteText = `\n\n📋 이 요청은 담당부서 확인이 필요합니다 — 정확한 연락처를 지금 확인하지 못했습니다. 정부24(gov.kr) 또는 해당 기관 대표전화로 문의해 주세요.`;
  }
  return replyText.replace(STAFF_GATE_RE, '').trim() + noteText;
}

// ── Fix ⑤ (2026-07-25) — 요청자(시민) 측 PDV 기록 ──────────────────
// 발견 경위: 기관 측 기록(AGY_VAULT_STORE → owner_pdv, worker.js)은 실제로
// 작동하지만, 요청자 자신의 PDV에 상담 이력이 남는 경로가 이 페이지엔
// 전혀 없었다. 이 페이지가 로그인 세션을 공유하는 별도 탭(webapp.html이
// window.open으로 연 탭)이라, webapp.html 쪽 _recordPDV()(src/gopang/pdv/
// record.js)를 여기서 직접 호출할 수 없다 — 그 함수는 _USER/_userLocation
// 같은 webapp.html 모듈 스코프 상태에 의존한다. 대신 이 저장소가 이미 쓰고
// 있는 크로스탭 패턴(HONDI_P2P_CONNECT_REQUEST, gopang-app.js:761)과 동일한
// 방식으로 window.opener.postMessage 후 gopang-app.js가 받아서 자기
// 컨텍스트 안에서 _recordPDV()를 호출하도록 한다 — 새 프로토콜을 발명하지
// 않고 이미 검증된 패턴을 재사용.
function _recordRequesterPdv(userText, replyText, agency, provinceCode, trace) {
  try {
    if (!window.opener) return; // 새 탭으로 안 열렸으면(직접 URL 접근 등) 조용히 스킵 — 필수 기능 아님
    const agencyDisplayName = resolveAgencyDisplayName(trace) || agency;
    window.opener.postMessage({
      type: 'GOV_CONSULTATION_RECORD',
      what: userText.slice(0, 200),
      summary: replyText.slice(0, 200),
      agency, agencyDisplayName, provinceCode,
      ts: new Date().toISOString(),
    }, location.origin);
  } catch (e) {
    console.warn('[RegionalGov] 요청자 PDV 기록 요청 실패(무시):', e.message);
  }
}

// ── AI 호출 — jeju.hondi.net이 쓰던 것과 동일한 공용 워커 엔드포인트.
// 오리진과 무관한 순수 서버 호출이라 그대로 재사용한다. ──────────────
async function _govRelayCompletion(agencyPrompt, msgs, agency, provinceCode, taskKey, taskRoundtrips, tier) {
  const user = _loadUser();
  try {
    const r = await fetch(`${PROXY}/gov/relay`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        guid: user?.ipv6 || null, agency, agencyPrompt, messages: msgs, provinceCode,
        max_tokens: 2000, stream: false, tier: tier || 'gov-flash',
        // 2026-08-13 신설 — 자율 과금 제안 시스템(worker.js billGovCall)이
        // task_key 단위로 신호를 쌓으려면 클라이언트가 알려줘야 한다.
        // 서버는 대화 1턴=1호출 구조라 task_key를 스스로 알 방법이 없음
        // (GOV_TASK_* 태그에서 처음 드러나는 지점이 클라이언트 쪽이므로).
        // taskKey가 아직 없으면(대화 초반) 그냥 안 보낸다 — 서버가 이미
        // undefined를 "규칙 조회 생략"으로 안전하게 처리하도록 짜여있음.
        task_key: taskKey || undefined,
        gov_task_roundtrips: taskRoundtrips || undefined,
      }),
    });
    if (!r.ok) {
      const errBody = await r.json().catch(() => ({}));
      if (r.status === 429) return errBody.detail || '오늘 이용 가능한 한도를 모두 사용했습니다. 내일 다시 이용해 주세요.';
      throw new Error(`gov/relay ${r.status}: ${errBody.detail || ''}`);
    }
    const d = await r.json();
    return d.choices?.[0]?.message?.content || '잠시 후 다시 시도해 주세요.';
  } catch (e) {
    console.warn('[RegionalGov] gov/relay 실패 → 폴백:', e.message);
    const r2 = await fetch(`${PROXY}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'deepseek-v4-pro', max_tokens: 1000, temperature: 0.7,
        messages: [{ role: 'system', content: agencyPrompt }, ...msgs.slice(-8)],
      }),
    });
    if (!r2.ok) throw new Error(`fallback ${r2.status}`);
    const d2 = await r2.json();
    return d2.choices?.[0]?.message?.content || '오류가 발생했습니다.';
  }
}

// ── 위치 힌트 — GWP facts(메인 비서가 이미 확보한 GPS)만 사용한다.
// 같은 오리진이라 PDV를 직접 읽는 경로는 후속 작업(§13 대체) 참고. ──
let _urlFactsLocation = null;
(function initFacts() {
  const json = _qs.get('facts');
  if (!json) return;
  try {
    const raw = _qs.get('facts_enc') === 'b64' ? decodeURIComponent(escape(atob(json))) : decodeURIComponent(json);
    const facts = JSON.parse(raw);
    if (facts && typeof facts.currentLocation === 'string') _urlFactsLocation = facts.currentLocation;
  } catch (e) { console.warn('[RegionalGov] facts 파싱 실패(무시):', e.message); }
  // facts로 이미 위치를 받았어도, 발화 자체에 지명이 없는 다음 턴들을
  // 위해 백그라운드로 자체 확보를 같이 걸어둔다(있으면 _callAI에서
  // 아래 _resolveLocationHint()가 explicit facts를 여전히 우선시함 —
  // 이 호출은 "손해 볼 일 없는" 보강일 뿐 기존 값을 덮어쓰지 않는다).
  _scheduleLocation();
})();

// ★ 위치 힌트를 매 턴 새로 읽는다 — GPS/프로필 조회는 비동기라 첫 턴엔
// 아직 준비 안 됐을 수 있는데, _urlFactsLocation처럼 한 번만 캐시해두면
// 이후 턴에서도 계속 null로 남는 문제가 있었다. 우선순위: ① 메인
// AI 비서가 launch 시점에 이미 확보해 건네준 explicit facts(가장
// 신뢰도 높음 — 사용자가 그 시점에 명시적으로 확인한 값) ② 이
// 페이지 자체가 스스로 확보한 현재 위치(GPS·역지오코딩·있으면 프로필
// 주소). 발화 자체에 지명이 있으면(예: "강남구") gov-router.js의
// _matchCity가 그걸 최우선으로 쓰므로, 이 힌트는 어디까지나 "발화에
// 지명이 없을 때"의 보조 힌트다(함수 인자 이름 그대로 pdvLocationHint).
function _resolveLocationHint() {
  return _urlFactsLocation || _buildRoutingFacts()?.currentLocation || null;
}

// ★ 2026-08-03 신설 — gov_code: K-Search가 profiles 엔티티로 기관을 이미
// 정확히 특정해 이 탭을 연 경우(§ENTITY-LAUNCH), _gwpLaunch()가 실어보낸
// ctx/url에 담긴 코드를 첫 턴에만 assembleGovSystemPrompt로 전달한다.
// 첫 턴 이후(사용자가 실제로 타이핑한 다음 질문)에는 더 이상 강제하지
// 않는다 — 대화가 다른 기관으로 자연스럽게 옮겨갈 수도 있으므로.
const _govDirectCode = _qs.get('gov_code') || null;
let _govDirectCodeUsed = false;

async function _callAI(latestUserText, typingEl) {
  let sp = '이 지역 정부기관 안내를 도와드립니다.', trace = [], agency = 'gov_do', provinceCode = null;
  try {
    // ★ 2026-08-22 신설(사용자 지시) — URL facts로 이미 위치를 받았으면
    // (가장 신뢰도 높은 값이라 그대로 씀) 대기 생략. 없으면 이 페이지
    // 자체 위치 확보(GPS·프로필주소)가 끝날 때까지 최대 4초 기다린 뒤
    // 라우팅한다 — "AI 비서는 항상 사용자 위치를 알고 있어야 한다"는
    // 원칙을 지키려면 라우팅이 그 확보를 안 기다리고 앞서가면 안 된다.
    if (!_urlFactsLocation) await _waitForLocationReady();
    const directCode = (_govDirectCode && !_govDirectCodeUsed) ? _govDirectCode : null;
    _govDirectCodeUsed = true;
    const r = await assembleGovSystemPrompt(latestUserText, _resolveLocationHint(), _govClassifyFn, (msg) => {
      if (typingEl) typingEl.querySelector('span').textContent = msg;
    }, directCode);
    // ★ 2026-08-21 신설(사용자 지시 — 설계 공백 해소) — classifyFn이
    // 후보 2개를 놓고 확신을 못 내리면(CLARIFY 신호) assembleGovSystemPrompt가
    // needsClarification을 채워 돌려준다. 이 경우 SP 조립·AI 실호출을
    // 전부 건너뛰고 되묻는 질문을 그대로 사용자에게 보여준다 — 예전엔
    // 이 신호 자체가 없어서 확신 없이 고른 부서 SP가 조용히 로드됐다.
    if (r.needsClarification) {
      const { question, options, isLocationQuestion } = r.needsClarification;
      // ★ 2026-08-22 추가 — isLocationQuestion(자유형 위치질문, 사용자
      // 지시로 신설)은 선택지가 없으니 번호목록을 붙이지 않는다. 부서
      // 선택형 되묻기(CLARIFY)만 기존처럼 번호목록을 붙인다.
      const clarifyText = isLocationQuestion
        ? question
        : `${question}\n\n${options.map((o, i) => `${i + 1}. ${o.name}`).join('\n')}`;
      messages.push({ role: 'assistant', content: clarifyText });
      return clarifyText;
    }
    sp = r.systemPrompt;
    trace = r.trace || [];
    agency = resolveGovAgency(trace) || 'gov_do';
    provinceCode = resolveProvinceCode();
    _lastAgency = agency;
  } catch (e) {
    console.warn('[RegionalGov] SP 조립 실패, 최소 폴백 사용:', e.message);
  }
  // 2026-07-23 수정 — trace.join(' > ')는 "JEJU-GOV-COMMON > SP-DO-000 >
  // SP-CITY-JEJU" 같은 개발자용 SP 코드를 그대로 사용자에게 보여주고
  // 있었다. resolveAgencyDisplayName()으로 실제 한글 기관/부서명을 뽑아
  // document.title에 반영한다(페이지 자체 헤더를 없앴으므로, 상위 크롬의
  // 제목표시줄이 유일한 헤더 — "제주도청 AI" 같은 광역 단위 대신 실제
  // 호출된 "제주시청 AI"가 보이도록 도청 라벨보다 우선한다).
  const agencyDisplayName = resolveAgencyDisplayName(trace);
  const provinceLabel = { jeju: '제주도청', seoul: '서울시청', busan: '부산시청', gyeonggi: '경기도청' }[provinceCode];
  document.title = agencyDisplayName ? `${agencyDisplayName} AI`
    : (provinceLabel ? `${provinceLabel} AI` : '전국 지방행정 AI');

  return _govRelayCompletion(sp, messages, agency, provinceCode, _lastTaskKey, _taskRoundtrips).then(async (rawReply) => {
    // ── GOV_TASK 태그 처리 (2026-08-13 신설) ──────────────────────
    // 이 페이지는 스트리밍이 아니라 단일 완료 호출이라 call-ai.js의
    // _callAIInner(스트리밍·bubble 기반)와 구조가 다르다 — 그래서
    // _handleGovTaskTags 자체(태그 감지·서버 호출 로직)는 그대로
    // 재사용하되, sendFn만 이 페이지 방식(messages 배열에 직접 push +
    // _govRelayCompletion 재호출)으로 새로 만든다. bubble은 없으므로
    // null(내부에서 안전하게 no-op 처리됨).
    //
    // 재귀 흐름: rawReply에 태그가 있으면 → INTERNAL 피드백을
    // messages에 user 턴으로 추가 → 다시 완료 호출 → 새 응답도 태그가
    // 있으면 반복. 모델이 태그를 계속 내는 이상 상황을 대비해 기존
    // call-ai.js 메인 루프에는 없는 재귀 깊이 상한(5회)을 새로 뒀다 —
    // 초과하면 경고 로그만 남기고 마지막 응답을 그대로 사용자에게
    // 보여준다(무한 루프로 인한 과금 폭주 방지가 태그 미처리보다 우선).
    let finalReply = rawReply;
    let depth = 0;
    const MAX_TAG_DEPTH = 5;

    // task_key가 이번 응답에서 처음 드러났으면 기억해둔다 — 이번 턴
    // 자체는 이미 과금이 끝났으니 다음 턴부터 반영된다.
    const _foundKey = _extractTaskKeyFromReply(rawReply);
    if (_foundKey && _foundKey !== _lastTaskKey) { _lastTaskKey = _foundKey; _taskRoundtrips = 0; }

    async function _tagAwareSend(internalText) {
      if (depth >= MAX_TAG_DEPTH) {
        console.warn('[RegionalGov] GOV_TASK 태그 재귀 깊이 상한(' + MAX_TAG_DEPTH + ') 도달 — 중단');
        return;
      }
      depth++;
      _taskRoundtrips++; // GOV_TASK 왕복 1회 — 자율 과금 제안의 "왕복 잦음" 신호
      messages.push({ role: 'user', content: internalText });
      const nextReply = await _govRelayCompletion(sp, messages, agency, provinceCode, _lastTaskKey, _taskRoundtrips);
      messages.push({ role: 'assistant', content: nextReply });
      finalReply = nextReply; // 태그가 더 없으면 이게 최종 표시될 응답
      const _foundKey2 = _extractTaskKeyFromReply(nextReply);
      if (_foundKey2 && _foundKey2 !== _lastTaskKey) { _lastTaskKey = _foundKey2; }
      await _handleGovTaskTags(nextReply, null, _tagAwareSend, latestUserText, trace);
    }

    messages.push({ role: 'assistant', content: rawReply }); // 태그 유무와 무관하게 문맥 유지를 위해 먼저 기록
    await _handleGovTaskTags(rawReply, null, _tagAwareSend, latestUserText, trace);

    const reply = await _consumeStaffReviewGate(finalReply, trace);
    _recordRequesterPdv(latestUserText, reply, agency, provinceCode, trace);
    return reply;
  });
}

// ── 초기화 ─────────────────────────────────────────────────────
(function init() {
  const user = _loadUser();
  if (!user?.ipv6) {
    // 같은 오리진이라 SSO 자체가 필요 없다 — 여기서 "로그인 안 됨"은
    // 정말로 이 브라우저에 로그인 기록이 없다는 뜻이다(교차 오리진
    // 타이밍 문제가 아니다). 정직하게 안내한다.
    const banner = document.getElementById('err-banner');
    banner.style.display = 'block';
    banner.innerHTML = '먼저 <a href="/webapp.html" style="color:#991B1B;text-decoration:underline">AI 비서 화면</a>에서 로그인해 주세요.';
    return;
  }

  // ★ 2026-07-23 수정 — 어느 기관인지 이 시점엔 아직 확정되지 않는다
  // (province/agency는 첫 AI 응답이 SP를 조립해야 알 수 있음, gov-router.js
  // 참고). 그런데 AI 비서로부터 특정 요청(GWP_CTX)과 함께 넘어온 경우
  // "전국 지방행정 AI입니다"라는 일반 인사말을 먼저 보여주면, 사용자가
  // 요청한 기관(예: 제주시청)과 다른 이름이 잠깐이라도 화면에 뜨는
  // 문제가 있었다(실사로 지적됨). 확정 안 된 이름을 보여주느니 아예
  // 보여주지 않는다 — GWP_CTX가 있으면 일반 인사말 없이 곧바로 실제
  // 응답(그 시점엔 올바른 기관명이 반영됨)으로 넘어간다.
  // ★ 2026-09-05 수정(사고실험으로 발견) — GWP_CTX뿐 아니라 K-정부
  // 카탈로그가 쓰는 _govDirectCode(특정 기관 직행 링크)로 들어온
  // 경우도 이미 기관이 확정돼 있으므로, 확정 안 된 "전국 지방행정
  // AI입니다" 일반 인사말을 보여줄 이유가 없다 — 그동안 이 조건이
  // GWP_CTX만 확인해서, 카탈로그에서 특정 부서를 직접 눌러도 일반
  // 인사말이 먼저 뜨는 버그가 있었다. directCode만 있는 경우엔
  // 사용자가 실제로 입력한 발화가 없으므로, 자기소개를 요청하는 시드
  // 발화를 GWP_CTX와 동일한 방식(공용 chat-input에 채워 넣고 전송)으로
  // 대신 보낸다 — 그 응답에는 이제 올바른 기관명이 반영된다.
  if (!GWP_CTX && !_govDirectCode) {
    appendBubble('ai',
      '안녕하세요, 전국 지방행정 AI입니다. 광역시도청·시군구청·읍면동사무소 관련 무엇이든 말씀해 주세요.'
    );
  } else if (GWP_CTX) {
    setTimeout(() => {
      ci.setText('(AI 비서로부터 전달됨)\n' + GWP_CTX);
      ci.el.sendBtn.click();
    }, 200);
  } else {
    setTimeout(() => {
      ci.setText('안녕하세요. 어느 기관인지, 어떤 업무를 도와줄 수 있는지 소개해 주세요.');
      ci.el.sendBtn.click();
    }, 200);
  }
})();
</script>
</body>
</html>
