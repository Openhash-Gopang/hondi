<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>전문가 AI 상담</title>
<meta name="description" content="자격직 전문가 AI 페르소나와의 1:1 상담 — GWP 방식 새 탭.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/chat-shell.css">
<style>
:root{ --gov:#1F2937; --pri:#2563EB; --pri-bg:#EFF6FF; }
/* ── 이 페이지 고유(다른 GWP 탭과 다른 부분만 남김) ──────────────
   무음 자동정지·자동전송까지 있는 이 페이지만의 마이크 구현(아래
   스크립트, webapp.html의 ai-panel-mic-btn 원본을 그대로 이식한 것)이
   토글하는 클래스명이 공용 CSS의 .mic-active와 달라 별도 유지. */
.ia-btn.mic-recording{color:var(--pri);animation:mic-pulse .9s ease-in-out infinite}
@keyframes mic-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
#attach-preview span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#attach-preview button{background:none;border:none;color:var(--hint);cursor:pointer;font-size:13px;flex-shrink:0}
</style>
</head>
<body>

<div id="top-bar">
  <div id="tb-icon">🤝</div>
  <div id="tb-sub">로딩 중…</div>
  <button id="tb-back">고팡으로</button>
</div>

<div id="err-banner"></div>
<div id="chat-thread"></div>

<div id="bottom-dock">
<div id="attach-preview" style="display:none">
  <span id="attach-name"></span>
  <button type="button" id="attach-remove">✕</button>
</div>
<div id="input-bar">
  <div id="input-aux-btns">

    <button class="ia-btn" id="btn-attach" type="button" title="파일 첨부">
      <svg width="17.87" height="17.87" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </button>
    <button class="ia-btn" id="btn-camera" type="button" title="카메라">
      <svg width="16.87" height="16.87" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button class="ia-btn" id="btn-mic" type="button" title="음성 입력">
      <svg width="15.88" height="15.88" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </button>
  </div>
  <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt" style="display:none">
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
  <div id="input-wrap">
    <textarea id="chat-input" rows="1" placeholder="메시지를 입력하세요…"></textarea>
    <button id="send-btn" disabled>
      <svg class="icon-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg class="icon-waveform" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
        <line x1="5" y1="9" x2="5" y2="15"/><line x1="9.5" y1="6" x2="9.5" y2="18"/>
        <line x1="14" y1="4" x2="14" y2="20"/><line x1="18.5" y1="7" x2="18.5" y2="17"/>
      </svg>
    </button>
  </div>
</div>
</div>

<script type="module">
import { EXPERT_REGISTRY, UNIVERSAL_INTEGRITY_KEY, COMMON_GUARDRAILS_KEY,
         COMMON_MEDICAL_SAFETY_KEY, EXPERT_BASE_KEY, isConsultableChild, resolveExpertId }
  from '/src/gopang/ai/expert-registry.js';
// 2026-07-09: fetch(하드코딩 URL) 직접 호출 -> _loadSpByKey(manifest 키)로
// 전환. 이 페이지가 실제 EXPERT 페르소나 라이브 경로다.
//
// ⚠️ 2026-08-06 정정: 위 문장 다음에 원래 "expert-session.js의
// _composeExpertPrompt는 2026-07-03 이후 더 이상 호출되지 않는 참고용
// 코드"라는 문구가 있었는데 틀렸다 — _composeExpertPrompt()는 죽지 않고
// call-ai.js의 K-Compose/K-Execute 내부 위임(scope=orchestration_subtask,
// §0-H) 경로로 여전히 살아있다(실사 재확인). SP_lawyer가 v3.2에 몇 주간
// 고정돼 있던 실제 버그는 이 파일의 하드코딩 때문이었던 게 맞다.
//
// 같은 2026-08-06 감사에서 드러난 별도 문제: 이 페이지의 composeExpertPrompt()
// 는 UNIVERSAL-INTEGRITY만 (여러 _loadSpByKey() 호출로 인해 2~3중 중복
// 삽입되며) 로드하고 있었고, UNIVERSAL-common(U0 의도특정·U1 권한의 한계·
// U7 "안내로 끝내지 않는다" 원칙의 실제 본문)과 PROFESSIONAL-common(전문가
// 사칭 금지·최종판단은 감독전문가 전속 등 정체성 계층)은 이 조립 로직
// 어디에도 없어 60개 EXPERT 페르소나 전원이 그 두 계층 없이 구동되고
// 있었다. expert-session.js의 _composeExpertPrompt()가 2026-07-19에
// 이미 고쳐진 것과 동일한 조립 순서(UNIVERSAL-INTEGRITY 정확히 1회 →
// UNIVERSAL-common → PROFESSIONAL-common → 공통 가드레일 → (의료시)
// 의료 안전모듈 → 페르소나 SP)로 맞췄다 — _loadSpByKey는 자동으로
// UNIVERSAL-INTEGRITY·TASK-DELEGATION-GUIDE를 앞에 붙이므로 상위 계층은
// _loadSpRawByKey(원문만, 자동 결합 없음)로 받아 정확히 한 번만 조립한다.
import { _loadSpByKey, _loadSpRawByKey } from '/src/gopang/ai/manifest-loader.js';
import { _missingNextStepMarker } from '/src/gopang/ai/expert-session.js';
// 2026-07-20: §7(기관측 PDV, SP_PDV v1.2) 기록 — 이 페이지가 EXPERT 페르소나의
// 실제 라이브 경로이므로(위 주석 참조), 세션 종료 리포팅도 여기 붙여야 실제로
// 동작한다. expert-session.js의 endExpertSession()에 붙이면 죽은 코드에
// 연결하는 셈이라 아무 효과가 없다.
import { recordOwnerPDV, queryOwnerPdvSelfHistory, recordUserPdvForExpert } from '/src/gopang/gwp/gwp-report-client.js';
import { escHtml, appendBubble, appendTyping as _sharedAppendTyping } from '/src/gopang/ui/chat-shell.js';

const RELAY_ENDPOINT = 'https://hondi-proxy.tensor-city.workers.dev';

// ══════════════════════════════════════════════════════════════
// GWP 파라미터 파싱 — klaw 등 기관 서비스와 완전히 동일한 규약
// ══════════════════════════════════════════════════════════════
const _qs       = new URLSearchParams(location.search);
const PERSONA   = resolveExpertId(_qs.get('persona') || '');
const GWP_TOKEN = _qs.get('token')  || '';
const RETURN    = _qs.get('return') || 'https://hondi.net';
let   GWP_CTX   = '';
if (_qs.get('ctx')) {
  try {
    GWP_CTX = (_qs.get('ctx_enc') === 'b64')
      ? decodeURIComponent(escape(atob(_qs.get('ctx'))))
      : decodeURIComponent(_qs.get('ctx'));
  } catch (e) { GWP_CTX = ''; }
}
let _gwpSeedUsed = false;

document.getElementById('tb-back').onclick = () => { location.href = RETURN; };

const def = EXPERT_REGISTRY[PERSONA];
if (!def) {
  document.getElementById('tb-sub').textContent = '알 수 없는 전문가입니다';
  const banner = document.getElementById('err-banner');
  banner.style.display = 'block';
  banner.textContent = `전문가 페르소나를 찾을 수 없습니다 (persona=${_qs.get('persona') || '(없음)'}). 고팡으로 돌아가 다시 시도해 주세요.`;

  // 2026-07-06: "초안 작성 + 검토 대기열" 원칙 — 존재하지 않는 전문가를
  // 자동으로 만들어 즉시 배포하지 않는다(자격·법적 책임이 걸린 분야에서
  // 검토 없는 페르소나가 실사용자에게 나가는 위험). 대신 기존
  // /feedback 시스템(자동 category 분류, feedback.html 관리자 검토
  // 화면 이미 존재)에 요청만 기록한다 — 새 백엔드를 만들지 않고 이미
  // 검증된 인프라를 재사용.
  try {
    const user = JSON.parse(localStorage.getItem('gopang_user_v4') || 'null');
    if (user?.ipv6 && user?.handle) {
      const requestedName = _qs.get('persona') || '(없음)';
      const contentLines = [
        `[전문가 요청] 등록되지 않은 전문가 페르소나가 요청됨: "${requestedName}"`,
        GWP_CTX ? `사용자 발화: ${GWP_CTX}` : null,
      ].filter(Boolean);
      fetch(`${RELAY_ENDPOINT}/feedback`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guid: user.ipv6, handle: user.handle, content: contentLines.join('\n') }),
      }).catch(e => console.warn('[Expert] 전문가 요청 기록 실패(무해함, 배너는 그대로 표시됨):', e.message));
    }
  } catch (e) { /* 로그인 정보 없거나 파싱 실패 — 조용히 건너뜀, 배너는 이미 표시됨 */ }

  throw new Error('unknown persona: ' + _qs.get('persona'));
}
document.getElementById('tb-icon').textContent  = def.icon || '🤝';
document.getElementById('tb-sub').textContent   = '자격직 전문가 페르소나 · 최종 법적/의료적 행위는 인간 전속';
document.title = def.label + ' AI 상담';

// ══════════════════════════════════════════════════════════════
// 채팅 UI 헬퍼 — 2026-07-22부터 공용 모듈(chat-shell.js) 사용.
// appendTyping만 이 페르소나 이름이 들어간 라벨이 필요해 얇은 래퍼로
// 감싼다(다른 두 페이지처럼 default 라벨이면 그냥 그대로 썼을 것).
// ══════════════════════════════════════════════════════════════
function appendTyping() {
  return _sharedAppendTyping(`${def.label} AI가 답변을 준비하고 있습니다`);
}

// ══════════════════════════════════════════════════════════════
// 시스템 프롬프트 합성 (2026-08-06 재구성) — 조립 순서:
//   UNIVERSAL-INTEGRITY → UNIVERSAL-common → PROFESSIONAL-common
//   → 공통 가드레일(C1~C43) → (의료시) 의료 안전모듈 → 페르소나 SP
//
// 2026-07-06: 하나라도 실패하면 조용히 저하되지 않고 명시적으로 실패한다.
// 이전엔 가드레일/의료안전모듈은 실패해도 아무 표시 없이 그냥 스킵됐고
// (페르소나 파일보다 오히려 더 위험 — 안전장치가 빠진 채 티도 안 나고
// 진행됨), 페르소나 SP만 실패 시 "[일반 전문가 모드로 응답]"이라는
// 문구를 얹어 부분 저하 상태로 계속 진행했다. AGENT-COMMON/webapp.html에
// 적용한 "실패하면 하드 실패" 원칙과 통일한다 — 없는 안전장치를 있는
// 것처럼 굴지 않는다. (이 원칙은 expert-session.js의 _composeExpertPrompt
// — K-Compose 오케스트레이션 하위 호출용 — 가 실패마다 console.warn만
// 남기고 계속 진행하는 것과 의도적으로 다르다: 이 페이지는 사용자가
// 직접 상담하는 라이브 경로라서 안전장치 누락을 절대 조용히 넘기면
// 안 되고, 오케스트레이션 하위 호출은 상위 AC가 이미 감시 중이라
// 부분 저하를 허용해도 되는 다른 위험 프로파일이기 때문이다.)
//
// 2026-08-06: UNIVERSAL-common·PROFESSIONAL-common 신규 추가(이전엔
// 이 조립 로직 어디에도 없어 60개 페르소나 전원이 그 두 계층 없이
// 구동되고 있었다) + UNIVERSAL-INTEGRITY 중복 삽입 제거(_loadSpByKey는
// 호출마다 자동으로 앞에 붙이므로, 상위 공유 계층은 _loadSpRawByKey로
// 원문만 받아 정확히 한 번만 조립한다).
async function composeExpertPrompt() {
  const parts = [];

  parts.push(await _loadSpByKey(UNIVERSAL_INTEGRITY_KEY, 'UNIVERSAL-INTEGRITY')
    .catch(e => { throw new Error('UNIVERSAL-INTEGRITY 로드 실패: ' + e.message); }));

  parts.push(await _loadSpRawByKey('UNIVERSAL-common', 'UNIVERSAL-common')
    .catch(e => { throw new Error('UNIVERSAL-common 로드 실패: ' + e.message); }));

  parts.push(await _loadSpRawByKey('PROFESSIONAL-common', 'PROFESSIONAL-common')
    .catch(e => { throw new Error('PROFESSIONAL-common 로드 실패: ' + e.message); }));

  parts.push(await _loadSpRawByKey(COMMON_GUARDRAILS_KEY, '공통 가드레일')
    .catch(e => { throw new Error('공통 가드레일 로드 실패: ' + e.message); }));

  if (def.needsMedicalSafety) {
    parts.push(await _loadSpRawByKey(COMMON_MEDICAL_SAFETY_KEY, '의료 안전모듈')
      .catch(e => { throw new Error('의료 안전모듈 로드 실패: ' + e.message); }));
  }

  // 2026-08-07 신설(발견된 이원화 결함 보정) — expert-session.js의
  // _composeExpertPrompt()가 SP_EXPERT_BASE 신설(§6-2) 이후로 EXPERT_BASE·
  // parentKey 재귀 상속을 갖추게 됐는데, 이 페이지는 그 함수를 쓰지 않고
  // 독립 구현을 유지해온 탓에(위 2026-08-06 주석 참조) 둘 다 반영되지
  // 않은 채 몇 주간 방치돼 있었다 — 실제 사용자가 상담하는 라이브
  // 페이지가 EXPERT_BASE 골격 없이 구동되고 있었다는 뜻이다. 아래 두
  // 블록을 추가해 격차를 메운다. 이 함수 특유의 "실패 시 즉시 throw"
  // 패턴(_composeExpertPrompt()의 "실패해도 console.warn만 남기고 계속
  // 진행" 패턴과 의도적으로 다름 — 위 2026-08-06 주석이 그 이유를 이미
  // 설명하고 있다)은 그대로 유지한다.
  parts.push(await _loadSpRawByKey(EXPERT_BASE_KEY, 'EXPERT_BASE')
    .catch(e => { throw new Error('EXPERT_BASE 로드 실패: ' + e.message); }));

  if (def.parentKey) {
    // 2026-09-04 수정(사고실험으로 발견한 결함 시정) — 예전엔 "부모의
    // 부모까지는 안 실음(3단까지만 규정)"으로 하드코딩돼 있어서, 교수
    // 세부전공처럼 3단(교수→중계열→소계열) 이상인 174개 페르소나가
    // 중간 계층(중계열 SP — 예: 재료 중계열의 고온공정 안전지침)을 조용히
    // 누락한 채 구동되고 있었다. 부모 체인을 끝까지 재귀적으로 따라가
    // 중간 계층을 하나도 빠뜨리지 않는다. 0~1단 체인(기존 60여 개
    // 페르소나)은 아래 while 루프가 한 번 만에 끝나므로 동작이 그대로다.
    const ancestors = [];
    let cursorKey = def.parentKey;
    const seen = new Set();
    while (cursorKey) {
      if (seen.has(cursorKey)) {
        throw new Error(`parentKey 순환 참조 감지: ${cursorKey}`);
      }
      seen.add(cursorKey);
      const ancestorDef = EXPERT_REGISTRY[cursorKey];
      if (!ancestorDef) {
        throw new Error(`parentKey 미등록: ${cursorKey} (${def.label})`);
      }
      ancestors.unshift(ancestorDef); // 최상위가 배열 맨 앞에 오도록 역순 삽입
      cursorKey = ancestorDef.parentKey;
    }
    for (const ancestorDef of ancestors) {
      parts.push(await _loadSpRawByKey(ancestorDef.key, `${ancestorDef.label}(상위 SP)`)
        .catch(e => { throw new Error(`상위 SP(${ancestorDef.label}) 로드 실패: ` + e.message); }));
    }
  }

  parts.push(await _loadSpRawByKey(def.key, def.label)
    .catch(e => { throw new Error(`${def.label} SP 로드 실패: ` + e.message); }));

  return parts.join('\n\n---\n\n');
}

// 2026-08-07 신설(내부 자문 호출 기능) — 부모 SP가 대화 중 자식(세부분야)
// SP에게 좁은 질문 하나를 던질 때 쓰는 경량 조립. 위 composeExpertPrompt()와
// 달리 **부모 SP 텍스트를 포함하지 않는다** — 자문은 C41 orchestration_
// subtask 프로토콜로 "좁은 질문 하나"만 오가므로, 자식이 부모의 전체
// STEP 0~D 골격까지 다시 짊어질 이유가 없다(정적 세부분야 진입과 다른
// 점 — 그쪽은 EXPERT_BASE→부모→자식 3단이 맞지만, 이건 EXPERT_BASE→
// 자식만으로 충분하다). 이게 이 기능의 실제 절약 포인트다 — 평소엔
// 가벼운 부모 SP로 대화하다가, 드물게 필요할 때만 자식의 전문 지식
// (Tier표·L2/L3 모듈)을 이 경량 조립으로 불러온다.
async function _composeConsultPrompt(childDef) {
  const parts = [];
  parts.push(await _loadSpByKey(UNIVERSAL_INTEGRITY_KEY, 'UNIVERSAL-INTEGRITY')
    .catch(e => { throw new Error('UNIVERSAL-INTEGRITY 로드 실패: ' + e.message); }));
  parts.push(await _loadSpRawByKey('UNIVERSAL-common', 'UNIVERSAL-common')
    .catch(e => { throw new Error('UNIVERSAL-common 로드 실패: ' + e.message); }));
  parts.push(await _loadSpRawByKey('PROFESSIONAL-common', 'PROFESSIONAL-common')
    .catch(e => { throw new Error('PROFESSIONAL-common 로드 실패: ' + e.message); }));
  parts.push(await _loadSpRawByKey(COMMON_GUARDRAILS_KEY, '공통 가드레일')
    .catch(e => { throw new Error('공통 가드레일 로드 실패: ' + e.message); }));
  if (childDef.needsMedicalSafety) {
    parts.push(await _loadSpRawByKey(COMMON_MEDICAL_SAFETY_KEY, '의료 안전모듈')
      .catch(e => { throw new Error('의료 안전모듈 로드 실패: ' + e.message); }));
  }
  parts.push(await _loadSpRawByKey(EXPERT_BASE_KEY, 'EXPERT_BASE')
    .catch(e => { throw new Error('EXPERT_BASE 로드 실패: ' + e.message); }));
  parts.push(await _loadSpRawByKey(childDef.key, childDef.label)
    .catch(e => { throw new Error(`${childDef.label} SP 로드 실패: ` + e.message); }));
  return parts.join('\n\n---\n\n');
}

// ══════════════════════════════════════════════════════════════
// AI 호출 — call-ai.js의 후보 폴백 로직을 그대로 이식(legacy → BYOK relay
// → 혼디 무료 기본 키). 같은 오리진(hondi.net)이라 localStorage를 그대로
// 공유해서 읽을 수 있다.
// ══════════════════════════════════════════════════════════════
function _loadCfg() {
  try { return JSON.parse(localStorage.getItem('gopang_cfg') || '{}'); } catch { return {}; }
}
function _loadUser() {
  try { return JSON.parse(localStorage.getItem('gopang_user_v4') || 'null'); } catch { return null; }
}
function _buildCandidates() {
  const cfg = _loadCfg();
  const candidates = [];
  if (Array.isArray(cfg.providers)) {
    for (const p of cfg.providers) {
      if (!p?.apiKey || !p?.model || !p?.baseUrl) continue;
      candidates.push({ provider: p.provider, baseUrl: p.baseUrl.replace(/\/+$/,''), model: p.model, apiKey: p.apiKey });
    }
  }
  if (!candidates.length && cfg.apiKey && cfg.endpoint && !cfg.endpoint.includes('workers.dev')) {
    candidates.push({ provider: 'legacy', baseUrl: cfg.endpoint.replace(/\/+$/,''), model: cfg.model || 'gpt-4o-mini', apiKey: cfg.apiKey });
  }
  // 최종 안전망 — 혼디 제공 무료 기본 키
  candidates.push({ provider: 'deepseek-default', baseUrl: RELAY_ENDPOINT, model: 'hondi-flash', apiKey: null });
  return candidates;
}

async function _pumpSSE(response, onJson) {
  if (!response.ok) {
    let msg = `HTTP ${response.status}`;
    try { const b = await response.json(); msg = b.message || b.error?.message || b.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      let json;
      try { json = JSON.parse(payload); } catch (e) { continue; }
      onJson(json);
    }
  }
}

async function callExpertAI(messages, onChunk) {
  const candidates = _buildCandidates();
  const user = _loadUser();
  let lastErr = null;
  for (const c of candidates) {
    try {
      const reqBody = { model: c.model, messages, max_tokens: 1200, temperature: 0.4, stream: true };
      const resp = c.provider === 'legacy'
        ? await fetch(`${c.baseUrl}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${c.apiKey}` },
            body: JSON.stringify(reqBody),
          })
        : c.provider === 'deepseek-default'
        ? await fetch(`${c.baseUrl}/deepseek`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...reqBody, guid: user?.ipv6 || null }),
          })
        : await fetch(`${RELAY_ENDPOINT}/llm/relay`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: c.provider, baseUrl: c.baseUrl, apiKey: c.apiKey, ...reqBody }),
          });

      let fullText = '';
      await _pumpSSE(resp, (json) => {
        const delta = json.choices?.[0]?.delta?.content || '';
        if (delta) { fullText += delta; onChunk && onChunk(delta, fullText); }
      });
      return fullText;
    } catch (e) {
      lastErr = e;
      console.warn(`[Expert] ${c.provider} 실패 — 다음 후보로 전환:`, e.message);
      continue;
    }
  }
  throw lastErr || new Error('모든 호출 후보 실패');
}

// ── [SUGGEST_SERVICE_REDIRECT:] EXPERT→GWP 되돌림 (2026-08-06 신설) ──

// 응답에서 태그를 찾아 화면에서 제거하고, 제안 배너를 렌더링한다.
// 강제 전환이 아니라 제안이므로(Q4 원칙) 자동으로 탭을 열지 않는다 —
// 사용자가 배너의 버튼을 눌러야만 새 탭이 열린다.
function _maybeHandleServiceRedirectSuggestion(fullReply, aiBubble) {
  const m = fullReply.match(/\[SUGGEST_SERVICE_REDIRECT:\s*type=GWP,\s*id=([\w-]+)(?:,\s*reason=([^\]]*))?\]/);
  if (!m) return fullReply;

  const gwpId = m[1];
  const reason = (m[2] || '').trim();
  const cleaned = fullReply.replace(m[0], '').trim();
  aiBubble.innerHTML = escHtml(cleaned).replace(/\n/g, '<br>');

  const target = _REDIRECT_GWP_TABLE[gwpId];
  if (!target) {
    // 표에 없는 id — 태그 자체는 신뢰하지 않고 조용히 무시(추측해서
    // 아무 URL이나 열지 않는다, §HONESTY와 동일 원칙).
    console.warn('[Expert] SUGGEST_SERVICE_REDIRECT — 알 수 없는 id, 무시:', gwpId);
    return cleaned;
  }

  const banner = document.createElement('div');
  banner.className = 'redirect-suggestion-banner';
  banner.style.cssText =
    'margin:8px 0;padding:12px;border-radius:10px;background:var(--fill-tertiary,#f2f2f7);' +
    'border:1px solid var(--separator,#d1d1d6);font-size:13px;';
  banner.innerHTML =
    `<div style="margin-bottom:8px;color:var(--label-2,#666)">` +
    `${escHtml(target.name)}로 이동하시면 더 정확한 안내를 받으실 수 있습니다` +
    (reason ? `<br><span style="font-size:12px">(${escHtml(reason)})</span>` : '') +
    `</div>` +
    `<button type="button" class="redirect-suggestion-btn" style="margin-right:8px;padding:7px 14px;border-radius:8px;border:none;background:var(--pri,#2563EB);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;">${escHtml(target.name)}로 이동</button>` +
    `<button type="button" class="redirect-suggestion-dismiss" style="padding:7px 14px;border-radius:8px;border:1px solid var(--separator,#d1d1d6);background:transparent;color:var(--label-2,#666);font-size:12.5px;cursor:pointer;">계속 여기서 상담</button>`;
  banner.querySelector('.redirect-suggestion-btn').onclick = () => {
    window.open(target.url, '_blank');
    banner.remove();
  };
  banner.querySelector('.redirect-suggestion-dismiss').onclick = () => banner.remove();
  aiBubble.insertAdjacentElement('afterend', banner);

  return cleaned;
}

// ── §7 기관측 PDV 리포팅 상태 (2026-07-20 신설) ──────────────────
let _escalationReason    = null; // null | 'success' | 'limit' — C39-5 반영(2026-07-20)
let _ownerPdvRecorded     = false; // 중복 기록 방지(종료 경로가 여러 개라 한 번만 기록)
const _sessionStartedAt   = new Date().toISOString();

// 페르소나 SP 원문 헤더에서 버전 표기(예: "v4.1")를 최선 노력으로 추출.
// 못 찾아도 기록 자체를 막지 않는다 — null로 남긴다.
function _extractPersonaVersion(promptText) {
  try {
    const m = promptText?.match(/#\s*SP-[\w-]+.*?\bv(\d+\.\d+)/);
    return m ? `v${m[1]}` : null;
  } catch { return null; }
}

// §4 사고실험 대응(2026-07-20) — 명시적 1탭 평가. 텍스트 입력을 받지 않으므로
// 판독(감정분석 등)이 필요 없다. 응답이 없으면(4초 타임아웃) null로 진행 —
// 강제하지 않는다. 무응답 자동 종료(reason==='timeout') 경로에서는 애초에
// 사용자가 자리에 없다는 뜻이므로 아예 호출하지 않는다(아래 참조).
function _captureExplicitRating() {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); };
    const box = appendBubble('ai',
      `<div style="display:flex;align-items:center;gap:10px">
        <span>이번 상담, 도움이 되셨나요?</span>
        <button id="rate-up" style="border:none;background:none;font-size:20px;cursor:pointer">👍</button>
        <button id="rate-down" style="border:none;background:none;font-size:20px;cursor:pointer">👎</button>
      </div>`
    );
    box.querySelector('#rate-up')?.addEventListener('click', () => {
      box.innerHTML = '<span style="color:var(--label-3)">평가 감사합니다 👍</span>';
      finish('up');
    });
    box.querySelector('#rate-down')?.addEventListener('click', () => {
      box.innerHTML = '<span style="color:var(--label-3)">평가 감사합니다 👎</span>';
      finish('down');
    });
    setTimeout(() => finish(null), 4000);
  });
}

// §7 기관측 PDV 기록 — 세션 종료 경로(명시적 종료 발화 / 10분 타임아웃)
// 양쪽에서 공용으로 호출한다. how 필드는 도달 경로로 구분한다(§7.4):
//   - 상담 중 CONNECT_HUMAN_EXPERT가 한 번이라도 호출됐으면 정상 설계된
//     경로이므로 'escalated_success'로 본다(§7.4 원칙 — STEP D 도달 자체는
//     실패 신호가 아님). AI 한계로 인한 조기 이탈과의 구분은 현재 코드에서
//     신뢰성 있게 판별할 신호가 없어 향후 SP가 별도 태그를 내도록 개선이
//     필요하다 — 지금은 보수적으로 success 쪽에 분류한다(알려진 한계).
//   - 그 외 명시적 종료 발화면 'completed', 대화 없이/거의 없이 타임아웃되면
//     'early_exit'.
async function _recordExpertOwnerPDV(reason) {
  if (_ownerPdvRecorded) return; // 이미 기록됨(예: 종료발화 처리 중 타임아웃 동시발생 등)
  _ownerPdvRecorded = true;

  const ownerAgency = def?.ownerAgency;
  if (!ownerAgency) {
    console.warn('[Expert] ownerAgency 미설정 — §7 기관측 PDV 기록 생략:', PERSONA);
    return;
  }
  const user = _loadUser();
  if (!user?.ipv6) {
    // 2026-07-20 확인: gopang-app.js v6.0부로 게스트 모드가 완전히 폐지되어
    // 정상 경로로는 비로그인 상태에서 이 페이지에 도달할 수 없다(#app 자체가
    // 렌더링 안 되고 로그인 팝업만 뜸, 닫기 버튼 없음). 그래도 이 분기를
    // 남겨두는 이유는 localStorage 손상·세션 중 로그아웃 등 비정상 상태에
    // 대한 방어 코드이지, 정상적인 "게스트 사용" 경로가 아니다.
    console.warn('[Expert] 로그인 정보 없음(비정상 상태) — §7 기관측 PDV 기록 생략');
    return;
  }

  const exchanged = messages.filter(m => m.role === 'user' || m.role === 'assistant').length;
  let how;
  if (_escalationReason === 'limit') how = 'escalated_ai_limit'; // C39-5 반영(2026-07-20) — 더는 일괄 success 분류 아님
  else if (_escalationReason === 'success') how = 'escalated_success';
  else if (reason === 'timeout' && exchanged === 0) how = 'early_exit';
  else if (reason === 'timeout') how = 'early_exit';
  else how = 'completed';

  // §4 — 무응답 타임아웃 경로는 사용자가 이미 자리에 없으므로 평가를 묻지
  // 않는다. 그 외 경로만 4초짜리 짧은 창을 준다(대화 흐름 지연 최소화).
  const explicitRating = (reason === 'timeout') ? null : await _captureExplicitRating();

  const lastUserTurn = [...messages].reverse().find(m => m.role === 'user');
  const what = typeof lastUserTurn?.content === 'string'
    ? lastUserTurn.content.slice(0, 80)
    : `${def.label} AI 상담 (${exchanged}턴)`;

  // ── §U0-1 6하원칙 "why" (2026-08-10 수정) ──────────────────────────
  // 기존엔 항상 null로 하드코딩돼 있었다(recordOwnerPDV() 함수 자체는
  // why 파라미터를 정상 지원하므로, 이건 라이브러리 결함이 아니라 이
  // 호출부만의 문제였다). 세션을 요약하는 별도 LLM 호출을 새로 만드는
  // 대신(비용·지연 증가), 이미 갖고 있는 데이터로 저비용 개선: 첫
  // 사용자 발화는 보통 이 상담을 시작한 목적을 담고 있다 — what(마지막
  // 발화, 어떻게 끝났는지)과는 다른 축의 정보라 둘 다 남길 가치가 있다.
  const firstUserTurn = messages.find(m => m.role === 'user');
  const why = typeof firstUserTurn?.content === 'string'
    ? firstUserTurn.content.slice(0, 80)
    : null;

  await recordOwnerPDV({
    ownerAgency,
    recordType: 'consultation',
    guid: user.ipv6,
    personaKey: PERSONA,
    personaVersion: _extractPersonaVersion(systemPrompt),
    what,
    how,
    why,
    when: _sessionStartedAt,
    where: location.href,
    outcomeSignals: { explicit_rating: explicitRating },
  }).catch(e => console.warn('[Expert] §7 기관측 PDV 기록 실패(무시):', e.message));

  // 2026-08-20 신설 — 갭① 보완. 위 recordOwnerPDV()는 기관측 가명화
  // 로그(owner_pdv)에만 남기고, 사용자 본인의 "나의 기록 금고"(pdv_records)
  // 에는 지금까지 아무것도 남지 않았다(실사로 확인된 갭). 같은 정보를
  // 사용자측에도 요약 한 줄로 남겨 본인이 자기 상담 이력을 조회할 수
  // 있게 한다 — 실패해도 위 owner_pdv 기록 흐름을 막지 않도록 별도로
  // catch한다(사이드이펙트, 세션 종료 흐름 자체를 지연·차단하지 않음).
  recordUserPdvForExpert({
    ownerAgency,
    personaKey: PERSONA,
    guid: user.ipv6,
    what,
    why,
    when: _sessionStartedAt,
    where: location.href,
  }).catch(e => console.warn('[Expert] 사용자측 PDV 기록 실패(무시):', e.message));
}

async function ensureSystemPrompt() {
  if (systemPrompt) return systemPrompt;
  systemPrompt = await composeExpertPrompt();
  messages = [{ role: 'system', content: systemPrompt }];

  // ── §U0-1 "즉시조회 가능성" (2026-08-10 신설) ──────────────────────
  // 인사말을 실제로 만들기 전에(U0-2/U8-2 요구사항) 이 사용자와 이
  // 기관(ownerAgency) 사이의 과거 상담 기록을 먼저 조회한다. 조회
  // 실패/기록 없음이어도 세션 진행을 막지 않는다(U2 정직성 — 아래
  // 결과는 모델에게 있는 그대로 전달되고, 모델이 "이전 기록이 확인되지
  // 않는다"고 정직하게 안내할지는 U8-5가 이미 규정).
  try {
    const user = _loadUser();
    if (def?.ownerAgency && user?.ipv6) {
      const hist = await queryOwnerPdvSelfHistory({
        ownerAgency: def.ownerAgency,
        guid: user.ipv6,
        personaKeyPrefix: PERSONA.split('-')[0], // 'professor-math' → 'professor' 계열 전체를 본다(리프 단위로 좁히면 과거에 다른 리프로 만났던 기록을 놓침)
        limit: 3,
      });
      let histNote;
      if (hist?.ok && hist.found) {
        const lines = hist.recent.map(r =>
          `- ${r.when || '(시각 미상)'} | ${r.persona_key || PERSONA} | ${r.what || '(내용 미상)'} | 결과: ${r.how}`
        ).join('\n');
        histNote = `[PDV_SELF_HISTORY_RESULT]\n이 사용자와의 과거 상담 총 ${hist.total_visits}건 중 최근 ${hist.recent.length}건:\n${lines}\n이 정보로 인사말에 과거 맥락을 반영하세요(U0-2). 대화 전문이 아니라 요약이므로, 세부 내용이 필요하면 사용자에게 자연스럽게 확인하세요.`;
      } else if (hist?.ok && !hist.found) {
        histNote = `[PDV_SELF_HISTORY_RESULT]\n이 사용자와의 과거 상담 기록이 없습니다(첫 방문으로 보입니다).`;
      } else {
        histNote = `[PDV_SELF_HISTORY_RESULT]\n조회에 실패했습니다 — 기록이 없다고 단정하지 말고, 필요하면 사용자에게 이전 대화 여부를 자연스럽게 물어보세요.`;
      }
      messages.push({ role: 'system', content: histNote });
    }
  } catch (e) {
    console.warn('[Expert] §U0-1 자기이력 조회 단계 실패(무시 — 세션은 계속 진행):', e.message);
  }

  return systemPrompt;
}

// ── [PDV_REQUEST:]/[PDV_HISTORY_REQUEST:] 방어적 스트립 (2026-08-06 신설) ──
// 배경: UNIVERSAL-common(U7-3/U8)이 이 두 태그를 지시하는데, 이 페이지는
// 그걸 실제로 가로채 /pdv/query를 호출하는 실행기(pdv-history-client.js —
// K-서비스 13개 저장소에만 연동돼 있음, 이 허브 저장소엔 없음)를 로드하지
// 않는다. U8-3 자체가 "scope 자리표시자가 치환 안 된 채(`{`로 시작) 남아
// 있으면 태그를 쓰지 않는다"고 지시하고, 이 페이지는 애초에 서버측
// 자리표시자 치환 경로(worker.js handleGovRelay)를 타지 않으므로(정적
// 파일을 직접 fetch) 정상적으로는 모델이 이 자기점검으로 태그 사용을
// 스스로 억제할 것으로 기대된다 — 그래도 그 억제는 프롬프트 준수에 기댄
// 것이지 코드로 강제된 게 아니므로, 혹시 새나오면 사용자 화면에 원시
// 태그 텍스트가 그대로 노출되지 않도록 최소한의 방어망만 둔다. (실행
// 자체를 구현하지 않는 이유: VALID_PDV_SCOPES가 GWP 기관/부서 단위로만
// 등록돼 있고 개별 EXPERT 페르소나 60개엔 등록된 scope가 없다 — U8은
// 애초에 EXPERT 페르소나를 염두에 두고 설계된 기능이 아니다. call-ai.js의
// K-Compose→EXPERT(orchestration_subtask) 경로도 2026-07-19부터 동일한
// 노출을 안고 있었다 — 거기도 동일 원리로 방어 스트립을 추가했다.)
function _stripPdvTags(text) {
  // PDV_HISTORY_REQUEST(U8)는 평문 본문(scope=/period=/reason=)이라 단순
  // 정규식으로 안전하지만, PDV_REQUEST(U7-3)는 fields=[field1, field2, ...]
  // 처럼 본문에 중첩 대괄호를 가진다 — call-ai.js의 _stripBracketTag와
  // 동일한 depth-aware 스캔이 필요하다(단순 `[^\]]*` 정규식은 배열 안쪽
  // 첫 ]에서 잘려 나머지 원문이 그대로 노출된다, 실사로 확인).
  let out = text.replace(/\[PDV_HISTORY_REQUEST:[^\]]*\]/g, '');
  let idx;
  while ((idx = out.indexOf('[PDV_REQUEST:')) !== -1) {
    let depth = 0, end = -1;
    for (let i = idx; i < out.length; i++) {
      if (out[i] === '[') depth++;
      else if (out[i] === ']') {
        depth--;
        if (depth === 0) { end = i + 1; break; }
      }
    }
    if (end === -1) break; // 짝이 안 맞으면(응답이 잘림 등) 더 이상 진행 안 함
    out = out.slice(0, idx) + out.slice(end);
  }
  return out.trim();
}

async function sendTurn(text, attachment) {
  const typing = appendTyping();
  const aiBubble = appendBubble('ai', '');
  aiBubble.style.display = 'none';
  try {
    await ensureSystemPrompt();

    let content = text;
    if (attachment?.isImage) {
      // 멀티모달 image_url 블록 — 메인 webapp.html의 첨부 처리와 동일 형식.
      // (모델이 비전을 지원하지 않으면 서버/모델 쪽에서 무시되거나 오류가
      // 날 수 있음 — 이 페이지 범위에서는 형식만 맞추고 모델별 지원 여부는
      // 별도로 확인하지 않는다.)
      content = [
        { type: 'text', text: text || '(첨부 이미지를 봐주세요)' },
        { type: 'image_url', image_url: { url: attachment.dataUrl } },
      ];
    } else if (attachment) {
      content = `${text ? text + '\n\n' : ''}[첨부 파일: ${attachment.name}]`;
    }

    messages.push({ role: 'user', content });
    let shown = false;
    let full = await callExpertAI(messages, (delta, fullText) => {
      if (!shown) { typing.remove(); aiBubble.style.display = ''; shown = true; }
      aiBubble.innerHTML = escHtml(fullText).replace(/\n/g, '<br>');
      document.getElementById('chat-thread').scrollTop = 1e9;
    });

    // ── [PDV_REQUEST:]/[PDV_HISTORY_REQUEST:] 방어적 스트립 (2026-08-06 신설) ──
    // (근거는 위 _stripPdvTags 주석 참조) `full`을 여기서 곧바로 클린 버전으로
    // 교체한다 — 아래 EXPERT_DONE/WEB_SEARCH/CONNECT_HUMAN_EXPERT/C50 로직이
    // 전부 이 시점 이후의 `full`을 참조하므로, 여기서 한 번만 처리하면
    // 이후 어떤 분기를 타도(예: EXPERT_DONE이 뒤에서 다시 자르는 경우) 원시
    // 태그가 되살아나지 않는다.
    if (/\[PDV(?:_HISTORY)?_REQUEST:/.test(full)) {
      console.warn('[Expert] PDV_REQUEST/PDV_HISTORY_REQUEST 태그가 응답에 나타나 화면에서 제거함(실행기 미구현 — 상세는 _stripPdvTags 주석)');
      full = _stripPdvTags(full);
      aiBubble.innerHTML = escHtml(full).replace(/\n/g, '<br>');
    }

    // ── [SUGGEST_SERVICE_REDIRECT:] EXPERT→GWP 되돌림 (2026-08-06 신설) ──
    // PROFESSIONAL-common Q4 참조. 위 PDV 스트립과 동일한 자리(모든
    // 다운스트림 로직이 참조하는 `full`을 여기서 한 번에 정리) — 배너는
    // 부수효과로 즉시 렌더링되고, 반환값은 태그가 제거된 클린 텍스트다.
    if (/\[SUGGEST_SERVICE_REDIRECT:/.test(full)) {
      full = _maybeHandleServiceRedirectSuggestion(full, aiBubble);
    }
    messages.push({ role: 'assistant', content: full });

    // ── [EXPERT_DONE] 태그 감지 (2026-07-20, C45 신설) ──────────────
    // 정규식 기반 종료 감지(아래 TERMINATION_RE)의 오탐지 문제(상담 내용
    // 자체에 "그만" 등이 등장하면 조기 종료)를 보완 — 페르소나 자신이
    // 대화 맥락으로 판단해 이 태그를 낸다. 사용자에게는 노출하지 않는다
    // (C39의 [CONNECT_HUMAN_EXPERT:] 클라이언트 처리 의무와 동일 패턴).
    const doneTagMatch = full.match(/\s*\[EXPERT_DONE\]\s*$/);
    if (doneTagMatch) {
      const cleaned = full.slice(0, doneTagMatch.index).trim();
      aiBubble.innerHTML = escHtml(cleaned).replace(/\n/g, '<br>');
      messages[messages.length - 1].content = cleaned; // 대화 이력에 태그가 남지 않도록 정리
    }

    // ── [WEB_SEARCH: query=...] 태그 감지 (2026-07-19 신설) ──────────
    // 배경: worker.js의 /web-search(Serper.dev 연동, 일일예산캡·캐싱 포함)와
    // call-ai.js의 _handleWebSearchTag()가 그림자 AI(AC) 쪽엔 이미 있었지만,
    // 전문가 페르소나가 실행되는 이 페이지엔 연결된 적이 없었다 — SP 문서가
    // 뭐라고 지시하든 페르소나가 실제로 검색을 실행할 방법 자체가 없었다는
    // 뜻이다(주피터 지적으로 발견). AC와 동일한 백엔드(/web-search)를 그대로
    // 재사용하고, 결과 재주입 후 한 번 더 응답을 받는 흐름도 동일하게 맞춘다.
    await _maybeHandleWebSearch(full);
    await _maybeHandleOrchestrationTags(full);

    // ── [CONNECT_HUMAN_EXPERT: 업종키워드] 태그 감지 (2026-07-06, C39 신설) ──
    // SP-COMMON-02 C39가 요구하는 "인간 전문가 연결"을 실제로 수행한다.
    // market/webapp.html의 [SEARCH] 인터셉터와 같은 패턴 — 존재하지 않는
    // 사업자를 지어내지 않고, 실제 등록된 사업자만 반환한다(C39-4).
    // C39-5(2026-07-20) — 선택적 `| reason=limit` 세그먼트로 정상 절차/AI
    // 한계 조기이관을 구분한다. 없으면 정상 절차(success)로 취급.
    const connectMatch = full.match(/\[CONNECT_HUMAN_EXPERT:\s*([^\]]+)\]/);
    if (connectMatch) {
      const [rawKeyword, ...rest] = connectMatch[1].split('|').map(s => s.trim());
      const reasonSeg = rest.find(s => /^reason\s*=/.test(s));
      const escReason = reasonSeg && /limit/.test(reasonSeg) ? 'limit' : 'success';
      await _connectHumanExpert(rawKeyword, escReason);
    }

    // ── C50(관제탑 원칙) [NEXT_STEP:] 태그 강제 ────────────────────
    // 위 태그 처리들이 다 끝난 뒤, 즉 이번 응답이 정말 최종 응답으로
    // 확정된 시점에 검사한다. 세션이 이번 턴에 종료되는 경우(아래
    // TERMINATION_RE/doneTagMatch)엔 "다음 행동"을 강제할 이유가 없으므로
    // 건너뛴다.
    if (!TERMINATION_RE.test(text) && !doneTagMatch) {
      await _maybeEnforceNextStep(full, aiBubble);
    }

    if (TERMINATION_RE.test(text) || doneTagMatch) {
      // 45-3(SP_common_guardrails C45) — 정규식(빠른 경로)과 [EXPERT_DONE]
      // (페르소나 판단) 중 하나라도 트리거되면 종료. 둘 다 걸려도 문구는 하나만.
      appendBubble('ai', `상담을 종료합니다. 고팡 화면으로 돌아갑니다…`);
      await _recordExpertOwnerPDV(doneTagMatch && !TERMINATION_RE.test(text) ? 'expert_judged' : 'user_phrase'); // §7 기관측 PDV
      setTimeout(() => { location.href = RETURN; }, 1200);
    }
  } catch (e) {
    typing.remove();
    aiBubble.remove();
    appendBubble('ai', `⚠️ 응답 중 오류가 발생했습니다: ${escHtml(e.message)}. 잠시 후 다시 시도해 주세요.`);
  }
}

// ── [WEB_SEARCH: query=...] 처리 (2026-07-19 신설, 2026-07-19 재정정) ────
// 이 태그는 AC 범용 기능이 아니라 K-Search(SP-18_ksearch) RULE-07 [7-B]가
// 정의한 태그다(v1.3, 2026-07-11 신설) — 원래는 K-Search 핸드오프 이후에만
// emit되도록 설계됐다. EXPERT 페르소나가 이 태그를 직접 쓰는 건 K-Search
// 본체(및 그 RULE-01 안전장치)를 거치지 않는 지름길이므로, 최소한 결과
// 보고 형식만큼은 K-Search RULE-07 [7-A] 대체형과 동일하게 맞춘다(아래
// searchInject) — "Hondi 내부에서 검증된 게 아닌 웹 참고정보"임을 명시.
// RULE-01의 실행 전 판단(전수조사·감시추적 정황·민감정보·전화번호 역조회
// 금지 등)은 SP_common_guardrails C43-1+에 요지가 반영돼 있고, 판단 자체는
// (이 코드가 아니라) 페르소나 자신이 C43 지시에 따라 검색 실행 전에 한다 —
// 이 판단이 코드 레벨 정규식 필터링이 아니라 LLM 판단에 맡겨진 이유는
// "감시·추적 정황" 같은 신호가 문맥 의존적이라 규칙만으로 걸러내기
// 어렵기 때문이다(K-Search 본체도 같은 방식으로 자기 자신의 SP 지시에
// 따라 판단한다 — 이 코드는 그 판단이 이뤄졌다고 전제하고 실행만 한다).
//
// call-ai.js의 _handleWebSearchTag()와 동일한 백엔드(worker.js /web-search
// — Serper.dev 연동, 일일예산캡·캐싱 포함)를 그대로 재사용한다. depth로
// 무한 루프를 방지한다(한 사용자 턴당 검색 최대 2회 — 그 이상 필요하면
// 페르소나가 사용자에게 직접 안내해야 한다).
// ── C50(관제탑 원칙) [NEXT_STEP:] 태그 강제 (2026-08-06, 재배선) ──────
// SP_common_guardrails C50 참조. 이 페이지가 실제 EXPERT 페르소나 대화가
// 벌어지는 라이브 경로이므로, 강제 로직도 여기 있어야 실제로 동작한다
// (최초 구현 시 call-ai.js에 걸어 죽은 게이트에 물려 있던 실수는
// expert-session.js 상단 주석·아카이브 참조). 판정 자체는
// expert-session.js의 _missingNextStepMarker()(순수 함수, C50-3의
// "아직 결론 없는 되묻기 턴" 예외 포함)를 그대로 재사용한다.
//
// 이미 스트리밍된 답변은 화면에서 지우지 않는다(사용자가 이미 읽고
// 있을 수 있음 — GOV_TASK_SUBMIT_REQUEST류 삭제 패턴과 다른 원칙).
// history(messages)에 정상 기록한 뒤 보정 지시만 추가로 보내고, 그
// 응답을 새 버블로 이어 붙인다. 무한루프 방지 상한을 넘으면 조용히
// 포기한다(사용자 경험을 해치는 게 원칙 준수보다 나쁘므로).
async function _maybeEnforceNextStep(fullReply, aiBubble) {
  if (!_missingNextStepMarker(fullReply)) return false; // 이미 충족 또는 예외 대상

  if (_nextStepRetryCount >= _NEXT_STEP_RETRY_MAX) {
    console.warn('[C50] NEXT_STEP 보정 재시도 한도 초과 — 이번 턴은 그냥 통과');
    return false;
  }
  _nextStepRetryCount += 1;

  const nudge =
    `[INTERNAL: 방금 응답에 [NEXT_STEP: ...] 태그가 없습니다 — ` +
    `SP_common_guardrails C50(관제탑 원칙)에 따라, 지금 사용자가 당장 ` +
    `할 수 있는 다음 행동이나 답해야 할 질문 한 가지를 ` +
    `[NEXT_STEP: ...] 태그로 명시해 짧게 이어서 답하세요. 방금 답변을 ` +
    `반복하지 말고, 정말로 다음 한 걸음만 제시하세요.]`;
  messages.push({ role: 'user', content: nudge });

  const nudgeReply = await callExpertAI(messages, (delta, fullText) => {
    aiBubble.innerHTML = escHtml(fullReply + '\n\n' + fullText).replace(/\n/g, '<br>');
    document.getElementById('chat-thread').scrollTop = 1e9;
  });
  messages.push({ role: 'assistant', content: nudgeReply });
  return true;
}

async function _maybeHandleWebSearch(fullReply, depth = 0) {
  const m = fullReply.match(/\[WEB_SEARCH:\s*query=([^\]]+)\]/);
  if (!m) return;

  if (depth >= 2) {
    console.warn('[Expert] WEB_SEARCH 반복 한도(2회) 도달 — 추가 검색 없이 현재 응답으로 진행');
    return;
  }

  const query = m[1].trim();
  const box = appendBubble('ai', `<i>"${escHtml(query)}" 관련 정보를 검색하는 중…</i>`);

  let resultText;
  try {
    const res = await fetch(`${RELAY_ENDPOINT}/web-search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 429(일일예산 초과)·503(키 미설정) 등도 조용히 감추지 않고 정직하게
      // 전달한다(call-ai.js의 동일 원칙과 일치).
      resultText = `검색 불가: ${data.message || data.error || `HTTP ${res.status}`}`;
    } else {
      const parts = [];
      if (data.answer_box) parts.push(`[요약] ${data.answer_box.title}: ${data.answer_box.snippet}`);
      if (data.knowledge_graph) parts.push(`[정보] ${data.knowledge_graph.title} — ${data.knowledge_graph.description}`);
      (data.organic || []).forEach((r, i) => {
        parts.push(`${i + 1}. ${r.title} — ${r.snippet} (${r.link})`);
      });
      resultText = parts.length > 0 ? parts.join('\n') : '검색 결과 없음';
    }
  } catch (e) {
    resultText = `검색 오류: ${e.message}`;
  }

  box.innerHTML = `<i>"${escHtml(query)}" 검색 완료</i>`;

  // K-Search RULE-07 [7-A] 대체형과 동일한 보고 형식 — "Hondi 내부에서
  // 검증된 게 아닌 웹 참고정보"임을 명시(guid 등 Hondi 검증 필드와 구분).
  const searchInject =
    `[웹 검색결과 — 미검증, 출처: 웹, K-Search RULE-07 [7-A] 대체형 준용] ${resultText}\n\n` +
    `이 정보는 Hondi 내부에서 검증된 게 아닙니다. 이 결과를 반영해 답하되, ` +
    `여전히 불확실한 부분은 [VERIFY] 표시와 함께 사용자 본인 확인을 권하세요. ` +
    `검색 결과에 없는 제3자의 정보(나이·거래이력 등)를 추정해 채우지 마세요(RULE-01 금지-10).`;
  messages.push({ role: 'user', content: searchInject });

  let shown = false;
  const aiBubble = appendBubble('ai', '');
  aiBubble.style.display = 'none';
  const full = await callExpertAI(messages, (delta, fullText) => {
    if (!shown) { aiBubble.style.display = ''; shown = true; }
    aiBubble.innerHTML = escHtml(fullText).replace(/\n/g, '<br>');
    document.getElementById('chat-thread').scrollTop = 1e9;
  });
  messages.push({ role: 'assistant', content: full });

  // 이어진 응답이 또 검색을 요청하면(예: 1차 검색으로 부족했던 경우) depth+1로
  // 재귀 — 2회 한도에 도달하면 위에서 조용히 종료.
  await _maybeHandleWebSearch(full, depth + 1);
}

// ── PROCEDURE_MAP_LOOKUP/DRAFT/UPDATE + CALL_GOVSYS 처리 (2026-07-20 신설) ──
// call-ai.js의 동일 이름 핸들러(§0-H 부근)를 그대로 이식한다 — 같은 백엔드
// (worker.js의 /orchestration/procedure-map*, /orchestration/execute-atom),
// 같은 정규식, 같은 정직한 한계(PROCEDURE_MAP_DRAFT는 goal 필드만 안전하게
// 추출하고 steps 등 구조화 필드는 아직 파싱하지 않음 — call-ai.js 원본 주석과
// 동일한 이유: 태그 바디가 완전한 JSON이 아니라 준-JSON 자유 텍스트라서다).
//
// call-ai.js와 다른 점 — 딱 하나, 의도적: 원본은
// `if (CFG.system?.includes('K-Compose') || CFG.system?.includes('K-Deliver'))`
// 로 게이트돼 있다. 이건 K-Compose/K-Deliver가 AC의 System Prompt로 전환된
// 상태에서만 작동하게 만든 것인데, expert-chat.html에서는 CFG.system이 애초에
// 항상 "이 페르소나 자신"이라 그런 게이트 자체가 성립하지 않는다(무엇과
// 비교해 켤지 대상이 없음). SP_lawyer STEP R이 K-Compose 전용으로 설계된
// 태그를 빌려 쓰면서 이 게이트에 원천적으로 걸릴 수밖에 없었던 것도 이번에
// 함께 확인됐다 — 그래서 게이트를 빼고 이식한다(K-Compose가 아닌 페르소나가
// 써도 안전한 범용 오케스트레이션 프리미티브이므로 무해하다).
async function _maybeHandleOrchestrationTags(fullReply) {
  // ── [CONSULT_SPECIALIST: id=..., question=...] 내부 자문 호출 (2026-08-07
  // 신설) ────────────────────────────────────────────────────────
  // 부모 페르소나(의사·교수 등)가 대화 중 세부분야 전문가 소견이
  // 필요하다고 판단했을 때, 새 탭을 열지 않고 이 탭 안에서 자식 SP에게
  // 좁은 질문 하나만 던져 소견을 받아온다. C41(0-(-1) 오케스트레이션
  // 하위 판단 요청) 프로토콜을 그대로 재사용 — 자식은 STEP A~D 전체를
  // 밟지 않고 [ORCHESTRATION_SUBTASK_RESULT: verdict=..., confidence=...,
  // needs_full_consultation=...]만 반환한다. 사용자에게는 "OO AI와 소통
  // 중…" 진행상황만 짧게 보여준다(관제탑 원칙 — 문서형 나열 금지, 그
  // 순간 사용자에게 필요한 한 걸음만).
  const consultMatch = fullReply.match(/\[CONSULT_SPECIALIST:\s*id=([\w-]+),\s*question=([^\]]+)\]/);
  if (consultMatch) {
    const childId = consultMatch[1].trim();
    const question = consultMatch[2].trim();

    if (!isConsultableChild(PERSONA, childId)) {
      console.warn(`[Expert] 등록되지 않은 자문 대상 — 거부: ${childId} (현재 페르소나: ${PERSONA})`);
      messages.push({ role: 'user', content:
        `[CONSULT_SPECIALIST 결과] 오류: "${childId}"는 이 페르소나가 자문을 구할 수 있는 ` +
        `등록된 세부분야가 아닙니다. 다른 방법으로 답변을 완성하거나, 필요하면 실제 인간 ` +
        `전문가 연결을 안내하세요.` });
      await _continueAfterOrchestrationTag();
      return;
    }

    const childDef = EXPERT_REGISTRY[childId];
    const progressBubble = appendBubble('ai', `🔄 ${childDef.label} AI와 소통 중…`);
    progressBubble.style.opacity = '0.65';
    document.getElementById('chat-thread').scrollTop = 1e9;

    let resultText;
    try {
      const childSystemPrompt = await _composeConsultPrompt(childDef);
      const childMessages = [
        { role: 'system', content: childSystemPrompt },
        { role: 'user', content:
          `[ORCHESTRATION_SUBTASK 요청 — scope=orchestration_subtask]\n` +
          `다른 전문가 페르소나(${EXPERT_REGISTRY[PERSONA]?.label || PERSONA})가 진행 중인 ` +
          `상담에서 당신의 세부분야 소견만 필요합니다. STEP A~D 전체를 밟지 말고, 아래 ` +
          `질문에 대해 STEP A-2급 깊이(사실확인 수준)로만 답한 뒤 반드시 다음 형식으로 ` +
          `마무리하세요:\n` +
          `[ORCHESTRATION_SUBTASK_RESULT: verdict={결론 요약 한두 문장}, confidence={0~10}, needs_full_consultation={true|false}]\n\n` +
          `질문: ${question}` },
      ];
      const childReply = await callExpertAI(childMessages, () => {});
      const resultMatch = childReply.match(/\[ORCHESTRATION_SUBTASK_RESULT:[^\]]+\]/);
      resultText = resultMatch ? resultMatch[0] : childReply.trim();
    } catch (e) {
      resultText = `[ORCHESTRATION_SUBTASK_RESULT: verdict=자문 호출 실패(${e.message}), confidence=0, needs_full_consultation=true]`;
    }

    progressBubble.textContent = `✅ ${childDef.label} AI 의견 접수`;

    messages.push({ role: 'user', content:
      `[CONSULT_SPECIALIST 결과 — ${childDef.label}] ${resultText}\n\n` +
      `이 소견을 반영해 사용자에게 자연스럽게 답변을 이어가세요. "자문을 구했습니다" 같은 ` +
      `과정 설명에 머물지 말고, 그 소견이 실제로 답변 내용에 반영된 결론을 말하세요(관제탑 원칙).` });
    await _continueAfterOrchestrationTag();
    return;
  }

  const updateMatch = fullReply.match(/\[PROCEDURE_MAP_UPDATE:\s*goal=([^,\]]+)/);
  if (updateMatch && fullReply.includes('[PROCEDURE_MAP_UPDATE:')) {
    console.log('[Expert] PROCEDURE_MAP_UPDATE 감지 — worker.js 갱신 요청');
    let resultText;
    try {
      const res = await fetch(`${RELAY_ENDPOINT}/orchestration/procedure-map/update`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal: updateMatch[1].trim(), changes: [] }),
      });
      resultText = JSON.stringify(await res.json().catch(() => ({ status: res.status })));
    } catch (e) {
      resultText = `{"error":"${e.message}"}`;
    }
    messages.push({ role: 'user', content: `[PROCEDURE_MAP_UPDATE 결과] ${resultText}` });
    await _continueAfterOrchestrationTag();
    return;
  }

  const lookupMatch = fullReply.match(/\[PROCEDURE_MAP_LOOKUP:\s*goal=([^\]]+)\]/);
  if (lookupMatch) {
    console.log('[Expert] PROCEDURE_MAP_LOOKUP 감지 — worker.js 조회');
    let resultText;
    try {
      const res = await fetch(`${RELAY_ENDPOINT}/orchestration/procedure-map?goal=${encodeURIComponent(lookupMatch[1].trim())}`);
      resultText = res.ok ? JSON.stringify(await res.json()) : `{"error":"HTTP ${res.status}"}`;
    } catch (e) {
      resultText = `{"error":"${e.message}"}`;
    }
    messages.push({ role: 'user', content: `[PROCEDURE_MAP_LOOKUP 결과] ${resultText}` });
    await _continueAfterOrchestrationTag();
    return;
  }

  const draftMatch = fullReply.match(/\[PROCEDURE_MAP_DRAFT:([\s\S]*)\]$/m);
  if (draftMatch && fullReply.includes('[PROCEDURE_MAP_DRAFT:')) {
    console.log('[Expert] PROCEDURE_MAP_DRAFT 감지 — worker.js 등재 요청');
    // ★ 정직한 한계(call-ai.js 원본과 동일) ★ goal 필드만 안전하게 추출한다
    // — steps 등 구조화 필드는 이번 배선에서 전달하지 않는다.
    const goalM = draftMatch[1].match(/goal=([^,\]]+)/);
    let resultText;
    if (!goalM) {
      resultText = '{"error":"goal 필드를 이 태그 바디에서 못 찾음 — 등재 생략"}';
    } else {
      try {
        const res = await fetch(`${RELAY_ENDPOINT}/orchestration/procedure-map/draft`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal: goalM[1].trim(), domain: '', steps: [] }),
        });
        resultText = JSON.stringify(await res.json().catch(() => ({ status: res.status })));
      } catch (e) {
        resultText = `{"error":"${e.message}"}`;
      }
    }
    messages.push({ role: 'user', content: `[PROCEDURE_MAP_DRAFT 결과] ${resultText}` });
    await _continueAfterOrchestrationTag();
    return;
  }

  const govsysMatch = fullReply.match(/\[CALL_GOVSYS:\s*id=([\w-]+),\s*mode=([\w-]+),\s*caller=([\w-]+)\]/);
  if (govsysMatch) {
    console.log('[Expert] CALL_GOVSYS 감지 — /orchestration/execute-atom 호출(id=atom_id로 취급)');
    let resultText;
    try {
      const res = await fetch(`${RELAY_ENDPOINT}/orchestration/execute-atom`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ atom_id: govsysMatch[1], atom_input: {} }),
      });
      resultText = JSON.stringify(await res.json().catch(() => ({ status: res.status })));
    } catch (e) {
      resultText = `{"error":"${e.message}"}`;
    }
    messages.push({ role: 'user', content:
      `[CALL_GOVSYS 결과] ${resultText}\n\n결과가 requires_user_action이면 그 사유를 이용자에게 자연스럽게 전달하세요.` });
    await _continueAfterOrchestrationTag();
    return;
  }
}

// 위 네 핸들러 공통 후속 처리 — 결과를 재주입한 뒤 한 번 더 응답을 받는다
// (WEB_SEARCH의 재호출 패턴과 동일).
async function _continueAfterOrchestrationTag() {
  let shown = false;
  const aiBubble = appendBubble('ai', '');
  aiBubble.style.display = 'none';
  const full = await callExpertAI(messages, (delta, fullText) => {
    if (!shown) { aiBubble.style.display = ''; shown = true; }
    aiBubble.innerHTML = escHtml(fullText).replace(/\n/g, '<br>');
    document.getElementById('chat-thread').scrollTop = 1e9;
  });
  messages.push({ role: 'assistant', content: full });
  // 이어진 응답이 또 오케스트레이션 태그를 요청하면(예: LOOKUP 후 DRAFT로
  // 이어지는 흐름) 재귀 처리한다. WEB_SEARCH와 달리 depth 한도를 별도로
  // 두지 않는 이유: STEP R 자체가 LOOKUP→DRAFT→CALL_GOVSYS로 이어지는
  // 정상적인 다단계 흐름을 갖고 있어(SP_lawyer STEP R 참조), 인위적으로
  // 끊으면 오히려 그 흐름을 깬다 — 대신 각 fetch 자체에 실패 시 에러
  // 텍스트가 재주입되므로 모델이 무한 재시도할 유인이 없다.
  await _maybeHandleOrchestrationTags(full);
}

// market의 search_entities RPC를 호출해 관련 업종의 실제 등록 사업자를
// 찾아 보여준다. 결과가 없으면 없다고 정직하게 알린다(C39-4).
async function _connectHumanExpert(occupationKeyword, escReason = 'success') {
  _escalationReason = escReason; // §7 how 필드 판정용 — C39-5 반영(2026-07-20)
  const box = appendBubble('ai', `<i>market에서 "${escHtml(occupationKeyword)}" 관련 등록
    사업자를 찾는 중…</i>`);
  try {
    const user = _loadUser();
    const res = await fetch(`${RELAY_ENDPOINT}/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_keyword: '', p_occupation: occupationKeyword, p_address: null,
        p_entity_type: 'business', p_limit: 5, p_offset: 0, p_lang_code: 'ko',
        p_sort: 'rating', p_trust_min: null, p_gdc_only: null,
        p_exclude_guid: user?.ipv6 || null, p_handle: null, p_nickname: null,
        p_primary_guid: null, p_l1_node: null, p_l2_node: null,
      }),
    });
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.rows || data.data || []);
    if (!res.ok || !rows.length) {
      box.innerHTML = `market에 "${escHtml(occupationKeyword)}" 관련 등록 사업자가
        아직 부족합니다. 직접 검색하시거나 아는 인간 전문가에게 문의하시는 것을
        권합니다.`;
      return;
    }
    const list = rows.slice(0, 5).map(r =>
      `· ${escHtml(r.name || r.nickname || '(이름 없음)')}` +
      (r.address ? ` (${escHtml(r.address)})` : '') +
      (r.rating_avg != null ? ` ★${r.rating_avg}` : '')
    ).join('<br>');
    box.innerHTML = `market에 등록된 관련 사업자입니다:<br>${list}<br><br>
      <i>연결하지 않고 위 AI 판단만으로 행동하실 경우의 위험은 앞서 안내드린
      대로입니다 — 실제 진행은 위 사업자와 직접 상담하신 뒤 결정하시길
      권합니다.</i>`;
  } catch (e) {
    console.warn('[Expert] CONNECT_HUMAN_EXPERT 실패:', e.message);
    box.innerHTML = `market 검색 중 오류가 발생했습니다. 직접 검색하시거나 아는
      인간 전문가에게 문의하시는 것을 권합니다.`;
  }
}

// ══════════════════════════════════════════════════════════════
// 2026-08-15 신설 — 전문가 페르소나(리프) 개별 구독 게이트. 첫 접근은
// worker.js(/expert-persona/access)가 청구 없이 자동으로 무료체험
// 레코드를 만들어 통과시킨다(첫 1일 무료, 2026-08-15 주피터 지시로
// 1개월 → 1일로 단축). 이후
// 정지(suspended)된 경우에만 여기서 결제 화면을 보여준다.
//
// 게이트 조회 자체가 실패하면(네트워크 오류 등) 막지 않고 그냥 통과시킨다
// — 결제 여부를 확정할 수 없다고 상담 자체를 차단하면 가용성이 더 크게
// 훼손된다는 판단(기존 FREE_QUOTA_ENFORCEMENT_ENABLED 등 다른 게이트와
// 동일한 방향의 절충). 실제 청구 누락 여부는 서버 로그(EXPERT_PERSONA_
// BILLING 태그)로 사후 확인한다.
// ══════════════════════════════════════════════════════════════
async function _ensureExpertPersonaAccess() {
  const user = _loadUser();
  const guid = user?.ipv6;
  if (!guid) { startGreeting(); return; } // 비로그인 등 guid 없음 — 기존 동작 유지

  let data;
  try {
    const res = await fetch(`${RELAY_ENDPOINT}/expert-persona/access?guid=${encodeURIComponent(guid)}&personaId=${encodeURIComponent(PERSONA)}`);
    data = await res.json();
  } catch (e) {
    console.warn('[Expert] 구독 게이트 조회 실패(통과 처리):', e.message);
    startGreeting();
    return;
  }

  if (data?.access) {
    if (data.trial) {
      const untilStr = data.trial_until ? new Date(data.trial_until).toLocaleDateString('ko-KR') : '';
      appendBubble('ai', `📌 ${escHtml(def.label)} AI는 첫 1일 무료입니다${untilStr ? `(${untilStr}까지)` : ''}. 이후 월 ${EXPERT_PERSONA_MONTHLY_FEE_KRW_DISPLAY}원이 GDC 잔액에서 자동 청구됩니다.`);
    }
    startGreeting();
    return;
  }

  // 정지 상태 — 결제 안내 + 재구독 버튼
  const btnId = 'expert-resub-btn-' + Date.now();
  appendBubble('ai',
    `${escHtml(data?.message || 'GDC 잔액 부족으로 이 페르소나 구독이 정지됐습니다.')}<br>` +
    `월 이용료: <b>${EXPERT_PERSONA_MONTHLY_FEE_KRW_DISPLAY}원</b><br><br>` +
    `<button id="${btnId}" onclick="_resubscribeExpertPersona('${btnId}')" style="margin-top:4px;padding:8px 14px;border:none;border-radius:8px;background:#0057A8;color:#fff;font-weight:600;cursor:pointer">` +
    `💳 지금 결제하고 계속하기</button>`
  );
}
const EXPERT_PERSONA_MONTHLY_FEE_KRW_DISPLAY = '9,900';

window._resubscribeExpertPersona = async function(btnId) {
  const user = _loadUser();
  const guid = user?.ipv6;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = '결제 처리 중…'; }
  try {
    const res = await fetch(`${RELAY_ENDPOINT}/expert-persona/resubscribe`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid, personaId: PERSONA }),
    });
    const data = await res.json();
    if (!res.ok || data?.ok === false) {
      appendBubble('ai', `⚠ 결제에 실패했습니다: ${escHtml(data?.message || data?.error || '알 수 없는 오류')}`);
      if (btn) { btn.disabled = false; btn.textContent = '💳 지금 결제하고 계속하기'; }
      return;
    }
    appendBubble('ai', '✅ 결제가 완료됐습니다. 상담을 시작합니다.');
    startGreeting();
  } catch (e) {
    appendBubble('ai', `⚠ 결제 처리 중 오류: ${escHtml(e.message)}`);
    if (btn) { btn.disabled = false; btn.textContent = '💳 지금 결제하고 계속하기'; }
  }
};

function startGreeting() {
  // GWP_CTX(그림자 AI로부터 전달된, 사용자가 방금 한 발화 원문)가 있으면
  // 정적 인사·재질문 없이 그 발화를 곧바로 첫 턴으로 사용한다 — klaw 등
  // 기관 서비스와 완전히 동일한 원칙.
  if (GWP_CTX && !_gwpSeedUsed) {
    _gwpSeedUsed = true;
    appendBubble('user', `<i>(AI 비서로부터 전달됨)</i><br>${escHtml(GWP_CTX).replace(/\n/g,'<br>')}`);
    sendTurn(GWP_CTX);
    return;
  }
  appendBubble('ai', `안녕하세요. 저는 ${escHtml(def.label)} AI입니다. 무엇을 도와드릴까요?`);
}

// ══════════════════════════════════════════════════════════════
// 입력 바
// ══════════════════════════════════════════════════════════════
const input   = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const auxBtns = document.getElementById('input-aux-btns');
function updateSendBtn() { sendBtn.disabled = !input.value.trim() && !_attachedFile; }
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  // ★ 2026-07-22 신설 — 메인 앱 입력창(webapp.html .input-dock)과
  // 동일하게, 글자가 있으면 좌측 아이콘(첨부/카메라/마이크)을 접어
  // 입력창을 넓힌다(공용 CSS #input-aux-btns.hidden 트랜지션 재사용).
  // 단, 마이크로 받아쓰는 중에는 숨기지 않는다 — 안 그러면 받아쓴
  // 텍스트가 채워지는 순간 마이크 버튼 자신이 숨겨져 정지할 방법이
  // 없어지는 막다른 상황이 생긴다(실사로 재현 확인, regional-gov.html
  // 쪽에서 먼저 발견).
  const _micRecording = document.getElementById('btn-mic')?.classList.contains('mic-recording');
  if (auxBtns) auxBtns.classList.toggle('hidden', input.value.length > 0 && !_micRecording);
  updateSendBtn();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);

// ── 파일 첨부 / 카메라 (2026-07-06 신설) ────────────────────────
// 메인 webapp.html의 AI 패널 첨부 패턴(ia-btn, attach-preview)을 그대로
// 이식 — 이미지는 멀티모달 image_url 블록으로 보내고, 그 외 파일은
// 파일명만 텍스트로 첨부한다(메인 채팅과 동일 원칙).
let _attachedFile = null; // { name, dataUrl, isImage }

const fileInput   = document.getElementById('file-input');
const cameraInput = document.getElementById('camera-input');
const preview     = document.getElementById('attach-preview');
const previewName = document.getElementById('attach-name');

document.getElementById('btn-attach').addEventListener('click', () => fileInput.click());
document.getElementById('btn-camera').addEventListener('click', () => cameraInput.click());
document.getElementById('attach-remove').addEventListener('click', clearAttach);

fileInput.addEventListener('change', () => handleFileSelect(fileInput.files?.[0]));
cameraInput.addEventListener('change', () => handleFileSelect(cameraInput.files?.[0]));

function handleFileSelect(file) {
  if (!file) return;
  const isImage = file.type.startsWith('image/');
  const reader = new FileReader();
  reader.onload = () => {
    _attachedFile = { name: file.name, dataUrl: reader.result, isImage };
    previewName.textContent = `📎 ${file.name}`;
    preview.style.display = 'flex';
    updateSendBtn();
  };
  reader.onerror = () => console.warn('[Expert] 파일 읽기 실패:', reader.error);
  reader.readAsDataURL(file);
}

function clearAttach() {
  _attachedFile = null;
  fileInput.value = '';
  cameraInput.value = '';
  preview.style.display = 'none';
  updateSendBtn();
}

// ── 마이크(음성 입력) — 단발 토글, 1초 무음 시 자동 전송 ──────────
// 2026-07-19 재수정 — 이전 버전은 주석만 "webapp.html의 ai-panel-mic-btn과
// 동일한 패턴"이라 해놓고 실제 설정은 그게 아니라 웹앱의 별개 기능(상시
// 대기 "혼디야" 호출어 리스너)의 설정(continuous:true)을 잘못 베껴온
// 것이었다(실사용자 신고 — "활성화됐다가 바로 stop"). 진짜 ai-panel-mic-btn
// 구현(webapp.html 3137행대)은 continuous:false를 쓰고, 결정적으로
// "무음 타이머"를 클릭 직후가 아니라 **결과가 한 번이라도 들어온 뒤에만**
// 건다 — 이전 버전은 클릭하자마자 1초 타이머를 걸어서, 말하기 전에
// 1초만 머뭇거려도 죽었다. 이번엔 그 실수를 그대로 재현하지 않도록
// 원본을 통째로 옮겨왔다.
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('btn-mic');
  if (!SR || !micBtn) { if (micBtn) micBtn.style.display = 'none'; return; }

  const SILENCE_MS = 1000;      // 1초 무음 → 자동 종료
  const RESTART_DELAY_MS = 150; // 재시작 전 짧은 지연(오디오 핸들 해제 대기)

  let recognition = null;
  let active = false;
  let baseText = '';
  let errorStreak = 0;
  let silenceTimer = null;

  function setMicVisual(on) { micBtn.classList.toggle('mic-recording', on); }
  function clearSilenceTimer() { if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; } }

  // 결과가 들어온 뒤에만 호출된다(startMic()에서는 호출하지 않음) —
  // 클릭 직후부터 무음을 세면 말하기 전 잠깐의 정적만으로도 꺼진다.
  //
  // 2026-07-19 추가 — 무음 시 마이크만 끄고 입력창에 텍스트를 남겨두는
  // 것으로 처음 고쳤으나(자동 stop 버그 수정에 집중), 실사용자 신고로
  // "터치해야만 전송되는 건 원치 않는다"는 게 확인됨 — 진짜 참조
  // 구현(webapp.html의 ai-panel-mic-btn `scheduleAutoSend`)도 원래
  // 무음 시 자동으로 전송까지 한다. 그 동작을 그대로 맞춘다.
  function scheduleAutoStop() {
    clearSilenceTimer();
    silenceTimer = setTimeout(() => {
      silenceTimer = null;
      if (!active) return;
      if (input.value.trim()) {
        stopMic();
        doSend();
      } else {
        stopMic();
      }
    }, SILENCE_MS);
  }

  function createRecognition() {
    const r = new SR();
    r.lang = 'ko-KR';
    r.continuous = false;
    r.interimResults = false;

    r.onresult = (e) => {
      const text = e.results?.[0]?.[0]?.transcript || '';
      if (text) {
        baseText = baseText && !/\s$/.test(baseText) ? baseText + ' ' + text : baseText + text;
        input.value = baseText;
        input.dispatchEvent(new Event('input'));
      }
      errorStreak = 0;
      scheduleAutoStop();
    };
    r.onerror = (e) => {
      // 무음(no-speech)·중단(aborted)은 흔히 발생하는 정상적인 일시
      // 정지다 — onend에서 자동 재시작되므로 여기서 죽이지 않는다.
      // (이전 버전은 이걸 구분 안 하고 모든 오류에 즉시 stopMic()을
      // 불러서, continuous:false의 자연스러운 no-speech 타임아웃조차
      // "고장"으로 오인해 죽었다.)
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      errorStreak++;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || errorStreak >= 3) {
        stopMic();
      }
    };
    r.onend = () => {
      // 자연 종료(no-speech 타임아웃 등)면 계속 듣고 있는 것처럼 보이게
      // 조용히 재시작 — 사용자가 stopMic()을 부르지 않은 이상 마이크가
      // 꺼지지 않는다.
      if (active) setTimeout(() => { if (active) startListening(); }, RESTART_DELAY_MS);
      else setMicVisual(false);
    };
    return r;
  }

  function startListening() {
    recognition = createRecognition();
    try { recognition.start(); return true; }
    catch (e) { return false; } // 이미 시작된 경우 등 — 다음 onend를 기다린다
  }

  function startMic() {
    baseText = input.value ? input.value + ' ' : '';
    active = true;
    if (!startListening()) { active = false; return; }
    setMicVisual(true);
    // scheduleAutoStop()을 여기서 부르지 않는다 — 위 주석 참고.
  }

  function stopMic() {
    active = false;
    clearSilenceTimer();
    setMicVisual(false);
    try { recognition?.stop(); } catch (e) {}
    recognition = null;
  }

  micBtn.addEventListener('click', () => { active ? stopMic() : startMic(); });
})();

function doSend() {
  const text = input.value.trim();
  if (!text && !_attachedFile) return;

  if (_attachedFile) {
    appendBubble('user', `${escHtml(text)}${text ? '<br>' : ''}📎 ${escHtml(_attachedFile.name)}`.trim());
  } else {
    appendBubble('user', escHtml(text).replace(/\n/g,'<br>'));
  }

  const attachment = _attachedFile;
  input.value = ''; input.style.height = 'auto';
  clearAttach();

  sendTurn(text, attachment);
}
updateSendBtn();


// 10분 무응답 자동 종료(전문가 세션 관례와 동일)
let _idleTimer = null;
function _resetIdle() {
  if (_idleTimer) clearTimeout(_idleTimer);
  _idleTimer = setTimeout(() => {
    appendBubble('ai', '10분간 응답이 없어 상담을 종료합니다. 고팡 화면으로 돌아갑니다…');
    _recordExpertOwnerPDV('timeout'); // §7 기관측 PDV (2026-07-20) — await 없이 발사(페이지 곧 이동)
    setTimeout(() => { location.href = RETURN; }, 1500);
  }, 10 * 60 * 1000);
}
document.addEventListener('click', _resetIdle);
document.addEventListener('keydown', _resetIdle);
_resetIdle();

_ensureExpertPersonaAccess();
</script>
