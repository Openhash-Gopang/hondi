<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혼디 숫자 코드</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#111827; --sub:#4b5563; --ok:#0a7d33; --okbg:#e3f5e9; --bad:#b42318; --warn:#8a5a00; --warnbg:#fff1d6; --acc:#1e4fd8; --accbg:#e8eefc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif; font-size:16px; line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:18px; margin:0 0 10px; }
  p.sub { color:var(--sub); margin:0 0 14px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card.locked { opacity:.55; }
  .lockmsg { display:none; color:var(--warn); background:var(--warnbg); border-radius:8px; padding:8px 10px; font-size:15px; margin:0 0 10px; }
  .card.locked .lockmsg { display:block; }
  label { display:block; font-size:15px; color:var(--sub); margin:8px 0 4px; }
  input[type=text] { width:100%; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  input[readonly] { background:#f1f3f6; }
  button { font-family:inherit; font-size:16px; padding:11px 16px; border-radius:10px; border:1px solid var(--acc); background:var(--acc); color:#fff; cursor:pointer; margin:8px 8px 0 0; }
  button.ghost { background:#fff; color:var(--acc); }
  button[disabled] { opacity:.4; cursor:default; }
  .banner { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:8px 10px; font-size:14px; margin:0 0 10px; }
  .banner.server { background:var(--okbg); color:var(--ok); }
  ol.steps { list-style:none; display:flex; gap:6px; padding:0; margin:0 0 8px; }
  ol.steps li { flex:1; text-align:center; font-size:14px; padding:6px 4px; border-radius:8px; background:#f1f3f6; color:var(--sub); }
  ol.steps li.now { background:var(--accbg); color:var(--acc); font-weight:700; }
  ol.steps li.done { background:var(--okbg); color:var(--ok); font-weight:700; }
  .msg { min-height:24px; margin:8px 0 0; font-size:15px; } .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); } .msg.warn { color:var(--warn); }
  .wait input[type=text] { width:100%; font-size:20px; letter-spacing:.3em; text-align:center; }
  .wait { display:none; margin-top:10px; padding:12px; background:var(--accbg); color:var(--acc); border-radius:10px; font-size:15px; }
  .reg { display:none; margin-top:10px; padding:10px 12px; background:var(--okbg); color:var(--ok); border-radius:10px; font-size:16px; }
  .reg b { font-size:22px; letter-spacing:.12em; }
  .reg .codeImg { display:block; width:100%; max-width:420px; height:auto; margin:10px 0; border-radius:8px; background:#fff; }
  .reg .regBtns { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btnlink { display:inline-block; font-size:16px; padding:10px 14px; border-radius:10px; border:1px solid var(--acc); color:var(--acc); text-decoration:none; background:var(--card); }
  #codeOut canvas { max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  /* 카메라 창: 숫자 코드의 가로로 긴 비율에 맞춘다 (스캐너 ROI와 같은 비율 → 보이는 곳 = 분석하는 곳) */
  .cam { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; aspect-ratio: var(--roi, 2.7) / 1; }
  .cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .cam canvas.ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .cam .guide { position:absolute; inset:6px; border:2px dashed rgba(255,255,255,.55); border-radius:8px; pointer-events:none; }
  .cam .hint[hidden] { display:none; }
  .cam .hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#fff; font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; }
  #status { font-size:17px; font-weight:600; margin:10px 0 4px; }
  #status:empty { display:none; }
  .cam { cursor:pointer; }
  .big { font-size:34px; font-weight:800; letter-spacing:.06em; }
  .scanResult { display:none; margin-top:10px; padding:12px; border-radius:10px; font-size:16px; }
  .scanResult.ok { display:block; background:var(--okbg); color:var(--ok); }
  ul.tips { margin:6px 0 0; padding-left:20px; color:var(--sub); font-size:15px; }
</style>
</head>
<body>
<main>
  <h1>혼디 숫자 코드</h1>

  <section class="card" id="s3">
    <h2>① 코드 스캔</h2>
    <p class="sub" style="margin:0 0 10px">혼디 숫자 코드를 카메라로 비춰 읽어 보세요. 다른 화면이나 인쇄물에 띄운 코드를 비추면 됩니다.</p>
    <div class="cam" id="cam"><video id="v" playsinline muted></video><canvas class="ov" id="ov"></canvas><div class="guide"></div><div class="hint" id="camHint">코드(로고+숫자)를 이 창 안에 가로로 맞추세요</div></div>
    <canvas id="work" style="display:none"></canvas>
    <div id="status" role="status"></div>
    <div id="scanResult" class="scanResult"></div>
    <div id="profileLookup" class="scanResult"></div>
    <ul class="tips">
      <li>코드 전체(로고 포함)가 창 안에 가로로 들어오게, 화면을 밝게 하고 비춰 주세요.</li>
    </ul>
  </section>

  <section class="card" id="s1">
    <h2>② 내 숫자 코드</h2>
    <div id="regMsg" class="msg" role="status"></div>
    <div id="reg" class="reg">
      <div>내 번호 <b id="regNo"></b> <span id="regOrder"></span></div>
      <img id="codeImg" class="codeImg" alt="내 혼디 숫자 코드">
      <div class="regBtns">
        <a id="bSave" class="btnlink" download="hondi-digit-code.png">이미지 저장</a>
        <button id="bWriteProfile" class="ghost" style="margin:0">프로필 작성 및 갱신하기 ↗</button>
      </div>
    </div>
  </section>
</main>

<script src="/gopang-wallet.js"></script>
<script type="module">
import { generateDigitCodeCanvas } from '/src/gopang/ai/hondi-digit-render.js';
import { startScanner, stopScanner, ROI_ASPECT } from '/src/gopang/ai/hondi-digit-scanner-v2.js';
import { ORG_SITES, findSiteByDigitCode } from '/src/gopang/gov/org-sites.js';
import { issueDigitCode } from '/src/gopang/ai/hondi-digit-issue.js';

const $ = id => document.getElementById(id);
document.documentElement.style.setProperty('--roi', String(ROI_ASPECT));

// ── ② 등록: [숫자 코드 받기] 한 번 → 번호 자동 배정(GET /digit/next) → 지갑 서명(필요 시 지문) → POST /digit/record → 코드 이미지 자동 생성 ──
// 본인 인증은 가입 때 이미 끝났다(폰 인증으로 계정과 지갑 키가 묶임). 서버는 서명한 키가 그 계정에 핀된 지갑 키인지만 확인하므로 문자 인증은 다시 받지 않는다.
const WORKER = 'https://hondi-proxy.tensor-city.workers.dev';
const me = (() => {
  try {
    const u = JSON.parse(localStorage.getItem('gopang_user_v4') || 'null');
    return u && !u.isGuest && !u.isTemp && u.ipv6 ? { guid: u.ipv6, e164: u.e164 || '', handle: u.handle || u.nickname || u.name || '' } : null;
  } catch { return null; }
})();
let state = { serial: null, order: null, registered: false, mode: null };
let lastCanvas = null;

// 혼디의 E.164 저장형은 +82 뒤에 0이 남는다(+8201096627170). 어느 표기로 와도 010-****-7170 으로 보이게 한다.

async function serverStatus(serial) {
  try {
    const r = await fetch(WORKER + '/digit/status?serial=' + encodeURIComponent(serial), { signal: AbortSignal.timeout(6000) });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.ok ? j : null;
  } catch { return null; }
}

function msg(t, cls) { const m = $('regMsg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }



async function issueNow() {
  if (!me || state.registered || state.busy) return;
  state.busy = true;
  try {
    const wallet = await getWallet();
    const owner = await ownerPubKey(me.guid);
    const res = await issueDigitCode({ guid: me.guid, wallet, worker: WORKER, owner, onStatus: t => msg(t, 'warn') });
    if (!res.ok) return msg(res.message, 'bad');
    state.mode = 'server'; msg('', '');
    await showRegistered(res.serial, res.order);
  } catch (e) { msg(e.message || '번호를 불러오지 못했습니다.', 'bad'); }
  finally { state.busy = false; }
}

async function getWallet() {
  const t0 = Date.now();
  while (window.gopangWallet === undefined && Date.now() - t0 < 2500) await new Promise(r => setTimeout(r, 150));
  let w = window.gopangWallet || null;
  if (!w && window.GopangWallet) {
    w = await window.GopangWallet.load();      // 사용자 동작 안에서 부르므로 지문/Face ID 창이 정상적으로 뜬다
    if (w) { try { w.setIdentity({ guid: me.guid, handle: me.handle || null, e164: me.e164 }); } catch {} window.gopangWallet = w; }
  }
  if (!w || typeof w.signPayload !== 'function') throw new Error('이 기기에서 지갑을 열 수 없습니다. 혼디 앱에 로그인한 뒤 다시 시도해 주세요.');
  return w;
}
async function ownerPubKey(guid) {
  const r = await fetch(`${WORKER}/wallet/x25519?guid=${encodeURIComponent(guid)}`, { signal: AbortSignal.timeout(8000) });
  const j = await r.json().catch(() => ({}));
  if (!j.ed25519_pubkey) throw new Error('계정의 지갑 키를 찾지 못했습니다. 혼디 앱에서 다시 로그인해 주세요.');
  return j.ed25519_pubkey;
}
async function showRegistered(serial, order) {
  state.serial = serial; state.registered = true;
  $('reg').style.display = 'block'; $('regNo').textContent = serial;
  $('regOrder').textContent = order ? '(' + order + '번째 가입)' : '';
  $('bWriteProfile').style.display = (state.mode === 'server' && me) ? '' : 'none';
  await make();
}
// 등록 직후에만 노출되는 진입점 — 기존 GWP 레지스트리의 profile-assistant SP
// (gwp-registry.js) 새 탭 규약을 그대로 따른다. 이 페이지는 독립 페이지라
// gwp/engine.js의 _gwpLaunch()가 기대하는 채팅 화면 전역 상태(core/state.js의
// _USER 등)가 없으므로, 그 규약(?gwp=1&token=<guid>)만 재현해 새 탭을 직접
// 연다 — profile-assistant.html의 _paGuid()는 URL의 token이 아니라 현재
// 지갑 세션(localStorage)만 보고 "내 프로필"을 판단하므로 이걸로 충분하다.
$('bWriteProfile').onclick = () => {
  if (!me) return;
  window.open('/pages/profile-assistant.html?gwp=1&token=' + encodeURIComponent(me.guid), '_blank');
};

// ── 등록 직후 코드 이미지 자동 생성 ────────────────────────────
async function make() {
  if (!state.registered) return;
  lastCanvas = await generateDigitCodeCanvas(state.serial, 2);
  const url = lastCanvas.toDataURL('image/png');
  $('codeImg').src = url; $('bSave').href = url;
  $('bSave').download = 'hondi-digit-code-' + state.serial + '.png';
}

// ── ③ 카메라로 확인 — 조회 전용(읽기만). 프로필 작성은 절대 여기서 하지
// 않는다 — ① 등록 성공 시점에만 가능하다(가입 때 자동 발급 또는 첫 열람 시 발급,
// 주피터님 지시 2026-09-27). 여기서는 그 번호에 이미 연결된 프로필이
// 있으면 보여주고, 없으면 "아직 없다"고만 알린다. 스캔한 사람이 그 번호의
// 소유자 본인인지 여부는 아예 따지지 않는다 — 어느 쪽이든 결과는 같다.
async function showProfileForSerial(serial) {
  const box = $('profileLookup');
  // 기관 AI 웹사이트 코드(제주도청·제주테크노파크 등)는 프로필이 아니라 해당 기관 AI 대화창을 새 탭으로 연다.
  const siteId = findSiteByDigitCode(serial);
  if (siteId) {
    const url = '/pages/org-ai.html?site=' + encodeURIComponent(siteId);
    box.className = 'scanResult ok'; box.style.display = 'block'; box.replaceChildren();
    box.append(document.createTextNode(ORG_SITES[siteId].name + ' AI 웹사이트 — '));
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.textContent = '열기 ↗';
    box.append(a);
    // 카메라 콜백은 사용자 제스처가 아니라 팝업이 차단될 수 있다 — 차단되면 위 링크로 열 수 있다.
    window.open(url, '_blank');
    return;
  }
  box.className = 'scanResult'; box.style.display = 'block'; box.textContent = '프로필 확인 중…';
  try {
    const sv = await serverStatus(serial);
    if (!sv || sv.status !== 'claimed') {
      box.textContent = sv && sv.status === 'available'
        ? '아직 등록되지 않은 번호입니다.'
        : '이 번호의 프로필 정보를 서버에서 확인할 수 없습니다(서버 미연결일 수 있습니다).';
      return;
    }
    // /digit/status의 owner는 Ed25519 pubkey뿐이라(guid를 모름) 그 pubkey로
    // 바로 프로필을 찾는다(worker.js _l1FindProfileByPubkey, 2026-09-27 신설).
    const r = await fetch(WORKER + '/profile?pubkey=' + encodeURIComponent(sv.owner), { signal: AbortSignal.timeout(8000) });
    const j = await r.json().catch(() => null);
    if (r.ok && j && j.ok && j.profile) {
      const handle = (j.profile.handle || '').replace(/^@/, '');
      const label = j.profile.name || (handle ? '@' + handle : '(이름 없음)');
      box.className = 'scanResult ok';
      box.replaceChildren();
      box.append(document.createTextNode('프로필: ' + label + ' — '));
      const a = document.createElement('a');
      a.href = '/profile.html?handle=' + encodeURIComponent(handle); a.target = '_blank'; a.textContent = '보기 ↗';
      box.append(a);
    } else {
      box.textContent = '이 번호는 등록됐지만, 아직 프로필을 작성하지 않았습니다.';
    }
  } catch (e) {
    box.textContent = '프로필 확인 중 오류가 발생했습니다.';
  }
}
// 맞춤 안내 문구는 스캔 중에는 숨기고, 스캔이 끝나거나 멈추거나 시작에 실패하면 다시 보인다.
const setHint = (show) => { $('camHint').hidden = !show; };
let scanOn = false;   // 카메라가 켜져 있거나 켜지는 중 (중복 시작 방지)
async function startScan() {
  if (scanOn) return;
  scanOn = true;
  setHint(false);
  $('scanResult').className = 'scanResult';
  $('profileLookup').className = 'scanResult'; $('profileLookup').style.display = 'none'; $('profileLookup').replaceChildren();
  try {
    await startScanner($('v'), $('work'), $('ov'),
      (serial) => {
        scanOn = false;
        const mine = serial === state.serial;
        $('status').textContent = '인식 완료';
        setHint(true);
        $('scanResult').className = 'scanResult ok';
        $('scanResult').textContent = mine ? `\u2713 정상적으로 읽혔습니다 — ${serial}` : `인식된 번호: ${serial} (등록한 번호와 다릅니다)`;
        showProfileForSerial(serial);
      },
      m => { $('status').textContent = m; });
  } catch (e) { scanOn = false; setHint(true); /* 상태 문구는 스캐너가 이미 표시 */ }
}
function stopScan() {
  scanOn = false;
  stopScanner();
  $('status').textContent = '';
  setHint(true);
}
// 시작·중지 버튼이 없으므로, 멈춰 있을 때 카메라 창을 누르면 다시 스캔한다.
$('cam').onclick = () => { if (!scanOn) startScan(); };

// "① 코드 스캔" 섹션이 화면에 보이면 자동으로 스캔을 시작하고, 벗어나면(스크롤·탭 전환·화면 끔) 자동으로 중단한다.
let inView = false;
new IntersectionObserver((entries) => {
  const v = entries[entries.length - 1].isIntersecting;
  if (v && !inView) { inView = true; if (!document.hidden) startScan(); }
  else if (!v && inView) { inView = false; if (scanOn) stopScan(); }
}, { threshold: 0.5 }).observe($('s3'));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scanOn) stopScan(); }
  else if (inView) startScan();
});


// 가입 때 만들어진 내 번호를 보여 준다. (번호가 아직 없는 기존 계정은 처음 열 때 한 번 자동 배정한다.)
(async () => {
  if (!me) { msg('로그인한 계정을 찾지 못했습니다. 혼디 앱에서 로그인한 뒤 숫자 코드 아이콘으로 열어 주세요.', 'warn'); return; }
  try {
    const r = await fetch(WORKER + '/digit/mine?guid=' + encodeURIComponent(me.guid), { signal: AbortSignal.timeout(6000) });
    const j = await r.json().catch(() => null);
    const first = j && j.ok && Array.isArray(j.serials) ? j.serials[0] : null;
    if (first) { state.mode = 'server'; await showRegistered(first.serial, null); return; }
    if (j && j.ok) { await issueNow(); return; }
    msg('내 번호를 서버에서 불러오지 못했습니다. 잠시 후 다시 열어 주세요.', 'warn');
  } catch { msg('내 번호를 서버에서 불러오지 못했습니다. 잠시 후 다시 열어 주세요.', 'warn'); }
})();
</script>
</body>
</html>
