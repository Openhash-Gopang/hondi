/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

:root {

}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size: 14px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

.ug-doc { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

/* ── 헤더 ── */
.ug-header {

}
.ug-header h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
.ug-header .ug-sub { font-size: 13.5px; color: #b3bfd1; }

/* ── 서비스 탭 (2행 x 8열) ── */
.svc-tabs {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.svc-tab {
  background: var(--surface); border: none; border-radius: 10px;
  padding: 10px 6px; text-align: center; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--text3);

}
.svc-tab.active {
  background: var(--brand); color: #fff;
  box-shadow: 0 6px 16px rgba(12,108,195,0.35), 0 2px 6px rgba(12,108,195,0.2);
}
@media (max-width: 900px) {

  .svc-tab { font-size: 12px; padding: 9px 4px; }
}
@media (max-width: 560px) {
  .svc-tabs { grid-template-columns: repeat(2, 1fr); }
}

/* ── 본문 콘텐츠 ── */
.svc-content {
  background: var(--surface); border: none; border-radius: var(--radius-lg);

}
.svc-content-empty .svc-empty-title { font-size: 15px; font-weight: 600; color: var(--text3); }
.svc-content-empty .svc-empty-sub { font-size: 13px; }

.svc-detail h2 { display: inline-block; font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
.svc-badge {

  content: counter(flow); position: absolute; left: 0; top: -1px;

  content: ''; position: absolute; left: 11px; top: 22px; bottom: 0; width: 1px; background: var(--border);

.svc-table-wrap { overflow-x: auto; margin: 8px 0 4px; }
table.svc-table { width: 100%; border-collapse: collapse; font-size: 13px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(15,23,42,0.08); }
table.svc-table th, table.svc-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.svc-table thead th { background: #f1f5f9; color: var(--navy); font-weight: 600; white-space: nowrap; }

.svc-callout {

/* ── 외부 링크 칩 (Material outlined button) ── */

.ug-footer { text-align: center; font-size: 12px; color: var(--text4); border-top: 1px solid var(--border); padding-top: 18px; margin-top: 40px; }

        아직 없는 기능 — 채용 사이트에 대한 실제 자동 지원 제출 연동, 실시간 채용 공고 크롤링·매칭, 영상 면접 분석(표정·음성 톤), 사업주 측 채용·인사·노무 대행 기능, 반추 결과의 PDV 기록·집단 학습 저장소는 아직 지원하지 않습니다. 대화창에서 실제로 호출(<code>[CALL_KJOB: query=...]</code>)되도록 2026-09-02 AC 오케스트레이션에 편입되었고, 과금 경로(구독자 기본 요금제와 동일 — GDC 무료 한도 소진 후 유료, flash/pro 자동 판단)도 worker.js에 연결되어 있습니다.
      </div>
      <p class="svc-note" style="margin-top:14px;color:var(--text4);font-size:12px;">이 탭의 정본(source of truth)은 <code>prompts/k-job_v1_0.md</code>입니다 — 이 문서를 고칠 때는 반드시 그 문서를 먼저 갱신하세요.</p>
    </div>
  `,
  kmail: `
    <div class="svc-detail">
      <h2>K-Mail — 혼디 사용자 간 메일 발송·주소록</h2>
      <span class="svc-badge svc-badge-partial">부분 가동</span>
      <p class="svc-lead">사용자 고유 주소(<code>&lt;guid&gt;@hondi.kr</code>)로 외부 이메일을 발송하고, 수신자를 대화로 확정해 예약 발송·다이제스트·주소록·자동삭제 규칙까지 처리하는 개인용 메일 비서입니다. 관리자 전용 공문 시스템(gov-mail, hondi.org)과는 도메인·인증·목적이 완전히 분리되어 있습니다.</p>

      <h3>할 수 있는 일 (3종)</h3>
      <ol class="svc-flow">
        <li><b>메일 발송</b> — 즉시 또는 예약, 한 명 또는 여러 명에게. 회신을 특정 시각까지 모아 다이제스트로 정리 가능. 발송 대상은 자동으로 주소록에도 등록됩니다.</li>
        <li><b>주소록 관리</b> — 이름·이메일·직업·소속·전공·관계·그룹(태그)으로 저장·검색, 그룹 부여/해제, 중복 연락처 병합.</li>
        <li><b>자동삭제 규칙</b> — "불필요한 메일은 도착 즉시 삭제해" 같은 인바운드 필터 규칙 등록.</li>

      <h3>정직한 한계 — 수신자를 지어내지 않습니다</h3>

      <h3>진입 경로 — 두 갈래로 나뉘어 있습니다</h3>
      <p class="svc-note">좌측 메뉴 "메일 보내기"(<code>/mail.html</code>)는 발송 전용 단순 폼입니다 — 수신함(받은 메일 확인) 기능은 아직 없고, 답장은 상대방의 실제 이메일로 직접 받아야 합니다. 대화형 비서(<code>/pages/kmail-assistant.html</code>, 주소록은 <code>/pages/kmail-contacts.html</code>)는 "메일 보내줘"·"주소록 검색" 등 발화 시 gwp-registry.js가 새 탭으로 연결하며, AC-PRO-CORE 태그 체계와 격리된 자체 프로토콜(KMAIL_SEND_CAMPAIGN 등)로 동작합니다. 현재 좌측 메뉴는 단순 폼으로만 연결되어 있고, 대화형 비서 탭은 직접 URL 진입만 가능합니다.</p>

      <div class="svc-callout important">

var SVC_LABEL = {
  k119: 'K-119', klaw: 'K-Law', kpolice: 'K-Police', ksecurity: 'K-Security',
  khealth: 'K-Health', kschool: 'K-School', gdc: 'GDC', kstock: 'K-Stock',
  kinsurance: 'K-Insurance', ktax: 'K-Tax', kmarket: 'K-Market', ktraffic: 'K-Traffic',
  klogistics: 'K-Logistics', kcleaner: 'K-Cleaner', kpublic: 'K-Public', kdemocracy: 'K-Democracy',
  ktelecom: 'K-Telecom', ksearch: 'K-Search', kbiz: 'K-Biz', kplan: 'K-Plan', kwatch: 'K-Watch', kjob: 'K-Job', kmail: 'K-Mail'
};

function renderSvc(key) {
  var contentEl = document.getElementById('svcContent');
  var html = SVC_CONTENT[key];
  if (html && html.trim()) {
    contentEl.innerHTML = html;
  } else {
    contentEl.innerHTML =
      '<div class="svc-content-empty">' +
        '<div class="svc-empty-title">' + SVC_LABEL[key] + ' — 준비 중</div>' +
        '<div class="svc-empty-sub">이 서비스의 상세 내용은 곧 채워질 예정입니다.</div>' +
      '</div>';
  }
}

document.getElementById('svcTabs').addEventListener('click', function (e) {
  var tab = e.target.closest('.svc-tab');
  if (!tab) return;
  document.querySelectorAll('.svc-tab').forEach(function (t) { t.classList.remove('active'); });
  tab.classList.add('active');
  renderSvc(tab.getAttribute('data-svc'));
});

(function () {
  // desktop.html에서 특정 탭으로 바로 진입시키기 위한 딥링크 훅.
  // window.__HONDI_SVC_TAB을 미리 지정해두면 해당 탭으로 열린다(없으면 기본 k119).
  // 다른 페이지에서 pages/k-services.html#kplan 처럼 URL 해시로도 진입 가능
  // (2026-08-31 신설 — highlights/hondi-network.html의 "K-Plan 바로 가기" 링크용).
  var hashTab = (location.hash || '').replace('#', '');
  var initTab = (window.__HONDI_SVC_TAB && SVC_LABEL[window.__HONDI_SVC_TAB]) ? window.__HONDI_SVC_TAB
    : (hashTab && SVC_LABEL[hashTab]) ? hashTab
    : 'k119';
  window.__HONDI_SVC_TAB = null;
  document.querySelectorAll('.svc-tab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-svc') === initTab);
  });
  renderSvc(initTab);
})();
</script>
