<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="/pdv-store.js"></script>
<script src="/gopang-wallet.js"></script>
<style>
:root{
  --blue:#1A73E8;--blue-lt:#EEF4FF;--blue-dk:#1557B0;
  --border:#DADCE0;--txt2:#5F6368;--txt3:#9AA0A6;
  --font:'Pretendard',-apple-system,'Helvetica Neue',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --person:#712B13;--person-bg:#FAECE7;
  --thing:#085041;--thing-bg:#E1F5EE;
  --org:#633806;--org-bg:#FAEEDA;
  --ai:#3C3489;--ai-bg:#EEEDFE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:#111;background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.header{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 14px) 16px 14px;border-bottom:1px solid var(--border)}
.icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.header h1{flex:1;font-size:16px;font-weight:700}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--border);-ms-overflow-style:none;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 13px;border-radius:16px;font-size:12.5px;border:1px solid var(--border);color:var(--txt2);background:#fff;white-space:nowrap}
.tab.active{background:var(--blue-lt);color:var(--blue-dk);border-color:var(--blue)}
.list{padding-bottom:calc(var(--safe-b) + 12px)}
.card{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);padding:13px 16px;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:active{background:#f9fafb}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px}
.card-who{display:flex;align-items:center;gap:6px;min-width:0}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}
.badge.person{background:var(--person-bg);color:var(--person)}
.badge.thing{background:var(--thing-bg);color:var(--thing)}
.badge.org{background:var(--org-bg);color:var(--org)}
.badge.ai{background:var(--ai-bg);color:var(--ai)}
.badge.uncategorized{background:#f3f4f6;color:var(--txt3)}
.name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:11px;color:var(--txt3);flex-shrink:0}
.what{font-size:13px;color:#333;line-height:1.5}
.why{font-size:11.5px;color:var(--txt3);margin-top:2px}
.locked{opacity:.7}
.locked .what{color:var(--txt3)}
.empty{padding:40px 24px;text-align:center;color:var(--txt3);font-size:13px;line-height:1.7}
.empty-tab-note{padding:16px 20px;background:#f9fafb;border-radius:10px;margin:12px 16px;font-size:12px;color:var(--txt3);line-height:1.7}

.detail{position:fixed;inset:0;background:#fff;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:5}
.detail.open{transform:translateX(0)}
.detail-body{padding:18px 16px;overflow-y:auto}
.detail-name{font-size:19px;font-weight:700;margin:2px 0 4px}
.detail-field{border-top:1px solid var(--border);padding:13px 0}
.detail-field:first-of-type{border-top:none;margin-top:8px}
.field-label{font-size:11.5px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.field-value{font-size:14.5px;line-height:1.6;color:#111}
.field-value.muted{color:var(--txt3)}
.sensitive-note{margin-top:16px;padding:12px 14px;border-radius:10px;background:#FAEEDA;color:#633806;font-size:12.5px;line-height:1.6;display:flex;gap:8px;align-items:flex-start}
/* 나비웹(mail.hondi.net) 설정 안에 끼워 쓸 때(?embed=mail): 자체 상단 바(뒤로가기·제목)를 숨기고 안에서 목록·상세를 그대로 보여 준다. */
body.embed > .header{display:none}
body.embed .detail{position:absolute}
.srcbar{padding:10px 14px;border-bottom:1px solid var(--border);background:#f8fafc;font-size:12.5px;color:var(--txt2);line-height:1.7}
.srcbar b{color:#111}.srcbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.srcbar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.srcbar label.off{opacity:.5;cursor:not-allowed}
.srcbar button{border:1px solid var(--blue);background:#fff;color:var(--blue-dk);border-radius:8px;padding:6px 12px;font:600 12.5px inherit;cursor:pointer}
.srcbar button:disabled{opacity:.5;cursor:default}.srcbar input{border:1px solid var(--border);border-radius:8px;padding:6px 8px;width:130px;font:inherit}
.srcbar input[type=radio]{width:auto;padding:0}.srcbar .st{color:var(--txt3)}.srcbar .st.err{color:#b91c1c}.srcbar .st.ok{color:#15803d}
</style>
</head>
<body>
<script>if (/[?&]embed=mail/.test(location.search)) document.body.classList.add('embed');</script>

<div class="header">
  <button class="icon-btn" onclick="parent.closePDV && parent.closePDV()" aria-label="닫기"><i class="ti ti-arrow-left"></i></button>
  <h1>PDV · 대화 이력</h1>
  <button class="icon-btn" aria-label="검색"><i class="ti ti-search"></i></button>
</div>

<div class="srcbar" id="srcbar">
  <div class="row">
    <span>PDV 원본 보관</span>
    <label><input type="radio" name="pdv-mode" value="phone" checked disabled> <b>폰</b> (원본)</label>
    <span class="st">· 백업 저장소</span>
    <label><input type="radio" name="pdv-cloud" value="l1" checked> <b>나비 L1</b> (기본)</label>
    <label><input type="radio" name="pdv-cloud" value="par"> 직접 지정</label>
    <input id="cl-url" type="url" style="width:min(340px,90%)" placeholder="Oracle PAR URL 등 (https://…/o/)" hidden aria-label="백업 저장소 주소">
  </div>
  <div class="row">
    <input id="cl-phrase" type="password" autocomplete="off" style="width:190px" placeholder="복구 문구 (12자 이상)" aria-label="복구 문구">
    <input id="cl-phrase2" type="password" autocomplete="off" style="width:190px" placeholder="복구 문구 확인" aria-label="복구 문구 확인" hidden>
    <button type="button" id="btn-cl-restore" hidden>클라우드에서 불러오기</button>
    <button type="button" id="btn-cl-backup" hidden>지금 백업</button>
    <span class="st" id="cl-state"></span>
  </div>
  <div class="row"><span class="st">백업은 폰에서 암호화되어 저장소에 올라가며, 복구 문구는 서버로 전송·저장되지 않습니다. 문구를 잃으면 복구할 수 없습니다.</span></div>
  <div class="row" id="src-pc" hidden>
    <span class="st">대안(불안정할 수 있음): 폰과 직접 연결</span>
    <input id="src-phone" inputmode="numeric" maxlength="8" placeholder="폰 번호 뒷자리 8자" hidden aria-label="010을 제외한 폰 번호 뒷자리 8자">
    <button type="button" id="btn-phone-fetch">폰에서 불러오기</button>
    <span class="st" id="src-state"></span>
  </div>
</div>
<div class="tabbar" id="tabbar">
  <button class="tab active" data-cat="all">전체 (시간순)</button>
  <button class="tab" data-cat="person">사람</button>
  <button class="tab" data-cat="thing">사물</button>
  <button class="tab" data-cat="org">기관</button>
  <button class="tab" data-cat="ai">공용 AI 전문가</button>
</div>

<div class="list" id="list"></div>

<div class="detail" id="detail">
  <div class="header">
    <button class="icon-btn" onclick="closeDetail()" aria-label="목록으로"><i class="ti ti-arrow-left"></i></button>
    <h1 id="detail-title">대화 상세</h1>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
// 이번 카테고리 분류가 어떤 근거로 나오는지, 데이터가 왜 비어있는지는
// pdv-store.js 파일 상단 주석(2026-07-01 저장소 실사 결과)이 최신 진실이다.
const EMPTY_TAB_NOTE = {
  person: '1:1 대화 상대의 PDV 기록 기능은 아직 구현되어 있지 않습니다. 지금은 나비 자체 AI 서브시스템과의 상호작용만 기록됩니다.',
  thing: '사물(기기) 상대방의 PDV 기록 기능은 아직 구현되어 있지 않습니다.',
  org: '실제 사업자 식별 정보 없이, K-Market 등 거래형 서비스 이용 기록을 근사치로 표시합니다. 어느 사업자였는지는 확인할 수 없습니다.',
  ai: '',
  all: '',
};

const CAT_CLASS = { person:'person', thing:'thing', org:'org', ai:'ai', uncategorized:'uncategorized' };

let RECORDS = [];
let activeCat = 'all';

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return (d.getMonth()+1).toString().padStart(2,'0') + '.' + d.getDate().toString().padStart(2,'0');
}

// L2 이상만 risk_level:'high' 레코드 상세를 볼 수 있음 — 백엔드 인증 미구현이라
// 현재는 항상 L0으로 취급(fail-safe). window.GopangAuth가 생기면 자동 반영됨.
function canViewHighRisk() {
  const tier = (parent.GopangAuth && parent.GopangAuth.tier) || 'L0';
  return tier === 'L2' || tier === 'L3';
}

function renderList() {
  const listEl = document.getElementById('list');
  const note = EMPTY_TAB_NOTE[activeCat];
  const noteHtml = note ? `<div class="empty-tab-note">${note}</div>` : '';

  const filtered = RECORDS.filter(r => activeCat === 'all' || r.category === activeCat);

  if (!filtered.length) {
    listEl.innerHTML = noteHtml + `<div class="empty">표시할 기록이 없습니다.</div>`;
    return;
  }

  listEl.innerHTML = noteHtml + filtered.map(r => {
    const cls = CAT_CLASS[r.category] || 'uncategorized';
    const locked = r.risk_level === 'high' && !canViewHighRisk();
    const w = r.summary_6w_view || {};
    const name = r.service || r.serviceId || w.who || '기록';
    const what = locked ? '민감도 높음 — 인증 후 열람 가능' : (w.what || r.summary || '(요약 없음)');
    const why  = locked ? '' : (w.why ? `<div class="why">왜: ${w.why}</div>` : '');
    return `
      <button class="card ${locked ? 'locked' : ''}" data-id="${r._id}">
        <div class="card-top">
          <div class="card-who"><span class="badge ${cls}">${r.category_label}</span><span class="name">${name}</span></div>
          <span class="date">${fmtDate(r.ts || r.when)}</span>
        </div>
        <div class="what">${locked ? '<i class="ti ti-lock" style="font-size:12px;margin-right:4px"></i>' : ''}${what}</div>
        ${why}
      </button>`;
  }).join('');

  listEl.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openDetail(Number(card.getAttribute('data-id'))));
  });
}

function openDetail(id) {
  const r = RECORDS.find(x => x._id === id);
  if (!r) return;
  const locked = r.risk_level === 'high' && !canViewHighRisk();
  const w = r.summary_6w_view || {};

  document.getElementById('detail-title').textContent = r.service || r.serviceId || '대화 상세';

  if (locked) {
    document.getElementById('detail-body').innerHTML = `
      <div class="detail-name">${r.service || r.serviceId || '기록'}</div>
      <div class="sensitive-note"><i class="ti ti-lock"></i>이 기록은 위험도(risk_level)가 높음으로 분류되어 있습니다. 인증 등급이 올라간 뒤(L2 이상) 열람할 수 있습니다.</div>`;
  } else {
    const rows = [
      ['ti-calendar','언제', w.when || fmtDate(r.ts) || '확인불가'],
      ['ti-map-pin','어디서', w.where || '확인불가'],
      ['ti-user','누가', w.who || '확인불가'],
      ['ti-message','무엇을', w.what || r.summary || '확인불가'],
      ['ti-route','어떻게', w.how || '확인불가'],
      ['ti-help-circle','왜', w.why || '확인불가'],
    ];
    document.getElementById('detail-body').innerHTML = `
      <div class="detail-name">${r.service || r.serviceId || '기록'}</div>
      ${rows.map(([icon,label,val]) => `
        <div class="detail-field">
          <div class="field-label"><i class="ti ${icon}"></i>${label}</div>
          <div class="field-value ${val==='확인불가' ? 'muted' : ''}">${val}</div>
        </div>`).join('')}
      ${r.risk_level ? `<div class="sensitive-note"><i class="ti ti-alert-triangle"></i>위험도: ${r.risk_level}</div>` : ''}
      <div class="detail-field">
        <div class="field-label"><i class="ti ${r.category === 'org' ? 'ti-info-circle' : 'ti-tag'}"></i>분류 근거</div>
        <div class="field-value muted">${r.category === 'org'
          ? '실거래(MKT) 서비스 이용으로 근사 분류됨 — 실제 사업자 식별자 아님'
          : `svc/serviceId "${r.serviceId || r.svc || '-'}"를 GWP_REGISTRY와 대조해 분류됨`}</div>
      </div>`;
  }

  document.getElementById('detail').classList.add('open');
}
function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

document.getElementById('tabbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.getAttribute('data-cat');
  renderList();
});

async function boot() {
  if (!window.GopangPDV) {
    document.getElementById('list').innerHTML = '<div class="empty">PDV 저장소 모듈(pdv-store.js)을 불러오지 못했습니다.</div>';
    return;
  }
  RECORDS = await window.GopangPDV.list();
  renderList();
}
boot();

// ── PDV 원본 보관: 폰(기본) — PC 는 폰의 승인을 받아 불러온다(2026-11-07) ──
(function () {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  const $ = (id) => document.getElementById(id);
  const WORKER = (window.GOPANG_WORKER || 'https://hondi-proxy.tensor-city.workers.dev').replace(/\/$/, '');
  if (isMobile) return;
  const user = (() => { try { return JSON.parse(localStorage.getItem('gopang_user_v4') || 'null'); } catch (e) { return null; } })();
  let e164 = user && user.e164 ? String(user.e164) : '';
  if (!e164) $('src-phone').hidden = false;
  const st = (m, c) => { const el = $('src-state'); el.textContent = m || ''; el.className = 'st' + (c ? ' ' + c : ''); };
  $('btn-phone-fetch').addEventListener('click', async () => {
    const btn = $('btn-phone-fetch'); btn.disabled = true; st('');
    try {
      if (!e164) {
        const d = ($('src-phone').value || '').replace(/\D/g, '');
        if (d.length !== 8) throw new Error('010을 제외한 폰 번호 뒷자리 8자를 입력하십시오.');
        e164 = '+8210' + d;
      }
      const { requestFromPhone } = await import('/src/gopang/pdv/phone-fetch.js');
      const keyPair = await GopangWallet.generateX25519KeyPair();
      const label = (/Windows/.test(navigator.userAgent) ? 'Windows PC' : /Mac/.test(navigator.userAgent) ? 'Mac' : '이 PC') + ' (' + location.hostname + ')';
      const data = await requestFromPhone({
        worker: WORKER, e164, keyPair, pcLabel: label,
        openWithKey: (sealed, priv) => GopangWallet.openSealedWithKey(priv, sealed),
        onState: (s) => st(s === 'pushed' ? '폰으로 승인 요청을 보냈습니다. 폰에서 확인해 주세요…' : s === 'no-push' ? '폰에 알림을 보내지 못했습니다. 폰에서 푸시 알림을 켜 주세요.' : s === 'receiving' ? '폰에서 받는 중…' : '폰의 승인을 기다리는 중…'),
      });
      const r = await window.GopangPDV.importRecords(data.records);
      st('불러왔습니다: ' + r.added + '건 추가' + (r.skipped ? ' (' + r.skipped + '건은 이미 있음)' : ''), 'ok');
      RECORDS = await window.GopangPDV.list(); renderList();
    } catch (e) { st(e.message || '불러오지 못했습니다.', 'err'); e164 = user && user.e164 ? String(user.e164) : ''; }
    finally { btn.disabled = false; }
  });
})();

// ── PDV 클라우드 백업(방식 C): 기본 나비 L1 PocketBase, 사용자 지정 가능. PC 는 클라우드에서 불러온다(2026-11-08) ──
(function () {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  const $ = (id) => document.getElementById(id);
  const WORKER = (window.GOPANG_WORKER || 'https://hondi-proxy.tensor-city.workers.dev').replace(/\/$/, '');
  const KEY = 'gopang_pdv_cloud';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || { kind: 'l1', url: '' }; } catch (e) { return { kind: 'l1', url: '' }; } };
  const cfg = load();
  const radios = document.querySelectorAll('input[name="pdv-cloud"]');
  radios.forEach((r) => { r.checked = r.value === cfg.kind; });
  $('cl-url').value = cfg.url || ''; $('cl-url').hidden = cfg.kind !== 'par';
  radios.forEach((r) => r.addEventListener('change', () => {
    cfg.kind = r.value; $('cl-url').hidden = cfg.kind !== 'par';
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* 저장 불가여도 이번 세션은 동작 */ }
  }));
  $('cl-url').addEventListener('change', () => { cfg.url = $('cl-url').value.trim(); try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} });
  $('btn-cl-restore').hidden = isMobile; $('btn-cl-backup').hidden = !isMobile; $('cl-phrase2').hidden = !isMobile;
  const st = (m, c) => { const el = $('cl-state'); el.textContent = m || ''; el.className = 'st' + (c ? ' ' + c : ''); };
  async function adapter(B) {
    if (cfg.kind === 'par') {
      const u = $('cl-url').value.trim();
      if (!/^https:\/\//.test(u)) throw new Error('저장소 주소(https://…)를 입력하십시오.');
      return new B.ParUrlAdapter(u);
    }
    const wallet = await GopangWallet.load();
    return new B.HondiL1Adapter({ worker: WORKER, wallet });
  }
  async function run(btn, fn) {
    btn.disabled = true; st('');
    try { await fn(await import('/src/gopang/pdv/backup.js')); }
    catch (e) { st(e.message || '실패했습니다.', 'err'); }
    finally { btn.disabled = false; }
  }
  $('btn-cl-backup').addEventListener('click', () => run($('btn-cl-backup'), async (B) => {
    const phrase = $('cl-phrase').value, c = B.checkPhrase(phrase);
    if (!c.ok) throw new Error(c.reason);
    const ad = await adapter(B);
    let header = null;
    try { header = JSON.parse(new TextDecoder().decode(await ad.get(B.HEADER_KEY))); } catch (e) { header = null; }
    let dek;
    if (header) dek = (await B.unlockDek(header, phrase)).dek;
    else {
      if (phrase !== $('cl-phrase2').value) throw new Error('복구 문구 확인이 일치하지 않습니다.');
      st('복구 문구로 키를 만드는 중…'); dek = (await B.initBackup(ad, phrase)).dek;
    }
    st('암호화해 올리는 중…');
    const r = await B.backupSnapshot(ad, dek, await window.GopangPDV.exportAll());
    st('백업했습니다: ' + r.count + '건', 'ok');
  }));
  $('btn-cl-restore').addEventListener('click', () => run($('btn-cl-restore'), async (B) => {
    const phrase = $('cl-phrase').value;
    if (!phrase) throw new Error('복구 문구를 입력하십시오.');
    st('클라우드에서 받는 중…');
    const r = await B.restoreLatest(await adapter(B), phrase);
    const m = await window.GopangPDV.importRecords(r.records, 'cloud');
    st('불러왔습니다: ' + m.added + '건 추가' + (m.skipped ? ' (' + m.skipped + '건은 이미 있음)' : '') + ' · 백업 시각 ' + new Date(r.ts).toLocaleString(), 'ok');
    RECORDS = await window.GopangPDV.list(); renderList();
  }));
  if (!isMobile) $('src-pc').hidden = false;
})();
</script>

</body>
</html>
