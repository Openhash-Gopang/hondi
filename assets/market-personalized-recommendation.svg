<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>같은 검색어, 제각기 다른 나비마켓 추천</title>
<desc>세 사용자가 모두 "오토바이 사고 싶어요"라고 검색하지만, 각자의 PDV에 기록된 직업·건강·생활 습관에 따라 나비는 서로 다른 추천을 제공한다. 배달업 종사자에게는 배달용 스쿠터와 인근 정비소를, 취미로 타려는 사람에게는 투어링 모델을, 지병이 있는 사람에게는 구매 대신 대중교통 이용을 권장한다.</desc>
<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">"오토바이 사고 싶어요"</text>

<line x1="300" y1="64" x2="150" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>
<line x1="340" y1="64" x2="340" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>
<line x1="380" y1="64" x2="530" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>

<rect x="50" y="110" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#444441">사용자 A</text>
<text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">배달업 종사자</text>

<rect x="240" y="110" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#444441">사용자 B</text>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">취미로 타려는 40대</text>

<rect x="430" y="110" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#444441">사용자 C</text>
<text x="530" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">지병 있는 60대</text>

<line x1="150" y1="166" x2="150" y2="206" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>
<line x1="340" y1="166" x2="340" y2="206" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>
<line x1="530" y1="166" x2="530" y2="206" stroke="#5F5E5A" stroke-width="1" marker-end="url(#mk-arrow)"/>

<rect x="50" y="208" width="200" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3C3489">125cc 배달용 스쿠터</text>
<text x="150" y="254" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">인근 정비소까지 추천</text>

<rect x="240" y="208" width="200" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3C3489">300cc 투어링 모델</text>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">주말 라이딩에 최적화</text>

<rect x="430" y="208" width="200" height="72" rx="8" fill="#FFF7ED" stroke="#FBBF24" stroke-width="0.5"/>
<text x="530" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#7C4A03">구매 대신 대중교통</text>
<text x="530" y="254" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#92400E">건강 상태 고려해 권장</text>

<text x="340" y="315" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5F5E5A">같은 질문, 다른 대답 — 판단 기준은 오직 그 사람의 PDV</text>
</svg>
