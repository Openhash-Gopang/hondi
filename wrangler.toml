# hondi-proxy Cloudflare Worker 배포 설정
# 2026-07-12 — CI/CD 자동배포 구축(수동 복사-붙여넣기 방식 근본 해결).
#
# 바인딩은 Cloudflare 대시보드(Workers & Pages > hondi-proxy > Bindings)
# 실사 확인 + `wrangler kv namespace list`로 정확한 ID 확보한 값을
# 그대로 반영했다 — 추측으로 만들지 않았다.
#
# RATE_LIMIT_KV는 대시보드에 없어서 여기 안 넣는다(worker.js가
# `if(env.RATE_LIMIT_KV)`로 방어적으로 처리하므로 없어도 안전하게
# 스킵됨 — _checkRateLimit 함수 참조).
# QR_SESSIONS_KV는 현재 worker.js 코드에서 실제로는 안 쓰이지만
# (grep으로 참조 0건 확인), 기존 배포 설정을 그대로 유지하기 위해
# 넣어둔다 — 임의로 빼면 대시보드 설정과 어긋난다.

name = "hondi-proxy"
main = "worker.js"
account_id = "8897e584cfc42457b462f76fdcf6e157"
compatibility_date = "2026-07-12"

# 2026-09-08 신설 — hondi.net 루트 도메인에 Worker Route가 단 하나도 없었다
# (대시보드 실사로 발견 - Workers Routes 목록이 비어있었고, hondi.net Overview는
# "No Workers connected" 상태였다). 그래서 /hondi-search뿐 아니라 기존 /search
# 등도 전부 GitHub Pages(정적 호스팅, Fastly)로만 가고 이 Worker엔 한 번도
# 도달하지 못했다 — DNS는 이미 Proxied(주황)라 원인이 아니었다.
# hondi.net/* 와일드카드는 쓰지 않는다 — 그러면 desktop.html 같은 정적
# 페이지 요청까지 이 Worker가 가로채버려 GitHub Pages 서빙과 충돌한다.
# 필요한 API 경로만 개별로 추가할 것.
# 2026-09-09 임시 제거 - Cloudflare Error 1042(zone-Origin workers.dev 차단) 원인으로 확정, 사이트 전역 정상화 위해 되돌림. 참고: docs/HANDOFF_SITEWIDE_1042_CORS_BLOCK_20260909_v1_0.md
# [[routes]]
# pattern = "hondi.net/hondi-search"
# zone_name = "hondi.net"

[[kv_namespaces]]
binding = "AI_SETUP_SEALS_KV"
id = "e1ae4dd08b344f9c9208ea4235e17d3e"

[[kv_namespaces]]
binding = "QR_SESSIONS_KV"
id = "af7cad0be99e4072bbca8d81d71edd98"

[[kv_namespaces]]
   binding = "RATE_LIMIT_KV"
   id = "9c29fda136eb4d12b694f7e8a9864ac6"

# 2026-07-16 추가 — GOV_OPEN_DATA_MAP 리졸버(/api/stats/resolve)용 캐시.
# [정정 2026-07-16] 이 주석은 원래 "Wrangler가 .toml을 우선 읽는다"고
# 적혀 있었으나 이는 사실과 반대다 — Wrangler는 wrangler.json이 있으면
# .toml을 통째로 무시한다(공식 문서 확인). 당시 이 블록을 추가해도
# 실제로는 .json이 배포에 쓰이고 있어 문제가 "우연히" 해소된 것뿐이었다.
# 이번에 .json 자체를 삭제해 이 파일 하나만 유효하도록 통합했다.
[[kv_namespaces]]
binding = "GOV_DATA_KV"
id = "cf1dc69a346747ac8319a6cab85640cf"

# 2026-09-08 신설 — 혼디 검색(Hondi Search) 대화 세션(conv:*)과
# site-manifest 캐시(site-manifest) 저장용. src/routes/hondi-search-worker.js 참고.
# ★ 배포 전 필수 — 아래 id는 실제 값이 아니다. 배포 권한 있는 쪽에서
#   `wrangler kv namespace create HONDI_SEARCH_HISTORY`로 발급 후,
#   Cloudflare 대시보드(Workers & Pages > hondi-proxy > Bindings)에서
#   실사 확인한 값으로 교체할 것 — 다른 바인딩들과 동일 원칙(추측 금지).
[[kv_namespaces]]
binding = "HONDI_SEARCH_HISTORY"
id = "1f4830905eb34e4abc65451b62d4e19b"

[[services]]
binding = "AGENT_SIGNER"
service = "gopang-agent-signer"
environment = "production"  # wrangler.json에서 이관(2026-07-16)

# 2026-07-16 추가 — 혜택 카탈로그 임베딩 기반 의미검색(docs/HANDOFF-
# 5단계오케스트레이션-임베딩설계_2026-07-16.md 설계 반영). 별도 GPU
# 서버 없이 Cloudflare Workers AI(bge-m3, BAAI 오픈소스 임베딩 모델)
# + Vectorize(네이티브 벡터DB)로 해결한다 — 둘 다 별도 API 키·계정
# 불필요, 기존 Cloudflare 계정 안에서 바로 쓸 수 있다.
#
# [ai] 바인딩은 id가 필요 없다(계정 단위로 자동 제공) — env.AI.run(...)
# 으로 바로 호출 가능.
[ai]
binding = "AI"

# 2026-07-27 신설 — 프로필 사진(간판·메뉴판·사업자등록증·명함 등 §IMAGE-SCAN
# 첨부 사진, 아바타)을 실제로 저장하기 위한 R2 바인딩. 기존엔 이 워커에
# 파일 바이너리 저장소가 전혀 없어(worker.js:12390/12828 주석 참고) 사진이
# AI 판독(텍스트 추출) 용도로만 쓰이고 실제 이미지 자체는 어디에도 남지
# 않았다 — 그 구조적 한계를 없애기 위한 바인딩.
#
# ★ 배포 전 필수 — 아래 bucket_name의 R2 버킷을 먼저 만들어야 한다
# (로컬에선 실행 못 함, 배포 권한 있는 쪽에서 1회 실행):
#   wrangler r2 bucket create hondi-profile-media
# (퍼블릭 서빙은 R2의 커스텀 도메인 대신 이 워커 자체가 GET /media/*로
# 프록시하는 방식을 쓴다 — handleMediaGet 참조. 그래서 R2 버킷을 별도로
# "Public" 설정할 필요가 없다 — 워커가 유일한 진입점이다.)
[[r2_buckets]]
binding = "PROFILE_MEDIA"
bucket_name = "hondi-profile-media"

# 2026-09-01 신설 — K-Mail 첨부파일(발신/수신 양쪽). PROFILE_MEDIA와
# 성격이 다르다 — 프로필 사진은 공개용이라 GET 프록시가 인증 없이
# 열려 있지만, 메일 첨부는 개인 문서일 수 있어 다운로드도 서명 인증을
# 거친다(handleKmailAttachmentGet 참조). 버킷은 이미 생성 완료
# (2026-09-01, wrangler r2 bucket create hondi-kmail-attachments).
[[r2_buckets]]
binding = "KMAIL_ATTACHMENTS"
bucket_name = "hondi-kmail-attachments"

# ★ 배포 전 필수 — 아래 index_name의 Vectorize 인덱스를 먼저 만들어야
# 한다(로컬에선 실행 못 함, 배포 권한 있는 쪽에서 1회 실행):
#   wrangler vectorize create hondi-benefit-catalog --dimensions=1024 --metric=cosine
# (bge-m3 임베딩 차원은 1024 — 다른 값이면 이 커맨드의 --dimensions도
# 맞춰 바꿔야 한다. 정확한 차원은 최초 소량 테스트 임베딩 생성 후
# 응답의 벡터 길이로 재확인 권장.)
[[vectorize]]
binding = "VECTORIZE"
index_name = "hondi-benefit-catalog"

# 2026-08-04 신설 — 기관·부서·개인 엔티티 의미검색 전용 인덱스
# (HANDOFF_2026-08-03_PM.md §3-2). benefit용(VECTORIZE)과 도메인·차원이
# 섞이지 않도록 별도 인덱스로 분리한다.
# ★ 배포 전 필수 — 아래 index_name의 Vectorize 인덱스를 먼저 만들어야
# 한다(로컬에선 실행 못 함, 배포 권한 있는 쪽에서 1회 실행):
#   wrangler vectorize create hondi-entity-registry --dimensions=1024 --metric=cosine
[[vectorize]]
binding = "VECTORIZE_ENTITIES"
index_name = "hondi-entity-registry"

# 2026-08-15 신설 — gov_fee_schedule(정부 수수료 기준표) 의미검색 전용 인덱스.
# entity(VECTORIZE_ENTITIES)와 도메인·차원이 섞이지 않도록 별도 인덱스로
# 분리한다(위 두 인덱스와 동일 원칙). 상세: worker.js handleGovFeeEmbedIndex 주석.
# ★ 배포 전 필수 — 아래 index_name의 Vectorize 인덱스를 먼저 만들어야
# 한다(로컬에선 실행 못 함, 배포 권한 있는 쪽에서 1회 실행):
#   wrangler vectorize create hondi-gov-fee-schedule --dimensions=1024 --metric=cosine
[[vectorize]]
binding = "VECTORIZE_GOV_FEE"
index_name = "hondi-gov-fee-schedule"

# 2026-07-16 통합 — wrangler.json 제거 후 이관된 필드
# (observability, AGENT_SIGNER의 environment) — wrangler.json에는 있었으나
# .toml엔 빠져 있던 설정. Wrangler는 두 파일이 공존하면 .json만 읽고
# .toml을 통째로 무시하므로(v3.91+ 공식 동작), 이 프로젝트는 .json을
# 삭제하고 .toml 하나로 통합한다 — 두 파일을 계속 동기화하는 방식은
# 오늘 같은 사고(AI/VECTORIZE 바인딩이 조용히 무시됨)를 반복시킨다.

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

# 2026-07-26 신설 — K-Traffic/K-Logistics 실매칭 백엔드 Phase 1, 실시간
# 알림용 Durable Objects. SQLite 백엔드로 생성(new_sqlite_classes) —
# 무료 플랜에서도 사용 가능(Cloudflare 공식 문서 2026-07-07 갱신 기준
# 확인. 개발 완료 시점에 유료 전환 예정 — 피터님 확정 2026-07-26).
[[durable_objects.bindings]]
name = "MATCH_DEMAND_CHANNEL"
class_name = "MatchDemandChannel"

[[durable_objects.bindings]]
name = "MATCH_REGION_CHANNEL"
class_name = "MatchRegionChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDemandChannel", "MatchRegionChannel"]

# 2026-07-28 신설 — device-link 세션 강한 일관성 저장소. 기존
# env.QR_SESSIONS_KV(Workers KV)는 최종적 일관성이라 쓰기 후 최대
# 60초까지 다른 엣지에서 옛 값이 보일 수 있어, 폰이 승인한 직후에도
# PC의 poll이 최대 1분 가까이 "아직 안 옴"으로 남아있던 근본 원인이었다
# (실사로 확인). sessionId 하나당 DO 인스턴스 하나(idFromName)라 항상
# 같은 물리적 위치에서 읽고 써서 전파 지연 자체가 없다. 기존 v1
# 마이그레이션은 이미 적용된 것이므로 건드리지 않고 별도 태그(v2)로
# 추가한다 — Cloudflare는 마이그레이션을 순차 누적 적용한다.
[[durable_objects.bindings]]
name = "DEVICE_LINK_SESSIONS"
class_name = "DeviceLinkSessionDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DeviceLinkSessionDO"]

# 2026-08-31 신설 — 공문 메일(기관과의 이메일 왕래) 발신용. worker.js
# handleAdminLetterSendEmail이 env.EMAIL.send()로 호출한다.
# ★ 배포 전 필수 — 코드만으로는 끝나지 않는다, 아래 두 가지는 Cloudflare
# 대시보드에서 1회 수동 설정해야 한다(로컬/CLI로 불가):
#   1. Workers Paid 플랜 필요 (Email Sending은 Free 플랜 미지원)
#   2. hondi.net 존 → Email → Email Routing에서 gov-mail.hondi.net
#      서브도메인에 대해 "Catch-all" 또는 letter-*@gov-mail.hondi.net
#      패턴 라우팅 규칙을 만들고, 대상을 이 Worker(hondi-proxy)로 지정
#      — 이게 없으면 인바운드 메일이 email() 핸들러에 전혀 도달하지 않는다.
#   hondi.net 루트 도메인의 기존 MX(다우오피스, mx1~3.daouoffice.com)는
#   건드리지 않는다 — gov-mail 서브도메인에만 별도 MX가 붙는다.
[[send_email]]
name = "EMAIL"

# 2026-09-07 신설(실사로 발견) — worker.js의 scheduled(event, env, ctx)
# 핸들러(anchorL1MerkleRoot: PDV 머클 앵커링, 2026-07-14 신설 /
# anchorFsSnapshotsMerkleRoot: 재무제표 스냅샷 앵커링, 2026-09-07 신설)가
# 둘 다 "10분마다 돈다"는 주석과 함께 코드에 있었지만, 이 파일에
# [triggers]/crons 선언이 아예 없어 Cloudflare가 이 워커를 스케줄 실행
# 대상으로 인식하지 못하고 있었다 — 즉 배포 이후 지금까지 이 두 함수는
# 대시보드에 별도 수동 Cron Trigger 설정이 없었다면 단 한 번도 자동
# 호출된 적이 없다(코드 존재 == 실행 보장이 아님을 실사로 확인).
[triggers]
crons = ["*/10 * * * *"]
